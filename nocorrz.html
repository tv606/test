<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Eklentisiz Haber Rehberi</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; display: flex; height: 100vh; margin: 0; }
        #list { width: 350px; border-right: 1px solid #333; overflow-y: auto; background: #222; }
        #content { flex: 1; background: white; }
        .item { padding: 15px; border-bottom: 1px solid #333; cursor: pointer; transition: 0.3s; }
        .item:hover { background: #333; }
        .title { font-size: 0.9rem; font-weight: bold; }
        .date { font-size: 0.7rem; color: #888; margin-top: 5px; }
        iframe { width: 100%; height: 100%; border: none; }
        .error { color: #ff6b6b; padding: 20px; font-size: 0.8rem; }
    </style>
</head>
<body>

<div id="list">
    <div style="padding:20px; text-align:center; border-bottom:1px solid #333;">
        <b>Google News TR</b>
    </div>
    <div id="news-container">
        <div style="padding:20px;">Haberler yükleniyor...</div>
    </div>
</div>

<div id="content">
    <div id="msg" style="color:#555; padding:50px; text-align:center;">
        Okumak istediğiniz habere tıklayın.<br>
        <small>(Not: Bazı siteler güvenlik nedeniyle iframe içinde açılmayı engelleyebilir.)</small>
    </div>
    <iframe id="viewer" style="display:none;"></iframe>
</div>

<script>
    // RSS'i JSON'a çeviren ücretsiz ve stabil bir servis kullanıyoruz
    const GOOGLE_NEWS_RSS = 'https://news.google.com/rss?hl=tr&gl=TR&ceid=TR:tr';
    const API_URL = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(GOOGLE_NEWS_RSS)}`;

    async function loadNews() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();

            if (data.status !== 'ok') throw new Error('Veri alınamadı');

            const container = document.getElementById('news-container');
            container.innerHTML = '';

            data.items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `
                    <div class="title">${item.title}</div>
                    <div class="date">${item.pubDate}</div>
                `;
                div.onclick = () => {
                    document.getElementById('msg').style.display = 'none';
                    const iframe = document.getElementById('viewer');
                    iframe.style.display = 'block';
                    iframe.src = item.link;
                };
                container.appendChild(div);
            });
        } catch (e) {
            document.getElementById('news-container').innerHTML = 
                `<div class="error">Hata: ${e.message}<br>Lütfen sayfayı yenileyin.</div>`;
        }
    }

    loadNews();
</script>
</body>
</html>
