<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FILMONDO</title>
    <style>
        :root {
            --bg: #050505;
            --surface: #111111;
            --accent: #00d2ff;
            --text: #ffffff;
            --text-dim: #888;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- PLAYER ALANI (EN ÜSTE YASLANDI) --- */
        #player-area {
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 5px; /* Çok hafif bir üst boşluk */
        }

        .video-fixed-box {
            width: 1280px;
            max-width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        iframe { width: 100%; height: 100%; border: none; }

        /* --- ANA İÇERİK (LİSTE) --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
        }

        .side-header { 
            padding: 15px 20px 5px 20px; 
            font-weight: 800; 
            color: var(--accent); 
            font-size: 1.2rem;
        }
        
        .search-wrapper { padding: 10px 20px; }
        #searchBox {
            width: 100%;
            padding: 10px 15px;
            background: var(--surface);
            border: 1px solid #222;
            border-radius: 10px;
            color: white;
            outline: none;
            font-size: 0.9rem;
        }

        #playlist-container {
            flex: 1;
            overflow-y: auto;
            position: relative;
            padding: 0 15px;
            scrollbar-width: none;
        }
        #playlist-container::-webkit-scrollbar { display: none; }

        #virtual-list { position: relative; width: 100%; }

        .playlist-item {
            position: absolute;
            width: 100%;
            height: 85px;
            background: var(--surface);
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 8px;
            box-sizing: border-box;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .playlist-item.active { border-color: var(--accent); background: #151515; }

        .playlist-item img {
            width: 45px;
            height: 65px;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 12px;
        }

        .item-info strong { display: block; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-info span { color: var(--text-dim); font-size: 0.7rem; }

        /* --- MODERN FOOTER & YENİ BUTON --- */
        footer {
            height: 60px;
            background: #0a0a0a;
            border-top: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: relative;
        }

        .now-playing { display: flex; align-items: center; gap: 10px; max-width: 80%; }
        .status-dot { 
            width: 6px; height: 6px; background: var(--accent); 
            border-radius: 50%; box-shadow: 0 0 8px var(--accent); 
            flex-shrink: 0; display: none;
        }
        
        .now-playing-info { overflow: hidden; }
        .now-playing-label { font-size: 0.6rem; color: var(--accent); font-weight: bold; text-transform: uppercase; }
        #currentTitle { font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ccc; display: block; }

        /* YENİ "+" BUTONU */
        .btn-fab {
            position: absolute;
            right: 20px;
            top: -25px; /* Footer'ın biraz üstüne taşan şık duruş */
            background: var(--accent);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,210,255,0.4);
            cursor: pointer;
            border: none;
            color: #000;
            font-size: 24px;
            font-weight: bold;
            z-index: 100;
        }

        /* PC Ekran Ayarı */
        @media (min-width: 850px) {
            body { flex-direction: row; }
            #player-area { flex: 1; height: 100vh; padding: 0; }
            main { width: 380px; height: 100vh; border-left: 1px solid #1a1a1a; }
            footer { position: fixed; bottom: 0; width: 380px; right: 0; }
            .btn-fab { right: 20px; top: -65px; }
        }
    </style>
</head>
<body>

    <section id="player-area">
        <div class="video-fixed-box" id="playerWrapper">
            <div style="display:flex; justify-content:center; align-items:center; height:100%; color:#222; font-size:0.7rem;">
                HAZIR
            </div>
        </div>
    </section>

    <main>
        <div class="side-header">FILMONDO</div>
        <div class="search-wrapper">
            <input type="text" id="searchBox" placeholder="Film ara..." oninput="handleSearch()">
        </div>
        <div id="playlist-container">
            <div id="virtual-list"></div>
        </div>

        <footer>
            <div class="now-playing">
                <div class="status-dot" id="activeDot"></div>
                <div class="now-playing-info">
                    <span class="now-playing-label" id="statusText">BOŞTA</span>
                    <span id="currentTitle">Bir medya seçin</span>
                </div>
            </div>

            <label class="btn-fab">
                <span>+</span>
                <input type="file" id="m3uInput" hidden>
            </label>
        </footer>
    </main>

    <script>
        let allData = [];
        let filteredData = [];
        let activeUrl = "";
        const itemHeight = 95; 
        const container = document.getElementById('playlist-container');
        const virtualList = document.getElementById('virtual-list');
        const currentTitle = document.getElementById('currentTitle');
        const statusText = document.getElementById('statusText');
        const activeDot = document.getElementById('activeDot');

        window.addEventListener('DOMContentLoaded', checkAutoLoad);

        function checkAutoLoad() {
            fetch('list.m3u').then(r => r.ok ? r.text() : null).then(t => t && parseM3U(t));
        }

        document.getElementById('m3uInput').addEventListener('change', e => {
            const reader = new FileReader();
            reader.onload = ev => parseM3U(ev.target.result);
            reader.readAsText(e.target.files[0]);
        });

        function parseM3U(content) {
            allData = [];
            const lines = content.split('\n');
            let temp = {};
            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    temp.logo = logoMatch ? logoMatch[1] : "";
                    temp.name = line.split(',').pop();
                } else if (line.startsWith('http')) {
                    temp.url = line;
                    allData.push({...temp});
                    temp = {};
                }
            }
            filteredData = [...allData];
            updateVirtualList();
        }

        function updateVirtualList() {
            virtualList.style.height = (filteredData.length * itemHeight) + 'px';
            renderVisibleItems();
        }

        function renderVisibleItems() {
            const start = Math.floor(container.scrollTop / itemHeight);
            const end = Math.min(filteredData.length - 1, Math.ceil((container.scrollTop + container.clientHeight) / itemHeight));
            virtualList.innerHTML = "";
            for (let i = start; i <= end; i++) {
                const item = filteredData[i];
                const div = document.createElement('div');
                div.className = 'playlist-item' + (activeUrl === item.url ? ' active' : '');
                div.style.top = (i * itemHeight) + 'px';
                div.innerHTML = `
                    <img src="${item.logo || 'https://via.placeholder.com/45x65/111/333?text='}" loading="lazy">
                    <div class="item-info">
                        <strong>${item.name}</strong>
                        <span>Medyayı Oynat</span>
                    </div>
                `;
                div.onclick = () => playVideo(item);
                virtualList.appendChild(div);
            }
        }

        function playVideo(item) {
            activeUrl = item.url;
            currentTitle.innerText = item.name;
            statusText.innerText = "OYNATILIYOR";
            activeDot.style.display = "block";
            renderVisibleItems();
            document.getElementById('playerWrapper').innerHTML = `<iframe src="${item.url}" allowfullscreen allow="autoplay"></iframe>`;
        }

        function handleSearch() {
            const q = document.getElementById('searchBox').value.toLowerCase();
            filteredData = allData.filter(d => d.name.toLowerCase().includes(q));
            container.scrollTop = 0;
            updateVirtualList();
        }

        container.addEventListener('scroll', renderVisibleItems);
    </script>
</body>
</html>
