<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TVX</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: black;
      font-family: sans-serif;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: auto;
      object-fit: cover;
      position: absolute;
      top: 0px;
      left: 0;
      z-index: 0;
    }

    #channelBar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 0px;
      display: flex;
      overflow-x: auto;
      gap: 6px;
      background: rgba(0, 0, 0, 0);
      z-index: 998;
      scrollbar-width: none;
      transition: opacity 0.4s ease;
      opacity: 1;


    }

    #channelBar.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #channelBar::-webkit-scrollbar {
      display: none;
    }

    .channel {
      min-width: 160px;
      background: #333;
      color: #fff;
      padding: 5px;
      border-radius: 0 0 10px 10px;
      text-align: center;
      flex-shrink: 0;
      font-size: 20px;
      transition: all 0.3s ease;
      opacity: 35%;
      max-height:30px;


    }

    .channel:focus,
    .channel.focused {
      background: #3f3f3f;
      outline: none;
      color: #fff;
      opacity: 100%;
      padding: 30px;
      font-weight: bold;
      margin-top:-20px;

    }

    .channel.active {
      border: 0px solid white;
      
      font-weight: bold;
      color:#59B200;
    }

    @media (max-width: 768px) {
      .channel {
        min-width: 120px;
        font-size: 20px;
      }
    }

    #channelNameOverlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      background: rgba(0, 0, 0, 0.5);
      padding: 12px 24px;
      border-radius: 16px;
      font-size: 50px;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.7s ease;
      pointer-events: none;
      font-weight: bold;
    }

    .opaq {
      opacity: 40%;
    }

video::-webkit-media-controls {
  display: none !important;
  -webkit-appearance: none;
}

    
  </style>
</head>
<body>

<video id="video" autoplay muted playsinline preload="auto" poster=""></video>

<div class="opaq"><div id="channelNameOverlay"></div></div>

<div id="channelBar">
    <div class="channel"  data-id="x" data-src="https://halktv-live.daioncdn.net/halktv/halktv.m3u8">HALK TV</div>
    <div class="channel"  data-id="x" data-src="https://tele1-live.ercdn.net/tele1/tele1.m3u8">TELE 1</div>
    <div class="channel"  data-id="x" data-src="https://tv.arectv34.sbs/live/box1.m3u8">BEIN1</div>
    <div class="channel"  data-id="x" data-src="https://tv.arectv34.sbs/live/bsstars.m3u8">BEIN STARS</div>
    <div class="channel"  data-id="x" data-src="https://fl3.moveonjoy.com/MTV_CLASSIC/index.m3u8">MTV CLASSIC</div>
    <div class="channel"  data-id="x" data-src="https://tv.arectv34.sbs/live/viasathistory.m3u8">VIASAT HISTORY</div>
    <div class="channel"  data-id="x" data-src="https://tv.arectv34.sbs/live/bbc.m3u8">BBC EARTH</div>
    <div class="channel"  data-id="x" data-src="https://saran-live.ercdn.net/natgeowild/index.m3u8">NATGEO WILD TR</div>
    
 </div>

<script>
  const video = document.getElementById('video');
  const channels = document.querySelectorAll('.channel');
  const channelBar = document.getElementById('channelBar');
  const overlay = document.getElementById('channelNameOverlay');
  let focusedIndex = 0;
  let hls;
  let hideTimeout;

  function playStream(url) {
    if (hls) hls.destroy();
    if (Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
    }
    video.play().catch(err => console.error('Oynatma hatası:', err));
  }

    video.removeAttribute("controls");
    video.removeAttribute("poster");



  function showChannelName(name) {
    overlay.textContent = name;
    overlay.style.opacity = 1;
    clearTimeout(overlay._timeout);
    overlay._timeout = setTimeout(() => {
      overlay.style.opacity = 0;
    }, 3000);
  }

  function updateFocus(index) {
    channels.forEach(c => c.classList.remove('focused'));
    channels[index].classList.add('focused');
    channels[index].scrollIntoView({behavior: "smooth", inline: "center"});
  }

  function activateChannel(index) {
    channels.forEach(c => c.classList.remove('active'));
    channels[index].classList.add('active');
    playStream(channels[index].dataset.src);
    showChannelName(channels[index].innerText);
    resetHideTimer();
  }

  // Kanal değişimi ve yön tuşları
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') {
      focusedIndex = (focusedIndex + 1) % channels.length;
      updateFocus(focusedIndex);
      resetHideTimer();
    } else if (e.key === 'ArrowLeft') {
      focusedIndex = (focusedIndex - 1 + channels.length) % channels.length;
      updateFocus(focusedIndex);
      resetHideTimer();
    } else if (e.key === 'Enter') {
      activateChannel(focusedIndex);
    }
  });

  // Mobil tıklama desteği
  channels.forEach((channel, index) => {
    channel.addEventListener('click', () => {
      focusedIndex = index;
      updateFocus(index);
      activateChannel(index);
    });
  });

  // === BAR GİZLEME GÖSTERME ===
  function resetHideTimer() {
    channelBar.classList.remove('hidden');
    clearTimeout(hideTimeout);
    hideTimeout = setTimeout(() => {
      channelBar.classList.add('hidden');
    }, 3000);
  }

  ['mousemove', 'keydown', 'touchstart'].forEach(event => {
    document.addEventListener(event, resetHideTimer);
  });

  // Sayfa açıldığında ilk kanal
  updateFocus(focusedIndex);
  activateChannel(focusedIndex);
</script>

</body>
</html>
