<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android TV IPTV Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #000;
            overflow: hidden;
            color: white;
            font-family: sans-serif;
        }

        #videoContainer {
            position: absolute; width: 100%; height: 100%;
            z-index: 1; background: #000;
        }

        video { width: 100%; height: 100%; object-fit: cover; }

        /* DEBUG EKRANI - Tuşları görmek için */
        #debug {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(255, 0, 0, 0.7); padding: 10px;
            z-index: 1000; font-size: 14px; border-radius: 5px;
        }

        #ui {
            position: absolute; top: 10%; left: 5%;
            z-index: 100;
        }

        .channel-info {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px 40px;
            font-size: 3rem;
            border-left: 15px solid #e50914;
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn { from { opacity:0; transform:translateX(-50px); } to { opacity:1; transform:translateX(0); } }

        #loader {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: #000; z-index: 50;
        }

        .spinner {
            width: 60px; height: 60px;
            border: 5px solid rgba(255,255,255,0.1);
            border-top: 5px solid #e50914;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body tabindex="0"> <div id="debug">Kumanda Testi: Bekleniyor...</div>

<div id="videoContainer">
    <video id="mainVideo" autoplay muted playsinline></video>
</div>

<div id="loader"><div class="spinner"></div></div>

<div id="ui">
    <div id="channelName" class="channel-info"></div>
</div>

<script>
    const channels = [
        { name: "KANAL 1", url: "https://test-streams.mux.dev/x36xhzz/main.m3u8" },
        { name: "KANAL 2", url: "https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8" },
        { name: "KANAL 3", url: "https://playertest.longtailvideo.com/adaptive/oceans_aes/oceans_aes.m3u8" }
    ];

    let currentIndex = 0;
    let hls = null;
    const video = document.getElementById('mainVideo');
    const debug = document.getElementById('debug');

    function playStream(index) {
        const item = channels[index];
        document.getElementById('loader').style.display = 'flex';
        const nameLabel = document.getElementById('channelName');
        
        nameLabel.innerText = item.name;
        nameLabel.style.display = 'block';
        setTimeout(() => { nameLabel.style.display = 'none'; }, 4000);

        if (hls) hls.destroy();

        if (Hls.isSupported()) {
            hls = new Hls();
            hls.loadSource(item.url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else {
            video.src = item.url;
            video.play();
        }
    }

    video.onplaying = () => {
        document.getElementById('loader').style.display = 'none';
        video.muted = false; // Video başlayınca sesi aç
    };

    // TUŞ KONTROLÜ - Çift katmanlı koruma
    function handleKey(code) {
        debug.innerText = "Basılan KeyCode: " + code;
        
        // 19-38 (Yukarı), 20-40 (Aşağı)
        if (code == 38 || code == 19) { 
            currentIndex = (currentIndex > 0) ? currentIndex - 1 : channels.length - 1;
            playStream(currentIndex);
        } 
        else if (code == 40 || code == 20) { 
            currentIndex = (currentIndex < channels.length - 1) ? currentIndex + 1 : 0;
            playStream(currentIndex);
        }
    }

    // Android WebView için hem window hem document dinlenmeli
    window.addEventListener('keydown', (e) => handleKey(e.keyCode));
    document.addEventListener('keydown', (e) => handleKey(e.keyCode));

    // ODAK ÇIKMAZINI ÇÖZME
    window.onload = () => {
        window.focus();
        document.body.focus();
        playStream(0);
        
        // Her 2 saniyede bir odağı zorla sayfaya getir (Kumanda kopmaması için)
        setInterval(() => {
            if (document.activeElement !== document.body) {
                document.body.focus();
            }
        }, 2000);
    };
</script>
</body>
</html>
