<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TVX - Modern</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    /* ÇALIŞAN MOTORUN CSS İSKELETİ */
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: black; /* Videonun görünmesi için kritik */
      font-family: sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }

    /* Modern Loader - İlk dosyadaki mantıkla */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      z-index: 997;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #333;
      border-left-color: #00BFFF;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Modern Kanal Barı - Konumu ve Yapısı Korundu */
    #channelBar {
      position: fixed;
      bottom: 20px; /* Aşağıya alındı */
      left: 0;
      width: 100%;
      padding: 10px 20px;
      display: flex;
      overflow-x: auto;
      gap: 10px;
      background: rgba(0, 0, 0, 0.8); /* Şeffaflık azaltıldı, render garantilendi */
      z-index: 998;
      scrollbar-width: none;
      transition: opacity 0.4s ease;
      opacity: 1;
    }

    #channelBar.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #channelBar::-webkit-scrollbar {
      display: none;
    }

    .channel {
      min-width: 140px;
      background: #222;
      color: #777;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      flex-shrink: 0;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s ease;
      border: 1px solid #333;
    }

    /* Odaklanma Efekti - İlk dosyadaki gibi çalışır */
    .channel:focus,
    .channel.focused {
      background: #00BFFF;
      outline: none;
      color: #fff;
      border-color: #fff;
      transform: scale(1.05);
    }

    .channel.active {
      font-weight: bold;
      color: #fff;
      border-bottom: 3px solid #00BFFF;
    }

    /* Kanal İsmi Overlay */
    #channelNameOverlay {
      position: fixed;
      top: 40px;
      left: 40px;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 35px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
      font-weight: bold;
    }

    video::-webkit-media-controls {
      display: none !important;
    }
  </style>
</head>
<body>

<video id="video" autoplay playsinline></video>

<div id="loader">
  <div class="spinner"></div>
</div>

<div id="channelNameOverlay"></div>

<div id="channelBar">
  <div class="channel" data-src="https://halktv-live.daioncdn.net/halktv/halktv_1080p.m3u8">HALK TV</div>
  <div class="channel" data-src="https://saran-live.ercdn.net/fx/index.m3u8">FX TR</div>
  <div class="channel" data-src="https://ekoltv-live.ercdn.net/ekoltv/ekoltv.m3u8">EKOL TV</div>
  <div class="channel" data-src="https://live.artidijitalmedya.com/artidijital_denizpostasi/denizpostasi/playlist.m3u8">DENİZ POSTASI</div>
  <div class="channel" data-src="https://saran-live.ercdn.net/natgeohd/index.m3u8">NAT GEO TR</div>
  <div class="channel" data-src="https://saran-live.ercdn.net/natgeowild/index.m3u8">NAT GEO WILD TR</div>
  <div class="channel" data-src="https://tv-trtbelgesel.medya.trt.com.tr/master.m3u8">TRT BELGESEL</div>
  <div class="channel" data-src="https://tv-trtspor1.medya.trt.com.tr/master.m3u8">TRT SPOR</div>
</div>

<script>
  /* ÇALIŞAN İLK DOSYANIN SCRİPTİ (BİREBİR) */
  const video = document.getElementById('video');
  const channels = document.querySelectorAll('.channel');
  const channelBar = document.getElementById('channelBar');
  const overlay = document.getElementById('channelNameOverlay');
  const loader = document.getElementById('loader');
  let focusedIndex = 0;
  let hls;
  let hideTimeout;

  function showLoader() {
    loader.style.display = 'flex';
    loader.style.opacity = 1;
  }

  function hideLoader() {
    loader.style.opacity = 0;
    setTimeout(() => loader.style.display = 'none', 400);
  }

  function playStream(url) {
    showLoader();
    if (hls) hls.destroy();
    if (Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().catch(err => console.error('Hata:', err));
      });
      video.addEventListener('playing', hideLoader, { once: true });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.addEventListener('loadeddata', () => {
        video.play().catch(err => console.error('Hata:', err));
        hideLoader();
      }, { once: true });
    }
  }

  video.removeAttribute("controls");
  video.removeAttribute("poster");

  function showChannelName(name) {
    overlay.textContent = name;
    overlay.style.opacity = 1;
    clearTimeout(overlay._timeout);
    overlay._timeout = setTimeout(() => {
      overlay.style.opacity = 0;
    }, 3000);
  }

  function updateFocus(index) {
    channels.forEach(c => c.classList.remove('focused'));
    channels[index].classList.add('focused');
    channels[index].scrollIntoView({behavior: "smooth", inline: "center"});
  }

  function activateChannel(index) {
    channels.forEach(c => c.classList.remove('active'));
    channels[index].classList.add('active');
    playStream(channels[index].dataset.src);
    showChannelName(channels[index].innerText);
    resetHideTimer();
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') {
      focusedIndex = (focusedIndex + 1) % channels.length;
      updateFocus(focusedIndex);
      resetHideTimer();
    } else if (e.key === 'ArrowLeft') {
      focusedIndex = (focusedIndex - 1 + channels.length) % channels.length;
      updateFocus(focusedIndex);
      resetHideTimer();
    } else if (e.key === 'Enter') {
      activateChannel(focusedIndex);
    }
  });

  channels.forEach((channel, index) => {
    channel.addEventListener('click', () => {
      focusedIndex = index;
      updateFocus(index);
      activateChannel(index);
    });
  });

  function resetHideTimer() {
    channelBar.classList.remove('hidden');
    clearTimeout(hideTimeout);
    hideTimeout = setTimeout(() => {
      channelBar.classList.add('hidden');
    }, 3000);
  }

  ['mousemove', 'keydown', 'touchstart'].forEach(event => {
    document.addEventListener(event, resetHideTimer);
  });

  updateFocus(focusedIndex);
  activateChannel(focusedIndex);
</script>

</body>
</html>
