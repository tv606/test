<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TVX Vertical Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --side-width: 320px;
      --accent: #00a2ff; /* Modern Mavi */
      --bg-dark: rgba(10, 10, 15, 0.95);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: black;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
    }

    /* Video Alanı */
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }

    /* Siyah Loader Ekranı */
    #loader {
      position: fixed;
      inset: 0;
      background: black;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease;
    }

    #loader img {
      width: 250px;
      height: auto;
    }

    /* Sol Dikey Kanal Barı */
    #channelBar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--side-width);
      height: 100%;
      background: var(--bg-dark);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      z-index: 998;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 20px 10px;
    }

    #channelBar.hidden {
      transform: translateX(-100%);
    }

    /* Kanal Listesi Konteynırı */
    #channelContainer {
      overflow-y: auto;
      scrollbar-width: none; /* Firefox */
      flex: 1;
    }

    #channelContainer::-webkit-scrollbar {
      display: none; /* Chrome/Safari */
    }

    .brand {
      color: var(--accent);
      font-size: 28px;
      font-weight: 800;
      padding: 10px 20px 30px;
      letter-spacing: 2px;
      text-align: center;
    }

    .channel {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      color: #aaa;
      padding: 18px 20px;
      margin-bottom: 10px;
      border-radius: 12px;
      text-align: left;
      font-size: 18px;
      transition: all 0.3s ease;
      cursor: pointer;
      border: 1px solid transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Odaklanma Durumu (Kumanda Gezintisi) */
    .channel.focused {
      background: rgba(0, 162, 255, 0.15);
      color: #fff;
      outline: none;
      border-color: var(--accent);
      transform: scale(1.02);
      box-shadow: 0 0 20px rgba(0, 162, 255, 0.2);
    }

    /* Aktif Oynayan Kanal */
    .channel.active {
      background: var(--accent);
      color: #fff;
      font-weight: bold;
      border-color: var(--accent);
    }

    /* Bilgi Overlay (Ortadaki Yazı) */
    #channelNameOverlay {
      position: fixed;
      top: 50%;
      left: 55%; /* Sidebar'ı dengelemek için biraz sağa kaydırdım */
      transform: translate(-50%, -50%);
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 20px 40px;
      border-radius: 20px;
      font-size: 40px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }

    video::-webkit-media-controls {
      display: none !important;
    }
  </style>
</head>
<body>

<video id="video" autoplay playsinline></video>

<div id="loader">
  <img src="https://tv606.github.io/test/lo.gif" alt="Yükleniyor...">
</div>

<div id="channelNameOverlay"></div>

<div id="channelBar">
  <div class="brand">TVX PRO</div>
  <div id="channelContainer">
    <div class="channel" data-src="https://halktv-live.daioncdn.net/halktv/halktv_1080p.m3u8">HALK TV</div>
    <div class="channel" data-src="https://saran-live.ercdn.net/fx/index.m3u8">FX TR</div>
    <div class="channel" data-src="https://ekoltv-live.ercdn.net/ekoltv/ekoltv.m3u8">EKOL TV</div>
    <div class="channel" data-src="https://live.artidijitalmedya.com/artidijital_denizpostasi/denizpostasi/playlist.m3u8">DENİZ POSTASI</div>
    <div class="channel" data-src="https://saran-live.ercdn.net/natgeohd/index.m3u8">NAT GEO TR</div>
    <div class="channel" data-src="https://saran-live.ercdn.net/natgeowild/index.m3u8">NAT GEO WILD TR</div>
    <div class="channel" data-src="https://tv-trtbelgesel.medya.trt.com.tr/master.m3u8">TRT BELGESEL</div>
    <div class="channel" data-src="https://tv-trtspor1.medya.trt.com.tr/master.m3u8">TRT SPOR</div>
    <div class="channel" data-src="https://tv-trt1.medya.trt.com.tr/master_1080.m3u8">TRT1</div>
    <div class="channel" data-src="https://tv.ensonhaber.com/haberglobal/haberglobal_720p.m3u8">HABER GLOBAL</div>
    <div class="channel" data-src="https://tv.ensonhaber.com/haberturk/haberturk_720p.m3u8">HABER TÜRK</div>
    <div class="channel" data-src="https://tv100-live.daioncdn.net/tv100/tv100.m3u8">TV 100</div>
    <div class="channel" data-src="https://tv.ensonhaber.com/bloomberght/bloomberght_720p.m3u8">BLOOMBERG HT</div>
    <div class="channel" data-src="https://hnpsechtsc.turknet.ercdn.net/xpnvudnlsv/cnbc-e/cnbc-e_720p.m3u8">CNBC-E</div>
    <div class="channel" data-src="https://tv-trt2.medya.trt.com.tr/master_720.m3u8">TRT 2</div>
    <div class="channel" data-src="https://d3bp6dwmpbdajl.cloudfront.net/v1/manifest/3722c60a815c199d9c0ef36c5b73da68a62b09d1/cc-ury0meh5m4nzm/2a65a3b9-8cf2-4c6a-b4c8-69b41f958f52/0.m3u8">CNN INT</div>
    <div class="channel" data-src="https://live.france24.com/hls/live/2037218-b/F24_EN_HI_HLS/master_5000.m3u8">FRANCE 24</div>
    <div class="channel" data-src="https://vs-hls-push-ww-live.akamaized.net/x=4/i=urn:bbc:pips:service:bbc_news_channel_hd/t=3840/v=pv14/b=5070016/main.m3u8">BBC NEWS</div>
    <div class="channel" data-src="https://dash4.antik.sk/live/test_arte_avc_25p/playlist.m3u8">ARTE HD</div>
    <div class="channel" data-src="https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/stream05/streamPlaylist.m3u8">DW ENG</div>
    <div class="channel" data-src="https://amg00793-amg00793c6-xumo-us-2669.playouts.now.amagi.tv/BBCStudios-BBCEarthA-hls/playlist1080p.m3u8">BBC EARTH</div>
    <div class="channel" data-src="https://aegis-cloudfront-1.tubi.video/6d6d0f24-8445-4b4c-bdf6-44f9e38beaa4/1080p-cc/index.m3u8">LOVE NATURE</div>
  </div>
</div>

<script>
  const video = document.getElementById('video');
  const channels = document.querySelectorAll('.channel');
  const channelBar = document.getElementById('channelBar');
  const overlay = document.getElementById('channelNameOverlay');
  const loader = document.getElementById('loader');
  
  let focusedIndex = 0;
  let hls;
  let hideTimeout;

  // --- MOTOR KISMI (Çalışma Mantığı) ---

  function showLoader() {
    loader.style.display = 'flex';
    loader.style.opacity = 1;
  }

  function hideLoader() {
    loader.style.opacity = 0;
    setTimeout(() => { loader.style.display = 'none'; }, 400);
  }

  function playStream(url) {
    showLoader();
    if (hls) hls.destroy();
    
    if (Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().catch(err => console.error('Hata:', err));
      });
      video.addEventListener('playing', hideLoader, { once: true });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.addEventListener('loadeddata', () => {
        video.play().catch(err => console.error('Hata:', err));
        hideLoader();
      }, { once: true });
    }
  }

  function showChannelName(name) {
    overlay.textContent = name;
    overlay.style.opacity = 1;
    clearTimeout(overlay._timeout);
    overlay._timeout = setTimeout(() => { overlay.style.opacity = 0; }, 3000);
  }

  function updateFocus(index) {
    channels.forEach(c => c.classList.remove('focused'));
    channels[index].classList.add('focused');
    // Dikey kaydırma için block: center yapıldı
    channels[index].scrollIntoView({ behavior: "smooth", block: "center" });
    resetHideTimer();
  }

  function activateChannel(index) {
    channels.forEach(c => c.classList.remove('active'));
    channels[index].classList.add('active');
    playStream(channels[index].dataset.src);
    showChannelName(channels[index].innerText);
    resetHideTimer();
  }

  function resetHideTimer() {
    channelBar.classList.remove('hidden');
    clearTimeout(hideTimeout);
    hideTimeout = setTimeout(() => {
      channelBar.classList.add('hidden');
    }, 4000);
  }

  // --- NAVİGASYON (Vertical Ayarı) ---

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') {
      focusedIndex = (focusedIndex + 1) % channels.length;
      updateFocus(focusedIndex);
    } else if (e.key === 'ArrowUp') {
      focusedIndex = (focusedIndex - 1 + channels.length) % channels.length;
      updateFocus(focusedIndex);
    } else if (e.key === 'Enter') {
      activateChannel(focusedIndex);
    } else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      resetHideTimer(); // Menüyü görünür yap
    }
  });

  channels.forEach((channel, index) => {
    channel.addEventListener('click', () => {
      focusedIndex = index;
      updateFocus(index);
      activateChannel(index);
    });
  });

  ['mousemove', 'keydown', 'touchstart'].forEach(event => {
    document.addEventListener(event, resetHideTimer);
  });

  // Başlangıç
  updateFocus(focusedIndex);
  activateChannel(focusedIndex);
</script>

</body>
</html>
