<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TVX V1</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
    }
    #playerContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent, rgba(0,0,0,0.9));
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title {
      font-size: 24px;
      color: #e50914;
      font-weight: bold;
    }
    #search {
      padding: 8px 12px;
      background: rgba(255,255,255,0.2);
      border: 1px solid #555;
      color: #fff;
      border-radius: 4px;
    }
    .bottom {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #movieTitle {
      font-size: 20px;
      font-weight: bold;
    }
    #progressBar {
      width: 100%;
      height: 8px;
      background: #444;
      border-radius: 4px;
      overflow: hidden;
    }
    #progress {
      width: 0%;
      height: 100%;
      background: #e50914;
    }
    #list {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 5px 0;
    }
    .item {
      padding: 10px 15px;
      background: #222;
      border-radius: 4px;
      white-space: nowrap;
      border: 2px solid transparent;
    }
    .item.selected {
      border-color: #fff;
      background: #333;
    }
    .item.active {
      background: #e50914;
      color: #fff;
    }
  </style>
</head>
<body>

<div id="playerContainer">
  <video id="video" autoplay playsinline webkit-playsinline controls></video>
</div>

<div id="ui">
  <div class="header">
    <div class="title">TVX V1</div>
    <input type="text" id="search" placeholder="Ara...">
  </div>
  
  <div class="bottom">
    <div id="movieTitle">-</div>
    <div id="progressBar"><div id="progress"></div></div>
    <div id="list"></div>
  </div>
</div>

<script>
  const video = document.getElementById('video');
  const listEl = document.getElementById('list');
  const titleEl = document.getElementById('movieTitle');
  const progressEl = document.getElementById('progress');
  const searchEl = document.getElementById('search');
  
  let movies = [];
  let currentIndex = 0;
  let hls = null;

  function loadStream(url) {
    if (hls) hls.destroy();
    
    if (Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.play();
    } else {
      video.src = url;
      video.play();
    }
  }

  function renderList(data) {
    listEl.innerHTML = '';
    data.forEach((m, idx) => {
      const div = document.createElement('div');
      div.className = 'item' + (idx === currentIndex ? ' selected' : '');
      div.innerText = m.title;
      div.onclick = () => playMovie(idx);
      listEl.appendChild(div);
    });
  }

  function playMovie(index) {
    currentIndex = index;
    const movie = movies[currentIndex];
    if (!movie) return;
    titleEl.innerText = movie.title;
    loadStream(movie.src);
    
    const items = document.querySelectorAll('.item');
    items.forEach((it, i) => {
      it.classList.toggle('active', i === currentIndex);
      it.classList.toggle('selected', i === currentIndex);
    });
    if (items[currentIndex]) {
      items[currentIndex].scrollIntoView({ behavior: 'smooth', inline: 'center' });
    }
  }

  video.addEventListener('timeupdate', () => {
    if (video.duration) {
      progressEl.style.width = ((video.currentTime / video.duration) * 100) + '%';
    }
  });

  document.addEventListener('keydown', (e) => {
    if (document.activeElement === searchEl) return;
    
    if (e.key === 'ArrowRight') {
      if (currentIndex < movies.length - 1) playMovie(currentIndex + 1);
    } else if (e.key === 'ArrowLeft') {
      if (currentIndex > 0) playMovie(currentIndex - 1);
    }
  });

  searchEl.addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    const filtered = movies.filter(m => m.title.toLowerCase().includes(q));
    renderList(filtered);
  });

  fetch('https://tv606.github.io/xinemax/listx.m3u')
    .then(r => r.text())
    .then(text => {
      const lines = text.split('\n');
      let currentTitle = '';
      lines.forEach(line => {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          currentTitle = line.split(',')[1] || 'İsimsiz';
        } else if (line && !line.startsWith('#')) {
          movies.push({ title: currentTitle, src: line });
        }
      });
      renderList(movies);
      if (movies.length > 0) playMovie(0);
    });
</script>

</body>
</html>
