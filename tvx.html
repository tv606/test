<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TVX Movies</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: black;
      font-family: sans-serif;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100vh;
      object-fit: cover;
      position: absolute;
      top: 0px;
      left: 0;
      z-index: 0;
    }

    /* Siyah loader ekran */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      z-index: 997;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    #loader img {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      height: auto;
    }

    #topContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 998;
      transition: opacity 0.4s ease;
      opacity: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 5px;
      background: rgba(0, 0, 0, 0);
    }

    #topContainer.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #searchBar {
      width: min(300px, 80vw);
      padding: 8px 15px;
      border-radius: 20px;
      border: 1px solid #555;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 16px;
      outline: none;
      margin: 0 auto;
    }

    #channelBar {
      width: 100%;
      padding: 0px;
      display: flex;
      overflow-x: auto;
      gap: 10px;
      scrollbar-width: none;
    }

    #channelBar::-webkit-scrollbar {
      display: none;
    }

    .channel {
      min-width: 160px;
      background: #333;
      color: #fff;
      padding: 5px;
      border-radius: 0 0 16px 16px;
      text-align: center;
      flex-shrink: 0;
      font-size: 25px;
      transition: all 0.3s ease;
      opacity: 35%;
      max-height: 40px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .channel:focus,
    .channel.focused {
      background: #002C33;
      outline: none;
      color: #fff;
      opacity: 100%;
      padding: 10px;
      font-weight: bold;
      margin-top: 0px;
      max-height: 50px;
    }

    .channel.active {
      font-weight: bold;
      color: #FFF;
    }

    @media (max-width: 768px) {
      .channel {
        min-width: 120px;
        font-size: 20px;
      }
    }

    #channelNameOverlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      background: rgba(0, 0, 0, 0.5);
      padding: 12px 24px;
      border-radius: 16px;
      font-size: 50px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.7s ease;
      pointer-events: none;
      font-weight: bold;
      text-align: center;
      margin: 0 auto;
    }

    .opaq {
      opacity: 40%;
    }

    video::-webkit-media-controls {
      display: none !important;
      -webkit-appearance: none;
    }
  </style>
</head>
<body>

<video id="video" autoplay playsinline></video>

<!-- Siyah ekran loader -->
<div id="loader">
  <img src="https://tv606.github.io/test/lo.gif" alt="Loading...">
</div>

<div class="opaq"><div id="channelNameOverlay"></div></div>

<div id="topContainer">
  <input type="text" id="searchBar" placeholder="Film Ara..." autocomplete="off">
  <div id="channelBar"></div>
</div>

<script>
  const video = document.getElementById('video');
  const channelBar = document.getElementById('channelBar');
  const topContainer = document.getElementById('topContainer');
  const searchBar = document.getElementById('searchBar');
  const overlay = document.getElementById('channelNameOverlay');
  const loader = document.getElementById('loader');

  let allMovies = [];
  let loadedMovies = [];
  let filteredMovies = [];
  let focusedIndex = 0;
  let hls;
  let hideTimeout;
  const BATCH_SIZE = 12;

  function showLoader() {
    loader.style.display = 'flex';
    loader.style.opacity = 1;
  }

  function hideLoader() {
    loader.style.opacity = 0;
    setTimeout(() => loader.style.display = 'none', 400);
  }

  function playStream(url) {
    showLoader();

    if (hls) hls.destroy();
    if (Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().catch(err => console.error('Oynatma hatası:', err));
      });

      video.addEventListener('playing', hideLoader, { once: true });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.addEventListener('loadeddata', () => {
        video.play().catch(err => console.error('Oynatma hatası:', err));
        hideLoader();
      }, { once: true });
    } else {
      video.src = url;
      video.play().catch(err => console.error('Oynatma hatası:', err));
      video.addEventListener('playing', hideLoader, { once: true });
    }
  }

  video.removeAttribute("controls");
  video.removeAttribute("poster");

  function showChannelName(name) {
    overlay.textContent = name;
    overlay.style.opacity = 1;
    clearTimeout(overlay._timeout);
    overlay._timeout = setTimeout(() => {
      overlay.style.opacity = 0;
    }, 3000);
  }

  function parseM3U(data) {
    const lines = data.split('\n');
    const movies = [];
    const seenUrls = new Set();
    let currentTitle = '';

    for (let line of lines) {
      line = line.trim();
      if (line.startsWith('#EXTINF:')) {
        const parts = line.split(',');
        currentTitle = parts.slice(1).join(',').trim();
      } else if (line && !line.startsWith('#')) {
        if (!seenUrls.has(line) && currentTitle) {
          seenUrls.add(line);
          movies.push({ title: currentTitle, src: line });
        }
        currentTitle = '';
      }
    }
    return movies;
  }

  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  function renderMoreMovies() {
    const currentLength = channelBar.children.length;
    const nextBatch = filteredMovies.slice(currentLength, currentLength + BATCH_SIZE);

    nextBatch.forEach((movie) => {
      const div = document.createElement('div');
      div.className = 'channel';
      div.innerText = movie.title;
      div.dataset.src = movie.src;

      const index = channelBar.children.length;
      div.addEventListener('click', () => {
        focusedIndex = index;
        updateFocus(focusedIndex);
        activateChannel(focusedIndex);
      });

      channelBar.appendChild(div);
    });
  }

  function updateFocus(index) {
    const channels = channelBar.querySelectorAll('.channel');
    if (!channels[index]) return;
    channels.forEach(c => c.classList.remove('focused'));
    channels[index].classList.add('focused');
    channels[index].scrollIntoView({ behavior: "smooth", inline: "center" });
  }

  function activateChannel(index) {
    const channels = channelBar.querySelectorAll('.channel');
    if (!channels[index]) return;
    channels.forEach(c => c.classList.remove('active'));
    channels[index].classList.add('active');
    playStream(channels[index].dataset.src);
    showChannelName(channels[index].innerText);
    resetHideTimer();
  }

  function resetHideTimer() {
    if (document.activeElement === searchBar) return;
    topContainer.classList.remove('hidden');
    clearTimeout(hideTimeout);
    hideTimeout = setTimeout(() => {
      if (document.activeElement !== searchBar) {
        topContainer.classList.add('hidden');
      }
    }, 3000);
  }

  channelBar.addEventListener('scroll', () => {
    resetHideTimer();
    if (channelBar.scrollLeft + channelBar.clientWidth >= channelBar.scrollWidth - 100) {
      renderMoreMovies();
    }
  });

  searchBar.addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase().trim();
    filteredMovies = allMovies.filter(m => m.title.toLowerCase().includes(query));
    channelBar.innerHTML = '';
    focusedIndex = 0;
    renderMoreMovies();
    if (filteredMovies.length > 0) {
      updateFocus(0);
    }
  });

  searchBar.addEventListener('focus', () => {
    clearTimeout(hideTimeout);
    topContainer.classList.remove('hidden');
  });

  searchBar.addEventListener('blur', () => {
    resetHideTimer();
  });

  document.addEventListener('keydown', e => {
    if (document.activeElement === searchBar) return;
    const channels = channelBar.querySelectorAll('.channel');
    if (channels.length === 0) return;

    if (e.key === 'ArrowRight') {
      focusedIndex = (focusedIndex + 1) % filteredMovies.length;
      if (focusedIndex >= channels.length) {
        renderMoreMovies();
      }
      updateFocus(focusedIndex);
      resetHideTimer();
    } else if (e.key === 'ArrowLeft') {
      focusedIndex = (focusedIndex - 1 + filteredMovies.length) % filteredMovies.length;
      updateFocus(focusedIndex);
      resetHideTimer();
    } else if (e.key === 'Enter') {
      activateChannel(focusedIndex);
    }
  });

  ['mousemove', 'keydown', 'touchstart'].forEach(event => {
    document.addEventListener(event, resetHideTimer);
  });

  showLoader();
  fetch('https://tv606.github.io/xinemax/listx.m3u')
    .then(res => res.text())
    .then(data => {
      allMovies = shuffleArray(parseM3U(data));
      filteredMovies = [...allMovies];
      renderMoreMovies();
      if (filteredMovies.length > 0) {
        updateFocus(0);
        activateChannel(0);
      }
    })
    .catch(err => {
      console.error('Liste yüklenemedi:', err);
      hideLoader();
    });
</script>

</body>
</html>
