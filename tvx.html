  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: black;
      font-family: sans-serif;
      overflow: hidden;
    }

    video{
      width: 100%;
      height: auto;
      object-fit: cover;
      position: absolute;
      top: 0px;
      left: 0;
      z-index: 0;
    }






    /* Siyah loader ekran */
   #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black; /* Arka plan siyah kalıyor */
      z-index: 997;
      display: none;
      opacity: 1;
      transition: opacity 0.4s ease;

      display: flex;               /* Ortalamak için */
      align-items: center;         /* Dikey merkezleme */
      justify-content: center;     /* Yatay merkezleme */
    }

   
    #loader img {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(220px, 30vmin);
      width: 300px;
      height: auto;
    }



    #channelBar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 0px;
      display: flex;
      overflow-x: auto;
      gap: 10px;
      background: rgba(0, 0, 0, 0);
      z-index: 998;
      scrollbar-width: none;
      transition: opacity 0.4s ease;
      opacity: 1;
    }

    #channelBar.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #channelBar::-webkit-scrollbar {
      display: none;
    }

    .channel {
      min-width: 160px;
      background: #333;
      color: #fff;
      padding: 5px;
      border-radius: 0 0 16px 16px;
      text-align: center;
      flex-shrink: 0;
      font-size: 25px;
      transition: all 0.3s ease;
      opacity: 35%;
      max-height:40px;
    }

    .channel:focus,
    .channel.focused {
      background: #3f3f3f;
      outline: none;
      color: #fff;
      opacity: 100%;
      padding: 10px;
      font-weight: bold;
      margin-top:0px;
      max-height:50px;
    }

    .channel.active {
      font-weight: bold;
      color:#F3B200;
    }

    @media (max-width: 768px) {
      .channel {
        min-width: 120px;
        font-size: 20px;
      }
    }

    #channelNameOverlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      background: rgba(0, 0, 0, 0.5);
      padding: 12px 24px;
      border-radius: 16px;
      font-size: 50px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.7s ease;
      pointer-events: none;
      font-weight: bold;
      text-align: center;
      margin: 0 auto;
    }

    .opaq {
      opacity: 40%;
    }

    video::-webkit-media-controls {
      display: none !important;
      -webkit-appearance: none;
    }
  </style>
</head>

<script>
  const video = document.getElementById('video');
  const channels = document.querySelectorAll('.channel');
  const channelBar = document.getElementById('channelBar');
  const overlay = document.getElementById('channelNameOverlay');
  const loader = document.getElementById('loader');
  let focusedIndex = 0;
  let hls;
  let hideTimeout;

  function showLoader() {
    loader.style.display = 'block';
    loader.style.opacity = 1;
  }

  function hideLoader() {
    loader.style.opacity = 0;
    setTimeout(() => loader.style.display = 'none', 400);
  }

  function playStream(url) {
    showLoader();

    if (hls) hls.destroy();
    if (Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().catch(err => console.error('Oynatma hatası:', err));
      });

      video.addEventListener('playing', hideLoader, { once: true });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.addEventListener('loadeddata', () => {
        video.play().catch(err => console.error('Oynatma hatası:', err));
        hideLoader();
      }, { once: true });
    }
  }

  video.removeAttribute("controls");
  video.removeAttribute("poster");

  function showChannelName(name) {
    overlay.textContent = name;
    overlay.style.opacity = 1;
    clearTimeout(overlay._timeout);
    overlay._timeout = setTimeout(() => {
      overlay.style.opacity = 0;
    }, 3000);
  }

  function updateFocus(index) {
    channels.forEach(c => c.classList.remove('focused'));
    channels[index].classList.add('focused');
    channels[index].scrollIntoView({behavior: "smooth", inline: "center"});
  }



  function activateChannel(index) {
    channels.forEach(c => c.classList.remove('active'));
    channels[index].classList.add('active');
    playStream(channels[index].dataset.src);
    showChannelName(channels[index].innerText);
    resetHideTimer();
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') {
      focusedIndex = (focusedIndex + 1) % channels.length;
      updateFocus(focusedIndex);
      resetHideTimer();
    } else if (e.key === 'ArrowLeft') {
      focusedIndex = (focusedIndex - 1 + channels.length) % channels.length;
      updateFocus(focusedIndex);
      resetHideTimer();
    } else if (e.key === 'Enter') {
      activateChannel(focusedIndex);
    }
  });

  channels.forEach((channel, index) => {
    channel.addEventListener('click', () => {
      focusedIndex = index;
      updateFocus(index);
      activateChannel(index);
    });
  });

  function resetHideTimer() {
    channelBar.classList.remove('hidden');
    clearTimeout(hideTimeout);
    hideTimeout = setTimeout(() => {
      channelBar.classList.add('hidden');
    }, 3000);
  }

  ['mousemove', 'keydown', 'touchstart'].forEach(event => {
    document.addEventListener(event, resetHideTimer);
  });

  updateFocus(focusedIndex);
  activateChannel(focusedIndex);
</script>
