<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>TVX - Modern</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #00d2ff;
      --bg-glass: rgba(10, 10, 15, 0.9);
      --font-main: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ÇALIŞAN VERSİYONUN KRİTİK BODY AYARI */
    body, html {
      background: #000;
      font-family: var(--font-main);
      color: white;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* ÇALIŞAN VERSİYONUN CONTAINER YAPISI */
    #videoContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1; /* Video en alt katmanda */
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* MODERN YATAY ALT MENÜ (DOCK) */
    #channelBar {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 95%;
      max-width: 1200px;
      padding: 16px 20px;
      display: flex;
      overflow-x: auto;
      gap: 12px;
      background: var(--bg-glass);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      z-index: 100; /* Videonun üstünde kalması için */
      scrollbar-width: none;
      transition: all 0.5s ease;
      opacity: 1;
    }

    #channelBar.hidden {
      opacity: 0;
      transform: translate(-50%, 40px);
      pointer-events: none;
    }

    #channelBar::-webkit-scrollbar { display: none; }

    .channel {
      min-width: 150px;
      background: rgba(255, 255, 255, 0.05);
      color: #777;
      padding: 16px;
      border-radius: 16px;
      text-align: center;
      flex-shrink: 0;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.2s ease;
      cursor: pointer;
      border: 1px solid transparent;
    }

    /* ODAKLANMA EFEKTİ */
    .channel.focused {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      transform: scale(1.05);
      border-color: var(--primary);
    }

    .channel.active {
      color: var(--primary);
      background: rgba(0, 210, 255, 0.1);
      border-color: var(--primary);
    }

    /* KANAL BİLGİ PANELİ (Üst Sol) */
    #infoPanel {
      position: fixed;
      top: 40px;
      left: 40px;
      background: var(--bg-glass);
      padding: 15px 30px;
      border-radius: 12px;
      z-index: 50;
      opacity: 0;
      transform: translateY(-20px);
      transition: all 0.4s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    #infoPanel.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* MODERN LOADER */
    #loader {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease;
    }

    .loading-bar {
      width: 150px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      border-radius: 2px;
    }

    .loading-bar::after {
      content: "";
      position: absolute;
      left: -100%;
      width: 100%;
      height: 100%;
      background: var(--primary);
      animation: loading 1.5s infinite;
    }

    @keyframes loading {
      0% { left: -100%; }
      50% { left: 0; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>

<div id="loader">
  <div class="loading-bar"></div>
</div>

<div id="videoContainer">
  <video id="video" autoplay playsinline></video>
</div>

<div id="infoPanel">
  <h2 id="currentLabel">-</h2>
</div>

<div id="channelBar">
  <div class="channel" data-src="https://halktv-live.daioncdn.net/halktv/halktv_1080p.m3u8">zALK TV</div>
  <div class="channel" data-src="https://saran-live.ercdn.net/fx/index.m3u8">FX TR</div>
  <div class="channel" data-src="https://ekoltv-live.ercdn.net/ekoltv/ekoltv.m3u8">EKOL TV</div>
  <div class="channel" data-src="https://live.artidijitalmedya.com/artidijital_denizpostasi/denizpostasi/playlist.m3u8">DENİZ POSTASI</div>
  <div class="channel" data-src="https://saran-live.ercdn.net/natgeohd/index.m3u8">NAT GEO TR</div>
  <div class="channel" data-src="https://saran-live.ercdn.net/natgeowild/index.m3u8">NAT GEO WILD TR</div>
  <div class="channel" data-src="https://tv-trtbelgesel.medya.trt.com.tr/master.m3u8">TRT BELGESEL</div>
  <div class="channel" data-src="https://tv-trtspor1.medya.trt.com.tr/master.m3u8">TRT SPOR</div>
</div>

<script>
  const video = document.getElementById('video');
  const channelBar = document.getElementById('channelBar');
  const channels = document.querySelectorAll('.channel');
  const infoPanel = document.getElementById('infoPanel');
  const label = document.getElementById('currentLabel');
  const loader = document.getElementById('loader');

  let focusedIndex = 0;
  let hls;
  let hideTimer;

  // --- ÇALIŞAN OYNATICI MOTORU ---
  function playStream(url) {
    loader.style.opacity = '1';
    loader.style.display = 'flex';

    if (hls) hls.destroy();
    if (Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      video.onplaying = () => { 
        loader.style.opacity = '0'; 
        setTimeout(() => loader.style.display = 'none', 500); 
      };
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.onloadeddata = () => { 
        video.play(); 
        loader.style.opacity = '0'; 
      };
    }
  }

  // --- NAVİGASYON ---
  function updateFocus(index) {
    channels.forEach(c => c.classList.remove('focused'));
    const target = channels[index];
    target.classList.add('focused');
    target.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    resetHideTimer();
  }

  function activateChannel(index) {
    channels.forEach(c => c.classList.remove('active'));
    channels[index].classList.add('active');
    
    label.innerText = channels[index].innerText;
    infoPanel.classList.add('show');
    
    playStream(channels[index].dataset.src);
    setTimeout(() => infoPanel.classList.remove('show'), 3000);
  }

  function resetHideTimer() {
    channelBar.classList.remove('hidden');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      channelBar.classList.add('hidden');
    }, 4000);
  }

  // --- KUMANDA OLAYLARI ---
  document.addEventListener('keydown', (e) => {
    switch(e.key) {
      case 'ArrowRight':
        focusedIndex = (focusedIndex + 1) % channels.length;
        updateFocus(focusedIndex);
        break;
      case 'ArrowLeft':
        focusedIndex = (focusedIndex - 1 + channels.length) % channels.length;
        updateFocus(focusedIndex);
        break;
      case 'Enter':
        activateChannel(focusedIndex);
        break;
      case 'ArrowUp':
      case 'ArrowDown':
        resetHideTimer();
        break;
    }
  });

  // Tıklama / Dokunma
  channels.forEach((chan, idx) => {
    chan.addEventListener('click', () => {
      focusedIndex = idx;
      updateFocus(idx);
      activateChannel(idx);
    });
  });

  // BAŞLAT
  updateFocus(0);
  activateChannel(0);
</script>

</body>
</html>
