<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TVX Cinema</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #141414;
      color: #fff;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow-hidden;
      width: 100vw;
      height: 100vh;
    }

    /* VİDEO OYNATICI */
    #videoContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* NETFLIX USULU ÜST KONTROL PANENİ */
    #uiLayer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px 40px;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.85) 100%);
      transition: opacity 0.4s ease;
      opacity: 1;
    }

    #uiLayer.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* HEADER / SEARCH */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      color: #E50914;
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    #searchBar {
      width: 320px;
      padding: 10px 20px;
      border-radius: 4px;
      border: 1px solid #333;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    #searchBar:focus {
      border-color: #E50914;
      background: rgba(0, 0, 0, 0.95);
    }

    /* ORTA BİLGİ ALANI */
    .movie-info {
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }

    #movieTitle {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    /* ALT KONTROLLER VE KATALOG */
    .controls-bottom {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* İLERLEME ÇUBUĞU */
    .progress-area {
      display: flex;
      align-items: center;
      gap: 15px;
      width: 100%;
    }

    #progressContainer {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: #E50914;
      border-radius: 4px;
    }

    #timeDisplay {
      font-size: 14px;
      font-weight: 500;
      min-width: 100px;
      text-align: right;
      color: #ddd;
    }

    /* FİLM LİSTESİ KATALOĞU */
    #channelBar {
      width: 100%;
      display: flex;
      overflow-x: auto;
      gap: 12px;
      padding-bottom: 5px;
      scrollbar-width: none;
    }

    #channelBar::-webkit-scrollbar {
      display: none;
    }

    .channel {
      min-width: 180px;
      max-width: 180px;
      background: #222;
      color: #aaa;
      padding: 12px 16px;
      border-radius: 4px;
      text-align: center;
      flex-shrink: 0;
      font-size: 16px;
      transition: all 0.2s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .channel.focused {
      background: #333;
      color: #fff;
      border-color: #fff;
      transform: scale(1.05);
    }

    .channel.active {
      border-color: #E50914;
      color: #fff;
      font-weight: bold;
      background: #E50914;
    }

    /* LOADER */
    #loader {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    #loader img {
      width: 200px;
      height: auto;
    }
  </style>
</head>
<body>

<div id="videoContainer">
  <video id="video" autoplay playsinline webkit-playsinline></video>
</div>

<div id="loader">
  <img src="https://tv606.github.io/test/lo.gif" alt="Yükleniyor...">
</div>

<div id="uiLayer">
  <div class="header">
    <div class="brand">TVX CINEMA</div>
    <input type="text" id="searchBar" placeholder="Film ara..." autocomplete="off">
  </div>

  <div class="movie-info">
    <div id="movieTitle">Yükleniyor...</div>
  </div>

  <div class="controls-bottom">
    <div class="progress-area">
      <div id="progressContainer">
        <div id="progressBar"></div>
      </div>
      <div id="timeDisplay">00:00 / 00:00</div>
    </div>
    
    <div id="channelBar"></div>
  </div>
</div>

<script>
  const video = document.getElementById('video');
  const channelBar = document.getElementById('channelBar');
  const uiLayer = document.getElementById('uiLayer');
  const searchBar = document.getElementById('searchBar');
  const movieTitle = document.getElementById('movieTitle');
  const loader = document.getElementById('loader');
  const progressContainer = document.getElementById('progressContainer');
  const progressBar = document.getElementById('progressBar');
  const timeDisplay = document.getElementById('timeDisplay');

  let allMovies = [];
  let filteredMovies = [];
  let focusedArea = 'channels'; // 'channels', 'search', 'progress'
  let focusedIndex = 0;
  let hls;
  let hideTimeout;
  const BATCH_SIZE = 12;

  function showLoader() {
    loader.style.display = 'flex';
    loader.style.opacity = 1;
  }

  function hideLoader() {
    loader.style.opacity = 0;
    setTimeout(() => loader.style.display = 'none', 400);
  }

  function playStream(url) {
    showLoader();

    if (hls) hls.destroy();

    const cleanUrl = url.trim();

    if (Hls.isSupported()) {
      hls = new Hls({
        enableWorker: true,
        lowLatencyMode: false
      });
      hls.loadSource(cleanUrl);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().catch(err => console.error('Play error:', err));
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          video.src = cleanUrl;
          video.play().catch(err => console.error('Direct fallback error:', err));
        }
      });
    } else {
      video.src = cleanUrl;
      video.load();
      video.play().catch(err => console.error('Play error:', err));
    }
  }

  video.addEventListener('playing', hideLoader);
  video.addEventListener('canplay', hideLoader);
  video.addEventListener('error', () => {
    hideLoader();
  });

  video.addEventListener('timeupdate', () => {
    if (video.duration) {
      const pct = (video.currentTime / video.duration) * 100;
      progressBar.style.width = pct + '%';
      timeDisplay.textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
    }
  });

  function formatTime(sec) {
    if (isNaN(sec)) return "00:00";
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
  }

  progressContainer.addEventListener('click', (e) => {
    e.stopPropagation();
    const rect = progressContainer.getBoundingClientRect();
    const pos = (e.clientX - rect.left) / rect.width;
    if (video.duration) {
      video.currentTime = pos * video.duration;
    }
  });

  function parseM3U(data) {
    const lines = data.split(/\r?\n/);
    const movies = [];
    const seenUrls = new Set();
    let currentTitle = '';

    for (let line of lines) {
      line = line.trim();
      if (line.startsWith('#EXTINF:')) {
        const parts = line.split(',');
        currentTitle = parts.slice(1).join(',').trim();
      } else if (line && !line.startsWith('#')) {
        if (!seenUrls.has(line) && currentTitle) {
          seenUrls.add(line);
          movies.push({ title: currentTitle, src: line });
        }
        currentTitle = '';
      }
    }
    return movies;
  }

  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  function renderMoreMovies() {
    const currentLength = channelBar.children.length;
    const nextBatch = filteredMovies.slice(currentLength, currentLength + BATCH_SIZE);

    nextBatch.forEach((movie) => {
      const div = document.createElement('div');
      div.className = 'channel';
      div.innerText = movie.title;
      div.dataset.src = movie.src;

      const index = channelBar.children.length;
      div.addEventListener('click', (e) => {
        e.stopPropagation();
        focusedIndex = index;
        focusedArea = 'channels';
        updateFocus();
        activateChannel(focusedIndex);
      });

      channelBar.appendChild(div);
    });
  }

  function updateFocus() {
    const channels = channelBar.querySelectorAll('.channel');

    searchBar.blur();
    progressContainer.style.border = 'none';
    channels.forEach(c => c.classList.remove('focused'));

    if (focusedArea === 'search') {
      searchBar.focus();
    } else if (focusedArea === 'progress') {
      progressContainer.style.border = '1px solid #E50914';
    } else if (focusedArea === 'channels' && channels[focusedIndex]) {
      channels[focusedIndex].classList.add('focused');
      channels[focusedIndex].scrollIntoView({ behavior: "smooth", inline: "center" });
    }
  }

  function activateChannel(index) {
    const channels = channelBar.querySelectorAll('.channel');
    if (!channels[index]) return;
    channels.forEach(c => c.classList.remove('active'));
    channels[index].classList.add('active');
    movieTitle.textContent = channels[index].innerText;
    playStream(channels[index].dataset.src);
    resetHideTimer();
  }

  function resetHideTimer() {
    uiLayer.classList.remove('hidden');
    clearTimeout(hideTimeout);
    hideTimeout = setTimeout(() => {
      if (document.activeElement !== searchBar) {
        uiLayer.classList.add('hidden');
      }
    }, 4000);
  }

  channelBar.addEventListener('scroll', () => {
    resetHideTimer();
    if (channelBar.scrollLeft + channelBar.clientWidth >= channelBar.scrollWidth - 100) {
      renderMoreMovies();
    }
  });

  searchBar.addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase().trim();
    filteredMovies = allMovies.filter(m => m.title.toLowerCase().includes(query));
    channelBar.innerHTML = '';
    focusedIndex = 0;
    renderMoreMovies();
    if (filteredMovies.length > 0 && focusedArea === 'channels') {
      updateFocus();
    }
  });

  document.addEventListener('keydown', e => {
    resetHideTimer();

    if (document.activeElement === searchBar) {
      if (e.key === 'ArrowDown') {
        focusedArea = 'channels';
        updateFocus();
      }
      return;
    }

    const channels = channelBar.querySelectorAll('.channel');

    if (e.key === 'ArrowUp') {
      if (focusedArea === 'channels') {
        focusedArea = 'progress';
      } else if (focusedArea === 'progress') {
        focusedArea = 'search';
      }
      updateFocus();
    } else if (e.key === 'ArrowDown') {
      if (focusedArea === 'search') {
        focusedArea = 'progress';
      } else if (focusedArea === 'progress') {
        focusedArea = 'channels';
      }
      updateFocus();
    } else if (e.key === 'ArrowRight') {
      if (focusedArea === 'channels') {
        focusedIndex = (focusedIndex + 1) % filteredMovies.length;
        if (focusedIndex >= channels.length) renderMoreMovies();
        updateFocus();
      } else if (focusedArea === 'progress') {
        if (video.duration) video.currentTime = Math.min(video.duration, video.currentTime + 10);
      }
    } else if (e.key === 'ArrowLeft') {
      if (focusedArea === 'channels') {
        focusedIndex = (focusedIndex - 1 + filteredMovies.length) % filteredMovies.length;
        updateFocus();
      } else if (focusedArea === 'progress') {
        if (video.duration) video.currentTime = Math.max(0, video.currentTime - 10);
      }
    } else if (e.key === 'Enter') {
      if (focusedArea === 'channels') {
        activateChannel(focusedIndex);
      }
    }
  });

  ['mousemove', 'keydown', 'touchstart'].forEach(event => {
    document.addEventListener(event, resetHideTimer);
  });

  showLoader();
  fetch('https://tv606.github.io/xinemax/listx.m3u')
    .then(res => res.text())
    .then(data => {
      allMovies = shuffleArray(parseM3U(data));
      filteredMovies = [...allMovies];
      renderMoreMovies();
      if (filteredMovies.length > 0) {
        updateFocus();
        activateChannel(0);
      }
    })
    .catch(err => {
      console.error('List error:', err);
      hideLoader();
    });
</script>

</body>
</html>
