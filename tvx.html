<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>TVX - Modern Edition</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #00BFFF;
      --bg-glass: rgba(15, 15, 20, 0.85); /* Mobil için biraz daha belirgin yapıldı */
      --border-glass: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* KRİTİK: Arka planı şeffaf yaparak videonun görünmesini sağlıyoruz */
    html, body {
      background-color: transparent !important;
      background: transparent !important;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* KRİTİK: Video katmanını GPU'ya zorlayıp en alta sabitliyoruz */
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1; /* En alt katman */
      background: transparent !important;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
    }

    /* Arayüz elemanları videonun üzerinde (z-index: 10+) olmalı */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease;
    }

    .spinner {
      width: 64px;
      height: 64px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #channelBar {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 95%;
      max-width: 1400px;
      padding: 16px 24px;
      display: flex;
      overflow-x: auto;
      gap: 16px;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: 24px;
      z-index: 1000;
      scrollbar-width: none;
      transition: all 0.5s ease;
      opacity: 1;
    }

    #channelBar.hidden {
      opacity: 0;
      transform: translate(-50%, 40px);
      pointer-events: none;
    }

    #channelBar::-webkit-scrollbar { display: none; }

    .channel {
      min-width: 140px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid transparent;
      color: rgba(255, 255, 255, 0.6);
      padding: 16px 20px;
      border-radius: 16px;
      text-align: center;
      flex-shrink: 0;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .channel.focused, .channel:active {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid var(--primary-color);
      color: #fff;
      transform: scale(1.05);
    }

    .channel.active {
      color: var(--primary-color);
      border-color: var(--primary-color);
    }

    #channelNameOverlay {
      position: fixed;
      top: 40px;
      left: 40px;
      color: white;
      background: var(--bg-glass);
      padding: 16px 32px;
      font-size: 40px;
      z-index: 1500;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform: translateY(-20px);
      font-weight: 800;
    }

    #channelNameOverlay.show {
      opacity: 1;
      transform: translateY(0);
    }

    video::-webkit-media-controls { display: none !important; }
  </style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>

<div id="loader">
  <div class="spinner"></div>
</div>

<div id="channelNameOverlay"></div>

<div id="channelBar">
    <div class="channel" data-src="https://halktv-live.daioncdn.net/halktv/halktv_1080p.m3u8">HALK TV</div>
    <div class="channel" data-src="https://saran-live.ercdn.net/fx/index.m3u8">FX TR</div>
    <div class="channel" data-src="https://ekoltv-live.ercdn.net/ekoltv/ekoltv.m3u8">EKOL TV</div>
    <div class="channel" data-src="https://saran-live.ercdn.net/natgeohd/index.m3u8">NAT GEO TR</div>
    <div class="channel" data-src="https://saran-live.ercdn.net/natgeowild/index.m3u8">NAT GEO WILD TR</div>
    <div class="channel" data-src="https://tv-trtbelgesel.medya.trt.com.tr/master.m3u8">TRT BELGESEL</div>
    <div class="channel" data-src="https://tv-trtspor1.medya.trt.com.tr/master.m3u8">TRT SPOR</div>
    <div class="channel" data-src="https://tv-trt1.medya.trt.com.tr/master_1080.m3u8">TRT1</div>
    <div class="channel" data-src="https://tv.ensonhaber.com/haberglobal/haberglobal_720p.m3u8">HABER GLOBAL</div>
    <div class="channel" data-src="https://tv.ensonhaber.com/haberturk/haberturk_720p.m3u8">HABER TÜRK</div>
    <div class="channel" data-src="https://tv100-live.daioncdn.net/tv100/tv100.m3u8">TV 100</div>
</div>

<script>
  const video = document.getElementById('video');
  const channels = document.querySelectorAll('.channel');
  const channelBar = document.getElementById('channelBar');
  const overlay = document.getElementById('channelNameOverlay');
  const loader = document.getElementById('loader');
  let focusedIndex = 0;
  let hls;
  let hideTimeout;

  function showLoader() {
    loader.style.opacity = 1;
    loader.style.display = 'flex';
  }

  function hideLoader() {
    loader.style.opacity = 0;
    setTimeout(() => { loader.style.display = 'none'; }, 400);
  }

  function playStream(url) {
    showLoader();
    if (hls) { hls.destroy(); }

    if (Hls.isSupported()) {
      hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true
      });
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().catch(e => console.log("Auto-play blocked"));
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
    }

    // Görüntü geldiğinde loader'ı kapat
    video.onplaying = () => { hideLoader(); };
  }

  function showChannelName(name) {
    overlay.textContent = name;
    overlay.classList.add('show');
    clearTimeout(overlay._timeout);
    overlay._timeout = setTimeout(() => overlay.classList.remove('show'), 3000);
  }

  function updateFocus(index) {
    channels.forEach(c => c.classList.remove('focused'));
    channels[index].classList.add('focused');
    channels[index].scrollIntoView({behavior: "smooth", inline: "center", block: "nearest"});
  }

  function activateChannel(index) {
    channels.forEach(c => c.classList.remove('active'));
    channels[index].classList.add('active');
    playStream(channels[index].dataset.src);
    showChannelName(channels[index].innerText);
    resetHideTimer();
  }

  // Kumanda / Klavye Kontrolü
  document.addEventListener('keydown', e => {
    resetHideTimer();
    if (e.key === 'ArrowRight') {
      focusedIndex = (focusedIndex + 1) % channels.length;
      updateFocus(focusedIndex);
    } else if (e.key === 'ArrowLeft') {
      focusedIndex = (focusedIndex - 1 + channels.length) % channels.length;
      updateFocus(focusedIndex);
    } else if (e.key === 'Enter') {
      activateChannel(focusedIndex);
    }
  });

  channels.forEach((channel, index) => {
    channel.addEventListener('click', () => {
      focusedIndex = index;
      updateFocus(index);
      activateChannel(index);
    });
  });

  function resetHideTimer() {
    channelBar.classList.remove('hidden');
    clearTimeout(hideTimeout);
    hideTimeout = setTimeout(() => {
      channelBar.classList.add('hidden');
    }, 4000);
  }

  // Başlangıç
  activateChannel(0);
</script>

</body>
</html>
