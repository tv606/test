<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV Pro - TV Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  /* MEVCUT TASARIMINIZI KORUYORUZ */
  :root {
    --bg: #0a0c10; --surface: #12151c; --surface2: #1a1e29; --border: #232838;
    --accent: #e63946; --accent2: #ff6b6b; --snap-color: #4cc9f0;
    --zap-color: #ff9f1c; --rec-color: #ff0000; --text: #e8eaf0;
    --muted: #6b7280; --active: #1e2535;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
  body { font-family: 'Rajdhani', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; align-items: center; gap: 12px; z-index: 10; }
  .topbar .logo { font-size: 18px; font-weight: 700; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; }
  .topbar .time { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--muted); margin-left: auto; }

  .main { display: flex; flex: 1; width: 100%; overflow: hidden; }

  .sidebar { width: 280px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .sidebar-header h2 { font-size: 11px; font-weight: 700; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }

  .channel-list { overflow-y: auto; flex: 1; scroll-behavior: smooth; }
  .channel-item { padding: 12px 16px; border-bottom: 1px solid rgba(35,40,56,0.4); display: flex; align-items: center; gap: 10px; transition: 0.2s; }
  
  /* KUMANDA İÇİN KRİTİK: FOCUS STİLLERİ */
  .channel-item.focused { background: var(--active); border-left: 5px solid var(--accent2); transform: scale(1.02); }
  .channel-item.active { background: var(--active); border-left: 5px solid var(--accent); }
  .channel-item.active .ch-name { color: var(--accent); }

  .player-area { flex: 1; background: #000; display: flex; flex-direction: column; position: relative; }
  .video-wrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; }
  video { width: 100%; height: 100%; object-fit: contain; }

  .hud-status { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; z-index: 10; }
  .badge { padding: 6px 15px; font-family: 'Share Tech Mono', monospace; font-weight: bold; font-size: 12px; display: none; }
  #zapIndicator { background: var(--zap-color); color: #000; }
  #recIndicator { background: var(--rec-color); color: #fff; animation: blink 1s infinite; }

  .video-info { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 10px 20px; border-left: 4px solid var(--accent); display: none; z-index: 10; }
  .video-info.show { display: block; animation: fadeIn 0.5s; }

  .controls { background: var(--surface); border-top: 1px solid var(--border); padding: 15px 30px; display: flex; align-items: center; gap: 15px; }
  .ctrl-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); min-width: 60px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
  
  /* BUTON FOCUS STİLİ */
  .ctrl-btn.focused { background: var(--accent); border-color: white; transform: scale(1.1); box-shadow: 0 0 15px var(--accent); }
  
  .zap-active { background: var(--zap-color) !important; color: #000 !important; }
  .rec-active { background: var(--rec-color) !important; color: #fff !important; }

  .now-playing { flex: 1; text-align: center; }
  .np-name { font-weight: 700; color: var(--accent); font-size: 18px; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">IPTV<span>·</span>STREAM</div>
  <div class="time" id="clock">00:00:00</div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>CHANNELS</h2>
      <span id="chCount" style="color:var(--accent)">0</span>
    </div>
    <div class="channel-list" id="channelList"></div>
  </div>

  <div class="player-area">
    <div class="hud-status">
      <div class="badge" id="zapIndicator">ZAPPING ACTIVE [5.5s]</div>
      <div class="badge" id="recIndicator">● RECORDING</div>
    </div>
    
    <div class="video-info" id="videoInfo">
      <div id="infoNum" style="color:var(--muted); font-size:12px;">CH 01</div>
      <div id="infoName" style="font-size:20px; font-weight:700;">KANAL ADI</div>
    </div>

    <div class="video-wrap">
      <video id="videoPlayer" crossorigin="anonymous" playsinline></video>
    </div>

    <div class="controls" id="controlsRow">
      <button class="ctrl-btn nav-item" onclick="prevChannel()">◀</button>
      <button class="ctrl-btn nav-item" id="playPauseBtn" onclick="togglePlay()">▶</button>
      <button class="ctrl-btn nav-item" onclick="nextChannel()">▶</button>
      <button class="ctrl-btn nav-item" id="zapBtn" onclick="toggleZapping()">ZAP</button>
      <button class="ctrl-btn nav-item" id="recBtn" onclick="toggleRecording()">REC</button>
      <button class="ctrl-btn nav-item snap-btn" onclick="takeScreenshot()">SNAP</button>

      <div class="now-playing">
        <div class="np-name" id="nowPlayingName">KANAL SEÇİN</div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.10/hls.min.js"></script>
<script>
let channels = [
  { name: "CNN INT", url: "https://d3bp6dwmpbdajl.cloudfront.net/v1/manifest/3722c60a815c199d9c0ef36c5b73da68a62b09d1/cc-ury0meh5m4nzm/2a65a3b9-8cf2-4c6a-b4c8-69b41f958f52/0.m3u8" },
  { name: "FRANCE 24", url: "https://live.france24.com/hls/live/2037218-b/F24_EN_HI_HLS/master_5000.m3u8" },
  { name: "BBC NEWS", url: "https://vs-hls-push-ww-live.akamaized.net/x=4/i=urn:bbc:pips:service:bbc_news_channel_hd/t=3840/v=pv14/b=5070016/main.m3u8" },
  { name: "HALK TV", url: "https://halktv-live.daioncdn.net/halktv/halktv_1080p.m3u8" },
  { name: "EKOL TV", url: "https://ekoltv-live.ercdn.net/ekoltv/ekoltv.m3u8" },
  { name: "CNBC-E", url: "https://hnpsechtsc.turknet.ercdn.net/xpnvudnlsv/cnbc-e/cnbc-e_720p.m3u8" },
  { name: "TRT BELGESEL", url: "https://tv-trtbelgesel.medya.trt.com.tr/master.m3u8" },
  { name: "LOVE NATURE", url: "https://aegis-cloudfront-1.tubi.video/6d6d0f24-8445-4b4c-bdf6-44f9e38beaa4/1080p-cc/index.m3u8" }
];

let currentIndex = 0; // Aktif oynayan kanal
let focusIndex = 0;   // Kumanda ile üzerinde olduğumuz öğe
let currentSection = 'sidebar'; // 'sidebar' veya 'controls'
let hls = null;
let zapInterval = null;
let mediaRecorder = null;
let recordedChunks = [];

function init() {
  renderChannels();
  updateFocus();
  setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString(); }, 1000);
}

function renderChannels() {
  const list = document.getElementById('channelList');
  document.getElementById('chCount').textContent = channels.length;
  list.innerHTML = '';
  channels.forEach((ch, i) => {
    const item = document.createElement('div');
    item.className = 'channel-item nav-item' + (i === currentIndex ? ' active' : '');
    item.id = 'ch-' + i;
    item.innerHTML = `<strong>${i+1}</strong> <span class="ch-name">${ch.name}</span>`;
    list.appendChild(item);
  });
}

// KUMANDA NAVİGASYON MANTIĞI
function updateFocus() {
  // Tüm odakları temizle
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('focused'));

  if (currentSection === 'sidebar') {
    const el = document.getElementById('ch-' + focusIndex);
    if (el) {
      el.classList.add('focused');
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  } else if (currentSection === 'controls') {
    const btns = document.querySelectorAll('#controlsRow .ctrl-btn');
    if (btns[focusIndex]) {
      btns[focusIndex].classList.add('focused');
    }
  }
}

document.addEventListener('keydown', (e) => {
  switch(e.key) {
    case 'ArrowDown':
      if (currentSection === 'sidebar') {
        focusIndex = (focusIndex + 1) % channels.length;
      } else {
        // Kontrollerdeyken aşağı basılırsa bir şey yapma veya listeye dön
      }
      break;
    case 'ArrowUp':
      if (currentSection === 'sidebar') {
        focusIndex = (focusIndex - 1 + channels.length) % channels.length;
      } else {
        currentSection = 'sidebar';
        focusIndex = currentIndex;
      }
      break;
    case 'ArrowRight':
      if (currentSection === 'sidebar') {
        currentSection = 'controls';
        focusIndex = 0;
      } else {
        const btns = document.querySelectorAll('#controlsRow .ctrl-btn');
        focusIndex = (focusIndex + 1) % btns.length;
      }
      break;
    case 'ArrowLeft':
      if (currentSection === 'controls') {
        if (focusIndex === 0) {
          currentSection = 'sidebar';
          focusIndex = currentIndex;
        } else {
          focusIndex--;
        }
      }
      break;
    case 'Enter':
      if (currentSection === 'sidebar') {
        selectChannel(focusIndex);
      } else {
        document.querySelectorAll('#controlsRow .ctrl-btn')[focusIndex].click();
      }
      break;
  }
  updateFocus();
});

// MOTOR KISMI (ORİJİNAL MANTIK)
function selectChannel(index) {
  currentIndex = index;
  const ch = channels[index];
  renderChannels();
  
  const video = document.getElementById('videoPlayer');
  if (hls) hls.destroy();

  if (Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(ch.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
  }

  document.getElementById('nowPlayingName').textContent = ch.name;
  showInfo(ch.name, index + 1);
}

function showInfo(name, num) {
  const info = document.getElementById('videoInfo');
  document.getElementById('infoName').textContent = name;
  document.getElementById('infoNum').textContent = 'CH ' + num;
  info.classList.add('show');
  setTimeout(() => info.classList.remove('show'), 3000);
}

// Diğer Fonksiyonlar (Aynen Korundu)
function togglePlay() {
  const v = document.getElementById('videoPlayer');
  if (v.paused) v.play(); else v.pause();
  document.getElementById('playPauseBtn').textContent = v.paused ? '▶' : '⏸';
}

function nextChannel() { selectChannel((currentIndex + 1) % channels.length); }
function prevChannel() { selectChannel((currentIndex - 1 + channels.length) % channels.length); }

function toggleZapping() {
  const btn = document.getElementById('zapBtn');
  const ind = document.getElementById('zapIndicator');
  if (zapInterval) {
    clearInterval(zapInterval); zapInterval = null;
    btn.classList.remove('zap-active'); ind.style.display = 'none';
  } else {
    btn.classList.add('zap-active'); ind.style.display = 'block';
    zapInterval = setInterval(() => { nextChannel(); }, 5500);
  }
}

function toggleRecording() {
  const video = document.getElementById('videoPlayer');
  const recBtn = document.getElementById('recBtn');
  const recInd = document.getElementById('recIndicator');
  if (mediaRecorder && mediaRecorder.state === "recording") {
    mediaRecorder.stop();
    recBtn.classList.remove('rec-active'); recInd.style.display = 'none';
  } else {
    recordedChunks = [];
    const stream = video.captureStream();
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `rec-${Date.now()}.webm`; a.click();
    };
    mediaRecorder.start();
    recBtn.classList.add('rec-active'); recInd.style.display = 'block';
  }
}

function takeScreenshot() {
  const video = document.getElementById('videoPlayer');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const a = document.createElement('a'); a.href = canvas.toDataURL("image/png");
  a.download = `snap-${Date.now()}.png`; a.click();
}

init();
selectChannel(0);
</script>
</body>
</html>
