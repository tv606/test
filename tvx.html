<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stremio Style TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --side-width: 320px;
      /* Stremio Renk Paleti */
      --stremio-purple: #8134af; 
      --stremio-bg: #0f0d19;
      --stremio-sidebar: rgba(22, 20, 34, 0.95);
      --stremio-item-hover: rgba(129, 52, 175, 0.2);
      --font-main: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      background: #000;
      font-family: var(--font-main);
      color: #eeecf2;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Video Alanı */
    #videoContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Stremio genelde en boy oranını korur */
    }

    /* Stremio Tarzı Sidebar */
    #sideBar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--side-width);
      height: 100%;
      background: var(--stremio-sidebar);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      z-index: 10;
      display: flex;
      flex-direction: column;
      padding: 30px 15px;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      border-right: 1px solid rgba(255,255,255,0.05);
      box-shadow: 10px 0 30px rgba(0,0,0,0.5);
      opacity: 0.5;
    }

    #sideBar.hidden {
      transform: translateX(-100%);
      opacity: 0;
    }

    .brand {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 30px;
      color: #fff;
      padding-left: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Stremio Logo Noktası */
    .brand::before {
      content: '';
      width: 12px;
      height: 12px;
      background: var(--stremio-purple);
      box-shadow: 0 0 12px var(--stremio-purple);
    }

    #channelList {
      flex: 1;
      overflow-y: auto;
      padding-right: 5px;
    }

    /* Scrollbar tasarımı */
    #channelList::-webkit-scrollbar { width: 4px; }
    #channelList::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1);}

    /* Kanal Öğeleri */
    .channel {
      position: relative;
      padding: 14px 16px;
      margin-bottom: 6px;

      background: transparent;
      color: #b3b2b7;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.2s ease;
      cursor: pointer;
      display: flex;
      align-items: center;
      border-left: 3px solid transparent;
    }

    /* Kumanda Odaklanması (Stremio Hover Efekti) */
    .channel.focused {
      background: var(--stremio-item-hover);
      color: #fff;
      border-left: 3px solid var(--stremio-purple);
      transform: scale(1.02);
    }

    /* Aktif Kanal */
    .channel.active {
      background: rgba(129, 52, 175, 0.4);
      color: #fff;
      font-weight: 700;
    }

    /* Bilgi Paneli (Stremio Overlay) */
    #infoPanel {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(15, 13, 25, 0.9);
      padding: 12px 30px;

      z-index: 5;
      opacity: 0;
      transition: all 0.4s ease;
      border: 1px solid rgba(129, 52, 175, 0.3);
      backdrop-filter: blur(10px);
    }

    #infoPanel.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #infoPanel h2 {
      font-size: 18px;
      letter-spacing: 0.5px;
      color: #fff;
    }

    /* Stremio Tarzı Loader */
    #loader {
      position: fixed;
      inset: 0;
      background: var(--stremio-bg);
      z-index: 999;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .stremio-spinner {
      width: 70px;
      height: 70px;
      border: 3px solid rgba(129, 52, 175, 0.2);
      border-top: 3px solid var(--stremio-purple);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div id="loader">
  <div class="stremio-spinner"></div>
</div>

<div id="videoContainer">
  <video id="video" autoplay playsinline></video>
</div>

<div id="infoPanel">
  <h2 id="currentChannelLabel">-</h2>
</div>

<div id="sideBar">
  <div class="brand">STREMIO TV</div>
  <div id="channelList">
    <div class="channel" data-type="hls" data-src="https://halktv-live.daioncdn.net/halktv/halktv_1080p.m3u8">HALK TV</div>
    <div class="channel" data-type="hls" data-src="https://saran-live.ercdn.net/fx/index.m3u8">FX TR</div>
    <div class="channel" data-type="hls" data-src="https://ekoltv-live.ercdn.net/ekoltv/ekoltv.m3u8">EKOL TV</div>
    <div class="channel" data-type="hls" data-src="https://saran-live.ercdn.net/natgeohd/index.m3u8">NAT GEO TR</div>
    <div class="channel" data-type="hls" data-src="https://tv-trtbelgesel.medya.trt.com.tr/master.m3u8">TRT BELGESEL</div>
    <div class="channel" data-type="hls" data-src="https://hnpsechtsc.turknet.ercdn.net/xpnvudnlsv/cnbc-e/cnbc-e_720p.m3u8">CNBC-E</div>
    <div class="channel" data-type="hls" data-src="https://vs-hls-push-ww-live.akamaized.net/x=4/i=urn:bbc:pips:service:bbc_news_channel_hd/t=3840/v=pv14/b=5070016/main.m3u8">BBC NEWS</div>
    </div>
</div>

<script>
  // Motor Kısmı: Dokunulmadı, sadece görsel geri bildirimler (loader vb.) yeni sınıflara bağlandı.
  const video = document.getElementById('video');
  const sideBar = document.getElementById('sideBar');
  const channelList = document.getElementById('channelList');
  const channels = document.querySelectorAll('.channel');
  const infoPanel = document.getElementById('infoPanel');
  const label = document.getElementById('currentChannelLabel');
  const loader = document.getElementById('loader');

  let focusedIndex = 0;
  let hls;
  let hideTimer;

  function playStream(url) {
    loader.style.display = 'flex';
    loader.style.opacity = '1';

    if (hls) hls.destroy();
    if (Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      video.onplaying = () => { 
        loader.style.opacity = '0'; 
        setTimeout(()=>loader.style.display='none', 400); 
      };
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.onloadeddata = () => { 
        video.play(); 
        loader.style.opacity = '0'; 
        setTimeout(()=>loader.style.display='none', 400);
      };
    }
  }

  function updateFocus(index) {
    channels.forEach(c => c.classList.remove('focused'));
    const target = channels[index];
    target.classList.add('focused');
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    resetHideTimer();
  }

  function activateChannel(index) {
    channels.forEach(c => c.classList.remove('active'));
    channels[index].classList.add('active');
    
    const name = channels[index].innerText;
    label.innerText = name;
    infoPanel.classList.add('show');
    
    playStream(channels[index].dataset.src);
    setTimeout(() => infoPanel.classList.remove('show'), 3000);
  }

  function resetHideTimer() {
    sideBar.classList.remove('hidden');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      sideBar.classList.add('hidden');
    }, 5000);
  }

  document.addEventListener('keydown', (e) => {
    switch(e.key) {
      case 'ArrowDown':
        focusedIndex = (focusedIndex + 1) % channels.length;
        updateFocus(focusedIndex);
        break;
      case 'ArrowUp':
        focusedIndex = (focusedIndex - 1 + channels.length) % channels.length;
        updateFocus(focusedIndex);
        break;
      case 'Enter':
        activateChannel(focusedIndex);
        break;
      case 'ArrowRight':
      case 'ArrowLeft':
        resetHideTimer();
        break;
    }
  });

  channels.forEach((chan, idx) => {
    chan.addEventListener('click', () => {
      focusedIndex = idx;
      updateFocus(idx);
      activateChannel(idx);
    });
  });

  updateFocus(0);
  activateChannel(0);
</script>

</body>
</html>
