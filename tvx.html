<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix Klonu</title>
<style>
    body, html { 
        margin: 0; 
        padding: 0; 
        background: #000; 
        color: #fff; 
        overflow-x: hidden; 
        font-family: sans-serif; 
    }
    #videoContainer { 
        position: fixed; 
        top: 0; 
        left: 0; 
        width: 100vw; 
        height: 100vh; 
        z-index: 1; 
        display: none; 
        background: #000; 
    }
    video { 
        width: 100%; 
        height: 100%; 
    }
    #ui { 
        position: relative; 
        z-index: 100; 
        padding: 20px; 
    }
    h1 { 
        color: #e50914; 
        text-align: center; 
    }
    #grid { 
        display: grid; 
        grid-template-columns: repeat(4, 1fr); 
        gap: 15px; 
    }
    .card { 
        background: rgba(30, 30, 30, 0.9); 
        border: 4px solid transparent; 
        border-radius: 8px; 
        padding: 10px; 
        text-align: center; 
        height: 120px; 
        display: flex; 
        flex-direction: column; 
        justify-content: center; 
        align-items: center; 
        transition: transform 0.2s;
    }
    .card.focused { 
        border-color: #fff; 
        transform: scale(1.05); 
    }
    .card img { 
        max-width: 100%; 
        max-height: 70px; 
        margin-bottom: 5px; 
    }
    .title { 
        font-size: 12px; 
        overflow: hidden; 
    }
</style>
</head>
<body>

<div id="videoContainer">
    <video id="player" controls></video>
</div>

<div id="ui">
    <h1>NETFLIX</h1>
    <div id="grid"></div>
</div>

<script>
let allMovies = [];
let displayedCount = 0;
const batchSize = 12;
const columns = 4;
let focusIndex = 0;
let isPlaying = false;

async function init() {
    const res = await fetch('https://tv606.github.io/xinemax/listx.m3u');
    const text = await res.text();
    parseM3U(text);
    shuffle(allMovies);
    loadMore();
    setupControls();
}

function parseM3U(data) {
    const lines = data.split('\n');
    let temp = {};
    const map = new Map();
    
    for (let line of lines) {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
            const nameMatch = line.match(/,(.+)$/);
            const logoMatch = line.match(/tvg-logo="([^"]+)"/);
            if (nameMatch) temp.title = nameMatch[1];
            if (logoMatch) temp.logo = logoMatch[1];
        } else if (line.startsWith('http')) {
            temp.url = line;
            if (temp.title && !map.has(temp.title)) {
                map.set(temp.title, { ...temp });
            }
            temp = {};
        }
    }
    allMovies = Array.from(map.values());
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function loadMore() {
    const grid = document.getElementById('grid');
    const end = Math.min(displayedCount + batchSize, allMovies.length);
    
    for (let i = displayedCount; i < end; i++) {
        const m = allMovies[i];
        const div = document.createElement('div');
        div.className = 'card';
        div.id = 'card-' + i;
        
        let content = '';
        if (m.logo) content += `<img src="${m.logo}" alt="Afiş">`;
        content += `<div class="title">${m.title}</div>`;
        
        div.innerHTML = content;
        grid.appendChild(div);
    }
    
    displayedCount = end;
    if (displayedCount === batchSize) updateFocus();
}

function updateFocus() {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('focused'));
    const active = document.getElementById('card-' + focusIndex);
    if (active) {
        active.classList.add('focused');
        active.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
}

function playVideo(url) {
    isPlaying = true;
    document.getElementById('ui').style.display = 'none';
    const vc = document.getElementById('videoContainer');
    const player = document.getElementById('player');
    vc.style.display = 'block';
    player.src = url;
    player.play();
}

function stopVideo() {
    isPlaying = false;
    const vc = document.getElementById('videoContainer');
    const player = document.getElementById('player');
    player.pause();
    player.src = '';
    vc.style.display = 'none';
    document.getElementById('ui').style.display = 'block';
    updateFocus();
}

function setupControls() {
    window.addEventListener('keydown', (e) => {
        if (isPlaying) {
            if (e.key === 'Escape' || e.key === 'Backspace' || e.keyCode === 10009) {
                e.preventDefault();
                stopVideo();
            }
            return;
        }

        if (e.key === 'ArrowRight') {
            if (focusIndex < displayedCount - 1) focusIndex++;
        } else if (e.key === 'ArrowLeft') {
            if (focusIndex > 0) focusIndex--;
        } else if (e.key === 'ArrowDown') {
            if (focusIndex + columns < displayedCount) {
                focusIndex += columns;
            } else if (displayedCount < allMovies.length) {
                loadMore();
                focusIndex += columns;
                if (focusIndex >= displayedCount) focusIndex = displayedCount - 1;
            }
        } else if (e.key === 'ArrowUp') {
            if (focusIndex - columns >= 0) focusIndex -= columns;
        } else if (e.key === 'Enter') {
            playVideo(allMovies[focusIndex].url);
        }
        
        updateFocus();
    });
}

init();
</script>
</body>
</html>
