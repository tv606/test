    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #000;
            overflow: hidden;
        }

        /* WebView render motoru için container zorunlu */
        #videoContainer {
            position: absolute;
            width: 100%; height: 100%;
            background: #000;
            z-index: 1;
        }

        video {
            width: 100%; height: 100%;
            object-fit: cover;
            background: #000;
        }

        /* UI Elemanları - backdrop-filter YOK */
        #overlay {
            position: absolute;
            top: 5%; left: 5%;
            z-index: 100;
            color: white;
            font-family: sans-serif;
        }

        .badge {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 30px;
            font-size: 2.5rem;
            border-left: 10px solid red;
            display: none; /* Sadece değişimde görünecek */
        }

        #loader {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 50;
        }

        .spinner {
            width: 80px; height: 80px;
            border: 8px solid rgba(255,255,255,0.1);
            border-top: 8px solid #ff0000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>

    let currentIndex = 0;
    let hls = null;
    const video = document.getElementById('mainVideo');
    const loader = document.getElementById('loader');
    const badge = document.getElementById('channelName');

    function loadSource(url) {
        loader.style.display = 'flex';
        badge.style.display = 'block';
        badge.innerText = channels[currentIndex].name;

        // Bilgi ekranını 3 saniye sonra gizle
        setTimeout(() => { badge.style.display = 'none'; }, 3000);

        if (hls) {
            hls.destroy();
        }

        if (Hls.isSupported()) {
            hls = new Hls({
                // WebView için performans ayarları
                enableWorker: true,
                lowLatencyMode: true,
                backBufferLength: 60
            });
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play().catch(e => console.log("Autoplay hatası:", e));
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play();
        }
    }

    // Video oynamaya başlayınca loader'ı gizle
    video.addEventListener('playing', () => {
        loader.style.display = 'none';
        // Video oynadıktan sonra sesi açmayı dene (Android kısıtlaması için)
        video.muted = false; 
    });

    function changeChannel(dir) {
        if (dir === 'up') currentIndex = (currentIndex > 0) ? currentIndex - 1 : channels.length - 1;
        else currentIndex = (currentIndex < channels.length - 1) ? currentIndex + 1 : 0;
        
        loadSource(channels[currentIndex].url);
    }

    // Kumanda Dinleyici
    document.addEventListener('keydown', (e) => {
        // Log alarak kumandanın tuş kodunu kontrol edebilirsin
        console.log("Basılan Tuş:", e.keyCode);
        
        if (e.keyCode === 38) changeChannel('up');   // Yukarı
        if (e.keyCode === 40) changeChannel('down'); // Aşağı
        if (e.keyCode === 13) video.muted = !video.muted; // OK tuşu sessize al/aç
    });

    // İlk kanal
    window.onload = () => {
        document.body.focus(); // Kumanda için odağı al
        loadSource(channels[currentIndex].url);
    };
