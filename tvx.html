    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        /* Video Container (z-index: 1) */
        #videoContainer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background: #000;
        }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* Arayüz Katmanı (z-index: 100) */
        #uiLayer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            transition: opacity 0.3s ease;
        }

        #uiLayer.hidden { opacity: 0; pointer-events: none; }

        header { padding: 40px 60px; background: rgba(0,0,0,0.5); }
        header h1 { color: #fff; margin: 0; font-size: 2rem; letter-spacing: 2px; }

        main { flex: 1; padding: 20px 60px; overflow-y: auto; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            padding-bottom: 100px;
        }

        .channel-item {
            position: relative;
            height: 180px;
            background: rgba(0, 0, 0, 0.2);;
            border: 5px solid transparent;
            border-radius: 15px;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            transition: transform 0.2s;
        }

        .channel-item span {
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
        }

        /* Focus Efekti */
        .channel-item.focused {
            transform: scale(1.08);
            border-color: #00d2ff;
            background-color: #333;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.4);
        }

        main::-webkit-scrollbar { display: none; }
    </style>
</head>

        const video = document.getElementById('mainVideo');
        const grid = document.getElementById('grid');
        const uiLayer = document.getElementById('uiLayer');
        const canvas = document.getElementById('snapshotCanvas');
        let hls = new Hls();
        let focusIndex = 0;

        function buildUI() {
            grid.innerHTML = "";
            channels.forEach((ch) => {
                const el = document.createElement('div');
                el.className = 'channel-item';
                el.id = "card-" + ch.id;
                el.innerHTML = `<span>${ch.name}</span>`;
                grid.appendChild(el);
            });
            updateSelection();
        }

        function updateSelection() {
            const cards = document.querySelectorAll('.channel-item');
            cards.forEach((card, idx) => {
                card.classList.toggle('focused', idx === focusIndex);
                if (idx === focusIndex) {
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            });
        }

        function playSelected() {
            const ch = channels[focusIndex];
            const targetCardId = "card-" + ch.id; // Screenshot'ın gideceği ID'yi mühürle
            
            document.getElementById('activeTitle').innerText = ch.name;
            
            hls.destroy(); // Eski yayını ve eventleri tamamen temizle
            hls = new Hls();
            
            hls.loadSource(ch.url);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play();
                // Yayının gelmesi için 2 saniye bekle ve sonra ilgili karta screenshot bas
                setTimeout(() => {
                    if (video.videoWidth > 0) {
                        const ctx = canvas.getContext('2d');
                        canvas.width = 480; canvas.height = 270;
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        const img = canvas.toDataURL('image/jpeg', 0.8);
                        document.getElementById(targetCardId).style.backgroundImage = `url('${img}')`;
                    }
                }, 2000);
            });

            // Menüyü 1 sn sonra kapat
            setTimeout(() => uiLayer.classList.add('hidden'), 1000);
        }

        // Navigasyon Mantığı
        document.addEventListener('keydown', (e) => {
            if (uiLayer.classList.contains('hidden')) {
                uiLayer.classList.remove('hidden');
                e.preventDefault();
                return;
            }

            // Izgara genişliğine göre sütun sayısını hesapla
            const containerWidth = grid.offsetWidth;
            const itemWidth = document.querySelector('.channel-item').offsetWidth + 30; // gap dahil
            const cols = Math.floor(containerWidth / itemWidth) || 1;

            switch(e.key) {
                case "ArrowRight": if (focusIndex < channels.length - 1) focusIndex++; break;
                case "ArrowLeft": if (focusIndex > 0) focusIndex--; break;
                case "ArrowDown": if (focusIndex + cols < channels.length) focusIndex += cols; break;
                case "ArrowUp": if (focusIndex - cols >= 0) focusIndex -= cols; break;
                case "Enter": playSelected(); break;
                case "Backspace":
                case "Escape": uiLayer.classList.add('hidden'); break;
            }
            updateSelection();
        });

        window.onload = buildUI;
    </script>
