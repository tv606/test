    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: sans-serif;
        }

        #mainSlider {
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 1;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* UI Katmanı */
        .ui-overlay {
            position: absolute;
            top: 40px;
            left: 40px;
            z-index: 100;
        }

        .channel-badge {
            background: rgba(20, 20, 20, 0.85);
            color: #fff;
            padding: 15px 30px;
            border-radius: 4px;
            font-size: 32px;
            font-weight: bold;
            border-left: 8px solid #e50914; /* Modern bir kırmızı vurgu */
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.5s ease;
        }

        .active .channel-badge {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- LOADER TASARIMI --- */
        .loader-wrapper {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000; /* Video açılana kadar tam siyah zemin */
            z-index: 50;
            transition: opacity 0.4s ease;
        }

        .spinner {
            width: 70px;
            height: 70px;
            border: 6px solid rgba(255, 255, 255, 0.1);
            border-top: 6px solid #e50914;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #fff;
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Video oynamaya başladığında loader'ı gizle */
        .video-playing .loader-wrapper {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

    let currentIndex = 0;
    let hls = null;
    const mainSlider = document.getElementById('mainSlider');

    function setupApp() {
        channels.forEach((ch, index) => {
            const section = document.createElement('div');
            section.className = `video-container ${index === 0 ? 'active' : ''}`;
            section.id = `container-${index}`;
            section.innerHTML = `
                <div class="loader-wrapper">
                    <div class="spinner"></div>
                    <div class="loading-text">Yükleniyor...</div>
                </div>
                <div class="ui-overlay">
                    <div class="channel-badge">${ch.name}</div>
                </div>
                <video id="video-${index}" playsinline></video>
            `;
            mainSlider.appendChild(section);
        });
        playChannel(0);
    }

    function playChannel(index) {
        if (hls) hls.destroy();

        const container = document.getElementById(`container-${index}`);
        const video = document.getElementById(`video-${index}`);
        const url = channels[index].url;

        // Yeni kanal için loader'ı göster (class temizliği)
        container.classList.remove('video-playing');

        if (Hls.isSupported()) {
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play();
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play();
        }

        // Video gerçekten oynamaya başladığında (ilk kare düştüğünde) loader'ı kaldır
        video.onplaying = () => {
            container.classList.add('video-playing');
        };
    }

    function switchChannel(direction) {
        const oldIndex = currentIndex;
        if (direction === 'down' && currentIndex < channels.length - 1) currentIndex++;
        else if (direction === 'up' && currentIndex > 0) currentIndex--;
        else return;

        // Eski videoyu durdur
        const oldVideo = document.getElementById(`video-${oldIndex}`);
        oldVideo.pause();
        oldVideo.src = "";

        mainSlider.style.transform = `translateY(-${currentIndex * 100}vh)`;
        
        document.querySelectorAll('.video-container').forEach(el => el.classList.remove('active'));
        document.getElementById(`container-${currentIndex}`).classList.add('active');

        playChannel(currentIndex);
    }

    document.addEventListener('keydown', (e) => {
        if (e.keyCode === 38) switchChannel('up');
        if (e.keyCode === 40) switchChannel('down');
    });

    setupApp();
</script>
