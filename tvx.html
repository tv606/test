<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xinemax TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #141414; color: #fff; font-family: sans-serif; overflow-x: hidden; padding: 20px; }
    #search { width: 100%; padding: 15px; font-size: 20px; background: #333; color: #fff; border: 2px solid transparent; border-radius: 8px; margin-bottom: 20px; outline: none; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
    .card { background: #222; border-radius: 8px; overflow: hidden; border: 3px solid transparent; cursor: pointer; aspect-ratio: 2/3; display: flex; flex-direction: column; position: relative; }
    .card img { width: 100%; height: 80%; object-fit: cover; background: #111; }
    .card .title { padding: 8px; font-size: 14px; text-align: center; font-weight: bold; height: 20%; display: flex; align-items: center; justify-content: center; word-break: break-word; }
    .focusable:focus, .card:focus, #search:focus { border-color: #e50914; background: #333; transform: scale(1.05); outline: none; z-index: 10; }
    
    /* Tam Ekran Video Oyuncu Katmanı */
    #player-container { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 99999; }
    video { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>

  <input type="text" id="search" class="focusable" placeholder="Film Ara..." />
  <div id="grid" class="grid"></div>
  
  <div id="player-container">
    <video id="video" controls autoplay playsinline></video>
  </div>

  <script>
    const M3U_URL = 'https://tv606.github.io/xinemax/listx.m3u';
    let allMovies = [];
    let filteredMovies = [];
    let displayedCount = 0;
    const PAGE_SIZE = 12;
    let hlsInstance = null;

    // Diziyi Rastgele Karıştırma (Fisher-Yates Shuffle)
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    async function loadM3U() {
      try {
        const res = await fetch(M3U_URL);
        const text = await res.text();
        parseM3U(text);
      } catch (e) {
        console.error("M3U yüklenemedi:", e);
      }
    }

    function parseM3U(data) {
      const lines = data.split('\n');
      let currentItem = {};

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (line.startsWith('#EXTINF:')) {
          const tvgLogo = line.match(/tvg-logo="([^"]+)"/);
          const logo = tvgLogo ? tvgLogo[1] : '';
          const title = line.split(',')[1] || 'Bilinmeyen Film';
          currentItem = { title: title, logo: logo };
        } else if (line.startsWith('http')) {
          if (currentItem.title) {
            currentItem.url = line;
            allMovies.push(currentItem);
            currentItem = {};
          }
        }
      }

      // Her açılışta ve yenilemede listeyi rastgele karıştır
      allMovies = shuffleArray(allMovies);
      filteredMovies = allMovies;
      loadMore();
    }

    function loadMore() {
      const grid = document.getElementById('grid');
      const nextBatch = filteredMovies.slice(displayedCount, displayedCount + PAGE_SIZE);
      
      nextBatch.forEach(m => {
        const div = document.createElement('div');
        div.className = 'card focusable';
        div.tabIndex = 0;
        
        const img = document.createElement('img');
        img.src = m.logo || 'https://via.placeholder.com/300x450?text=Görsel+Yok';
        img.onerror = () => { img.src = 'https://via.placeholder.com/300x450?text=Görsel+Yok'; };
        
        const titleDiv = document.createElement('div');
        titleDiv.className = 'title';
        titleDiv.innerText = m.title;

        div.appendChild(img);
        div.appendChild(titleDiv);
        
        div.onclick = () => playVideo(m.url);
        div.onkeydown = (e) => { if (e.key === 'Enter' || e.keyCode === 13) playVideo(m.url); };
        grid.appendChild(div);
      });
      
      displayedCount += nextBatch.length;
    }

    function playVideo(url) {
      const container = document.getElementById('player-container');
      const video = document.getElementById('video');
      container.style.display = 'block';

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      // HLS.js yapılandırması (CORS ve Akış Hatalarını En Aza İndirmek İçin)
      if (Hls.isSupported()) {
        hlsInstance = new Hls({
          debug: false,
          enableWorker: true,
          lowLatencyMode: false,
          xhrSetup: function (xhr, url) {
            xhr.withCredentials = false;
          }
        });

        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);
        
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(err => console.log("Oynatma başlatılamadı:", err));
        });

        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                hlsInstance.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                hlsInstance.recoverMediaError();
                break;
              default:
                // HLS çalışmazsa doğrudan native html5 video oynatmayı dene
                hlsInstance.destroy();
                video.src = url;
                video.play().catch(() => {});
                break;
            }
          }
        });
      } else {
        // Native HLS destekleyen cihaz/browser'lar için
        video.src = url;
        video.play().catch(() => {});
      }

      video.focus();
    }

    function closePlayer() {
      const container = document.getElementById('player-container');
      const video = document.getElementById('video');
      
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      
      video.pause();
      video.removeAttribute('src');
      video.load();
      container.style.display = 'none';
      
      // Player kapandığında ilk karta odaklan
      document.querySelector('.card')?.focus();
    }

    // Arama Fonksiyonu
    document.getElementById('search').addEventListener('input', (e) => {
      const val = e.target.value.toLowerCase();
      filteredMovies = allMovies.filter(m => m.title.toLowerCase().includes(val));
      document.getElementById('grid').innerHTML = '';
      displayedCount = 0;
      loadMore();
    });

    // Sonsuz Kaydırma (Infinite Scroll)
    window.addEventListener('scroll', () => {
      if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
        if (displayedCount < filteredMovies.length) loadMore();
      }
    });

    // Kumanda Tuş Kontrolleri
    document.addEventListener('keydown', (e) => {
      const player = document.getElementById('player-container');
      
      // Video oynatılırken BACK tuşlarına basılırsa video kapatılsın
      if (player.style.display === 'block') {
        if (e.key === 'Escape' || e.key === 'BackSpace' || e.keyCode === 27 || e.keyCode === 8 || e.keyCode === 10009 || e.keyCode === 461) {
          closePlayer();
          e.preventDefault();
        }
        return;
      }

      const focusables = Array.from(document.querySelectorAll('.focusable'));
      let index = focusables.indexOf(document.activeElement);

      if (index === -1) {
        focusables[0]?.focus();
        return;
      }

      const cols = Math.floor(document.getElementById('grid').clientWidth / 200) || 1;

      if (e.key === 'ArrowRight' && index < focusables.length - 1) focusables[index + 1].focus();
      if (e.key === 'ArrowLeft' && index > 0) focusables[index - 1].focus();
      if (e.key === 'ArrowDown') {
        if (index + cols < focusables.length) {
          focusables[index + cols].focus();
        } else if (displayedCount < filteredMovies.length) {
          loadMore();
          setTimeout(() => {
            const updated = document.querySelectorAll('.focusable');
            if (updated[index + cols]) updated[index + cols].focus();
          }, 50);
        }
      }
      if (e.key === 'ArrowUp' && index - cols >= 0) focusables[index - cols].focus();
    });

    loadM3U();
  </script>
</body>
</html>
