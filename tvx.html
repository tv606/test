<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebOS TV App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #141414;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        :focus {
            outline: 4px solid #8a2be2 !important;
            outline-offset: 4px;
            box-shadow: 0 0 15px #8a2be2;
        }

        header {
            display: flex;
            align-items: center;
            padding: 20px 50px;
            background: rgba(0,0,0,0.8);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #8a2be2;
            margin-right: 40px;
            padding: 5px 10px;
        }

        nav a {
            color: #ccc;
            text-decoration: none;
            margin-right: 20px;
            padding: 8px 16px;
            display: inline-block;
            border-radius: 4px;
        }

        main {
            padding: 40px 50px;
        }

        .category-title {
            margin-bottom: 20px;
            font-size: 22px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: #222;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
        }

        /* Loader Overlay */
        .loader-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .loader-overlay.active {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #8a2be2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Video Player Container */
        .player-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
        }

        .player-container.active {
            display: block;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 10001;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" tabindex="0">STREAM TV</div>
        <nav>
            <a href="#" class="nav-item" tabindex="0">Aksiyon</a>
            <a href="#" class="nav-item" tabindex="0">Komedi</a>
            <a href="#" class="nav-item" tabindex="0">Dram</a>
        </nav>
    </header>

    <main>
        <h2 class="category-title">Popüler Filmler</h2>
        
        <div class="grid">
            <div class="card movie-card" tabindex="0" data-video="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4">
                <h3>Film 1</h3>
            </div>
            <div class="card movie-card" tabindex="0" data-video="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4">
                <h3>Film 2</h3>
            </div>
            <div class="card movie-card" tabindex="0" data-video="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4">
                <h3>Film 3</h3>
            </div>
            <div class="card movie-card" tabindex="0" data-video="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4">
                <h3>Film 4</h3>
            </div>
        </div>
    </main>

    <div class="loader-overlay" id="loader">
        <div class="spinner"></div>
        <p style="margin-top: 15px;">Yükleniyor...</p>
    </div>

    <div class="player-container" id="player-wrapper">
        <button class="close-btn" id="close-player" tabindex="0">Kapat</button>
        <video id="video-player" controls></video>
    </div>

    <script>
        const loader = document.getElementById('loader');
        const playerWrapper = document.getElementById('player-wrapper');
        const videoPlayer = document.getElementById('video-player');
        const closeBtn = document.getElementById('close-player');

        document.querySelectorAll('.movie-card').forEach(card => {
            card.addEventListener('click', () => {
                const src = card.getAttribute('data-video');
                playMovie(src);
            });
        });

        function playMovie(src) {
            loader.classList.add('active');
            playerWrapper.classList.add('active');
            videoPlayer.src = src;

            videoPlayer.play().then(() => {
                loader.classList.remove('active');
                closeBtn.focus();
            }).catch(() => {
                loader.classList.remove('active');
            });
        }

        function closeVideo() {
            videoPlayer.pause();
            videoPlayer.src = '';
            playerWrapper.classList.remove('active');
            loader.classList.remove('active');
            document.querySelector('.logo').focus();
        }

        closeBtn.addEventListener('click', closeVideo);

        document.addEventListener('keydown', (e) => {
            const focusable = Array.from(document.querySelectorAll('[tabindex="0"]'));
            const index = focusable.indexOf(document.activeElement);

            switch (e.keyCode) {
                case 13:
                    if (document.activeElement) document.activeElement.click();
                    break;
                case 10009:
                case 27:
                    if (playerWrapper.classList.contains('active')) {
                        closeVideo();
                    }
                    break;
                case 37:
                    if (index > 0) focusable[index - 1].focus();
                    break;
                case 39:
                    if (index < focusable.length - 1) focusable[index + 1].focus();
                    break;
                case 38:
                    if (index - 4 >= 0) focusable[index - 4].focus();
                    break;
                case 40:
                    if (index + 4 < focusable.length) focusable[index + 4].focus();
                    break;
            }
        });

        window.onload = () => {
            document.querySelector('.logo').focus();
        };
    </script>
</body>
</html>
