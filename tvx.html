<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TVX Vertical Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --side-width: 350px;
      --accent: #00d2ff; /* Modern Cyber Blue */
      --glass: rgba(15, 15, 20, 0.85);
      --font-main: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      background: #000;
      font-family: var(--font-main);
      color: white;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Tam Ekran Video */
    #videoContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Sol Dikey Kanal Barı */
    #sideBar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--side-width);
      height: 100%;
      background: linear-gradient(to right, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 100%);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 10;
      display: flex;
      flex-direction: column;
      padding: 40px 20px;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      border-right: 1px solid rgba(255,255,255,0.1);
    }

    #sideBar.hidden {
      transform: translateX(-110%);
    }

    .brand {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 40px;
      color: var(--accent);
      padding-left: 15px;
      letter-spacing: -1px;
    }

    /* Kanal Listesi Konteynırı */
    #channelList {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: none; /* Firefox */
      padding-bottom: 100px;
    }

    #channelList::-webkit-scrollbar { display: none; }

    /* Kanal Öğesi */
    .channel {
      position: relative;
      padding: 18px 20px;
      margin-bottom: 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      color: #aaa;
      font-size: 18px;
      font-weight: 600;
      transition: all 0.3s ease;
      cursor: pointer;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
    }

    /* Kumanda Odaklanması */
    .channel.focused {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      transform: translateX(15px);
      border-color: var(--accent);
      box-shadow: -10px 0 20px rgba(0, 210, 255, 0.2);
    }

    /* Aktif Çalan Kanal */
    .channel.active {
      background: linear-gradient(90deg, rgba(0, 210, 255, 0.2), transparent);
      color: var(--accent);
    }

    .channel.active::before {
      content: "";
      position: absolute;
      left: 0;
      width: 4px;
      height: 60%;
      background: var(--accent);
      border-radius: 0 4px 4px 0;
    }

    /* Bilgi Paneli (Üst Sağ) */
    #infoPanel {
      position: fixed;
      top: 40px;
      right: 40px;
      background: var(--glass);
      padding: 20px 40px;
      border-radius: 20px;
      z-index: 5;
      opacity: 0;
      transform: translateY(-20px);
      transition: all 0.5s ease;
      border: 1px solid rgba(255,255,255,0.1);
    }

    #infoPanel.show {
      opacity: 1;
      transform: translateY(0);
    }

    #infoPanel h2 {
      font-size: 28px;
      margin: 0;
      font-weight: 700;
    }

    /* Modern Loader */
    #loader {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.6s ease;
    }

    .loading-bar {
      width: 150px;
      height: 4px;
      background: rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
      border-radius: 2px;
    }

    .loading-bar::after {
      content: "";
      position: absolute;
      left: -100%;
      width: 100%;
      height: 100%;
      background: var(--accent);
      animation: loading 1.5s infinite;
    }

    @keyframes loading {
      0% { left: -100%; }
      50% { left: 0; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>

<div id="loader">
  <div class="loading-bar"></div>
</div>

<div id="videoContainer">
  <video id="video" autoplay playsinline></video>
</div>

<div id="infoPanel">
  <h2 id="currentChannelLabel">-</h2>
</div>

<div id="sideBar">
  <div class="brand">TVX PRO</div>
  <div id="channelList">
    <div class="channel" data-src="https://halktv-live.daioncdn.net/halktv/halktv_1080p.m3u8">HALK TV</div>
    <div class="channel" data-src="https://saran-live.ercdn.net/fx/index.m3u8">FX TR</div>
    <div class="channel" data-src="https://ekoltv-live.ercdn.net/ekoltv/ekoltv.m3u8">EKOL TV</div>
    <div class="channel" data-src="https://saran-live.ercdn.net/natgeohd/index.m3u8">NAT GEO TR</div>
    <div class="channel" data-src="https://saran-live.ercdn.net/natgeowild/index.m3u8">NAT GEO WILD TR</div>
    <div class="channel" data-src="https://tv-trtbelgesel.medya.trt.com.tr/master.m3u8">TRT BELGESEL</div>
    <div class="channel" data-src="https://tv-trtspor1.medya.trt.com.tr/master.m3u8">TRT SPOR</div>
    <div class="channel" data-src="https://tv-trt1.medya.trt.com.tr/master_1080.m3u8">TRT 1</div>
    <div class="channel" data-src="https://hnpsechtsc.turknet.ercdn.net/xpnvudnlsv/cnbc-e/cnbc-e_720p.m3u8">CNBC-E</div>
    <div class="channel" data-src="https://vs-hls-push-ww-live.akamaized.net/x=4/i=urn:bbc:pips:service:bbc_news_channel_hd/t=3840/v=pv14/b=5070016/main.m3u8">BBC NEWS</div>
    <div class="channel" data-src="https://amg00793-amg00793c6-xumo-us-2669.playouts.now.amagi.tv/BBCStudios-BBCEarthA-hls/playlist1080p.m3u8">BBC EARTH</div>
    <div class="channel" data-src="https://aegis-cloudfront-1.tubi.video/6d6d0f24-8445-4b4c-bdf6-44f9e38beaa4/1080p-cc/index.m3u8">LOVE NATURE</div>
  </div>
</div>

<script>
  const video = document.getElementById('video');
  const sideBar = document.getElementById('sideBar');
  const channelList = document.getElementById('channelList');
  const channels = document.querySelectorAll('.channel');
  const infoPanel = document.getElementById('infoPanel');
  const label = document.getElementById('currentChannelLabel');
  const loader = document.getElementById('loader');

  let focusedIndex = 0;
  let hls;
  let hideTimer;

  // --- Oynatıcı Fonksiyonları ---
  function playStream(url) {
    loader.style.opacity = '1';
    loader.style.display = 'flex';

    if (hls) hls.destroy();
    if (Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      video.onplaying = () => { loader.style.opacity = '0'; setTimeout(()=>loader.style.display='none', 600); };
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.onloadeddata = () => { video.play(); loader.style.opacity = '0'; };
    }
  }

  // --- Navigasyon ---
  function updateFocus(index) {
    channels.forEach(c => c.classList.remove('focused'));
    const target = channels[index];
    target.classList.add('focused');
    
    // Akıllı Kaydırma: Odaklanan kanalı ortala
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    resetHideTimer();
  }

  function activateChannel(index) {
    channels.forEach(c => c.classList.remove('active'));
    channels[index].classList.add('active');
    
    const name = channels[index].innerText;
    label.innerText = name;
    infoPanel.classList.add('show');
    
    playStream(channels[index].dataset.src);

    setTimeout(() => infoPanel.classList.remove('show'), 4000);
  }

  function resetHideTimer() {
    sideBar.classList.remove('hidden');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      sideBar.classList.add('hidden');
    }, 5000); // 5 saniye işlem yapılmazsa gizle
  }

  // --- Klavye / Kumanda Olayları ---
  document.addEventListener('keydown', (e) => {
    switch(e.key) {
      case 'ArrowDown':
        focusedIndex = (focusedIndex + 1) % channels.length;
        updateFocus(focusedIndex);
        break;
      case 'ArrowUp':
        focusedIndex = (focusedIndex - 1 + channels.length) % channels.length;
        updateFocus(focusedIndex);
        break;
      case 'Enter':
        activateChannel(focusedIndex);
        break;
      case 'ArrowRight':
      case 'ArrowLeft':
        resetHideTimer(); // Menüyü geri getir
        break;
    }
  });

  // Tıklama desteği
  channels.forEach((chan, idx) => {
    chan.addEventListener('click', () => {
      focusedIndex = idx;
      updateFocus(idx);
      activateChannel(idx);
    });
  });

  // Başlangıç
  updateFocus(0);
  activateChannel(0);
</script>

</body>
</html>
