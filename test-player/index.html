  <style>
    :root {
      --side-width: 320px;
      --stremio-purple: #fff; 
      --stremio-bg: #000;
      --stremio-sidebar: rgba(2, 20, 34, 0.95);
      --stremio-item-hover: rgba(29, 52, 175, 0.2);
      --font-main: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      background: #000;
      font-family: var(--font-main);
      color: #eeecf2;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Video Alanı */
    #videoContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #000;
    }

    video, iframe {
      width: 100%;
      height: 100%;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* YouTube iframe'i başlangıçta gizli */
    #ytPlayer {
      display: none;
      z-index: 2;
    }

    video {
      object-fit: contain;
      z-index: 1;
    }

    /* Stremio Tarzı Sidebar */
    #sideBar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--side-width);
      height: 100%;
      background: var(--stremio-sidebar);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      padding: 30px 15px;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      border-right: 1px solid rgba(255,255,255,0.05);
      box-shadow: 10px 0 30px rgba(0,0,0,0.5);
      opacity: 0.9;
    }

    #sideBar.hidden {
      transform: translateX(-100%);
      opacity: 0;
    }

    .brand {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 30px;
      color: #fff;
      padding-left: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand::before {
      content: '';
      width: 12px;
      height: 12px;
      background: var(--stremio-purple);
      box-shadow: 0 0 12px var(--stremio-purple);
    }

    #channelList {
      flex: 1;
      overflow-y: auto;
      padding-right: 5px;
    }

    #channelList::-webkit-scrollbar { width: 4px; }
    #channelList::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1);}

    .channel {
      position: relative;
      padding: 14px 16px;
      margin-bottom: 6px;
      background: transparent;
      color: #b3b2b7;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.2s ease;
      cursor: pointer;
      display: flex;
      align-items: center;
      border-left: 3px solid transparent;
    }

    .channel.focused {
      background: rgba(222, 222, 222, 0.2);
      color: #fff;
      border-left: 3px solid var(--stremio-purple);
      transform: scale(1.02);
      font-weight: 700;
      font-size: 20px;
    }

    .channel.active {
      background: rgba(2, 20, 34, 0.7);
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      filter: invert(1);
    }

    #infoPanel {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(15, 13, 25, 0.9);
      padding: 12px 30px;
      z-index: 5;
      opacity: 0;
      transition: all 0.4s ease;
      border: 1px solid rgba(129, 52, 175, 0.3);
      backdrop-filter: blur(10px);
    }

    #infoPanel.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #infoPanel h2 {
      font-size: 18px;
      letter-spacing: 0.5px;
      color: #fff;
    }

    #loader {
      position: fixed;
      inset: 0;
      background: var(--stremio-bg);
      z-index: 99;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .stremio-spinner {
      width: 70px;
      height: 70px;
      border: 3px solid rgba(182, 173, 165, 0.2);
      border-top: 3px solid var(--stremio-purple);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<script>
  const video = document.getElementById('video');
  const ytPlayer = document.getElementById('ytPlayer');
  const sideBar = document.getElementById('sideBar');
  const channelList = document.getElementById('channelList');
  const infoPanel = document.getElementById('infoPanel');
  const label = document.getElementById('currentChannelLabel');
  const loader = document.getElementById('loader');

  let focusedIndex = 0;
  let hls;
  let hideTimer;

  // Kanalları dinamik olarak çekmek için querySelectorAll'u fonksiyon içinde veya liste değiştikçe güncellemeliyiz
  let channels = document.querySelectorAll('.channel');

  function showLoader() {
    loader.style.display = 'flex';
    loader.style.opacity = '1';
  }

  function hideLoader() {
    loader.style.opacity = '0'; 
    setTimeout(() => loader.style.display = 'none', 400);
  }

  function playStream(type, src) {
    showLoader();

    // HLS Durdur
    if (hls) {
      hls.destroy();
      hls = null;
    }
    video.pause();
    video.src = "";
    
    // YouTube Durdur
    ytPlayer.src = "";
    ytPlayer.style.display = 'none';

    if (type === 'youtube') {
      // YouTube Modu
      ytPlayer.style.display = 'block';
      ytPlayer.src = `https://www.youtube.com/embed/${src}?autoplay=1&rel=0`;
      // YT Iframe yüklendiğinde loader'ı kapat
      ytPlayer.onload = () => hideLoader();
    } 
    else {
      // HLS Modu
      if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(src);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        video.onplaying = () => hideLoader();
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = src;
        video.onloadeddata = () => { video.play(); hideLoader(); };
      }
    }
  }

  function updateFocus(index) {
    channels.forEach(c => c.classList.remove('focused'));
    const target = channels[index];
    target.classList.add('focused');
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    resetHideTimer();
  }

  function activateChannel(index) {
    channels.forEach(c => c.classList.remove('active'));
    channels[index].classList.add('active');
    
    const name = channels[index].innerText;
    const type = channels[index].dataset.type;
    const src = channels[index].dataset.src;

    label.innerText = name;
    infoPanel.classList.add('show');
    
    playStream(type, src);
    setTimeout(() => infoPanel.classList.remove('show'), 3000);
  }

  function resetHideTimer() {
    sideBar.classList.remove('hidden');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      sideBar.classList.add('hidden');
    }, 5000);
  }

  document.addEventListener('keydown', (e) => {
    switch(e.key) {
      case 'ArrowDown':
        focusedIndex = (focusedIndex + 1) % channels.length;
        updateFocus(focusedIndex);
        break;
      case 'ArrowUp':
        focusedIndex = (focusedIndex - 1 + channels.length) % channels.length;
        updateFocus(focusedIndex);
        break;
      case 'Enter':
        activateChannel(focusedIndex);
        break;
      case 'ArrowRight':
      case 'ArrowLeft':
        resetHideTimer();
        break;
    }
  });

  channels.forEach((chan, idx) => {
    chan.addEventListener('click', () => {
      focusedIndex = idx;
      updateFocus(idx);
      activateChannel(idx);
    });
  });

  // SERVICE WORKER KAYDI (YouTube Bypass için)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(() => {
        console.log("YouTube Bypass Sistemi Aktif.");
    });
  }

  // Başlangıç
  updateFocus(0);
  activateChannel(0);
</script>
