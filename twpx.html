<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Twin Peaks Filter</title>
<style>
  :root {
    --red: #8b0000;
    --bright-red: #d11a2a;
    --gold: #d4af37;
    --dark-bg: #0a0a0a;
    --card-bg: #141414;
    --zigzag-dark: #111111;
    --zigzag-light: #222222;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--dark-bg);
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    overflow: hidden;
  }

  /* Header */
  header {
    text-align: center;
    padding: 15px 0 10px 0;
    border-bottom: 2px solid var(--red);
    background: linear-gradient(180deg, rgba(139,0,0,0.2) 0%, rgba(10,10,10,1) 100%);
  }

  h1 {
    margin: 0;
    font-size: 1.1rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    text-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
  }

  /* Main Display Area */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
    position: relative;
  }

  .viewport-frame {
    width: 100%;
    max-width: 330px;
    height: 420px;
    background-color: var(--card-bg);
    border-radius: 16px;
    border: 1px solid #2a2a2a;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(139, 0, 0, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  canvas {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
  }

  .upload-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    color: #666;
  }

  .upload-placeholder svg {
    width: 48px;
    height: 48px;
    fill: var(--red);
  }

  .upload-placeholder span {
    font-size: 0.85rem;
    letter-spacing: 1px;
  }

  /* Bottom Controls Area */
  controls {
    background: var(--card-bg);
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
    padding: 20px 15px 10px 15px;
    box-shadow: 0 -5px 25px rgba(0,0,0,0.9);
    display: flex;
    flex-direction: column;
    gap: 15px;
    position: relative;
  }

  /* Red Room Zigzag Pattern Strip */
  .zigzag-strip {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 5px;
    background: repeating-linear-gradient(
      45deg,
      var(--zigzag-dark),
      var(--zigzag-dark) 5px,
      var(--zigzag-light) 5px,
      var(--zigzag-light) 10px
    );
    border-radius: 3px;
  }

  .preset-scroll {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 5px;
    scrollbar-width: none;
  }

  .preset-scroll::-webkit-scrollbar {
    display: none;
  }

  .btn-preset {
    flex: 0 0 auto;
    background: #1f1f1f;
    border: 1px solid #333;
    color: #ccc;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .btn-preset.active {
    background: var(--red);
    color: #fff;
    border-color: var(--bright-red);
    box-shadow: 0 0 10px rgba(209, 26, 42, 0.5);
  }

  .action-row {
    display: flex;
    gap: 10px;
  }

  .btn-action {
    flex: 1;
    padding: 14px;
    border-radius: 14px;
    border: none;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-upload {
    background: #252525;
    color: #fff;
    border: 1px solid #3a3a3a;
  }

  .btn-reset {
    background: #1a0505;
    color: var(--bright-red);
    border: 1px solid var(--red);
    flex: 0 0 50px;
  }

  #file-input {
    display: none;
  }
</style>
</head>
<body>

<header>
  <h1>TWIN PEAKS</h1>
</header>

<main>
  <div class="viewport-frame">
    <div id="placeholder" class="upload-placeholder">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-5-7l-3 3.72L9 13l-3 4h12l-4-5z"/></svg>
      <span>GÖRSEL YÜKLE</span>
    </div>
    <canvas id="canvas"></canvas>
  </div>
</main>

<controls>
  <div class="zigzag-strip"></div>
  
  <div class="preset-scroll">
    <button class="btn-preset active" onclick="applyFilter('none', this)">Orijinal</button>
    <button class="btn-preset" onclick="applyFilter('redroom', this)">Red Room</button>
    <button class="btn-preset" onclick="applyFilter('douglasfir', this)">Douglas Fir</button>
    <button class="btn-preset" onclick="applyFilter('laura', this)">Laura Palmer</button>
    <button class="btn-preset" onclick="applyFilter('blacklodge', this)">Black Lodge</button>
  </div>

  <div class="action-row">
    <button class="btn-action btn-upload" onclick="document.getElementById('file-input').click()">
      FOTOĞRAF SEÇ
    </button>
    <button class="btn-action btn-reset" onclick="resetImage()">✕</button>
  </div>
  
  <input type="file" id="file-input" accept="image/*">
</controls>

<script>
const fileInput = document.getElementById('file-input');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const placeholder = document.getElementById('placeholder');
let originalImage = null;

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => {
      placeholder.style.display = 'none';
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      originalImage = ctx.getImageData(0, 0, img.width, img.height);
      setActiveButton(document.querySelector('.btn-preset'));
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
});

function resetImage() {
  if (!originalImage) return;
  ctx.putImageData(originalImage, 0, 0);
  setActiveButton(document.querySelector('.btn-preset'));
}

function setActiveButton(element) {
  document.querySelectorAll('.btn-preset').forEach(btn => btn.classList.remove('active'));
  element.classList.add('active');
}

function applyFilter(type, btn) {
  if (!originalImage) return;
  setActiveButton(btn);

  if (type === 'none') {
    resetImage();
    return;
  }

  const imgData = new ImageData(
    new Uint8ClampedArray(originalImage.data),
    originalImage.width,
    originalImage.height
  );
  const data = imgData.data;

  for (let i = 0; i < data.length; i += 4) {
    let r = data[i];
    let g = data[i + 1];
    let b = data[i + 2];

    if (type === 'redroom') {
      data[i]     = Math.min(255, r * 1.6 + 30);
      data[i + 1] = g * 0.3;
      data[i + 2] = b * 0.2;
    } else if (type === 'douglasfir') {
      data[i]     = r * 0.5;
      data[i + 1] = Math.min(255, g * 1.3 + 15);
      data[i + 2] = Math.min(255, b * 0.7 + 10);
    } else if (type === 'laura') {
      let avg = (r + g + b) / 3;
      data[i]     = avg * 0.5;
      data[i + 1] = avg * 0.7;
      data[i + 2] = Math.min(255, avg * 1.4 + 40);
    } else if (type === 'blacklodge') {
      let avg = (r * 0.3 + g * 0.59 + b * 0.11);
      let contrast = (avg - 128) * 1.5 + 128;
      data[i]     = Math.min(255, Math.max(0, contrast));
      data[i + 1] = Math.min(255, Math.max(0, contrast));
      data[i + 2] = Math.min(255, Math.max(0, contrast));
    }
  }

  ctx.putImageData(imgData, 0, 0);
}
</script>

</body>
</html>
