<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FilterApp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100dvh; overflow: hidden; background-color: #000; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; color: #fff; }
    
    .app-container {
      width: 100%;
      height: 100dvh;
      max-width: 430px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 12px) 16px env(safe-area-inset-bottom, 12px) 16px;
      position: relative;
    }

    .header {
      height: 40px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.5px; }
    .upload-btn {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
    }

    .preview-area {
      flex: 1;
      min-height: 0;
      margin: 8px 0;
      background: #121212;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    canvas { width: 100%; height: 100%; object-fit: contain; }
    .placeholder { color: #666; font-size: 14px; }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }

    .filter-bar {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 4px 0;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-card {
      flex: 0 0 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .filter-thumb {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: #222;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }
    .filter-card.active .filter-thumb { border-color: #007AFF; transform: scale(1.05); }
    .filter-card span { font-size: 11px; color: #aaa; font-weight: 400; white-space: nowrap; }
    .filter-card.active span { color: #fff; font-weight: 600; }

    .action-btn {
      width: 100%;
      height: 46px;
      border-radius: 23px;
      background: #007AFF;
      border: none;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(0,122,255,0.3);
    }
    .action-btn:active { transform: scale(0.98); opacity: 0.9; }
    
    input[type="file"] { display: none; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>FX Video</h1>
    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">Medya Seç</button>
    <input type="file" id="fileInput" accept="video/*">
  </div>

  <div class="preview-area">
    <span class="placeholder" id="placeholderText">Galeriden video yükleyin</span>
    <canvas id="canvas" style="display:none;"></canvas>
    <video id="video" autoplay loop playsinline muted hidden></video>
  </div>

  <div class="controls">
    <div class="filter-bar">
      <div class="filter-card active" onclick="applyFilter('none', this)">
        <div class="filter-thumb"></div>
        <span>Normal</span>
      </div>
      <div class="filter-card" onclick="applyFilter('bw', this)">
        <div class="filter-thumb" style="filter: grayscale(100%); background:#888;"></div>
        <span>S&B</span>
      </div>
      <div class="filter-card" onclick="applyFilter('sepia', this)">
        <div class="filter-thumb" style="filter: sepia(100%); background:#a88;"></div>
        <span>Sepya</span>
      </div>
      <div class="filter-card" onclick="applyFilter('vivid', this)">
        <div class="filter-thumb" style="filter: contrast(150%); background:#e66;"></div>
        <span>Canlı</span>
      </div>
      <div class="filter-card" onclick="applyFilter('cyber', this)">
        <div class="filter-thumb" style="filter: hue-rotate(180deg); background:#48e;"></div>
        <span>Cyber</span>
      </div>
      <div class="filter-card" onclick="applyFilter('vintage', this)">
        <div class="filter-thumb" style="filter: sepia(50%); background:#c96;"></div>
        <span>Vintage</span>
      </div>
      <div class="filter-card" onclick="applyFilter('neon', this)">
        <div class="filter-thumb" style="filter: invert(100%); background:#0ff;"></div>
        <span>Neon</span>
      </div>
      <div class="filter-card" onclick="applyFilter('dramatic', this)">
        <div class="filter-thumb" style="filter: contrast(200%); background:#444;"></div>
        <span>Dramatik</span>
      </div>
      <div class="filter-card" onclick="applyFilter('warm', this)">
        <div class="filter-thumb" style="filter: sepia(30%); background:#f93;"></div>
        <span>Sıcak</span>
      </div>
    </div>

    <button class="action-btn" id="shareBtn" onclick="exportVideo()">Paylaş</button>
  </div>
</div>

<script>
  const fileInput = document.getElementById('fileInput');
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const placeholder = document.getElementById('placeholderText');
  let currentFilter = 'none';

  fileInput.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    video.src = URL.createObjectURL(file);
    placeholder.style.display = 'none';
    canvas.style.display = 'block';
  };

  video.onloadedmetadata = () => {
    canvas.width = video.videoWidth || 375;
    canvas.height = video.videoHeight || 500;
    video.play();
  };

  function applyFilter(filterType, el) {
    currentFilter = filterType;
    document.querySelectorAll('.filter-card').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
  }

  function processPixels() {
    if (currentFilter === 'none') return;
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
      let r = d[i], g = d[i+1], b = d[i+2];
      if (currentFilter === 'bw') {
        let v = 0.299 * r + 0.587 * g + 0.114 * b;
        d[i] = d[i+1] = d[i+2] = v;
      } else if (currentFilter === 'sepia') {
        d[i] = Math.min(255, (r * 0.393) + (g * 0.769) + (b * 0.189));
        d[i+1] = Math.min(255, (r * 0.349) + (g * 0.686) + (b * 0.168));
        d[i+2] = Math.min(255, (r * 0.272) + (g * 0.534) + (b * 0.131));
      } else if (currentFilter === 'vivid') {
        d[i] = Math.min(255, r * 1.3);
        d[i+1] = Math.min(255, g * 1.2);
        d[i+2] = Math.min(255, b * 0.9);
      } else if (currentFilter === 'cyber') {
        d[i] = 255 - r;
        d[i+1] = g;
        d[i+2] = 255 - b;
      } else if (currentFilter === 'vintage') {
        d[i] = Math.min(255, r * 1.1 + 30);
        d[i+1] = Math.min(255, g * 0.9 + 10);
        d[i+2] = Math.min(255, b * 0.7);
      } else if (currentFilter === 'neon') {
        d[i] = 255 - r;
        d[i+1] = 255 - g;
        d[i+2] = 255 - b;
      } else if (currentFilter === 'dramatic') {
        let v = (r + g + b) / 3;
        d[i] = v > 128 ? Math.min(255, v * 1.3) : v * 0.7;
        d[i+1] = d[i];
        d[i+2] = d[i];
      } else if (currentFilter === 'warm') {
        d[i] = Math.min(255, r * 1.2);
        d[i+1] = Math.min(255, g * 1.05);
        d[i+2] = Math.max(0, b * 0.85);
      }
    }
    ctx.putImageData(imgData, 0, 0);
  }

  function render() {
    if (!video.paused && !video.ended) {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      processPixels();
    }
    requestAnimationFrame(render);
  }
  video.onplay = render;

  function exportVideo() {
    if (!video.src) return;
    const stream = canvas.captureStream(30);
    
    let options = {};
    if (MediaRecorder.isTypeSupported('video/mp4')) {
      options = { mimeType: 'video/mp4' };
    } else if (MediaRecorder.isTypeSupported('video/webm')) {
      options = { mimeType: 'video/webm' };
    }

    const recorder = new MediaRecorder(stream, options);
    const chunks = [];

    video.currentTime = 0;
    video.play();
    recorder.start();

    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = async () => {
      const type = options.mimeType || 'video/mp4';
      const ext = type.includes('webm') ? 'webm' : 'mp4';
      const blob = new Blob(chunks, { type: type });
      const file = new File([blob], `video-fx.${ext}`, { type: type });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: 'FX Video',
            text: 'Filtrelenmiş video'
          });
        } catch (err) {}
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `video-fx.${ext}`;
        a.click();
      }
    };

    setTimeout(() => recorder.stop(), video.duration * 1000);
  }
</script>
</body>
</html>
