<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FilterApp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; color: #fff; }
    
    .app-container {
      width: 100vw;
      height: 100vh;
      max-width: 375px;
      max-height: 812px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px) 16px;
      position: relative;
    }

    .header {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.5px; }
    .upload-btn {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
    }

    .preview-area {
      flex: 1;
      margin: 12px 0;
      background: #121212;
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    canvas { width: 100%; height: 100%; object-fit: cover; }
    .placeholder { color: #666; font-size: 14px; }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .filter-bar {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 4px 0;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-card {
      flex: 0 0 68px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .filter-thumb {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #222;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }
    .filter-card.active .filter-thumb { border-color: #007AFF; transform: scale(1.05); }
    .filter-card span { font-size: 11px; color: #aaa; font-weight: 400; }
    .filter-card.active span { color: #fff; font-weight: 600; }

    .action-btn {
      width: 100%;
      height: 50px;
      border-radius: 25px;
      background: #007AFF;
      border: none;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(0,122,255,0.3);
    }
    .action-btn:active { transform: scale(0.98); opacity: 0.9; }
    
    input[type="file"] { display: none; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>FX Video</h1>
    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">Medyo Seç</button>
    <input type="file" id="fileInput" accept="video/*">
  </div>

  <div class="preview-area">
    <span class="placeholder" id="placeholderText">Galeriden video yükleyin</span>
    <canvas id="canvas" style="display:none;"></canvas>
    <video id="video" autoplay loop playsinline muted hidden></video>
  </div>

  <div class="controls">
    <div class="filter-bar">
      <div class="filter-card active" onclick="applyFilter('none', this)">
        <div class="filter-thumb"></div>
        <span>Normal</span>
      </div>
      <div class="filter-card" onclick="applyFilter('grayscale(100%)', this)">
        <div class="filter-thumb" style="filter: grayscale(100%); background:#888;"></div>
        <span>S&B</span>
      </div>
      <div class="filter-card" onclick="applyFilter('sepia(100%) contrast(120%)', this)">
        <div class="filter-thumb" style="filter: sepia(100%); background:#a88;"></div>
        <span>Sepya</span>
      </div>
      <div class="filter-card" onclick="applyFilter('contrast(160%) brightness(110%) saturate(140%)', this)">
        <div class="filter-thumb" style="filter: contrast(150%); background:#e66;"></div>
        <span>Vivid</span>
      </div>
      <div class="filter-card" onclick="applyFilter('hue-rotate(180deg) invert(10%)', this)">
        <div class="filter-thumb" style="filter: hue-rotate(180deg); background:#48e;"></div>
        <span>Cyber</span>
      </div>
    </div>

    <button class="action-btn" id="saveBtn" onclick="exportVideo()">Kaydet</button>
  </div>
</div>

<script>
  const fileInput = document.getElementById('fileInput');
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const placeholder = document.getElementById('placeholderText');
  let currentFilter = 'none';

  fileInput.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    video.src = URL.createObjectURL(file);
    placeholder.style.display = 'none';
    canvas.style.display = 'block';
    video.play();
  };

  function applyFilter(filterStr, el) {
    currentFilter = filterStr;
    document.querySelectorAll('.filter-card').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
  }

  function render() {
    if (!video.paused && !video.ended) {
      canvas.width = video.videoWidth || 375;
      canvas.height = video.videoHeight || 500;
      ctx.filter = currentFilter;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    }
    requestAnimationFrame(render);
  }
  video.onplay = render;

  function exportVideo() {
    if (!video.src) return;
    const stream = canvas.captureStream(30);
    const recorder = new MediaRecorder(stream, { mimeType: 'video/mp4' });
    const chunks = [];

    video.currentTime = 0;
    video.play();
    recorder.start();

    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/mp4' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'video-fx.mp4';
      a.click();
    };

    setTimeout(() => recorder.stop(), video.duration * 1000);
  }
</script>
</body>
</html>
