<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Noir FX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100dvh; overflow: hidden; background-color: #000; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; color: #fff; }
    
    .app-container {
      width: 100%;
      height: 100dvh;
      max-width: 430px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 12px) 16px env(safe-area-inset-bottom, 12px) 16px;
      position: relative;
    }

    .header {
      height: 40px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.5px; }
    .upload-btn {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
    }

    .preview-area {
      flex: 1;
      min-height: 0;
      margin: 8px 0;
      background: #121212;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    canvas { width: 100%; height: 100%; object-fit: contain; }
    .placeholder { color: #666; font-size: 14px; }

    .loading-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      padding: 20px;
      text-align: center;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #007AFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 15px; font-weight: 500; color: #fff; }

    .overlay-share-btn {
      background: #007AFF;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 22px;
      font-size: 15px;
      font-weight: 600;
      display: none;
      box-shadow: 0 4px 12px rgba(0,122,255,0.4);
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }

    .filter-bar {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 8px 4px;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-card {
      flex: 0 0 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .filter-thumb {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: #222;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }
    .filter-card.active .filter-thumb { 
      border: 3px solid #007AFF; 
      box-shadow: 0 0 12px rgba(0,122,255,0.9);
      transform: scale(1.1); 
    }
    .filter-card span { font-size: 11px; color: #aaa; font-weight: 400; white-space: nowrap; }
    .filter-card.active span { color: #007AFF; font-weight: 700; }

    .action-btn {
      width: 100%;
      height: 46px;
      border-radius: 23px;
      background: #007AFF;
      border: none;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(0,122,255,0.3);
    }
    .action-btn:active { transform: scale(0.98); opacity: 0.9; }
    
    input[type="file"] { display: none; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>Noir FX</h1>
    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">Select Media</button>
    <input type="file" id="fileInput" accept="video/*">
  </div>

  <div class="preview-area">
    <span class="placeholder" id="placeholderText">Upload video (Max 20s)</span>
    <canvas id="canvas" style="display:none;"></canvas>
    <video id="video" autoplay loop playsinline muted hidden></video>
    
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner" id="loadingSpinner"></div>
      <span class="loading-text" id="loadingText">Processing... 0%</span>
      <button class="overlay-share-btn" id="overlayShareBtn" onclick="triggerNativeShare()">Share / Save Video</button>
    </div>
  </div>

  <div class="controls">
    <div class="filter-bar">
      <div class="filter-card active" onclick="applyFilter('classic', this)">
        <div class="filter-thumb" style="background:#666;"></div>
        <span>Classic</span>
      </div>
      <div class="filter-card" onclick="applyFilter('noir', this)">
        <div class="filter-thumb" style="background:#222; border:1px solid #555;"></div>
        <span>Deep Noir</span>
      </div>
      <div class="filter-card" onclick="applyFilter('vhs', this)">
        <div class="filter-thumb" style="background:#333; border: 1px dashed #777;"></div>
        <span>VHS Tape</span>
      </div>
      <div class="filter-card" onclick="applyFilter('glitch', this)">
        <div class="filter-thumb" style="background:#1a1a1a;"></div>
        <span>80s Glitch</span>
      </div>
      <div class="filter-card" onclick="applyFilter('grain', this)">
        <div class="filter-thumb" style="background:#888;"></div>
        <span>Grain</span>
      </div>
      <div class="filter-card" onclick="applyFilter('scratch', this)">
        <div class="filter-thumb" style="background:#444;"></div>
        <span>Scratch</span>
      </div>
      <div class="filter-card" onclick="applyFilter('soft', this)">
        <div class="filter-thumb" style="background:#aaa;"></div>
        <span>Soft</span>
      </div>
      <div class="filter-card" onclick="applyFilter('charcoal', this)">
        <div class="filter-thumb" style="background:#111;"></div>
        <span>Charcoal</span>
      </div>
    </div>

    <button class="action-btn" id="shareBtn" onclick="exportVideo()">Process Video</button>
  </div>
</div>

<script>
  const fileInput = document.getElementById('fileInput');
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const placeholder = document.getElementById('placeholderText');
  const overlay = document.getElementById('loadingOverlay');
  const loadingSpinner = document.getElementById('loadingSpinner');
  const loadingText = document.getElementById('loadingText');
  const overlayShareBtn = document.getElementById('overlayShareBtn');
  const shareBtn = document.getElementById('shareBtn');
  
  let currentFilter = 'classic';
  let isExporting = false;
  let processedFile = null;

  fileInput.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    video.src = URL.createObjectURL(file);
  };

  video.onloadedmetadata = () => {
    if (video.duration > 20) {
      alert("Video length cannot exceed 20 seconds!");
      video.removeAttribute('src');
      video.load();
      fileInput.value = '';
      placeholder.style.display = 'block';
      canvas.style.display = 'none';
      return;
    }

    placeholder.style.display = 'none';
    canvas.style.display = 'block';
    canvas.width = video.videoWidth || 375;
    canvas.height = video.videoHeight || 500;
    video.play();
  };

  function applyFilter(filterType, el) {
    currentFilter = filterType;
    document.querySelectorAll('.filter-card').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
  }

  function processPixels() {
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = imgData.data;
    const w = canvas.width;
    const h = canvas.height;
    
    for (let i = 0; i < d.length; i += 4) {
      let r = d[i], g = d[i+1], b = d[i+2];
      let v = 0.299 * r + 0.587 * g + 0.114 * b;

      if (currentFilter === 'noir') {
        v = (v - 128) * 1.6 + 128;
      } else if (currentFilter === 'vhs') {
        v += (Math.random() - 0.5) * 35;
      } else if (currentFilter === 'glitch') {
        v = (v - 128) * 1.8 + 128;
      } else if (currentFilter === 'grain') {
        v += (Math.random() - 0.5) * 45;
      } else if (currentFilter === 'scratch') {
        v += (Math.random() - 0.5) * 20;
      } else if (currentFilter === 'soft') {
        v = v * 0.75 + 35;
      } else if (currentFilter === 'charcoal') {
        v = v < 90 ? 0 : (v > 160 ? 255 : v);
      }

      v = Math.max(0, Math.min(255, v));
      d[i] = d[i+1] = d[i+2] = v;
    }
    
    ctx.putImageData(imgData, 0, 0);

    if (currentFilter === 'vhs') {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
      for (let y = 0; y < h; y += 4) {
        ctx.fillRect(0, y, w, 2);
      }
      if (Math.random() < 0.3) {
        const lineY = Math.random() * h;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.fillRect(0, lineY, w, Math.random() * 4 + 1);
      }
    }

    if (currentFilter === 'glitch' && Math.random() < 0.35) {
      const sliceY = Math.floor(Math.random() * (h - 20));
      const sliceH = Math.floor(Math.random() * 15) + 5;
      const offsetX = (Math.random() - 0.5) * 30;
      
      const sliceData = ctx.getImageData(0, sliceY, w, sliceH);
      ctx.putImageData(sliceData, offsetX, sliceY);
    }

    if (currentFilter === 'scratch' && Math.random() < 0.4) {
      ctx.strokeStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.4)' : 'rgba(0,0,0,0.4)';
      ctx.lineWidth = Math.random() * 2;
      ctx.beginPath();
      let x = Math.random() * w;
      ctx.moveTo(x, 0);
      ctx.lineTo(x + (Math.random() - 0.5) * 10, h);
      ctx.stroke();
    }
  }

  function render() {
    if (!video.paused && !video.ended) {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      processPixels();
    }
    requestAnimationFrame(render);
  }
  video.onplay = render;

  function exportVideo() {
    if (!video.src || isExporting) return;
    isExporting = true;
    
    overlay.style.display = 'flex';
    loadingSpinner.style.display = 'block';
    overlayShareBtn.style.display = 'none';
    loadingText.innerText = 'Processing... 0%';
    shareBtn.disabled = true;
    shareBtn.style.opacity = '0.5';

    const stream = canvas.captureStream(30);
    
    let options = {};
    if (MediaRecorder.isTypeSupported('video/mp4')) {
      options = { mimeType: 'video/mp4' };
    } else if (MediaRecorder.isTypeSupported('video/webm')) {
      options = { mimeType: 'video/webm' };
    }

    const recorder = new MediaRecorder(stream, options);
    const chunks = [];

    video.currentTime = 0;
    video.play();
    recorder.start();

    const progressInterval = setInterval(() => {
      if (video.duration) {
        const percent = Math.min(100, Math.round((video.currentTime / video.duration) * 100));
        loadingText.innerText = `Processing... ${percent}%`;
      }
    }, 100);

    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      clearInterval(progressInterval);
      
      const type = options.mimeType || 'video/mp4';
      const ext = type.includes('webm') ? 'webm' : 'mp4';
      const blob = new Blob(chunks, { type: type });
      processedFile = new File([blob], `noir-fx.${ext}`, { type: type });

      loadingSpinner.style.display = 'none';
      loadingText.innerText = 'Video Ready!';
      overlayShareBtn.style.display = 'inline-block';
    };

    setTimeout(() => recorder.stop(), video.duration * 1000);
  }

  async function triggerNativeShare() {
    if (!processedFile) return;

    if (navigator.canShare && navigator.canShare({ files: [processedFile] })) {
      try {
        await navigator.share({
          files: [processedFile],
          title: 'Noir FX Video'
        });
      } catch (err) {}
    } else {
      const url = URL.createObjectURL(processedFile);
      const a = document.createElement('a');
      a.href = url;
      a.download = processedFile.name;
      a.click();
    }

    overlay.style.display = 'none';
    shareBtn.disabled = false;
    shareBtn.style.opacity = '1';
    isExporting = false;
  }
</script>
</body>
</html>
