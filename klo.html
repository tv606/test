<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Kalori Takip</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 flex justify-center">

    <div class="max-w-md w-full space-y-6">
        <div class="bg-slate-800 rounded-3xl p-8 text-center border border-slate-700 shadow-2xl">
            <h2 class="text-slate-400 text-sm font-medium mb-2">KALAN KALORİ</h2>
            <div id="remaining" class="text-6xl font-black text-emerald-400">1350</div>
            <div class="mt-4 text-xs text-slate-500 tracking-widest">HEDEF: 1350 KCAL</div>
        </div>

        <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700">
            <textarea id="userInput" rows="2" 
                class="w-full bg-slate-900 border-none rounded-2xl p-4 text-white placeholder-slate-500 outline-none focus:ring-2 focus:ring-emerald-500"
                placeholder="Ne yedin?"></textarea>
            
            <button onclick="processAI()" id="btn"
                class="w-full mt-4 bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold py-4 rounded-2xl transition-all">
                Öğünü Ekle
            </button>
            <button onclick="resetKey()" class="w-full mt-2 text-xs text-slate-500 underline">API Anahtarını Değiştir</button>
        </div>
    </div>

    <script>
        const DAILY_GOAL = 1350;

        function getApiKey() {
            let key = localStorage.getItem('gemini_api_key');
            if (!key) {
                key = prompt("Lütfen API anahtarınızı girin:");
                if (key) localStorage.setItem('gemini_api_key', key);
            }
            return key;
        }

        function resetKey() {
            localStorage.removeItem('gemini_api_key');
            location.reload();
        }

        window.onload = () => {
            checkAndReset();
            updateUI();
        };

        function checkAndReset() {
            const today = new Date().toDateString();
            const lastDate = localStorage.getItem('lastDate');
            if (lastDate !== today) {
                localStorage.setItem('usedCalories', '0');
                localStorage.setItem('lastDate', today);
            }
        }

        async function processAI() {
            const API_KEY = getApiKey();
            if (!API_KEY) return;

            const input = document.getElementById('userInput').value;
            const btn = document.getElementById('btn');
            if (!input) return;

            btn.disabled = true;
            btn.innerText = "Hesaplanıyor...";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `"${input}" ifadesindeki toplam kaloriyi sadece sayı olarak yaz. Metin ekleme.` }] }]
                    })
                });

                const data = await response.json();
                const text = data.candidates[0].content.parts[0].text;
                const calorie = parseInt(text.replace(/\D/g, '')) || 0;
                
                let used = parseInt(localStorage.getItem('usedCalories') || '0');
                localStorage.setItem('usedCalories', used + calorie);
                
                document.getElementById('userInput').value = "";
                updateUI();
            } catch (e) {
                alert("Hata: API anahtarı yanlış veya bağlantı sorunu var.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Öğünü Ekle";
            }
        }

        function updateUI() {
            const used = parseInt(localStorage.getItem('usedCalories') || '0');
            const remaining = DAILY_GOAL - used;
            const display = document.getElementById('remaining');
            display.innerText = remaining;
            display.className = `text-6xl font-black transition-all ${remaining < 0 ? 'text-red-500' : 'text-emerald-400'}`;
        }
    </script>
</body>
</html>
