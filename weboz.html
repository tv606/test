<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, initial-scale=1.0, user-scalable=yes">
    <title>Mobil WebOS</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WebOS">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: url('https://picsum.photos/1920/1080') no-repeat center center/cover;
        }

        /* Masaüstü Alanı */
        #desktop {
            width: 100%;
            height: calc(100% - 50px);
            position: relative;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-content: flex-start;
            flex-wrap: wrap;
            gap: 25px;
        }

        /* Masaüstü Simgeleri */
        .icon {
            width: 90px;
            height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 10px;
            transition: background 0.2s;
        }
        .icon:active {
            background: rgba(255, 255, 255, 0.25);
        }
        .icon-img {
            font-size: 45px;
            margin-bottom: 5px;
        }
        .icon-txt {
            color: white;
            font-size: 13px;
            font-weight: 500;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
            text-align: center;
        }

        /* Görev Çubuğu */
        #taskbar {
            width: 100%;
            height: 50px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            position: absolute;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 9999;
            border-top: 1px solid rgba(255,255,255,0.15);
        }
        #start-btn {
            color: white;
            font-weight: bold;
            font-size: 16px;
            background: rgba(255,255,255,0.2);
            padding: 6px 18px;
            border-radius: 6px;
            cursor: pointer;
        }
        #clock {
            color: white;
            font-size: 15px;
            font-weight: 500;
        }

        /* İşletim Sistemi Penceresi (Not Defteri vb. için) */
        .window {
            position: absolute;
            width: 500px;
            height: 350px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.35);
            display: none;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.4);
            z-index: 10;
        }
        .window-header {
            background: rgba(0, 0, 0, 0.06);
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            border-bottom: 1px solid rgba(0,0,0,0.12);
            font-weight: bold;
        }
        .window-title {
            font-size: 14px;
            color: #222;
        }
        .close-btn {
            width: 16px;
            height: 16px;
            background: #ff5f56;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }
        .window-body {
            flex: 1;
            padding: 12px;
        }
        .window-body textarea {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            resize: none;
            font-size: 15px;
            outline: none;
            font-family: inherit;
        }
    </style>
</head>
<body>

    <div id="desktop">
        <div class="icon" onclick="openWindow('notepad')">
            <span class="icon-img">📝</span>
            <span class="icon-txt">Not Defteri</span>
        </div>

        <div class="icon" onclick="openSafariDesktop('https://www.google.com')">
            <span class="icon-img">🌐</span>
            <span class="icon-txt">İnternet</span>
        </div>
    </div>

    <div id="notepad" class="window" style="top: 150px; left: 200px;">
        <div class="window-header" onmousedown="dragStart(event)" ontouchstart="dragStart(event)">
            <span class="window-title">Not Defteri</span>
            <button class="close-btn" onclick="closeWindow('notepad')"></button>
        </div>
        <div class="window-body">
            <textarea placeholder="Buraya hızlıca notlar alabilirsin..."></textarea>
        </div>
    </div>

    <div id="taskbar">
        <div id="start-btn"> OS</div>
        <div id="clock">00:00</div>
    </div>

    <script>
        // Saat Güncelleme
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('clock').textContent = timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Yerel Pencere Açma/Kapama
        function openWindow(id) {
            const win = document.getElementById(id);
            win.style.display = 'flex';
            bringToFront(win);
        }
        function closeWindow(id) {
            document.getElementById(id).style.display = 'none';
        }

        // İnternet İkonuna Tıklayınca Gerçek Safari Sekmesi Açma
        function openSafariDesktop(url) {
            // Yeni sekmede hedef adresi açar
            const newWindow = window.open(url, '_blank');
            if (newWindow) {
                newWindow.focus();
            }
        }

        // Aktif pencereyi en öne getirme
        function bringToFront(win) {
            document.querySelectorAll('.window').forEach(w => w.style.zIndex = 10);
            win.style.zIndex = 100;
        }

        // Pencereleri Sürükleme Mekanizması (Fare ve Dokunmatik Ekranlar için)
        let activeWin = null;
        let currentX, currentY, initialX, initialY;

        function dragStart(e) {
            if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            activeWin = e.target.closest('.window');
            bringToFront(activeWin);

            const rect = activeWin.getBoundingClientRect();
            
            if (e.type === "touchstart") {
                initialX = e.touches[0].clientX - rect.left;
                initialY = e.touches[0].clientY - rect.top;
            } else {
                initialX = e.clientX - rect.left;
                initialY = e.clientY - rect.top;
            }

            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', dragEnd);
            document.addEventListener('touchmove', drag, { passive: false });
            document.addEventListener('touchend', dragEnd);
        }

        function drag(e) {
            if (activeWin) {
                e.preventDefault();
                
                if (e.type === "touchmove") {
                    currentX = e.touches[0].clientX - initialX;
                    currentY = e.touches[0].clientY - initialY;
                } else {
                    currentX = e.clientX - initialX;
                    currentY = e.clientY - initialY;
                }

                activeWin.style.left = currentX + "px";
                activeWin.style.top = currentY + "px";
            }
        }

        function dragEnd() {
            activeWin = null;
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('mouseup', dragEnd);
            document.removeEventListener('touchmove', drag);
            document.removeEventListener('touchend', dragEnd);
        }
    </script>
</body>
</html>
