<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Twin Peaks Analog Film Emulator</title>
<style>
  :root {
    --tp-red: #8b0000;
    --tp-gold: #d4af37;
    --tp-dark: #0a0a0a;
    --ui-bg: #141414;
    --ui-accent: #2a2a2a;
    --text: #e0e0e0;
    --header-h: 60px;
    --controls-h: 160px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; margin: 0; padding: 0; }

  body {
    background-color: var(--tp-dark);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* --- HEADER --- */
  header {
    height: var(--header-h);
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 2px solid var(--tp-red);
    background: linear-gradient(180deg, rgba(139,0,0,0.15) 0%, rgba(10,10,10,1) 100%);
    z-index: 10;
  }
  h1 {
    font-size: 1rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--tp-gold);
    text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
  }

  /* --- MAIN VIEWPORT (Responsive Canvas) --- */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    background: 
      repeating-linear-gradient(45deg, #0d0d0d, #0d0d0d 10px, #111 10px, #111 20px); /* Zigzag subconscious */
    overflow: hidden; /* Canvas'ın taşmasını önle */
  }

  .canvas-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas {
    /* Responsive Magic */
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    display: block;
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.9);
    border: 1px solid var(--ui-accent);
  }

  #placeholder {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #555;
    gap: 15px;
  }
  #placeholder svg { width: 50px; height: 50px; fill: var(--tp-red); opacity: 0.7; }

  /* --- CONTROLS --- */
  controls {
    height: var(--controls-h);
    background: var(--ui-bg);
    border-top: 1px solid var(--ui-accent);
    display: flex;
    flex-direction: column;
    padding: 15px;
    gap: 15px;
    z-index: 10;
  }

  .preset-scroll {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 5px;
    -webkit-overflow-scrolling: touch;
  }
  .preset-scroll::-webkit-scrollbar { display: none; }

  .btn-preset {
    flex: 0 0 auto;
    background: #202020;
    border: 1px solid #333;
    color: #aaa;
    padding: 12px 18px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-preset.active {
    background: var(--tp-red);
    color: white;
    border-color: #b00000;
    box-shadow: 0 0 15px rgba(139, 0, 0, 0.4);
  }

  .action-row {
    display: flex;
    gap: 10px;
  }
  .btn-action {
    flex: 1;
    padding: 15px;
    border-radius: 12px;
    border: none;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .btn-upload { background: #e0e0e0; color: #111; }
  .btn-download { background: var(--ui-accent); color: var(--tp-gold); border: 1px solid var(--tp-gold); }

  #file-input { display: none; }
</style>
</head>
<body>

<header>
  <h1>Twin Peaks Analog</h1>
</header>

<main>
  <div class="canvas-wrapper">
    <div id="placeholder">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-5-7l-3 3.72L9 13l-3 4h12l-4-5z"/></svg>
      <span>FOTOĞRAF YÜKLE</span>
    </div>
    <canvas id="canvas"></canvas>
  </div>
</main>

<controls>
  <div class="preset-scroll">
    <button class="btn-preset active" onclick="applyPreset('none', this)">Orijinal Log</button>
    <button class="btn-preset" onclick="applyPreset('35mm', this)">Glastonbury 35mm</button>
    <button class="btn-preset" onclick="applyPreset('redroom', this)">The Red Room</button>
    <button class="btn-preset" onclick="applyPreset('bw', this)">Black Lodge B&W</button>
  </div>

  <div class="action-row">
    <button class="btn-action btn-upload" onclick="triggerUpload()">Yükle</button>
    <button class="btn-action btn-download" onclick="downloadImage()">Kaydet</button>
  </div>
  
  <input type="file" id="file-input" accept="image/*">
</controls>

<script>
/**
 * ANALOG FILM EMÜLASYON MOTORU
 * Bu motor, basit renk manipülasyonu yerine pixel-shading benzeri matematiksel
 * emülasyon teknikleri kullanır.
 */

const fileInput = document.getElementById('file-input');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const placeholder = document.getElementById('placeholder');
let originalImageData = null;

// Fotoğraf Yükleme ve Responsive Tuval Hazırlama
function triggerUpload() { fileInput.click(); }

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => {
      // Ekrana sığacak maksimum tuval boyutunu hesapla
      const maxW = window.innerWidth * 2; // Retina destekli içsel boyut
      const maxH = window.innerHeight * 0.6 * 2;
      
      let finalW = img.width;
      let finalH = img.height;
      
      const ratio = img.width / img.height;
      
      if (finalW > maxW) { finalW = maxW; finalH = finalW / ratio; }
      if (finalH > maxH) { finalH = maxH; finalW = finalH * ratio; }

      canvas.width = finalW;
      canvas.height = finalH;
      
      ctx.drawImage(img, 0, 0, finalW, finalH);
      // Orijinal veriyi sakla
      originalImageData = ctx.getImageData(0, 0, finalW, finalH);
      
      placeholder.style.display = 'none';
      // Varsayılan filtreyi uygula
      applyPreset('35mm', document.querySelectorAll('.btn-preset')[1]);
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
});

// Kaydetme İşlemi
function downloadImage() {
  if (!originalImageData) return;
  const link = document.createElement('a');
  link.download = 'tp-analog-photo.jpg';
  link.href = canvas.toDataURL('image/jpeg', 0.9);
  link.click();
}

// UI Yönetimi
function setActivePreset(btn) {
  document.querySelectorAll('.btn-preset').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// --- FİLTRE MOTORU BAŞLANGIÇ ---

function applyPreset(type, btnElement) {
  if (!originalImageData) return;
  setActivePreset(btnElement);
  
  // Orijinal veriyi kopyala
  const workingData = new ImageData(
    new Uint8ClampedArray(originalImageData.data),
    originalImageData.width,
    originalImageData.height
  );
  const data = workingData.data;

  // Film Grain (Kumlanma) katmanını önceden hesapla (performans için)
  const grainAmount = getGrainAmountForPreset(type);
  const grainTable = grainAmount > 0 ? createGrainTable(grainAmount) : null;

  for (let i = 0; i < data.length; i += 4) {
    // Dijital Log formatına normalize et (0.0 - 1.0)
    let r = data[i] / 255;
    let g = data[i+1] / 255;
    let b = data[i+2] / 255;
    const avg = (r + g + b) / 3;

    // 1. Aşama: Emülasyon Matematiği
    if (type === '35mm') {
      // Twin Peaks 90'lar 35mm Stoğu: Sıcak gölgeler, soluk maviler, yumuşak tepe ışıkları
      // Renk Eğrileri (Non-linear curves)
      r = Math.pow(r, 0.85); // Kırmızıyı gölgelerde aç
      g = Math.pow(g, 1.0);  // Yeşili koru
      b = Math.pow(b, 1.1);  // Maviyi gölgelerde ez (sarart)
      
      // Renk Dengesi (Color Shift)
      r += 0.02;
      b -= 0.03;
      
      // Highlight Roll-off (Parlak alanların yumuşaması)
      if (r > 0.8) r = 0.8 + (r-0.8) * 0.5;
      if (g > 0.8) g = 0.8 + (g-0.8) * 0.5;
      if (b > 0.8) b = 0.8 + (b-0.8) * 0.5;

    } else if (type === 'redroom') {
      // The Red Room: Ezici kırmızı halüsinasyon dokusu
      r = Math.pow(r, 0.6); // Kırmızıyı aşırı parlat
      g = Math.pow(g, 1.5) * 0.4; // Yeşili ez
      b = Math.pow(b, 1.8) * 0.3; // Maviyi ez
      
      // Halation (Kırmızımsı sızıntı efekti - basitleştirilmiş)
      r = r + (avg * 0.1); 

    } else if (type === 'bw') {
      // Black Lodge Siyah Beyaz: Yüksek kontrastlı, grenli gümüş nitrat film
      let bwContrast = (avg - 0.5) * 1.5 + 0.5; // Güçlü kontrast
      
      // Soluk siyahlar (Faded blacks)
      if (bwContrast < 0.1) bwContrast = 0.1 + (bwContrast * 0.2);

      r = g = b = bwContrast;
    }

    // 2. Aşama: Film Grain Uygulaması (Ortalama değere göre gürültü ekle)
    if (grainTable) {
      const noise = grainTable[i % grainTable.length];
      // Gren, parlaklığa göre değişir (analogda gölgelerde gren daha görünürdür)
      const grainFactor = (1.0 - avg * 0.5); 
      const finalNoise = noise * grainFactor;
      
      r += finalNoise;
      g += finalNoise;
      b += finalNoise;
    }

    // 3. Aşama: Geri Dönüştür ve Sınırla (Clip)
    data[i]   = Math.min(255, Math.max(0, r * 255));
    data[i+1] = Math.min(255, Math.max(0, g * 255));
    data[i+2] = Math.min(255, Math.max(0, b * 255));
  }

  // İşlenmiş veriyi tuvale yaz
  ctx.putImageData(workingData, 0, 0);
}

// Yardımcı Fonksiyonlar

function getGrainAmountForPreset(type) {
  if (type === '35mm') return 0.04;
  if (type === 'redroom') return 0.03;
  if (type === 'bw') return 0.12; // Siyah beyazda yoğun gren
  return 0;
}

// Rastgele gren tablosu oluştur (Performans için döngü dışında)
function createGrainTable(amount) {
  const size = 10000;
  const table = new Float32Array(size);
  for(let i=0; i<size; i++) {
    table[i] = (Math.random() - 0.5) * amount;
  }
  return table;
}

</script>

</body>
</html>
