<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastLapse</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 24px;
        }

        video, canvas { display: none; }

        .file-upload {
            position: relative;
            display: inline-block;
            width: 100%;
            margin-bottom: 20px;
        }

        .file-upload input[type="file"] {
            display: none;
        }

        .file-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px dashed var(--border);
            border-radius: 12px;
            color: var(--text-muted);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .file-label:hover {
            border-color: var(--accent);
            color: var(--text-main);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            display: none;
        }

        .btn:hover { background-color: var(--accent-hover); }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-download {
            background-color: #10b981;
            margin-top: 15px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-download:hover { background-color: #059669; }

        #status {
            margin-top: 15px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FastLapse</h1>
        <p class="subtitle">Maksimum 1 dakikalık videoyu 4x hızlandırın</p>

        <div class="file-upload">
            <label for="videoInput" class="file-label" id="fileLabel">
                <span>📁 Video Seç</span>
            </label>
            <input type="file" id="videoInput" accept="video/*">
        </div>

        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>

        <button id="processBtn" class="btn">4x Hızlandır ve Oluştur</button>

        <div id="status"></div>
        <div id="downloadArea"></div>
    </div>

    <script>
        const videoInput = document.getElementById('videoInput');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const processBtn = document.getElementById('processBtn');
        const status = document.getElementById('status');
        const downloadArea = document.getElementById('downloadArea');
        const fileLabel = document.getElementById('fileLabel');

        let stream, mediaRecorder, recordedChunks = [];

        videoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            fileLabel.querySelector('span').innerText = file.name;
            const url = URL.createObjectURL(file);
            video.src = url;

            video.onloadedmetadata = () => {
                if (video.duration > 60) {
                    status.innerText = "Hata: Video 1 dakikadan uzun olamaz.";
                    status.style.color = "#ef4444";
                    videoInput.value = "";
                    processBtn.style.display = "none";
                    return;
                }
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                processBtn.style.display = "block";
                status.innerText = "Video hazır.";
                status.style.color = "#94a3b8";
                downloadArea.innerHTML = "";
            };
        });

        processBtn.addEventListener('click', () => {
            recordedChunks = [];
            processBtn.disabled = true;
            status.innerText = "İşleniyor...";

            video.playbackRate = 4.0;
            stream = canvas.captureStream(30);

            const mimeType = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
            mediaRecorder = new MediaRecorder(stream, { mimeType });

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: mimeType });
                const videoUrl = URL.createObjectURL(blob);
                const ext = mimeType.split('/')[1];

                downloadArea.innerHTML = `<a href="${videoUrl}" download="hizli_cekim.${ext}" class="btn btn-download">Videoyu İndir</a>`;
                status.innerText = "İşlem tamamlandı!";
                processBtn.disabled = false;
            };

            mediaRecorder.start();
            video.play();

            function drawFrame() {
                if (!video.paused && !video.ended) {
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    requestAnimationFrame(drawFrame);
                }
            }
            drawFrame();

            video.onended = () => {
                mediaRecorder.stop();
            };
        });
    </script>
</body>
</html>
