<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rabbit v1</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        video, canvas { display: none; }

        .file-upload {
            position: relative;
            display: inline-block;
            width: 100%;
            margin-bottom: 15px;
        }

        .file-upload input[type="file"] { display: none; }

        .file-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px dashed var(--border);
            border-radius: 12px;
            color: var(--text-muted);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .file-label:hover {
            border-color: var(--accent);
            color: var(--text-main);
        }

        .controls {
            display: none;
            margin-bottom: 20px;
        }

        .speed-options {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
        }

        .speed-btn {
            flex: 1;
            padding: 8px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
        }

        .speed-btn.active {
            background-color: var(--accent);
            border-color: var(--accent);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .btn:hover { background-color: var(--accent-hover); }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .progress-box {
            display: none;
            margin-top: 20px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: var(--accent);
            transition: width 0.1s linear;
        }

        #status {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .warning {
            color: #f59e0b;
            font-size: 0.8rem;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Rabbit v1</h1>
        <p class="subtitle">Hızlı Çekim Video Dönüştürücü</p>

        <div class="file-upload">
            <label for="videoInput" class="file-label" id="fileLabel">
                <span>📁 Video Seç</span>
            </label>
            <input type="file" id="videoInput" accept="video/*">
        </div>

        <div id="warning" class="warning">⚠️ Video 3 dakikadan uzun, ilk 3 dakikası kırpılacak.</div>

        <div class="controls" id="controls">
            <p style="font-size: 0.85rem; color: var(--text-muted);">Hız Seçin:</p>
            <div class="speed-options">
                <button class="speed-btn" data-speed="2">2x</button>
                <button class="speed-btn active" data-speed="4">4x</button>
                <button class="speed-btn" data-speed="6">6x</button>
                <button class="speed-btn" data-speed="8">8x</button>
            </div>
            <br>
            <button id="processBtn" class="btn">İşlemi Başlat</button>
        </div>

        <div class="progress-box" id="progressBox">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div id="status">İşleniyor... %0</div>
        </div>

        <div id="shareArea" style="margin-top: 15px;"></div>

        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const videoInput = document.getElementById('videoInput');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const fileLabel = document.getElementById('fileLabel');
        const controls = document.getElementById('controls');
        const warning = document.getElementById('warning');
        const processBtn = document.getElementById('processBtn');
        const progressBox = document.getElementById('progressBox');
        const progressFill = document.getElementById('progressFill');
        const status = document.getElementById('status');
        const shareArea = document.getElementById('shareArea');
        const speedBtns = document.querySelectorAll('.speed-btn');

        let selectedSpeed = 4;
        let processDuration = 0;
        let generatedFile = null;

        speedBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                speedBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedSpeed = parseFloat(btn.dataset.speed);
            });
        });

        videoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            fileLabel.querySelector('span').innerText = file.name;
            const url = URL.createObjectURL(file);
            video.src = url;

            video.onloadedmetadata = () => {
                processDuration = Math.min(video.duration, 180);
                if (video.duration > 180) {
                    warning.style.display = "block";
                } else {
                    warning.style.display = "none";
                }

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                controls.style.display = "block";
                shareArea.innerHTML = "";
                progressBox.style.display = "none";
            };
        });

        processBtn.addEventListener('click', () => {
            processBtn.disabled = true;
            progressBox.style.display = "block";
            shareArea.innerHTML = "";
            progressFill.style.width = "0%";
            status.innerText = "İşleniyor... %0";

            video.currentTime = 0;
            video.playbackRate = selectedSpeed;
            
            const stream = canvas.captureStream(30);
            const mimeType = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
            const mediaRecorder = new MediaRecorder(stream, { mimeType });
            const recordedChunks = [];

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const ext = mimeType.split('/')[1];
                const blob = new Blob(recordedChunks, { type: mimeType });
                generatedFile = new File([blob], `rabbit_hizli_cekim.${ext}`, { type: mimeType });

                status.innerText = "İşlem tamamlandı!";
                progressFill.style.width = "100%";
                processBtn.disabled = false;

                const shareBtn = document.createElement('button');
                shareBtn.className = 'btn';
                shareBtn.innerText = '📤 Paylaş / Kaydet';
                shareBtn.onclick = () => {
                    if (navigator.share && navigator.canShare && navigator.canShare({ files: [generatedFile] })) {
                        navigator.share({
                            files: [generatedFile],
                            title: 'Rabbit v1 Video'
                        }).catch(console.error);
                    } else {
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = generatedFile.name;
                        a.click();
                    }
                };
                shareArea.appendChild(shareBtn);
            };

            mediaRecorder.start();
            video.play();

            function updateProgress() {
                if (!video.paused && !video.ended && video.currentTime < processDuration) {
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    const percent = Math.min(Math.round((video.currentTime / processDuration) * 100), 100);
                    progressFill.style.width = percent + "%";
                    status.innerText = `İşleniyor... %${percent}`;

                    requestAnimationFrame(updateProgress);
                } else if (video.currentTime >= processDuration || video.ended) {
                    video.pause();
                    mediaRecorder.stop();
                }
            }

            updateProgress();
        });
    </script>
</body>
</html>
