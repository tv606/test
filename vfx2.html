<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rabbit v1</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            padding-top: calc(16px + env(safe-area-inset-top));
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px 16px;
            width: 100%;
            max-width: 340px;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
            justify-content: space-between;
        }

        .header {
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-top: 2px;
        }

        .info-text {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 8px;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            line-height: 1.3;
        }

        video, canvas { display: none; }

        .file-upload {
            width: 100%;
            margin-bottom: 8px;
            position: relative;
        }

        .file-upload input[type="file"] { display: none; }

        @keyframes glowingBorder {
            0% { box-shadow: 0 0 5px rgba(255, 255, 255, 0.2), inset 0 0 5px rgba(255, 255, 255, 0.1); }
            50% { box-shadow: 0 0 15px rgba(255, 255, 255, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.3); border-color: rgba(255, 255, 255, 0.8); }
            100% { box-shadow: 0 0 5px rgba(255, 255, 255, 0.2), inset 0 0 5px rgba(255, 255, 255, 0.1); }
        }

        .file-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            animation: glowingBorder 2.5s infinite ease-in-out;
            transition: all 0.3s ease;
        }

        .file-label.has-file {
            animation: none;
            border-style: solid;
            border-color: var(--border);
            color: var(--text-muted);
        }

        .controls {
            display: none;
            margin-bottom: 8px;
        }

        .speed-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .speed-options {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-bottom: 12px;
        }

        .speed-btn {
            flex: 1;
            padding: 8px 0;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .speed-btn.active {
            background-color: var(--accent);
            border-color: var(--accent);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, opacity 0.2s ease;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-success {
            background-color: var(--success) !important;
        }

        .progress-box {
            display: none;
            margin-top: 6px;
            margin-bottom: 6px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background-color: var(--border);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: var(--accent);
            transition: width 0.1s linear;
        }

        #status {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .warning {
            color: #f59e0b;
            font-size: 0.7rem;
            margin-bottom: 8px;
            display: none;
        }

        #shareArea {
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Rabbit v1</h1>
            <p class="subtitle">Hızlı Çekim Video Dönüştürücü</p>
        </div>

        <div class="info-text">
            ℹ️ En iyi performans için maksimum 3 dakikalık videolar desteklenir.
        </div>

        <div class="file-upload">
            <label for="videoInput" class="file-label" id="fileLabel">
                <span>📁 Video Seç</span>
            </label>
            <input type="file" id="videoInput" accept="video/*">
        </div>

        <div id="warning" class="warning">⚠️ Video 3 dakikadan uzun, ilk 3 dakikası işlenecek.</div>

        <div class="controls" id="controls">
            <p class="speed-title">Hız Seçin:</p>
            <div class="speed-options">
                <button class="speed-btn" data-speed="2">2x</button>
                <button class="speed-btn active" data-speed="4">4x</button>
                <button class="speed-btn" data-speed="6">6x</button>
                <button class="speed-btn" data-speed="8">8x</button>
            </div>
            <button id="processBtn" class="btn">İşlemi Başlat</button>
        </div>

        <div class="progress-box" id="progressBox">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div id="status">İşleniyor... %0</div>
        </div>

        <div id="shareArea"></div>

        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const videoInput = document.getElementById('videoInput');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const fileLabel = document.getElementById('fileLabel');
        const controls = document.getElementById('controls');
        const warning = document.getElementById('warning');
        const processBtn = document.getElementById('processBtn');
        const progressBox = document.getElementById('progressBox');
        const progressFill = document.getElementById('progressFill');
        const status = document.getElementById('status');
        const shareArea = document.getElementById('shareArea');
        const speedBtns = document.querySelectorAll('.speed-btn');

        let selectedSpeed = 4;
        let processDuration = 0;
        let generatedFile = null;

        speedBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                speedBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedSpeed = parseFloat(btn.dataset.speed);
                processBtn.disabled = false;
            });
        });

        videoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            fileLabel.querySelector('span').innerText = file.name;
            fileLabel.classList.add('has-file');
            const url = URL.createObjectURL(file);
            video.src = url;

            video.onloadedmetadata = () => {
                processDuration = Math.min(video.duration, 180);
                warning.style.display = video.duration > 180 ? "block" : "none";

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                controls.style.display = "block";
                processBtn.disabled = false;
                shareArea.innerHTML = "";
                progressBox.style.display = "none";
            };
        });

        processBtn.addEventListener('click', () => {
            processBtn.disabled = true;
            progressBox.style.display = "block";
            shareArea.innerHTML = "";
            progressFill.style.width = "0%";
            status.innerText = "Kareler hazırlanıyor...";

            video.currentTime = 0.1;
            video.playbackRate = selectedSpeed;

            video.onseeked = function startRecording() {
                video.onseeked = null;

                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const stream = canvas.captureStream(30);
                const mimeType = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
                const mediaRecorder = new MediaRecorder(stream, { mimeType });
                const recordedChunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const ext = mimeType.split('/')[1];
                    const blob = new Blob(recordedChunks, { type: mimeType });
                    generatedFile = new File([blob], `rabbit_hizli_cekim.${ext}`, { type: mimeType });

                    status.innerText = "İşlem tamamlandı!";
                    progressFill.style.width = "100%";
                    processBtn.disabled = true;

                    const shareBtn = document.createElement('button');
                    shareBtn.className = 'btn';
                    shareBtn.innerText = '📤 Kaydet / Paylaş';
                    shareBtn.onclick = async () => {
                        if (navigator.share && navigator.canShare && navigator.canShare({ files: [generatedFile] })) {
                            try {
                                await navigator.share({
                                    files: [generatedFile],
                                    title: 'Rabbit v1 Video'
                                });
                                shareBtn.innerText = '✅ Kaydedildi / Paylaşıldı';
                                shareBtn.classList.add('btn-success');
                                shareBtn.disabled = true;
                            } catch (err) {
                                console.log(err);
                            }
                        } else {
                            const a = document.createElement('a');
                            a.href = URL.createObjectURL(blob);
                            a.download = generatedFile.name;
                            a.click();
                            shareBtn.innerText = '✅ Kaydedildi / İndirildi';
                            shareBtn.classList.add('btn-success');
                            shareBtn.disabled = true;
                        }
                    };
                    shareArea.appendChild(shareBtn);
                };

                mediaRecorder.start();
                video.play();

                function updateProgress() {
                    if (!video.paused && !video.ended && video.currentTime < processDuration) {
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        
                        const percent = Math.min(Math.round((video.currentTime / processDuration) * 100), 100);
                        progressFill.style.width = percent + "%";
                        status.innerText = `İşleniyor... %${percent}`;

                        requestAnimationFrame(updateProgress);
                    } else if (video.currentTime >= processDuration || video.ended) {
                        video.pause();
                        mediaRecorder.stop();
                    }
                }

                updateProgress();
            };
        });
    </script>
</body>
</html>
