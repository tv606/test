<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: sans-serif;
        }
        #player {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #title-bar {
            position: absolute;
            bottom: 10%;
            left: 5%;
            width: 90%;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 24px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            z-index: 10;
        }
        #title-bar.show {
            opacity: 1;
        }
        #random-btn {
            position: absolute;
            bottom: 5%;
            right: 5%;
            padding: 15px 30px;
            background-color: rgba(255, 255, 255, 0.8);
            color: #000;
            border: none;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            z-index: 10;
            outline: none;
        }
        #random-btn:focus {
            background-color: #ff0000;
            color: #fff;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <video id="player" autoplay controlslist="nodownload"></video>
    <div id="title-bar">Film Yükleniyor...</div>
    <button id="random-btn">Rastgele Film</button>

    <script>
        const video = document.getElementById('player');
        const titleBar = document.getElementById('title-bar');
        const randomBtn = document.getElementById('random-btn');
        
        let playlist = [];
        let titleTimeout;

        async function loadPlaylist() {
            try {
                const response = await fetch('list.m3u');
                const text = await response.text();
                parseM3U(text);
                if (playlist.length > 0) {
                    playRandom();
                } else {
                    showTitle("Liste boş veya hatalı.");
                }
            } catch (error) {
                showTitle("list.m3u yüklenemedi.");
            }
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            let currentTitle = "";
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    const infoParts = line.split(',');
                    currentTitle = infoParts[infoParts.length - 1] || "Bilinmeyen Film";
                } else if (line && !line.startsWith('#')) {
                    playlist.push({
                        title: currentTitle || "Bilinmeyen Film",
                        url: line
                    });
                    currentTitle = "";
                }
            }
        }

        function playRandom() {
            if (playlist.length === 0) return;
            
            const randomIndex = Math.floor(Math.random() * playlist.length);
            const selected = playlist[randomIndex];
            
            video.src = selected.url;
            video.play().catch(err => {
                showTitle("Oynatma başlatılamadı. Ekrana dokunun.");
            });
            
            showTitle(selected.title);
            randomBtn.style.display = 'none';
        }

        function showTitle(text) {
            clearTimeout(titleTimeout);
            titleBar.textContent = text;
            titleBar.classList.add('show');
            
            titleTimeout = setTimeout(() => {
                titleBar.classList.remove('show');
            }, 5000);
        }

        video.addEventListener('pause', () => {
            randomBtn.style.display = 'block';
            randomBtn.focus();
        });

        video.addEventListener('play', () => {
            randomBtn.style.display = 'none';
        });

        video.addEventListener('ended', () => {
            playRandom();
        });

        randomBtn.addEventListener('click', () => {
            playRandom();
        });

        // TV Kumandası Tuş Kontrolleri
        document.addEventListener('keydown', (e) => {
            switch(e.keyCode) {
                case 13: // Enter/OK
                    if (document.activeElement === randomBtn) {
                        playRandom();
                    } else {
                        if (video.paused) {
                            video.play();
                        } else {
                            video.pause();
                        }
                    }
                    break;
                case 32: // Boşluk Tuşu
                    if (video.paused) {
                        video.play();
                    } else {
                        video.pause();
                    }
                    break;
                case 415: // Play (Bazı TV kumandaları)
                    video.play();
                    break;
                case 19:  // Pause (Bazı TV kumandaları)
                    video.pause();
                    break;
                case 39: // Sağ Yön (Butona odaklanmak için alternatif)
                    if (randomBtn.style.display === 'block') {
                        randomBtn.focus();
                    }
                    break;
            }
        });

        // Başlangıç
        loadPlaylist();
    </script>
</body>
</html>
