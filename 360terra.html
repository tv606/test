<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>360 Terra</title>
<style>
:root{--bg:#f4f1ea;--fg:#23201a;--card:#fffdf8;--line:#d9d2c3;--ac:#2f7d4f;--acfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161b;--fg:#ece8df;--card:#1f2027;--line:#34363f;--ac:#6fc08a;--acfg:#10261a}}
:root[data-theme="dark"]{--bg:#15161b;--fg:#ece8df;--card:#1f2027;--line:#34363f;--ac:#6fc08a;--acfg:#10261a}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;background:#0d0e12}
canvas{width:100%;height:100%;object-fit:contain;display:block}
.panel{background:var(--card);border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;max-height:42vh;overflow:auto}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;min-width:120px}
input[type=range]{width:140px}
input[type=number],select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 6px;width:100%;box-sizing:border-box}
button,.btn{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
button.pri{background:var(--ac);color:var(--acfg);border-color:var(--ac);font-weight:600}
button:disabled{opacity:.5;cursor:default}
#st{font-size:12px;opacity:.85;flex-basis:100%}
</style>
</head>
<body>
<div class="stage"><canvas id="cv"></canvas></div>
<div class="panel">
  <label>Tohum<div style="display:flex;gap:4px"><input type="number" id="seed" value="7" min="0" max="9999"><button id="rnd" title="Rastgele">🎲</button></div></label>
  <label>Deniz seviyesi<input type="range" id="sea" min="0" max="0.45" step="0.01" value="0.2"></label>
  <label>Yükseklik çarpanı<input type="range" id="sc" min="0.3" max="2" step="0.05" value="1.1"></label>
  <label>Süre (sn)<input type="number" id="dur" value="12" min="4" max="90"></label>
  <label>Çözünürlük<select id="res"><option value="1280x720">1280×720</option><option value="1920x1080">1920×1080</option><option value="1080x1080">1080×1080</option><option value="1080x1920">1080×1920 (dikey)</option></select></label>
  <label class="btn" style="flex-direction:row;align-items:center;min-width:0">Yükseklik haritası yükle (PNG)<input type="file" id="hm" accept="image/*" hidden></label>
  <button class="pri" id="rec">● Videoyu kaydet</button>
  <button id="dl" disabled>İndir (.webm)</button>
  <div id="st">Hazır. Kayıt sırasında bu sekmeyi açık tutun.</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const N=257,W=4,BOT=-.3;
let H=new Float32Array(N*N),GX=new Float32Array(N*N),GY=new Float32Array(N*N),seed=7;
/* ---- noise ---- */
function hash(x,y,s){const n=Math.sin(x*127.1+y*311.7+s*74.7)*43758.5453;return n-Math.floor(n)}
function vn(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,s,o){let a=.5,f=1,r=0;for(let i=0;i<o;i++){r+=a*vn(x*f,y*f,s+i*13);f*=2.03;a*=.5}return r}
function ridge(x,y,s,o){let a=.5,f=1,r=0;for(let i=0;i<o;i++){const n=1-Math.abs(2*vn(x*f,y*f,s+i*7)-1);r+=a*n*n;f*=2.1;a*=.5}return r}
const sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
/* ---- height ---- */
function normalize(){let mn=1e9,mx=-1e9;for(const v of H){if(v<mn)mn=v;if(v>mx)mx=v}for(let i=0;i<H.length;i++)H[i]=(H[i]-mn)/(mx-mn||1);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x,xl=x?i-1:i,xr=x<N-1?i+1:i,yu=y?i-N:i,yd=y<N-1?i+N:i;GX[i]=H[xr]-H[xl];GY[i]=H[yd]-H[yu]}}
function genHeights(s){const px=.05+hash(s,1,3)*.25-.1,py=-.05+hash(s,2,5)*.2-.1;
 for(let gy=0;gy<N;gy++)for(let gx=0;gx<N;gx++){const x=gx/(N-1)*2-1,y=gy/(N-1)*2-1;
  const r=Math.hypot(x-px,y-py),cone=Math.pow(Math.max(0,1-r/.95),1.5);
  let h=.6*cone+.4*ridge(x*2.4+s,y*2.4,s,6)*(.25+cone*1.2)+.18*fbm(x*3+s,y*3,s+9,5);
  h-=.4*sm(.15,.95,-(x+y)/1.4+.5*fbm(x*2,y*2,s+4,4));
  H[gy*N+gx]=h}
 normalize();for(let i=0;i<H.length;i++){const h=H[i];H[i]=.6*h+.4*h*h*(3-2*h)}normalize()}
function sampleH(u,v){const x=u*(N-1),y=v*(N-1),xi=Math.min(N-2,x|0),yi=Math.min(N-2,y|0),fx=x-xi,fy=y-yi,i=yi*N+xi;
 return H[i]*(1-fx)*(1-fy)+H[i+1]*fx*(1-fy)+H[i+N]*(1-fx)*fy+H[i+N+1]*fx*fy}
/* ---- painterly colors ---- */
const SAND=[222,205,150],PL1=[150,204,98],PL2=[98,164,72],FO=[52,120,60],FO2=[80,106,58],ROCK=[142,126,98],ROCK2=[172,166,154],SNOW=[251,253,255],SH=[76,172,214],DP=[22,68,142];
const ST=[[0,SAND],[.03,SAND],[.07,PL1],[.27,PL2],[.44,FO],[.58,FO2],[.68,ROCK],[.78,ROCK2],[.85,SNOW],[1,SNOW]];
function colorAt(h,sl,nz,sp,o){
 if(h<sl){const d=Math.min(1,(sl-h)/Math.max(.02,sl)*1.5);for(let k=0;k<3;k++)o[k]=SH[k]+(DP[k]-SH[k])*d;return}
 let t=(h-sl)/(1-sl)+(nz-.5)*.1;t=t<0?0:t>1?1:t;let k=1;while(k<ST.length-1&&t>ST[k][0])k++;
 const a=ST[k-1],b=ST[k],f=(t-a[0])/(b[0]-a[0]||1);for(let c=0;c<3;c++)o[c]=a[1][c]+(b[1][c]-a[1][c])*f;
 if(t>.7){const m=Math.min(1,sp*sp*.9)*(t>.8?.55:.3);for(let c=0;c<3;c++)o[c]+=(ROCK2[c]-o[c])*m}}
const TS=1024,tc=document.createElement("canvas");tc.width=tc.height=TS;const tx=tc.getContext("2d");
function buildTexture(){const sl=+$("sea").value,img=tx.createImageData(TS,TS),d=img.data,o=[0,0,0];
 for(let y=0;y<TS;y++)for(let x=0;x<TS;x++){const u=x/(TS-1),v=y/(TS-1),i=((v*(N-1)+.5)|0)*N+((u*(N-1)+.5)|0),p=(y*TS+x)*4;
  colorAt(sampleH(u,v),sl,fbm(x*.02,y*.02,seed,3),Math.min(1,Math.hypot(GX[i],GY[i])*14),o);d[p]=o[0];d[p+1]=o[1];d[p+2]=o[2];d[p+3]=255}
 tx.putImageData(img,0,0);tx.lineCap="round";
 for(let k=0;k<48000;k++){const u=Math.random(),v=Math.random(),i=((v*(N-1)+.5)|0)*N+((u*(N-1)+.5)|0),h=sampleH(u,v);
  let a=Math.atan2(GY[i],GX[i])+Math.PI/2+(Math.random()-.5)*.9;if(h<sl)a=(Math.random()-.5)*.3;
  const L=8+Math.random()*18,Wd=3+Math.random()*6,px=u*TS,py=v*TS;
  colorAt(h,sl,fbm(px*.02,py*.02,seed,3),Math.min(1,Math.hypot(GX[i],GY[i])*14),o);const j=(Math.random()-.5)*36;
  tx.strokeStyle=`rgba(${o[0]+j|0},${o[1]+j|0},${o[2]+j*.6|0},.55)`;tx.lineWidth=Wd;tx.beginPath();
  tx.moveTo(px-Math.cos(a)*L/2,py-Math.sin(a)*L/2);tx.lineTo(px+Math.cos(a)*L/2,py+Math.sin(a)*L/2);tx.stroke()}
 tex.needsUpdate=true}
/* ---- three scene ---- */
const cv=$("cv"),renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,16/9,.1,100),group=new THREE.Group();scene.add(group);
const bg=document.createElement("canvas");bg.width=4;bg.height=512;const bx=bg.getContext("2d"),gr=bx.createLinearGradient(0,0,0,512);
[[0,"#1c1d26"],[.35,"#8f7d55"],[.5,"#c9915a"],[.62,"#3b4256"],[1,"#14151b"]].forEach(s=>gr.addColorStop(s[0],s[1]));bx.fillStyle=gr;bx.fillRect(0,0,4,512);
scene.background=new THREE.CanvasTexture(bg);
scene.add(new THREE.HemisphereLight(0xffe9d0,0x3a3a50,.75));const sun=new THREE.DirectionalLight(0xfff1dc,.95);sun.position.set(3,5,2.5);scene.add(sun);
const tex=new THREE.CanvasTexture(tc);tex.anisotropy=8;
const geo=new THREE.BufferGeometry(),pos=new Float32Array(N*N*3),uv=new Float32Array(N*N*2),idx=new Uint32Array((N-1)*(N-1)*6);
for(let gy=0;gy<N;gy++)for(let gx=0;gx<N;gx++){const i=gy*N+gx;pos[i*3]=(gx/(N-1)-.5)*W;pos[i*3+2]=(gy/(N-1)-.5)*W;uv[i*2]=gx/(N-1);uv[i*2+1]=1-gy/(N-1)}
let q=0;for(let y=0;y<N-1;y++)for(let x=0;x<N-1;x++){const a=y*N+x,b=a+1,c=a+N,d=c+1;idx.set([a,c,b,b,c,d],q);q+=6}
geo.setAttribute("position",new THREE.BufferAttribute(pos,3));geo.setAttribute("uv",new THREE.BufferAttribute(uv,2));geo.setIndex(new THREE.BufferAttribute(idx,1));
group.add(new THREE.Mesh(geo,new THREE.MeshLambertMaterial({map:tex})));
let sides=null;const sideMat=new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide});
const water=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshLambertMaterial({color:0x2f86c9,transparent:true,opacity:.5,depthWrite:false}));water.renderOrder=2;group.add(water);
const PAL=[[201,143,94],[168,109,70],[214,167,122],[141,90,59],[185,130,90],[120,80,60]].map(c=>c.map(v=>v/255));
function updGeo(){const hs=+$("sc").value;for(let i=0;i<N*N;i++)pos[i*3+1]=H[i]*hs;geo.attributes.position.needsUpdate=true;geo.computeVertexNormals()}
function updSides(){if(sides){group.remove(sides);sides.geometry.dispose()}const hs=+$("sc").value,S=26,P=[],C=[],I=[];let base=0;
 for(let e=0;e<4;e++){for(let i=0;i<N;i++){const gx=e==0?i:e==1?N-1:e==2?N-1-i:0,gy=e==0?0:e==1?i:e==2?N-1:N-1-i,top=H[gy*N+gx]*hs;
  for(let k=0;k<=S;k++){const y=top+(BOT-top)*k/S;P.push((gx/(N-1)-.5)*W,y,(gy/(N-1)-.5)*W);
   const b=Math.floor((y-BOT)/.065),c=PAL[(b*3+Math.floor(hash(b,e,seed)*3))%PAL.length],j=.92+hash(b,i>>3,e)*.12;C.push(c[0]*j,c[1]*j,c[2]*j)}}
  for(let i=0;i<N-1;i++)for(let k=0;k<S;k++){const a=base+i*(S+1)+k,b=a+1,c=a+S+1,d=c+1;I.push(a,b,c,b,d,c)}base+=N*(S+1)}
 const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(P,3));g.setAttribute("color",new THREE.Float32BufferAttribute(C,3));g.setIndex(I);g.computeVertexNormals();
 sides=new THREE.Mesh(g,sideMat);group.add(sides)}
function updWater(){const sy=+$("sea").value*+$("sc").value;water.geometry.dispose();water.geometry=new THREE.BoxGeometry(W*1.002,Math.max(.001,sy-BOT),W*1.002);water.position.y=(sy+BOT)/2}
let tm;const later=f=>{clearTimeout(tm);tm=setTimeout(f,160)};
function full(){updGeo();updSides();updWater();buildTexture()}
function setRes(){const [w,h]=$("res").value.split("x").map(Number);renderer.setSize(w,h,false);camera.aspect=w/h;
 const dist=7.4*Math.pow(Math.max(1,1.35/camera.aspect),.8);camera.position.set(0,dist*.42,dist);camera.lookAt(0,.25,0);camera.updateProjectionMatrix()}
/* ---- controls ---- */
$("seed").oninput=()=>later(()=>{seed=+$("seed").value||0;genHeights(seed);full()});
$("rnd").onclick=()=>{$("seed").value=Math.floor(Math.random()*9999);$("seed").oninput()};
$("sea").oninput=()=>later(()=>{updWater();buildTexture()});
$("sc").oninput=()=>later(()=>{updGeo();updSides();updWater()});
$("res").onchange=setRes;
$("hm").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const b=await createImageBitmap(f),c=document.createElement("canvas");c.width=c.height=N;const x=c.getContext("2d"),s=Math.min(b.width,b.height);
 x.drawImage(b,(b.width-s)/2,(b.height-s)/2,s,s,0,0,N,N);const d=x.getImageData(0,0,N,N).data;for(let i=0;i<N*N;i++)H[i]=(d[i*4]*.299+d[i*4+1]*.587+d[i*4+2]*.114)/255;normalize();full();$("st").textContent="Yükseklik haritası yüklendi."}
 catch(err){$("st").textContent="Görsel okunamadı."}};
/* ---- animate + record ---- */
let t0=performance.now(),recS=null,blob=null;
function loop(now){requestAnimationFrame(loop);const dur=Math.max(4,+$("dur").value||12);let a;
 if(recS){const el=(now-recS.t0)/1000;a=Math.min(1,el/recS.secs)*Math.PI*2;$("st").textContent=`Kayıt: ${Math.min(el,recS.secs).toFixed(1)} / ${recS.secs} sn`;
  if(el>=recS.secs){recS.r.stop();recS=null}}
 else a=((now-t0)/(dur*1000)%1)*Math.PI*2;
 group.rotation.y=-a;renderer.render(scene,camera)}
$("rec").onclick=()=>{if(!window.MediaRecorder){$("st").textContent="Bu tarayıcı video kaydını desteklemiyor.";return}
 const secs=Math.max(4,Math.min(90,+$("dur").value||12)),mime=["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"].find(m=>MediaRecorder.isTypeSupported(m));
 const r=new MediaRecorder(cv.captureStream(30),{mimeType:mime,videoBitsPerSecond:16e6}),ch=[];$("dl").disabled=true;$("rec").disabled=true;
 r.ondataavailable=e=>e.data.size&&ch.push(e.data);
 r.onstop=()=>{blob=new Blob(ch,{type:"video/webm"});$("rec").disabled=false;$("dl").disabled=false;$("st").textContent=`Kayıt bitti (${(blob.size/1048576).toFixed(1)} MB). “İndir” ile kaydedin.`};
 r.start();recS={t0:performance.now(),secs,r}};
$("dl").onclick=async()=>{if(!blob)return;let d=null;try{d=window.claude&&await claude.use("downloads")}catch(e){}
 try{if(d)await d.save({filename:"arazi-360.webm",data:blob});else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="arazi-360.webm";a.click()}}
 catch(e){if(!e||e.code!=="declined")$("st").textContent="İndirme başarısız oldu."}};
/* ---- init ---- */
setRes();genHeights(seed);full();requestAnimationFrame(loop);
</script>
</body>
</html>
