<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Twin Peaks Vibrant LUT Camera</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #050505;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    
    /* Viewport & Canvas Wrapper */
    .viewport {
      position: relative;
      width: 100%;
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: filter 0.1s ease;
    }

    /* SVG Grain Effect Overlay */
    .grain-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.35;
      mix-blend-mode: overlay;
    }

    /* Top Badges & Controls */
    .top-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .badge {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 700;
      color: #ffca28;
    }

    .btn-icon {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
    }

    /* REC Indicator */
    .rec-indicator {
      display: none;
      align-items: center;
      gap: 6px;
      background: rgba(220, 38, 38, 0.85);
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 1; }
      to { opacity: 0.4; }
    }

    /* Controls Panel */
    .controls {
      padding: 16px 20px 24px;
      background: #050505;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .filter-presets {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .filter-presets::-webkit-scrollbar { display: none; }

    .btn-preset {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #aaa;
      padding: 8px 16px;
      border-radius: 14px;
      font-size: 12px;
      white-space: nowrap;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-preset.active {
      background: #ffca28;
      color: #000;
      border-color: #ffca28;
      font-weight: 800;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 14px;
      border-radius: 12px;
    }
    .slider-group label {
      font-size: 10px;
      color: #888;
      width: 60px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .slider-group input {
      flex: 1;
      accent-color: #ffca28;
    }

    /* Bottom Record Action Bar */
    .action-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
    }

    .btn-record {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: transparent;
      border: 4px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
    }
    .btn-record-inner {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #dc2626;
      transition: all 0.2s ease;
    }
    .btn-record.recording .btn-record-inner {
      border-radius: 8px;
      width: 28px;
      height: 28px;
    }
  </style>
</head>
<body>

  <!-- SVG Noise Filter Definition -->
  <svg style="display:none;">
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </svg>

  <div class="viewport">
    <video id="webcam" autoplay playsinline muted></video>

    <!-- Dynamic Grain Layer -->
    <div class="grain-overlay" id="grainOverlay" style="filter: url(#grain);"></div>

    <!-- UI Overlay Top -->
    <div class="top-bar">
      <div class="badge" id="presetLabel">Preset: Fuji Vivid</div>
      <div class="rec-indicator" id="recIndicator">● REC</div>
      <button class="btn-icon" onclick="toggleCamera()" title="Kamerayı Değiştir">🔄</button>
    </div>
  </div>

  <div class="controls">
    <!-- Presets -->
    <div class="filter-presets">
      <button class="btn-preset active" onclick="setPreset('fuji_vivid', 'Fuji Vivid', this)">Fuji Vivid</button>
      <button class="btn-preset" onclick="setPreset('redroom_high', 'Red Room Vivid', this)">Red Room Vivid</button>
      <button class="btn-preset" onclick="setPreset('neon_woods', 'Snoqualmie Neon', this)">Neon Woods</button>
      <button class="btn-preset" onclick="setPreset('none', 'Normal', this)">Bypass</button>
    </div>

    <!-- Slider: Doygunluk / Yoğunluk -->
    <div class="slider-group">
      <label>Efekt</label>
      <input type="range" id="intensity" min="0" max="100" value="100" oninput="updateFilter()">
    </div>

    <!-- Slider: Grain (Kumlanma) -->
    <div class="slider-group">
      <label>Grain</label>
      <input type="range" id="grainSlider" min="0" max="100" value="40" oninput="updateGrain()">
    </div>

    <!-- Record Button -->
    <div class="action-bar">
      <button class="btn-record" id="recBtn" onclick="toggleRecord()">
        <div class="btn-record-inner"></div>
      </button>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const intensitySlider = document.getElementById('intensity');
    const grainSlider = document.getElementById('grainSlider');
    const grainOverlay = document.getElementById('grainOverlay');
    const presetLabel = document.getElementById('presetLabel');
    const recIndicator = document.getElementById('recIndicator');
    const recBtn = document.getElementById('recBtn');

    let currentPreset = 'fuji_vivid';
    let currentFacingMode = 'environment';
    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;

    async function initCamera() {
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true
        });
        video.srcObject = stream;
      } catch (err) {
        alert('Kamera veya Mikrofon erişimi sağlana ma dı: ' + err.message);
      }
    }

    function toggleCamera() {
      currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
      initCamera();
    }

    function updateGrain() {
      grainOverlay.style.opacity = grainSlider.value / 100;
    }

    function updateFilter() {
      const factor = intensitySlider.value / 100;
      let filterString = '';

      if (currentPreset === 'fuji_vivid') {
        const saturate = 100 + (120 * factor);
        const contrast = 100 + (35 * factor);
        const brightness = 100 + (10 * factor);
        filterString = `saturate(${saturate}%) contrast(${contrast}%) brightness(${brightness}%) sepia(${25 * factor}%) hue-rotate(-10deg)`;
      } else if (currentPreset === 'redroom_high') {
        const saturate = 100 + (350 * factor);
        const contrast = 100 + (50 * factor);
        filterString = `sepia(${85 * factor}%) hue-rotate(305deg) saturate(${saturate}%) contrast(${contrast}%)`;
      } else if (currentPreset === 'neon_woods') {
        const saturate = 100 + (150 * factor);
        const contrast = 100 + (40 * factor);
        filterString = `saturate(${saturate}%) contrast(${contrast}%) hue-rotate(25deg) brightness(95%)`;
      } else {
        filterString = 'none';
      }

      video.style.filter = filterString;
    }

    function setPreset(preset, name, btn) {
      currentPreset = preset;
      presetLabel.textContent = `Preset: ${name}`;
      document.querySelectorAll('.btn-preset').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateFilter();
    }

    function toggleRecord() {
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    }

    function startRecording() {
      recordedChunks = [];
      const stream = video.srcObject;
      mediaRecorder = new MediaRecorder(stream);

      mediaRecorder.ondataavailable = (event) => {
        if (event.data.size > 0) {
          recordedChunks.push(event.data);
        }
      };

      mediaRecorder.onstop = saveVideo;
      mediaRecorder.start();

      isRecording = true;
      recBtn.classList.add('recording');
      recIndicator.style.display = 'flex';
    }

    function stopRecording() {
      mediaRecorder.stop();
      isRecording = false;
      recBtn.classList.remove('recording');
      recIndicator.style.display = 'none';
    }

    function saveVideo() {
      const blob = new Blob(recordedChunks, { type: 'video/mp4' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `TwinPeaks_Video_${Date.now()}.mp4`;
      a.click();
      URL.revokeObjectURL(url);
    }

    initCamera();
    updateFilter();
    updateGrain();
  </script>
</body>
</html>
