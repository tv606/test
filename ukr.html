<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="apple-touch-icon" sizes="180x180" href="iconukr.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="UKR-TV">
    <title>UKR-TV</title>
    
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #080b11;
            color: #f3f4f6;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* 1. MÖBİL İÇİN VİDEO BÖLÜMÜ (Masaüstünde flex-direction değişecek) */
        .player-section {
            width: 100%;
            background-color: #000;
            position: relative;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
        }

        .player-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        .video-js {
            width: 100% !important;
            height: 100% !important;
        }

        .info-bar {
            background: #0d1321;
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .info-bar h1 {
            font-size: 1rem;
            font-weight: 700;
            background: linear-gradient(90deg, #3b82f6, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .current-badge {
            font-size: 0.8rem;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        /* 2. KANAL LİSTESİ BÖLÜMÜ */
        .content-section {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #4b5563;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .channel-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 40px;
        }

        .channel-card {
            display: flex;
            align-items: center;
            padding: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }

        .channel-card:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            transform: scale(1.02);
        }

        .channel-card.active {
            background: linear-gradient(90deg, rgba(30, 58, 138, 0.6) 0%, rgba(17, 24, 39, 0.8) 100%);
            border-color: #3b82f6;
        }

        .logo-container {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: #fff;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            flex-shrink: 0;
        }

        .channel-logo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .channel-name {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .channel-type {
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 2px;
        }

        /* ==========================================================================
           MASAÜSTÜ AYARLARI (Yenilenmiş Sinematik Tam Ekran Düzeni)
           ========================================================================== */
        @media (min-width: 992px) {
            body { 
                flex-direction: row-reverse; /* Listeyi sağa, videoyu sola dev ekran olarak yaslar */
            }

            /* Video Alanı: Artık ufacık değil, listenin dışındaki tüm dev alanı kaplar */
            .player-section { 
                flex: 1; 
                height: 100vh; 
                padding: 0; 
                background: #000;
                box-shadow: none;
            }

            /* Video kutusu tüm ekranı dolduracak şekilde esnetildi */
            .player-wrapper { 
                flex: 1;
                height: calc(100vh - 55px); /* Bilgi çubuğu yüksekliği düşüldü */
                aspect-ratio: auto; /* Sabit 16:9 oran zorlamasını kaldırıp tam ekran yaptık */
            }

            .info-bar { 
                height: 55px;
                background: #06080c; 
                border-top: 1px solid rgba(255, 255, 255, 0.05);
                border-bottom: none;
            }

            /* Kanal Listesi: Sol veya sağ tarafta sabit 380px sütun olarak kalır */
            .content-section { 
                width: 380px; 
                max-width: 380px; 
                height: 100vh;
                background: #0d1321; 
                border-right: 1px solid rgba(255, 255, 255, 0.05); 
                border-left: none;
            }

            .channel-card:hover {
                background: rgba(255, 255, 255, 0.05);
                border-color: rgba(255, 255, 255, 0.15);
            }
        }


           /* ==========================================================================
              VARSAYILAN VIDEO.JS LOADER RENKLERİNİ UKRAYNA TEMASINA ÇEVİRME
              ========================================================================== */

           /* Ana çemberin boyutunu ve genel dönme rengini ayarlayalım */
           .vjs-loading-spinner {
               border-radius: 50% !important;
               border-width: 6px !important;
               /* Çemberin genel/boşta kalan kısımları hafif şeffaf mavi olsun */
               border-color: rgba(0, 87, 183, 0.2) !important; 
               opacity: .8;
           }

           /* Orijinal loader'ın hareket eden/dönen animasyonlu parçaları */
           .vjs-loading-spinner::before,
           .vjs-loading-spinner::after {
               border-width: 6px !important;
    
               /* Üst çeyrek: Ukrayna Mavisi */
               border-top-color: #0057b7 !important;
    
               /* Alt çeyrek: Ukrayna Sarısı */
               border-bottom-color: #ffd700 !important;
    
               /* Yanlar şeffaf kalsın ki varsayılan kesikli çember efekti bozulmasın */
               border-left-color: transparent !important;
               border-right-color: transparent !important;
           }

    




    </style>
</head>
<body>

    <!-- Oynatıcı Alanı (Masaüstünde Dev Ekran) -->
    <div class="player-section">
        <div class="player-wrapper">
            <video id="main-tv-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" playsinline></video>
        </div>
        <div class="info-bar">
            <h1>UKRAINE TV</h1>
            <div class="current-badge" id="currentTrack">Yükleniyor...</div>
        </div>
    </div>

    <!-- Yan Menü Kanal Listesi -->
    <div class="content-section">
        <div class="section-title">Kanallar</div>
        <div class="channel-grid" id="channelGrid"></div>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/videojs-youtube/3.0.1/videojs-youtube.min.js"></script>

    <script>
        const channels = [
            
            { name: "1+1 Int", logo: "iconukr.png", url: "https://dash2.antik.sk/live/test_one_plus_one_int_tizen/playlist.m3u8", type: "hls" },
            { name: "1+1 Marathon", logo: "iconukr.png", url: "https://dash2.antik.sk/live/1plus1_marathon/playlist.m3u8", type: "hls" },
            { name: "36.6 TV", logo: "iconukr.png", url: "https://dash2.antik.sk/live/test_tridsatsest_hd_atktv/playlist.m3u8", type: "hls" },
            { name: "Avers", logo: "iconukr.png", url: "https://avers.pp.ua/hls/efir.m3u8", type: "hls" },
            { name: "Channel 7", logo: "iconukr.png", url: "https://cdn15.live-tv.cloud/ua_infinitas_tv/7tvod-abr/7tvod/7tvod720/chunks.m3u8?nimblesessionid=18864620", type: "hls" },
            { name: "Dacha", logo: "iconukr.png", url: "https://dash2.antik.sk/live/test_dacha_tv_atktv/playlist.m3u8", type: "hls" },
            { name: "DIM", logo: "iconukr.png", url: "https://dash2.antik.sk/live/telekanal_dim/playlist.m3u8", type: "hls" },
            { name: "Espreso TV", logo: "iconukr.png", url: "https://dash2.antik.sk/live/test_espresso/playlist.m3u8", type: "hls" },
            { name: "EWTN Ukraine", logo: "iconukr.png", url: "https://cdn3.wowza.com/1/WjduMm1tYnlwNXQx/M01NV3Uz/hls/xrf5kgxs/720/chunklist.m3u8", type: "hls" },
            { name: "FilmUA Live", logo: "iconukr.png", url: "https://dash2.antik.sk/live/test_film_life_atktv/playlist.m3u8", type: "hls" },
            { name: "FilmUA Drama", logo: "iconukr.png", url: "https://dash2.antik.sk/live/test_film_drama_atktv/playlist.m3u8", type: "hls" },
            { name: "FREEDOM", logo: "iconukr.png", url: "https://dash2.antik.sk/live/test_uatv/playlist.m3u8", type: "hls" },
            { name: "Happy Radio TV", logo: "iconukr.png", url: "https://tv.mediacp.eu:8081/happyradio/tracks-v1a1/mono.ts.m3u8", type: "hls" },
            { name: "Inter+", logo: "iconukr.png", url: "https://cdn15.live-tv.cloud/ua_infinitas_tv/inter-abr/inter/720/chunks.m3u8?nimblesessionid=18864703", type: "hls" },
            { name: "ITV", logo: "iconukr.png", url: "https://cdn10.live-tv.cloud/itvrv/abr-lq/itvrv/480p/chunks.m3u8?nimblesessionid=484221", type: "hls" },
            { name: "Izmail TV", logo: "iconukr.png", url: "https://cdn10.live-tv.cloud/izod/izod-abr-lq/izod/izod-sub/chunks.m3u8?nimblesessionid=484379", type: "hls" },
            { name: "Kus-Kus", logo: "iconukr.png", url: "https://dash2.antik.sk/live/test_kuskus_tv_atktv/playlist.m3u8", type: "hls" },
            { name: "Kvartal TV Int", logo: "iconukr.png", url: "https://dash2.antik.sk/live/kvartal_tv/playlist.m3u8", type: "hls" },
            { name: "Muzvar", logo: "iconukr.png", url: "https://cdn15.live-tv.cloud/ua_infinitas_tv/muzvar-abr/muzvar/muzvar720/chunks.m3u8?nimblesessionid=18864746", type: "hls" },
            { name: "NASHE Music", logo: "iconukr.png", url: "https://cdn15.live-tv.cloud/ua_infinitas_tv/nashemus-abr/nashemus/nashemus720/chunks.m3u8?nimblesessionid=18864748", type: "hls" },
            { name: "NKT TV", logo: "iconukr.png", url: "https://stream.ntktv.ua/s/ntk/ntk.m3u8", type: "hls" },
            { name: "NTN", logo: "iconukr.png", url: "https://cdn15.live-tv.cloud/ua_infinitas_tv/ntn-abr/intermedia/ntn/chunks.m3u8?nimblesessionid=18864753", type: "hls" },
            { name: "PTV", logo: "iconukr.png", url: "https://cdn15.live-tv.cloud/ua_infinitas_tv/hrpl-abr/hrpl/720p/chunks.m3u8?nimblesessionid=18864762", type: "hls" },
            { name: "Rivne 1", logo: "iconukr.png", url: "https://cdn1.live-tv.cloud/rivne1/rivne1-abr/rivne1/rivne1/chunks.m3u8?nimblesessionid=485617", type: "hls" },
            { name: "Rybalka", logo: "iconukr.png", url: "https://dash2.antik.sk/live/test_rybalka_tv_atktv/playlist.m3u8", type: "hls" },
            { name: "Sfera TV", logo: "iconukr.png", url: "https://cdn10.live-tv.cloud/sferarv/sferarv-abr/sferarv/360p/chunks.m3u8?nimblesessionid=485831", type: "hls" },
            { name: "Simon", logo: "iconukr.png", url: "https://hls.simon.ua/live-HD/live/chunks.m3u8?nimblesessionid=377083", type: "hls" },
            { name: "Suspilne Kultura", logo: "iconukr.png", url: "https://cdn15.live-tv.cloud/ua_infinitas_tv/7tvod-abr/playlist.m3u8", type: "hls" },
            { name: "Suspilne Pershyi", logo: "iconukr.png", url: "https://www.youtube.com/watch?v=uOntga5OQrs", type: "youtube" }, 
            { name: "Suspline Mix", logo: "iconukr.png", url: "suspline.m3u8", type: "hls" },
            { name: "Suspline Kyiv Video Only", logo: "iconukr.png", url: "https://live-nstu.cdn-03.cosmonova.net.ua/mobile-app/main/nstu-kyiv/nstu-kyiv_video_high_.m3u8", type: "hls" },
            { name: "Suspline Kyiv Audio Only", logo: "iconukr.png", url: "https://live-nstu.cdn-03.cosmonova.net.ua/mobile-app/main/nstu-kyiv/nstu-kyiv_audio_ukr_high_.m3u8", type: "hls" },
            { name: "Telekanal RAI", logo: "iconukr.png", url: "https://stream.rai.ua/rai/stream.m3u8", type: "hls" },


          
        ];

        let activeFocusIndex = 0;

        const player = videojs('main-tv-player', {
            fluid: false, // Tam ekran yayılımı sağlamak için akışkan mod kapatıldı (Masaüstü için)
            fill: true,   // Video.js'in içinde bulunduğu div'i tamamen doldurmasını sağlar
            techOrder: ["html5", "youtube"],
            youtube: { "iv_load_policy": 3, "modestbranding": 1 }
        });

        const gridContainer = document.getElementById('channelGrid');
        const currentTrackBadge = document.getElementById('currentTrack');

        function initApp() {
            channels.forEach((channel, idx) => {
                const card = document.createElement('div');
                card.className = `channel-card ${idx === 0 ? 'active' : ''}`;
                card.setAttribute('tabindex', '0'); 
                card.setAttribute('data-index', idx);

                card.innerHTML = `
                    <div class="logo-container">
                        <img src="${channel.logo}" class="channel-logo" alt="${channel.name}" onerror="this.src='https://via.placeholder.com/50?text=TV'">
                    </div>
                    <div class="channel-details">
                        <div class="channel-name">${channel.name}</div>
                        <div class="channel-type">${channel.type === 'youtube' ? 'YouTube' : 'Canlı Stream'}</div>
                    </div>
                `;

                card.addEventListener('click', () => { selectChannel(idx); });
                card.addEventListener('focus', () => { activeFocusIndex = idx; });
                gridContainer.appendChild(card);
            });

            if(channels.length > 0) playStream(channels[0]);
            
            setTimeout(() => {
                const initialFocus = document.querySelector('.channel-card');
                if(initialFocus) initialFocus.focus();
            }, 500);
        }

        function selectChannel(idx) {
            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
            const cards = document.querySelectorAll('.channel-card');
            if(cards[idx]) {
                cards[idx].classList.add('active');
                playStream(channels[idx]);
            }
        }

        function playStream(channel) {
            currentTrackBadge.innerText = channel.name;
            if (channel.type === "youtube") {
                player.src({ src: channel.url, type: "video/youtube" });
            } else {
                player.src({ src: channel.url, type: "application/x-mpegURL" });
            }
            player.ready(() => {
                player.play().catch(() => console.log("Oynatma başlatılamadı"));
            });
        }

        // TV Kumandası Tuş Kombinasyonları
        document.addEventListener('keydown', function(e) {
            const cards = document.querySelectorAll('.channel-card');
            switch(e.key) {
                case 'ArrowDown':
                    e.preventDefault();
                    if (activeFocusIndex < cards.length - 1) {
                        activeFocusIndex++;
                        cards[activeFocusIndex].focus();
                        cards[activeFocusIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    if (activeFocusIndex > 0) {
                        activeFocusIndex--;
                        cards[activeFocusIndex].focus();
                        cards[activeFocusIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                    break;
                case 'Enter':
                    e.preventDefault();
                    selectChannel(activeFocusIndex);
                    break;
            }
        });

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
