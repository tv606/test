<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV Stream Player - Pro Recording & Snap</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --surface: #12151c;
    --surface2: #1a1e29;
    --border: #232838;
    --accent: #e63946;
    --accent2: #ff6b6b;
    --snap-color: #4cc9f0; /* Screenshot için yeni renk */
    --zap-color: #ff9f1c;
    --rec-color: #ff0000;
    --text: #e8eaf0;
    --muted: #6b7280;
    --active: #1e2535;
  }
  html {scrollbar-color: #1a1818 #2e2e2e;}
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Rajdhani', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; align-items: center; gap: 12px; z-index: 10; }
  .topbar .logo { font-size: 18px; font-weight: 700; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; }
  .topbar .time { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--muted); margin-left: auto; }

  .main { display: flex; flex: 1; width: 100%; overflow: hidden; }

  .sidebar { width: 280px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .sidebar-header h2 { font-size: 11px; font-weight: 700; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }

  .m3u8-input-wrap { padding: 12px; border-bottom: 1px solid var(--border); background: var(--bg); }
  .m3u8-input-wrap input { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px; font-family: 'Share Tech Mono', monospace; font-size: 11px; outline: none; margin-bottom: 6px; }
  .load-btn { width: 100%; background: var(--accent); border: none; color: #fff; padding: 8px; font-weight: 700; cursor: pointer; text-transform: uppercase; }

  .channel-list { overflow-y: auto; flex: 1; }
  .channel-item { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid rgba(35,40,56,0.4); display: flex; align-items: center; gap: 10px; }
  .channel-item:hover { background: var(--active); }
  .channel-item.active { background: var(--active); border-left: 3px solid var(--accent); }
  .channel-item.active .ch-name { color: var(--accent); }

  .player-area { flex: 1; background: #000; display: flex; flex-direction: column; position: relative; }
  .video-wrap { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  video { max-width: 100%; max-height: 100%; width: 100%; height: auto; }

  .hud-status { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; z-index: 10; }
  .badge { padding: 6px 15px; font-family: 'Share Tech Mono', monospace; font-weight: bold; font-size: 12px; display: none; }
  #zapIndicator { background: var(--zap-color); color: #000; box-shadow: 0 0 15px rgba(255,159,28,0.5); }
  #recIndicator { background: var(--rec-color); color: #fff; animation: blink 1s infinite; box-shadow: 0 0 15px rgba(255,0,0,0.5); }

  .video-info { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 10px 20px; border-left: 4px solid var(--accent); display: none; z-index: 10; }
  .video-info.show { display: block; animation: fadeIn 0.5s; }

  .controls { background: var(--surface); border-top: 1px solid var(--border); padding: 15px 30px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
  .ctrl-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); min-width: 60px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; transition: 0.2s; }
  .ctrl-btn:hover { background: var(--border); }
  .ctrl-btn.primary { background: var(--accent); border: none; width: 50px; height: 50px; font-size: 20px; }
  
  .zap-active { background: var(--zap-color) !important; color: #000 !important; }
  .rec-active { background: var(--rec-color) !important; color: #fff !important; border-color: #fff !important; }
  /*.snap-btn { color: var(--snap-color); border-color: var(--snap-color); } */
  .snap-btn:active { background: var(--snap-color); color: #000; }

  .now-playing { flex: 1; text-align: center; min-width: 200px; }
  .np-name { font-weight: 700; color: var(--accent); font-size: 18px; }

  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>

</div>

let currentIndex = -1;
let hls = null;
let zapInterval = null;
let mediaRecorder = null;
let recordedChunks = [];

function init() {
  renderChannels();
  setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString(); }, 1000);
}

function renderChannels() {
  const list = document.getElementById('channelList');
  document.getElementById('chCount').textContent = channels.length;
  list.innerHTML = '';
  channels.forEach((ch, i) => {
    const item = document.createElement('div');
    item.className = 'channel-item' + (i === currentIndex ? ' active' : '');
    item.innerHTML = `<strong>${i+1}</strong> <span>${ch.name}</span>`;
    item.onclick = () => selectChannel(i);
    list.appendChild(item);
  });
}

function selectChannel(index) {
  if (mediaRecorder && mediaRecorder.state === "recording") {
      if(!confirm("Kanal değiştirirseniz kayıt duracak. Devam edilsin mi?")) return;
      toggleRecording();
  }
  
  currentIndex = index;
  const ch = channels[index];
  renderChannels();
  
  const video = document.getElementById('videoPlayer');
  if (hls) hls.destroy();

  if (Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(ch.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
  }

  document.getElementById('nowPlayingName').textContent = ch.name;
  showInfo(ch.name, index + 1);
}

// SCREENSHOT ÖZELLİĞİ
function takeScreenshot() {
  const video = document.getElementById('videoPlayer');
  if (!video.videoWidth) return alert("Video henüz yüklenmedi!");

  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  
  // Videoyu canvasa çiz
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  
  // PNG olarak indir
  try {
    const dataUrl = canvas.toDataURL("image/png");
    const link = document.createElement('a');
    link.download = `iptv-snap-${Date.now()}.png`;
    link.href = dataUrl;
    link.click();
  } catch (e) {
    alert("Hata: CORS kısıtlamaları nedeniyle bu kanaldan görüntü alınamıyor.");
  }
}

function toggleRecording() {
  const video = document.getElementById('videoPlayer');
  const recBtn = document.getElementById('recBtn');
  const recInd = document.getElementById('recIndicator');

  if (mediaRecorder && mediaRecorder.state === "recording") {
    mediaRecorder.stop();
    recBtn.classList.remove('rec-active');
    recBtn.innerText = "REC";
    recInd.style.display = 'none';
  } else {
    recordedChunks = [];
    try {
      const stream = video.captureStream ? video.captureStream() : video.mozCaptureStream();
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
      
      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `iptv-record-${Date.now()}.webm`;
        a.click();
      };

      mediaRecorder.start();
      recBtn.classList.add('rec-active');
      recBtn.innerText = "STOP";
      recInd.style.display = 'block';
    } catch (e) {
      alert("Hata: Kayıt başlatılamadı. Tarayıcı desteğini kontrol edin.");
    }
  }
}

function showInfo(name, num) {
  const info = document.getElementById('videoInfo');
  document.getElementById('infoName').textContent = name;
  document.getElementById('infoNum').textContent = 'CH ' + num;
  info.classList.add('show');
  setTimeout(() => info.classList.remove('show'), 3000);
}

function toggleZapping() {
  const btn = document.getElementById('zapBtn');
  const ind = document.getElementById('zapIndicator');
  if (zapInterval) {
    clearInterval(zapInterval); zapInterval = null;
    btn.classList.remove('zap-active'); ind.style.display = 'none';
  } else {
    btn.classList.add('zap-active'); ind.style.display = 'block';
    zapInterval = setInterval(() => { selectChannel(Math.floor(Math.random() * channels.length)); }, 5500);
  }
}

function togglePlay() {
  const v = document.getElementById('videoPlayer');
  if (v.paused) v.play(); else v.pause();
  document.getElementById('playPauseBtn').textContent = v.paused ? '▶' : '⏸';
}

function nextChannel() { selectChannel((currentIndex + 1) % channels.length); }
function prevChannel() { selectChannel((currentIndex - 1 + channels.length) % channels.length); }

function loadFromUrl() {
  const url = document.getElementById('m3u8Url').value;
  if(url) { channels.push({name: "Custom Stream", url: url}); renderChannels(); selectChannel(channels.length - 1); }
}

init();

  // Web sitesi açıkken internetin koptuğunu anladığı an çalışır
window.addEventListener('offline', () => {
    // Electron ortamında olduğumuz için yerel dosyaya bu şekilde dönebiliriz
    window.location.href = "index.html"; 
});
