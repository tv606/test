<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rastgele Kameraman Pro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: fixed;
    top: 0;
    left: 0;
    background-color: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  #app-container {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
  }

  #viewfinder {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.3s ease;
  }

  #viewfinder.aspect-16-9 {
    width: 100vw;
    height: calc(100vw * 16 / 9);
    max-height: 100vh;
  }

  #camera-feed {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform-origin: 50% 50%;
    transition: transform 2.5s cubic-bezier(0.4, 0.0, 0.2, 1);
  }

  .overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 2;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px) 16px;
  }

  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.6);
    padding: 10px 16px;
    border-radius: 20px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .rec-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: bold;
  }

  .dot {
    width: 8px;
    height: 8px;
    background: #8e8e93;
    border-radius: 50%;
  }

  .dot.recording {
    background: #ff3b30;
    animation: blink 1s infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .controls {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: rgba(0,0,0,0.65);
    padding: 16px;
    border-radius: 24px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .btn-group {
    display: flex;
    gap: 8px;
  }

  .btn {
    flex: 1;
    background: #2c2c2e;
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: 14px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-active {
    background: #30d158;
    color: #000;
  }

  .btn-rec {
    background: #ff3b30;
    color: #fff;
  }

  .info-text {
    font-size: 11px;
    color: #aaa;
    text-align: center;
  }
</style>
</head>
<body>

<div id="app-container">
  <div id="viewfinder">
    <video id="camera-feed" autoplay playsinline muted></video>
  </div>
  
  <div class="overlay">
    <div class="status-bar">
      <div class="rec-indicator">
        <div id="rec-dot" class="dot"></div>
        <span id="rec-status">HAZIR</span>
      </div>
      <div id="mode-text" style="font-size: 12px;">Mod: Sabit</div>
    </div>

    <div class="controls">
      <div class="btn-group">
        <button id="toggle-btn" class="btn">Rastgele Hareket</button>
        <button id="aspect-btn" class="btn">16:9 Mod</button>
      </div>
      <button id="record-btn" class="btn btn-rec">Kaydı Başlat</button>
      <div class="info-text">Merkez odaklı akıcı hareketler ve yüksek kaliteli kayıt.</div>
    </div>
  </div>
</div>

<script>
  const viewfinder = document.getElementById('viewfinder');
  const video = document.getElementById('camera-feed');
  const toggleBtn = document.getElementById('toggle-btn');
  const aspectBtn = document.getElementById('aspect-btn');
  const recordBtn = document.getElementById('record-btn');
  const modeText = document.getElementById('mode-text');
  const recDot = document.getElementById('rec-dot');
  const recStatus = document.getElementById('rec-status');
  
  let isActive = false;
  let is169 = false;
  let isRecording = false;
  let intervalId = null;
  let mediaRecorder = null;
  let recordedChunks = [];
  let stream = null;

  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ 
        video: { 
          facingMode: 'user', 
          width: { ideal: 1920 }, 
          height: { ideal: 1080 },
          frameRate: { ideal: 60 }
        }, 
        audio: true 
      });
      video.srcObject = stream;
    } catch (e) {
      alert('Kamera veya mikrofon erişimi reddedildi.');
    }
  }

  function applyRandomTransform() {
    if (!isActive) return;
    const scale = (1.15 + Math.random() * 0.25).toFixed(2);
    const translateX = (-1 * (Math.random() * 24 - 12)).toFixed(1);
    const translateY = (Math.random() * 24 - 12).toFixed(1);
    const rotate = (Math.random() * 4 - 2).toFixed(1);
    
    video.style.transform = `scale(${scale}) translate(${translateX}px, ${translateY}px) rotate(${rotate}deg)`;
  }

  toggleBtn.addEventListener('click', () => {
    isActive = !isActive;
    if (isActive) {
      toggleBtn.textContent = 'Hareketi Durdur';
      toggleBtn.classList.add('btn-active');
      modeText.textContent = 'Mod: Dinamik Kameraman';
      applyRandomTransform();
      intervalId = setInterval(applyRandomTransform, 2800);
    } else {
      toggleBtn.textContent = 'Rastgele Hareket';
      toggleBtn.classList.remove('btn-active');
      modeText.textContent = 'Mod: Sabit';
      clearInterval(intervalId);
      video.style.transform = 'scale(1) translate(0px, 0px) rotate(0deg)';
    }
  });

  aspectBtn.addEventListener('click', () => {
    is169 = !is169;
    if (is169) {
      viewfinder.classList.add('aspect-16-9');
      aspectBtn.textContent = 'Tam Ekran Mod';
    } else {
      viewfinder.classList.remove('aspect-16-9');
      aspectBtn.textContent = '16:9 Mod';
    }
  });

  recordBtn.addEventListener('click', () => {
    if (!isRecording) {
      startRecording();
    } else {
      stopRecording();
    }
  });

  function startRecording() {
    recordedChunks = [];
    const mimeType = MediaRecorder.isTypeSupported('video/mp4;codecs=avc1') 
      ? 'video/mp4;codecs=avc1' 
      : 'video/webm;codecs=vp9';

    try {
      mediaRecorder = new MediaRecorder(stream, {
        mimeType: mimeType,
        videoBitsPerSecond: 8000000
      });
    } catch (e) {
      mediaRecorder = new MediaRecorder(stream);
    }

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = saveVideo;
    mediaRecorder.start();

    isRecording = true;
    recordBtn.textContent = 'Kaydı Bitir';
    recDot.classList.add('recording');
    recStatus.textContent = 'KAYITTA';
  }

  function stopRecording() {
    mediaRecorder.stop();
    isRecording = false;
    recordBtn.textContent = 'Kaydı Başlat';
    recDot.classList.remove('recording');
    recStatus.textContent = 'HAZIR';
  }

  function saveVideo() {
    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.style.display = 'none';
    a.href = url;
    a.download = `video_${Date.now()}.mp4`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      window.URL.revokeObjectURL(url);
    }, 100);
  }

  startCamera();
</script>

</body>
</html>
