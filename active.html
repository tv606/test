<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rastgele Kameraman</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: fixed;
    top: 0;
    left: 0;
    background-color: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* iPhone 13 Mini Tam Ekran Yapısı */
  #app-container {
    width: 100vw;
    height: 100vh;
    height: -webkit-fill-available;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  #viewfinder {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
    overflow: hidden;
  }

  #camera-feed {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform-origin: center center;
    transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
  }

  .overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 2;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 16px) 16px;
  }

  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.5);
    padding: 10px 16px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .rec-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: bold;
  }

  .dot {
    width: 8px;
    height: 8px;
    background: #ff3b30;
    border-radius: 50%;
    animation: blink 1s infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .controls {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: rgba(0,0,0,0.6);
    padding: 16px;
    border-radius: 24px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .btn {
    background: #2c2c2e;
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: 14px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-active {
    background: #30d158;
    color: #000;
  }

  .info-text {
    font-size: 11px;
    color: #aaa;
    text-align: center;
  }
</style>
</head>
<body>

<div id="app-container">
  <div id="viewfinder">
    <video id="camera-feed" autoplay playsinline muted></video>
  </div>
  
  <div class="overlay">
    <div class="status-bar">
      <div class="rec-indicator"><div class="dot"></div> CANLI</div>
      <div id="mode-text" style="font-size: 12px;">Mod: Pasif</div>
    </div>

    <div class="controls">
      <button id="toggle-btn" class="btn">Rastgele Kamera Hareketini Başlat</button>
      <div class="info-text">Senin hareketinden bağımsız rastgele zum ve kaydırma yapar.</div>
    </div>
  </div>
</div>

<script>
  const video = document.getElementById('camera-feed');
  const toggleBtn = document.getElementById('toggle-btn');
  const modeText = document.getElementById('mode-text');
  
  let isActive = false;
  let intervalId = null;

  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, 
        audio: false 
      });
      video.srcObject = stream;
    } catch (e) {
      alert('Kamera erişimi verilmeli veya HTTPS üzerinden çalıştırılmalı.');
    }
  }

  function applyRandomTransform() {
    if (!isActive) return;
    const scale = (1 + Math.random() * 0.35).toFixed(2);
    const translateX = (Math.random() * 30 - 15).toFixed(1);
    const translateY = (Math.random() * 30 - 15).toFixed(1);
    const rotate = (Math.random() * 2 - 1).toFixed(1);
    
    video.style.transform = `scale(${scale}) translate(${translateX}px, ${translateY}px) rotate(${rotate}deg)`;
  }

  toggleBtn.addEventListener('click', () => {
    isActive = !isActive;
    if (isActive) {
      toggleBtn.textContent = 'Rastgele Hareketi Durdur';
      toggleBtn.classList.add('btn-active');
      modeText.textContent = 'Mod: Aktif (Rastgele)';
      applyRandomTransform();
      intervalId = setInterval(applyRandomTransform, 2500);
    } else {
      toggleBtn.textContent = 'Rastgele Kamera Hareketini Başlat';
      toggleBtn.classList.remove('btn-active');
      modeText.textContent = 'Mod: Pasif';
      clearInterval(intervalId);
      video.style.transform = 'scale(1) translate(0px, 0px) rotate(0deg)';
    }
  });

  startCamera();
</script>

</body>
</html>
