<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rastgele Kameraman Pro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: fixed;
    top: 0;
    left: 0;
    background-color: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  #app-container {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
  }

  #viewfinder {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.3s ease;
  }

  #viewfinder.aspect-16-9 {
    width: 100vw;
    height: calc(100vw * 16 / 9);
    max-height: 100vh;
  }

  #camera-feed, #canvas-render {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #camera-feed {
    display: none;
  }

  .overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 2;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px) 16px;
  }

  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.6);
    padding: 10px 16px;
    border-radius: 20px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .rec-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: bold;
  }

  .dot {
    width: 8px;
    height: 8px;
    background: #8e8e93;
    border-radius: 50%;
  }

  .dot.recording {
    background: #ff3b30;
    animation: blink 1s infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .controls {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: rgba(0,0,0,0.65);
    padding: 16px;
    border-radius: 24px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .btn-group {
    display: flex;
    gap: 8px;
  }

  .btn {
    flex: 1;
    background: #2c2c2e;
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: 14px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-active {
    background: #30d158;
    color: #000;
  }

  .btn-rec {
    background: #ff3b30;
    color: #fff;
  }

  .info-text {
    font-size: 11px;
    color: #aaa;
    text-align: center;
  }
</style>
</head>
<body>

<div id="app-container">
  <div id="viewfinder">
    <video id="camera-feed" autoplay playsinline muted></video>
    <canvas id="canvas-render"></canvas>
  </div>
  
  <div class="overlay">
    <div class="status-bar">
      <div class="rec-indicator">
        <div id="rec-dot" class="dot"></div>
        <span id="rec-status">HAZIR</span>
      </div>
      <div id="mode-text" style="font-size: 12px;">Mod: Sabit</div>
    </div>

    <div class="controls">
      <div class="btn-group">
        <button id="toggle-btn" class="btn">Rastgele Hareket</button>
        <button id="aspect-btn" class="btn">16:9 Mod</button>
      </div>
      <button id="record-btn" class="btn btn-rec">Kaydı Başlat</button>
      <div class="info-text">Ayna modlu akıcı hareketler ve sorunsuz kayıt.</div>
    </div>
  </div>
</div>

<script>
  const viewfinder = document.getElementById('viewfinder');
  const video = document.getElementById('camera-feed');
  const canvas = document.getElementById('canvas-render');
  const ctx = canvas.getContext('2d');
  
  const toggleBtn = document.getElementById('toggle-btn');
  const aspectBtn = document.getElementById('aspect-btn');
  const recordBtn = document.getElementById('record-btn');
  const modeText = document.getElementById('mode-text');
  const recDot = document.getElementById('rec-dot');
  const recStatus = document.getElementById('rec-status');
  
  let isActive = false;
  let is169 = false;
  let isRecording = false;
  let mediaRecorder = null;
  let recordedChunks = [];
  let videoStream = null;

  // Hedef ve mevcut animasyon değerleri (Akıcılık için Lerp)
  let currentTransform = { scale: 1, tx: 0, ty: 0, rotate: 0 };
  let targetTransform = { scale: 1, tx: 0, ty: 0, rotate: 0 };

  async function startCamera() {
    try {
      videoStream = await navigator.mediaDevices.getUserMedia({ 
        video: { 
          facingMode: 'user', 
          width: { ideal: 1280 }, 
          height: { ideal: 720 },
          frameRate: { ideal: 30 }
        }, 
        audio: true 
      });
      video.srcObject = videoStream;
      video.play();
      
      video.onloadedmetadata = () => {
        canvas.width = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 720;
        renderFrame();
      };
    } catch (e) {
      alert('Kamera veya mikrofon erişimi reddedildi.');
    }
  }

  function lerp(start, end, amt) {
    return (1 - amt) * start + amt * end;
  }

  function updateTargets() {
    if (!isActive) {
      targetTransform = { scale: 1, tx: 0, ty: 0, rotate: 0 };
      return;
    }
    targetTransform = {
      scale: 1.15 + Math.random() * 0.25,
      tx: (Math.random() * 40 - 20),
      ty: (Math.random() * 40 - 20),
      rotate: (Math.random() * 4 - 2)
    };
  }

  let transformInterval = null;

  function renderFrame() {
    // Yumuşak geçişler (Lerp)
    currentTransform.scale = lerp(currentTransform.scale, targetTransform.scale, 0.03);
    currentTransform.tx = lerp(currentTransform.tx, targetTransform.tx, 0.03);
    currentTransform.ty = lerp(currentTransform.ty, targetTransform.ty, 0.03);
    currentTransform.rotate = lerp(currentTransform.rotate, targetTransform.rotate, 0.03);

    ctx.save();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Merkeze taşı, transform uygula, geri taşı
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.scale(currentTransform.scale, currentTransform.scale);
    ctx.translate(currentTransform.tx, currentTransform.ty);
    ctx.rotate((currentTransform.rotate * Math.PI) / 180);

    // Ayna etkisi (Ayna modu için -1 scaleX)
    ctx.scale(-1, 1);

    ctx.drawImage(video, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
    ctx.restore();

    requestAnimationFrame(renderFrame);
  }

  toggleBtn.addEventListener('click', () => {
    isActive = !isActive;
    if (isActive) {
      toggleBtn.textContent = 'Hareketi Durdur';
      toggleBtn.classList.add('btn-active');
      modeText.textContent = 'Mod: Dinamik Kameraman';
      updateTargets();
      transformInterval = setInterval(updateTargets, 2500);
    } else {
      toggleBtn.textContent = 'Rastgele Hareket';
      toggleBtn.classList.remove('btn-active');
      modeText.textContent = 'Mod: Sabit';
      clearInterval(transformInterval);
      targetTransform = { scale: 1, tx: 0, ty: 0, rotate: 0 };
    }
  });

  aspectBtn.addEventListener('click', () => {
    is169 = !is169;
    if (is169) {
      viewfinder.classList.add('aspect-16-9');
      aspectBtn.textContent = 'Tam Ekran Mod';
    } else {
      viewfinder.classList.remove('aspect-16-9');
      aspectBtn.textContent = '16:9 Mod';
    }
  });

  recordBtn.addEventListener('click', () => {
    if (!isRecording) {
      startRecording();
    } else {
      stopRecording();
    }
  });

  function startRecording() {
    recordedChunks = [];
    
    // Canvas görüntüsü ile mikrofon sesini birleştir
    const canvasStream = canvas.captureStream(30);
    const audioTrack = videoStream.getAudioTracks()[0];
    if (audioTrack) {
      canvasStream.addTrack(audioTrack);
    }

    let options = { mimeType: 'video/webm' };
    if (MediaRecorder.isTypeSupported('video/mp4')) {
      options = { mimeType: 'video/mp4' };
    }

    try {
      mediaRecorder = new MediaRecorder(canvasStream, options);
    } catch (e) {
      mediaRecorder = new MediaRecorder(canvasStream);
    }

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = saveVideo;
    mediaRecorder.start(1000);

    isRecording = true;
    recordBtn.textContent = 'Kaydı Bitir';
    recDot.classList.add('recording');
    recStatus.textContent = 'KAYITTA';
  }

  function stopRecording() {
    mediaRecorder.stop();
    isRecording = false;
    recordBtn.textContent = 'Kaydı Başlat';
    recDot.classList.remove('recording');
    recStatus.textContent = 'HAZIR';
  }

  function saveVideo() {
    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/mp4' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.style.display = 'none';
    a.href = url;
    a.download = `kayit_${Date.now()}.mp4`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      window.URL.revokeObjectURL(url);
    }, 100);
  }

  startCamera();
</script>

</body>
</html>
