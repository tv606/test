<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Twin Peaks LUT Camera</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0b0b0b;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .viewport {
      position: relative;
      width: 100%;
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: filter 0.1s ease;
    }
    .badge {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
      color: #e5c158;
    }
    .controls {
      padding: 16px 20px;
      background: #0b0b0b;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .filter-presets {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .filter-presets::-webkit-scrollbar {
      display: none;
    }
    .btn-preset {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #8e8e93;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 12px;
      white-space: nowrap;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .btn-preset.active {
      background: #e5c158;
      color: #000;
      border-color: #e5c158;
      font-weight: 700;
    }
    .slider-group {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px 14px;
      border-radius: 14px;
    }
    .slider-group label {
      font-size: 11px;
      color: #a1a1a6;
      width: 70px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .slider-group input {
      flex: 1;
      accent-color: #e5c158;
    }
  </style>
</head>
<body>

  <div class="viewport">
    <video id="webcam" autoplay playsinline muted></video>
    <div class="badge" id="presetLabel">Preset: Fuji Warm</div>
  </div>

  <div class="controls">
    <div class="filter-presets">
      <button class="btn-preset active" onclick="setPreset('fuji', 'Fuji Warm', this)">Fuji 35mm</button>
      <button class="btn-preset" onclick="setPreset('redroom', 'Red Room', this)">Red Room</button>
      <button class="btn-preset" onclick="setPreset('woods', 'Snoqualmie Woods', this)">Woods</button>
      <button class="btn-preset" onclick="setPreset('none', 'Normal', this)">Bypass</button>
    </div>

    <div class="slider-group">
      <label>Yoğunluk</label>
      <input type="range" id="intensity" min="0" max="100" value="100" oninput="updateFilter()">
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const intensitySlider = document.getElementById('intensity');
    const presetLabel = document.getElementById('presetLabel');
    let currentPreset = 'fuji';

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert('Kamera erişimi sağlana ma dı: ' + err.message);
      }
    }

    function updateFilter() {
      const factor = intensitySlider.value / 100;
      let filterString = '';

      if (currentPreset === 'fuji') {
        const sepia = 35 * factor;
        const contrast = 100 + (25 * factor);
        const warm = 100 + (15 * factor);
        const saturate = 100 + (20 * factor);
        filterString = `sepia(${sepia}%) contrast(${contrast}%) brightness(${warm}%) saturate(${saturate}%) hue-rotate(-10deg)`;
      } else if (currentPreset === 'redroom') {
        const sepia = 80 * factor;
        const saturate = 100 + (250 * factor);
        const contrast = 100 + (40 * factor);
        filterString = `sepia(${sepia}%) hue-rotate(310deg) saturate(${saturate}%) contrast(${contrast}%)`;
      } else if (currentPreset === 'woods') {
        const saturate = 100 + (10 * factor);
        const contrast = 100 + (30 * factor);
        filterString = `contrast(${contrast}%) saturate(${saturate}%) hue-rotate(15deg) brightness(90%)`;
      } else {
        filterString = 'none';
      }

      video.style.filter = filterString;
    }

    function setPreset(preset, name, btn) {
      currentPreset = preset;
      presetLabel.textContent = `Preset: ${name}`;
      document.querySelectorAll('.btn-preset').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateFilter();
    }

    initCamera();
    updateFilter();
  </script>
</body>
</html>
