<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Super 8 PHOTO PRO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100dvh; overflow: hidden; background-color: #0b0f0d; font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: #e2d9cc; }
    .app-container { width: 100%; height: 100dvh; max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; justify-content: space-between; padding: env(safe-area-inset-top, 12px) 16px env(safe-area-inset-bottom, 12px) 16px; position: relative; }
    .header { height: 50px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .btn-group { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .icon-btn { background: rgba(46, 64, 52, 0.8); border: 1px solid rgba(201, 59, 43, 0.5); color: #e2d9cc; padding: 6px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .icon-btn.active-mode { background: #c93b2b; border-color: #fff; }
    
    .preview-area { flex: 1; min-height: 0; margin: 8px 0; background: #000; border-radius: 16px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; border: 1px solid #1a261f; }
    canvas { width: 100%; height: 100%; object-fit: contain; }
    .placeholder { color: #5a6b5e; font-size: 14px; text-align: center; padding: 20px; }
    
    .controls { display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; padding-bottom: 8px; }
    
    .zoom-container { display: flex; align-items: center; gap: 8px; background: rgba(18, 26, 21, 0.8); padding: 6px 12px; border-radius: 20px; border: 1px solid #1a261f; }
    .zoom-label { font-size: 10px; font-weight: 800; color: #c93b2b; }
    .zoom-slider { flex: 1; -webkit-appearance: none; appearance: none; height: 16px; border-radius: 4px; background: #2e4034; outline: none; }
    .zoom-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 28px; height: 28px; border-radius: 50%; background: #c93b2b; cursor: pointer; border: 2px solid #fff; }
    .zoom-value { font-size: 10px; font-weight: 700; width: 32px; text-align: right; color: #e2d9cc; }

    .filter-bar { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 4px 2px; }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-card { flex: 0 0 62px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
    .filter-thumb { width: 52px; height: 52px; border-radius: 10px; background: #121a15; border: 2px solid transparent; transition: all 0.2s; }
    .filter-card.active .filter-thumb { border: 2px solid #c93b2b; transform: scale(1.05); }
    .filter-card span { font-size: 10px; color: #7a8c7e; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
    .filter-card.active span { color: #e2d9cc; }
    
    .shutter-row { display: flex; align-items: center; justify-content: space-between; padding: 0 10px; }
    .gallery-preview { width: 50px; height: 50px; border-radius: 12px; border: 2px solid #2e4034; background: #121a15; background-size: cover; background-position: center; cursor: pointer; }
    .shutter-btn { width: 72px; height: 72px; border-radius: 50%; background: #c93b2b; border: 4px solid #fff; outline: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(201, 59, 43, 0.4); transition: transform 0.1s; }
    .shutter-btn:active { transform: scale(0.92); }
    .shutter-inner { width: 54px; height: 54px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.2); }

    .settings-modal, .gallery-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 7, 6, 0.95); z-index: 50; display: none; flex-direction: column; padding: 40px 20px; backdrop-filter: blur(10px); }
    .settings-modal h2, .gallery-modal h2 { color: #c93b2b; margin-bottom: 20px; font-size: 20px; }
    .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 14px; font-weight: 600; }
    .close-btn { margin-top: auto; background: #5a6b5e; color: #fff; padding: 12px; border-radius: 20px; text-align: center; cursor: pointer; font-weight: 700; }
    
    .flash-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background:white; opacity:0; pointer-events:none; transition: opacity 0.15s ease-out; }
    
    input[type="file"] { display: none; }
  </style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <div class="btn-group">
      <button class="icon-btn" id="camBtn">Kamera Aç</button>
      <button class="icon-btn" id="flipBtn">Çevir</button>
      <button class="icon-btn" id="aspectBtn">4:3 Mode</button>
      <button class="icon-btn" id="flashBtn">Flaş: Kapalı</button>
      <button class="icon-btn" onclick="document.getElementById('fileInput').click()">Foto Yükle</button>
      <button class="icon-btn" onclick="toggleSettings()">Ayarlar</button>
    </div>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="preview-area">
    <span class="placeholder" id="placeholderText">Kamera açın veya galeriniden bir fotoğraf yükleyin</span>
    <canvas id="canvas" style="display:none;"></canvas>
    <video id="video" autoplay playsinline muted hidden></video>
    <div id="flashOverlay" class="flash-overlay"></div>
  </div>

  <div class="controls">
    <div class="zoom-container">
      <span class="zoom-label">ZOOM</span>
      <input type="range" class="zoom-slider" id="zoomSlider" min="1.0" max="4.0" step="0.05" value="1.0">
      <span class="zoom-value" id="zoomValue">1.0x</span>
    </div>

    <div class="filter-bar" id="filterBar"></div>

    <div class="shutter-row">
      <div class="gallery-preview" id="galleryBtn" onclick="openGallery()"></div>
      <button class="shutter-btn" onclick="takePhoto()">
        <div class="shutter-inner"></div>
      </button>
      <div style="width: 50px;"></div> <!-- Dengeleme boşluğu -->
    </div>
  </div>

  <!-- Ayarlar Modalı -->
  <div class="settings-modal" id="settingsModal">
    <h2>Fotoğraf Ayarları</h2>
    <div class="setting-row">
      <span>Fotoğraf Çözünürlüğü</span>
      <select id="setResolution" style="background:#1a261f; color:#fff; border:1px solid #c93b2b; padding:4px; border-radius:6px;">
        <option value="1.0" selected>Orijinal (En Yüksek HQ)</option>
        <option value="0.75">Yüksek (75%)</option>
        <option value="0.5">Orta (50%)</option>
      </select>
    </div>
    <div class="setting-row"><span>Film Kumlanması (Grain)</span><input type="range" id="setNoise" min="0" max="100" value="50"></div>
    <div class="setting-row"><span>VHS Çizik Seviyesi</span><input type="range" id="setScratch" min="0" max="100" value="40"></div>
    <div class="close-btn" onclick="toggleSettings()">Kapat</div>
  </div>

  <!-- Galeri Önizleme Modalı -->
  <div class="gallery-modal" id="galleryModal">
    <h2>Son Çekilen Fotoğraf</h2>
    <div style="flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden;">
      <img id="lastPhotoImg" style="max-width:100%; max-height:100%; object-fit:contain; border-radius:8px;">
    </div>
    <div style="display:flex; gap:10px; margin-top:15px;">
      <a id="downloadLink" style="flex:1; background:#c93b2b; color:#fff; text-align:center; padding:12px; border-radius:20px; text-decoration:none; font-weight:700;">İndir</a>
      <div class="close-btn" style="flex:1; margin-top:0;" onclick="closeGallery()">Kapat</div>
    </div>
  </div>
</div>

<script>
  const filtersData = [
    ["Grain Master", 1.0, 1.0, 1.0, 0, 0, 0],
    ["Black Lodge", 1.4, 1.2, 1.2, 15, -10, -15],
    ["Exposure Redux", 1.15, 1.1, 1.0, 15, 10, -5],
    ["Premium 8mm", 1.1, 1.05, 0.85, 10, 8, -10],
    ["Vintage VHS", 1.0, 1.2, 1.1, 5, 0, 15],
    ["Retro Cam", 0.9, 1.1, 0.9, 10, 20, 10],
    ["Cine 16mm", 1.05, 1.0, 0.95, 10, 5, -5],
    ["Noir Classic", 0.9, 0.9, 0.9, 0, 0, 0],
    ["Laura Blue", 0.95, 0.98, 1.25, 5, 10, 20],
    ["Old Film", 0.8, 0.75, 0.7, 40, 35, 30],
    ["Snoqualmie", 0.75, 0.8, 0.75, 20, 30, 25],
    ["Red Room", 1.35, 0.5, 0.4, 30, 0, 0],
    ["Cherry Diner", 1.2, 1.0, 0.75, 20, 5, -10],
    ["Dougie Gold", 1.15, 1.1, 0.65, 15, 10, 0],
    ["Fuji Superia", 1.05, 1.1, 0.95, 5, 15, -5],
    ["Kodak Gold", 1.1, 1.05, 0.8, 15, 10, -15],
    ["Ilford HP5", 0.8, 0.8, 0.8, 20, 20, 20],
    ["VHS Tracker", 0.85, 1.3, 1.0, -5, 20, 5],
    ["Beta Glitch", 1.1, 0.8, 1.4, 10, -15, 30],
    ["Agfa Vista", 1.15, 0.95, 0.9, 10, -5, -10],
    ["Sepia Dream", 1.2, 1.0, 0.6, 20, 10, -20],
    ["Polaroid 600", 0.95, 1.1, 1.2, -10, 15, 25],
    ["Lomo LC-A", 1.3, 1.1, 0.8, 25, 15, -20],
    ["Super 8 Gold", 1.2, 1.1, 0.7, 30, 20, -10],
    ["Dusty Lens", 0.9, 0.9, 0.85, 15, 15, 10],
    ["Light Leak", 1.4, 1.0, 0.9, 40, 5, -5],
  ];

  const filters = filtersData.map(d => ({
    name: d[0], rm: d[1], gm: d[2], bm: d[3], ra: d[4], ga: d[5], ba: d[6]
  }));

  const filterBar = document.getElementById('filterBar');
  let activeFilter = filters[0];

  filters.forEach((f, index) => {
    const el = document.createElement('div');
    el.className = `filter-card ${index === 0 ? 'active' : ''}`;
    el.innerHTML = `<div class="filter-thumb" style="background: rgb(${100*f.rm}, ${100*f.gm}, ${100*f.bm})"></div><span>${f.name}</span>`;
    el.onclick = () => {
      document.querySelectorAll('.filter-card').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      activeFilter = f;
    };
    filterBar.appendChild(el);
  });

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const placeholder = document.getElementById('placeholderText');
  
  let isCameraActive = false;
  let useFrontCamera = false;
  let isLandscape = false;
  let renderId;
  let userZoom = 1.0;
  let loadedImage = null; // Yüklenen durağan fotoğraf
  let isFlashOn = false;
  let lastCapturedDataUrl = null;

  document.getElementById('zoomSlider').addEventListener('input', (e) => {
    userZoom = parseFloat(e.target.value);
    document.getElementById('zoomValue').innerText = userZoom.toFixed(1) + 'x';
  });

  document.getElementById('aspectBtn').addEventListener('click', (e) => {
    isLandscape = !isLandscape;
    e.target.innerText = isLandscape ? "3:4 Mode" : "4:3 Mode";
    setupCanvas();
  });

  document.getElementById('flashBtn').addEventListener('click', (e) => {
    isFlashOn = !isFlashOn;
    e.target.innerText = isFlashOn ? "Flaş: Açık" : "Flaş: Kapalı";
    if (isFlashOn) e.target.classList.add('active-mode');
    else e.target.classList.remove('active-mode');
  });

  // Yüksek Çözünürlüklü Kamera Başlatma (Full HD / 4K Talebi)
  async function startCamera() {
    try {
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }
      loadedImage = null;
      
      const constraints = {
        video: {
          facingMode: useFrontCamera ? 'user' : 'environment',
          width: { ideal: 3840, max: 4096 },
          height: { ideal: 2160, max: 2160 }
        },
        audio: false
      };

      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      video.play().catch(()=>{});
      isCameraActive = true;
      setupCanvas();
    } catch (e) {
      alert("Yüksek çözünürlüklü kameraya erişilemedi: " + e.message);
    }
  }

  document.getElementById('camBtn').addEventListener('click', startCamera);
  document.getElementById('flipBtn').addEventListener('click', () => {
    useFrontCamera = !useFrontCamera;
    if (isCameraActive) startCamera();
  });

  // Harici Fotoğraf Yükleme
  document.getElementById('fileInput').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    if (video.srcObject) {
      video.srcObject.getTracks().forEach(track => track.stop());
      video.srcObject = null;
    }
    isCameraActive = false;
    
    const img = new Image();
    img.onload = () => {
      loadedImage = img;
      setupCanvas();
    };
    img.src = URL.createObjectURL(file);
  };

  function setupCanvas() {
    placeholder.style.display = 'none';
    canvas.style.display = 'block';
    
    const applySize = () => {
      let sourceW = loadedImage ? loadedImage.width : (video.videoWidth || 1920);
      let sourceH = loadedImage ? loadedImage.height : (video.videoHeight || 1080);
      
      let max = Math.max(sourceW, sourceH);
      let min = Math.min(sourceW, sourceH);
      
      canvas.width = isLandscape ? max : min;
      canvas.height = isLandscape ? min : max;
      
      if (renderId) cancelAnimationFrame(renderId);
      renderLoop();
    };

    if (loadedImage) {
      applySize();
    } else {
      if (video.readyState >= 1) applySize();
      video.onloadedmetadata = applySize;
    }
  }

  function renderLoop() {
    const source = loadedImage || video;
    const sw = loadedImage ? loadedImage.width : (video.videoWidth || canvas.width);
    const sh = loadedImage ? loadedImage.height : (video.videoHeight || canvas.height);

    if (sw > 0 && sh > 0) {
      const cw = canvas.width;
      const ch = canvas.height;
      const vr = sw / sh;
      const cr = cw / ch;
      
      let dw = cw, dh = ch, dx = 0, dy = 0;
      if (vr > cr) {
        dw = ch * vr;
        dx = (cw - dw) / 2;
      } else {
        dh = cw / vr;
        dy = (ch - dh) / 2;
      }

      const totalZoom = userZoom;
      const zw = dw * totalZoom;
      const zh = dh * totalZoom;
      const zx = dx - (zw - dw) / 2;
      const zy = dy - (zh - dh) / 2;
      
      ctx.drawImage(source, 0, 0, sw, sh, zx, zy, zw, zh);
      processPixels();
    }
    
    // Eğer video/kamera aktifse döngüyü sürdür
    if (!loadedImage) {
      renderId = requestAnimationFrame(renderLoop);
    }
  }

  function processPixels() {
    const w = canvas.width;
    const h = canvas.height;
    if (w === 0 || h === 0) return;
    
    const imgData = ctx.getImageData(0, 0, w, h);
    const d = imgData.data;
    const noiseLvl = document.getElementById('setNoise').value / 100 * 40;
    const scratchLvl = document.getElementById('setScratch').value / 100;

    const { rm, gm, bm, ra, ga, ba } = activeFilter;

    for (let i = 0; i < d.length; i += 4) {
      let r = d[i], g = d[i+1], b = d[i+2];

      r = (r * rm) + ra;
      g = (g * gm) + ga;
      b = (b * bm) + ba;

      if (noiseLvl > 0) {
        const noise = (Math.random() - 0.5) * noiseLvl;
        r += noise; g += noise; b += noise;
      }

      d[i] = Math.max(0, Math.min(255, r));
      d[i+1] = Math.max(0, Math.min(255, g));
      d[i+2] = Math.max(0, Math.min(255, b));
    }
    
    ctx.putImageData(imgData, 0, 0);

    // Nostaljik Çizikler
    if (scratchLvl > 0) {
      if (Math.random() < scratchLvl * 0.3) {
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillRect(Math.random() * w, 0, 1 + Math.random() * 3, h);
      }
      if (Math.random() < scratchLvl * 0.15) {
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.fillRect(Math.random() * w, 0, 2, h);
      }
    }
    
    // Vintage Karartma (Vignette)
    const grad = ctx.createRadialGradient(w/2, h/2, Math.min(w,h)*0.3, w/2, h/2, Math.max(w,h)*0.8);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(5,10,7,0.55)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
  }

  // Fotoğraf Çekimi & İndirme
  function takePhoto() {
    if (!canvas.width || (!isCameraActive && !loadedImage)) return;

    // Flaş Efekti
    const flash = document.getElementById('flashOverlay');
    flash.style.opacity = isFlashOn ? '0.9' : '0.4';
    setTimeout(() => { flash.style.opacity = '0'; }, 150);

    const scale = parseFloat(document.getElementById('setResolution').value) || 1.0;
    
    // Orijinal çözünürlük için geçici canvas
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = canvas.width * scale;
    tempCanvas.height = canvas.height * scale;
    const tempCtx = tempCanvas.getContext('2d');
    
    tempCtx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
    
    lastCapturedDataUrl = tempCanvas.toDataURL('image/jpeg', 0.95);
    
    // Sol alttaki galeri simgesini güncelle
    const galBtn = document.getElementById('galleryBtn');
    galBtn.style.backgroundImage = `url(${lastCapturedDataUrl})`;
    
    // Otomatik İndirme / Paylaşma
    const a = document.createElement('a');
    a.href = lastCapturedDataUrl;
    a.download = `Super8_Photo_${Date.now()}.jpg`;
    a.click();
  }

  function toggleSettings() {
    const modal = document.getElementById('settingsModal');
    modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
  }

  function openGallery() {
    if (!lastCapturedDataUrl) return;
    document.getElementById('lastPhotoImg').src = lastCapturedDataUrl;
    document.getElementById('downloadLink').href = lastCapturedDataUrl;
    document.getElementById('downloadLink').download = `Super8_Photo_${Date.now()}.jpg`;
    document.getElementById('galleryModal').style.display = 'flex';
  }

  function closeGallery() {
    document.getElementById('galleryModal').style.display = 'none';
  }
</script>
</body>
</html>
