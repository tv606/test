<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gizli Çet">
<link rel="manifest" href="manifest.json">
<title>Gizli Çet</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: #0b0f19; color: #e2e8f0; height: 100vh; height: -webkit-fill-available; display: flex; flex-direction: column; padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom) 12px; overflow: hidden; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #1e293b; }
  h1 { font-size: 1.1rem; color: #38bdf8; font-weight: 700; }
  .badge { background: #1e293b; color: #94a3b8; font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; }
  .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 10px; margin: 8px 0; }
  .pin-box { display: flex; align-items: center; justify-content: space-between; background: #1f2937; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; }
  .pin-code { font-size: 1.1rem; font-weight: bold; color: #38bdf8; letter-spacing: 2px; }
  .conn-box { display: flex; gap: 6px; margin-top: 8px; }
  input { background: #1f2937; border: 1px solid #374151; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; outline: none; flex: 1; }
  .pin-input { text-align: center; letter-spacing: 3px; font-weight: bold; }
  button { background: #2563eb; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; }
  #chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 8px 0; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 0.85rem; line-height: 1.3; word-break: break-word; }
  .me { background: #2563eb; align-self: flex-end; border-bottom-right-radius: 2px; }
  .peer { background: #1f2937; align-self: flex-start; border-bottom-left-radius: 2px; }
  .input-area { display: flex; gap: 6px; padding-bottom: 8px; }
</style>
</head>
<body>
<header>
  <h1>Gizli Çet</h1>
  <span class="badge" id="status">Çevrimdışı</span>
</header>

<div class="card">
  <div class="pin-box">
    <span>PIN Kodun: <b id="my-pin" class="pin-code">----</b></span>
    <button onclick="kopyala()" style="padding:4px 8px; font-size:0.75rem;">Kopyala</button>
  </div>
  <div class="conn-box">
    <input type="text" id="peer-pin" class="pin-input" placeholder="4 Haneli PIN" maxlength="4">
    <button onclick="baglan()">Bağlan</button>
  </div>
</div>

<div id="chat"></div>

<div class="input-area">
  <input type="text" id="msg" placeholder="Mesaj yaz...">
  <button onclick="gonder()">Gönder</button>
</div>

<script>
  const myPin = Math.floor(1000 + Math.random() * 9000).toString();
  document.getElementById('my-pin').innerText = myPin;

  const peer = new Peer('gizlicet-' + myPin);
  let conn;

  peer.on('open', () => { durum('Hazır'); });
  peer.on('connection', c => { 
    conn = c; 
    durum('Bağlandı'); 
    dinle(); 
  });

  function baglan() {
    const pin = document.getElementById('peer-pin').value;
    if (!pin || pin.length !== 4) return;
    conn = peer.connect('gizlicet-' + pin);
    durum('Bağlanıyor...');
    dinle();
  }

  function dinle() {
    conn.on('open', () => durum('Bağlandı'));
    conn.on('data', data => ekle(data, 'peer'));
    conn.on('close', () => durum('Koptu'));
  }

  function gonder() {
    const el = document.getElementById('msg');
    if (!el.value || !conn) return;
    conn.send(el.value);
    ekle(el.value, 'me');
    el.value = '';
  }

  function ekle(msg, cls) {
    const d = document.createElement('div');
    d.className = `msg ${cls}`;
    d.innerText = msg;
    const c = document.getElementById('chat');
    c.appendChild(d);
    c.scrollTop = c.scrollHeight;
  }

  function durum(txt) { document.getElementById('status').innerText = txt; }
  function kopyala() { navigator.clipboard.writeText(myPin); }
</script>
</body>
</html>
