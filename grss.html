<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HaberTR - Ultra Native</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #09090b;
            --surface: #18181b;
            --primary: #60a5fa; 
            --text: #fafafa;
            --text-muted: #a1a1aa;
            --border: #27272a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.6; overflow-x: hidden; }

        /* Ortak Header ve Yapı */
        header { padding: 1.2rem 1.5rem; position: sticky; top: 0; background: rgba(9, 9, 11, 0.95); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border); z-index: 10; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 1.3rem; letter-spacing: -1px; }
        .logo span { color: var(--primary); }

        /* Ana Liste */
        .news-list { padding: 1rem; max-width: 650px; margin: 0 auto; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 1.25rem; margin-bottom: 1rem; cursor: pointer; transition: all 0.2s; }
        .card:active { transform: scale(0.97); }
        .card-title { font-size: 1.1rem; font-weight: 600; color: #fff; margin-bottom: 0.8rem; }
        .source-pill { background: #27272a; color: var(--primary); padding: 4px 10px; border-radius: 30px; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; }

        /* Katmanlı Görünüm Sistemi (Layering) */
        .view-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 100; transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto; }
        .view-layer.open { transform: translateX(0); }

        .layer-header { padding: 1rem; display: flex; align-items: center; border-bottom: 1px solid var(--border); sticky; top: 0; background: var(--bg); z-index: 2; }
        .back-btn { background: var(--surface); border: none; color: var(--primary); width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-right: 1rem; }

        /* Detay Sayfası ve Renkli Bloklar */
        .detail-body { padding: 2rem 1.2rem; max-width: 600px; margin: 0 auto; }
        .content-area a { 
            display: block; background: #1c1c21; padding: 16px; border-radius: 12px; 
            color: #eee !important; text-decoration: none !important; margin: 12px 0; 
            pointer-events: none; position: relative; font-style: italic; border-left: 5px solid;
        }

.quote-block {
            flex: 1;
            padding: 20px;
            border-radius: 15px;
            color: #000; /* Yazılar koyu */
            font-weight: 600;
            font-style: italic;
            position: relative;
            margin-bottom: 8px;
        }

        .source-name { color: #fff; font-size: 0.85rem; padding-left: 30px; margin-bottom: 20px; display: block; }

        /* Renk Paleti (Görseldeki sırayla) */
        .block-0 { background-color: #00ced1; } /* Turkuaz */
        .block-1 { background-color: #ffcc4d; } /* Sarı */
        .block-2 { background-color: #ff4d4d; } /* Kırmızı */
        .block-3 { background-color: #fca581; } /* Somon */
        .block-4 { background-color: #9370db; } /* Mor */


        /* Blok Renk Döngüsü */
        .content-area a:nth-child(5n+1) { border-color: #60a5fa; background: rgba(96, 165, 250, 0.05); } /* Mavi */
        .content-area a:nth-child(5n+2) { border-color: #fbbf24; background: rgba(251, 191, 36, 0.05); }  /* Sarı */
        .content-area a:nth-child(5n+3) { border-color: #f87171; background: rgba(248, 113, 113, 0.05); } /* Kırmızı */
        .content-area a:nth-child(5n+4) { border-color: #34d399; background: rgba(52, 211, 153, 0.05); } /* Yeşil */
        .content-area a:nth-child(5n+5) { border-color: #a78bfa; background: rgba(167, 139, 250, 0.05); } /* Mor */

        /* 3. Sayfa (Kaynaklar) Listesi */
        .source-item { 
            background: var(--surface); padding: 1.2rem; border-radius: 15px; margin-bottom: 10px; 
            display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: #fff;
            border: 1px solid var(--border);
        }
        .source-item i { color: var(--primary); }

        .action-btn { 
            display: flex; align-items: center; justify-content: center; gap: 10px; 
            background: var(--primary); color: #000; padding: 1.1rem; border-radius: 14px; 
            text-decoration: none; margin-top: 2rem; font-weight: 800; cursor: pointer;
        }

        .shimmer { text-align: center; padding: 5rem 2rem; color: var(--primary); }
    </style>
</head>
<body>

<div class="app-container">
    <header><div class="logo">HABER<span>TR</span></div><i class="fas fa-bars"></i></header>
    <div id="news-list" class="news-list">
        <div class="shimmer"><i class="fas fa-circle-notch fa-spin fa-2x"></i></div>
    </div>
</div>

<div id="detail-view" class="view-layer">
    <div class="layer-header">
        <div class="back-btn" onclick="closeLayer('detail-view')"><i class="fas fa-chevron-left"></i></div>
        <span style="font-weight: 600;">Haber Özeti</span>
    </div>
    <div class="detail-body">
        <h1 id="det-title" style="margin-bottom:1.5rem"></h1>
        <div id="det-content" class="content-area"></div>
        <div class="action-btn" onclick="openSources()">Haberin Tamamını Oku</div>
    </div>
</div>

<div id="source-view" class="view-layer" style="z-index: 101;">
    <div class="layer-header">
        <div class="back-btn" onclick="closeLayer('source-view')"><i class="fas fa-chevron-left"></i></div>
        <span style="font-weight: 600;">Haber Kaynakları</span>
    </div>
    <div class="detail-body">
        <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Aşağıdaki kaynaklardan birini seçerek haberin detayına gidebilirsiniz:</p>
        <div id="source-links-list"></div>
    </div>
</div>

<script>
    const RSS_URL = "https://news.google.com/rss?hl=tr&gl=TR&ceid=TR:tr";
    const PROXY_URL = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(RSS_URL);
    let currentItem = null;

    async function loadNews() {
        try {
            const res = await fetch(PROXY_URL);
            const data = await res.json();
            if (data.status === 'ok') renderList(data.items.slice(0, 20));
        } catch (err) { console.error(err); }
    }

    function renderList(items) {
        const list = document.getElementById('news-list');
        list.innerHTML = '';
        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openDetail(item);
            card.innerHTML = `
                <div class="card-title">${item.title.split(' - ')[0]}</div>
                <div class="source-pill">${item.author || item.title.split(' - ').pop()}</div>
            `;
            list.appendChild(card);
        });
    }

    function openDetail(item) {
        currentItem = item;
        document.getElementById('det-title').innerText = item.title.split(' - ')[0];
        
        let tempDiv = document.createElement('div');
        tempDiv.innerHTML = item.description;
        tempDiv.querySelectorAll('a').forEach(a => a.removeAttribute('href'));

        document.getElementById('det-content').innerHTML = tempDiv.innerHTML;
        document.getElementById('detail-view').classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function openSources() {
        const listContainer = document.getElementById('source-links-list');
        listContainer.innerHTML = '';
        
        // Google News description içindeki gerçek linkleri ayıklayalım
        let tempDiv = document.createElement('div');
        tempDiv.innerHTML = currentItem.description;
        const links = tempDiv.querySelectorAll('a');

        links.forEach(link => {
            const href = link.getAttribute('href');
            const text = link.innerText.trim();
            if(text.length > 2) {
                const item = document.createElement('a');
                item.className = 'source-item';
                item.href = href;
                item.target = '_blank';
                item.innerHTML = `<span>${text}</span> <i class="fas fa-external-link-alt"></i>`;
                listContainer.appendChild(item);
            }
        });

        document.getElementById('source-view').classList.add('open');
    }

    function closeLayer(id) {
        document.getElementById(id).classList.remove('open');
        if(id === 'detail-view') document.body.style.overflow = 'auto';
    }

    loadNews();
</script>

</body>
</html>
