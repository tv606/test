<style>
  :root {
    --bg: #05070a;
    --surface: #101218;
    --accent: #ff3e3e;
    --text: #ffffff;
    --nav-height: 85px;
    --header-height: 65px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html {scrollbar-color: #1a1818 #2e2e2e;}
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    position: fixed;
    width: 100%;
  }

  .app-header {
    height: var(--header-height);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    position: absolute;
    top: 0; width: 100%; z-index: 1000;
  }
  .app-logo { font-weight: 800; font-size: 0.85rem; color: var(--accent); text-transform: uppercase; letter-spacing: 3px; }
  .active-ch-display { font-weight: 600; font-size: 0.9rem; color: #fff; margin-top: 2px; }

  .player-section {
    position: absolute;
    top: var(--header-height);
    width: 100%;
    z-index: 900;
    background: #000;
  }
  .video-box { width: 100%; aspect-ratio: 16 / 9; position: relative; background: #000; }
  video { width: 100%; height: 100%; background: #000; }
  
  .swipe-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 950;
    background: transparent;
  }

  .vid-btn {
    position: absolute; background: rgba(0,0,0,0.6); color: white; border: none;
    padding: 10px; border-radius: 10px; backdrop-filter: blur(5px); z-index: 1001;
  }
  .fs-btn { bottom: 10px; right: 10px; }
  .ss-btn { bottom: 10px; left: 10px; }

  .channel-grid {
    position: absolute;
    top: calc(var(--header-height) + (100vw * 9 / 16)); 
    bottom: var(--nav-height);
    width: 100%;
    overflow-y: scroll;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    padding: 15px;
    background: var(--bg);
    z-index: 800;
  }

  .mobile-ch-card {
    display: flex; align-items: center; padding: 15px;
    background: var(--surface); border-radius: 14px; margin-bottom: 10px;
    border: 1px solid rgba(255,255,255,0.05);
    transition: all 0.3s ease;
  }
  .mobile-ch-card.active { border-color: var(--accent); background: rgba(255,62,62,0.15); transform: scale(1.02); }
  .mobile-ch-card h4 { font-size: 0.9rem; font-weight: 600; color: #e2e8f0; pointer-events: none; }
  .drag-handle { margin-right: 15px; opacity: 0.3; padding: 5px; cursor: grab; }

  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: var(--nav-height);
    background: #0f1116;
    display: flex; justify-content: space-around; align-items: center;
    border-top: 1px solid rgba(255,255,255,0.1);
    z-index: 1000;
    padding-bottom: env(safe-area-inset-bottom);

  }

  .nav-item { color: #64748b; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; height: 100%; justify-content: center; transition: 0.2s; }
  .nav-item.active { color: var(--accent); }
  
  .is-zapping { color: #00f2ff !important; animation: zap-pulse 1s infinite; }
  @keyframes zap-pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.1); } 100% { opacity: 1; transform: scale(1); } }

  .is-recording { color: var(--accent) !important; animation: blink 1s infinite; }
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
</style>

let hls = null, currentIndex = -1, isRecording = false, mediaRecorder, recordedChunks = [], dragItem = null;
let zapInterval = null, isZapping = false;

// --- SWIPE LOGIC ---
let touchStartX = 0;
const swipeOverlay = document.getElementById('swipeOverlay');

swipeOverlay.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, {passive: true});
swipeOverlay.addEventListener('touchend', (e) => {
    let diff = touchStartX - e.changedTouches[0].screenX;
    if (Math.abs(diff) > 60) {
        if (isZapping) toggleZapping(); // Swipe yapılırsa zapping durur
        changeChannel(diff > 0 ? 1 : -1);
    }
}, {passive: true});

function changeChannel(direction) {
    if (channels.length === 0) return;
    let nextIndex = (currentIndex + direction + channels.length) % channels.length;
    playStream(nextIndex);
}

// --- ZAPPING MODU ---
function toggleZapping() {
    const btn = document.getElementById('zapBtn');
    if (!isZapping) {
        isZapping = true;
        btn.classList.add('is-zapping');
        document.getElementById('zapStatus').textContent = "STOP ZAP";
        zapInterval = setInterval(() => {
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * channels.length);
            } while (randomIndex === currentIndex && channels.length > 1);
            playStream(randomIndex);
        }, 5500);
    } else {
        isZapping = false;
        btn.classList.remove('is-zapping');
        document.getElementById('zapStatus').textContent = "ZAP";
        clearInterval(zapInterval);
    }
}

// --- RENDER & AUTO FOCUS ---
function renderChannels() {
  const container = document.getElementById('channelList');
  container.innerHTML = '';
  channels.forEach((ch, i) => {
    const card = document.createElement('div');
    card.id = `ch-card-${i}`;
    card.className = `mobile-ch-card ${i === currentIndex ? 'active' : ''}`;
    card.draggable = true;
    card.innerHTML = `<div class="drag-handle">☰</div><h4>${ch.name}</h4>`;
    card.onclick = () => { if (!card.classList.contains('dragging')) playStream(i); };

    // Drag Drop Logic (Korundu)
    card.addEventListener('dragstart', () => { dragItem = card; setTimeout(() => card.classList.add('dragging'), 0); });
    card.addEventListener('dragend', () => { card.classList.remove('dragging'); saveNewOrder(); });
    card.addEventListener('dragover', e => {
      e.preventDefault();
      const afterElement = getDragAfterElement(container, e.clientY);
      if (afterElement == null) container.appendChild(dragItem);
      else container.insertBefore(dragItem, afterElement);
    });
    container.appendChild(card);
  });

  // Auto Scroll Focus
  if (currentIndex !== -1) {
      const activeCard = document.getElementById(`ch-card-${currentIndex}`);
      if (activeCard) {
          activeCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
  }
}

function getDragAfterElement(container, y) {
  const elements = [...container.querySelectorAll('.mobile-ch-card:not(.dragging)')];
  return elements.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closest.offset) return { offset: offset, element: child };
    else return closest;
  }, { offset: Number.NEGATIVE_INFINITY }).element;
}

function saveNewOrder() {
  const newOrder = [];
  document.querySelectorAll('.mobile-ch-card h4').forEach(h4 => {
    const ch = channels.find(c => c.name === h4.innerText);
    if(ch) newOrder.push(ch);
  });
  channels = newOrder;
  const activeH4 = document.querySelector('.mobile-ch-card.active h4');
  if(activeH4) currentIndex = channels.findIndex(c => c.name === activeH4.innerText);
}

function playStream(i) {
  currentIndex = i;
  const video = document.getElementById('videoPlayer');
  const ch = channels[i];
  document.getElementById('activeChName').textContent = ch.name;
  
  renderChannels();
  if (hls) hls.destroy();
  if (Hls.isSupported()) {
    hls = new Hls(); hls.loadSource(ch.url); hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = ch.url; video.play().catch(() => {});
  }
}

// Ekran Görüntüsü ve Kayıt Özellikleri (Korundu)
async function takeScreenshot() {
  const v = document.getElementById('videoPlayer');
  const c = document.getElementById('ssCanvas');
  
  c.width = v.videoWidth; 
  c.height = v.videoHeight;
  
  try {
    const ctx = c.getContext('2d');
    ctx.drawImage(v, 0, 0, c.width, c.height);
    
    // 1. Canvas'ı Blob'a çeviriyoruz (Paylaşım için dosya lazım)
    c.toBlob(async (blob) => {
      const file = new File([blob], `TELE_X_Shot_${Date.now()}.png`, { type: "image/png" });

      // 2. Tarayıcı "Paylaş" özelliğini destekliyor mu kontrol et
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: 'TELE X Ekran Görüntüsü',
            text: 'Ekran görüntüsü galeriye kaydedilmeye hazır.'
          });
        } catch (shareError) {
          // Kullanıcı paylaşımı iptal ederse buraya düşer, hata vermemize gerek yok
          console.log("Paylaşım iptal edildi.");
        }
      } else {
        // Masaüstü veya desteklemeyen tarayıcılar için eski yöntem (Fallback)
        const link = document.createElement('a');
        link.download = file.name;
        link.href = URL.createObjectURL(blob);
        link.click();
      }
    }, 'image/png');

  } catch(e) { 
    alert("Güvenlik: Stream içeriği paylaşılamıyor."); 
    console.error(e);
  }
}

function toggleRecording() {
  const v = document.getElementById('videoPlayer');
  const btn = document.getElementById('recToggle');
  if (!isRecording) {
    try {
      recordedChunks = [];
      const stream = v.captureStream ? v.captureStream() : v.mozCaptureStream();
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, {type: 'video/webm'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download=`TELE_X_Rec_${Date.now()}.webm`; a.click();
      };
      mediaRecorder.start(); 
      isRecording = true; btn.classList.add('is-recording');
      document.getElementById('recStatus').textContent = "STOP";
    } catch(e) { alert("Recording not supported."); }
  } else {
    mediaRecorder.stop(); isRecording = false; btn.classList.remove('is-recording');
    document.getElementById('recStatus').textContent = "RECORD";
  }
}

function toggleFullScreen() {
  const v = document.getElementById('videoPlayer');
  if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
  else if (v.requestFullscreen) v.requestFullscreen();
}

renderChannels();
</script>
