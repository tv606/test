<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HaberTR - Ultra Native</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #000000; /* Görseldeki gibi tam siyah */
            --surface: #121212;
            --primary: #60a5fa; 
            --text: #ffffff;
            --text-muted: #a1a1aa;
            --border: #27272a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.6; overflow-x: hidden; }

        header { padding: 1.2rem 1.5rem; position: sticky; top: 0; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border); z-index: 10; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 1.3rem; letter-spacing: -1px; }
        .logo span { color: var(--primary); }

        .news-list { padding: 1rem; max-width: 650px; margin: 0 auto; }
        .card { background: #18181b; border: 1px solid var(--border); border-radius: 20px; padding: 1.25rem; margin-bottom: 1rem; cursor: pointer; }
        .card-title { font-size: 1.1rem; font-weight: 600; color: #fff; }

        /* Katman Sistemi */
        .view-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 100; transform: translateX(100%); transition: transform 0.3s ease-out; overflow-y: auto; }
        .view-layer.open { transform: translateX(0); }
        .layer-header { padding: 1rem; display: flex; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 2; }
        .back-btn { background: #18181b; border: none; color: #fff; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-right: 1rem; }

        /* DETAY SAYFASI ÖZEL BLOKLAR (Görseldeki Tasarım) */
        .detail-body { padding: 1.5rem; max-width: 600px; margin: 0 auto; }
        .detail-body h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 2rem; color: #fff; }

        .news-item-container { margin-bottom: 25px; display: flex; align-items: flex-start; gap: 10px; }
        .item-number { color: #fff; font-weight: 600; font-size: 0.9rem; padding-top: 20px; min-width: 20px; }
        
        .quote-block {
            flex: 1;
            padding: 20px;
            border-radius: 15px;
            color: #000; /* Yazılar koyu */
            font-weight: 600;
            font-style: italic;
            position: relative;
            margin-bottom: 8px;
        }

        .source-name { color: #fff; font-size: 0.85rem; padding-left: 30px; margin-bottom: 20px; display: block; }

        /* Renk Paleti (Görseldeki sırayla) */
        .block-0 { background-color: #00ced1; } /* Turkuaz */
        .block-1 { background-color: #ffcc4d; } /* Sarı */
        .block-2 { background-color: #ff4d4d; } /* Kırmızı */
        .block-3 { background-color: #fca581; } /* Somon */
        .block-4 { background-color: #9370db; } /* Mor */

        /* Alt Buton */
        .action-btn { 
            display: block; width: 100%; background: #60a5fa; color: #000; 
            padding: 1.2rem; border-radius: 15px; text-align: center;
            text-decoration: none; margin-top: 2rem; font-weight: 800; cursor: pointer;
        }

        /* 3. Sayfa Kaynak Listesi */
        .source-link-item { 
            background: #18181b; padding: 1.2rem; border-radius: 15px; margin-bottom: 10px; 
            display: flex; justify-content: space-between; text-decoration: none; color: #fff; border: 1px solid var(--border);
        }
    </style>
</head>
<body>

<div class="app-container">
    <header><div class="logo">HABER<span>TR</span></div><i class="fas fa-globe"></i></header>
    <div id="news-list" class="news-list"></div>
</div>

<div id="detail-view" class="view-layer">
    <div class="layer-header">
        <div class="back-btn" onclick="closeLayer('detail-view')"><i class="fas fa-chevron-left"></i></div>
        <span>Detaylar</span>
    </div>
    <div class="detail-body">
        <h1 id="det-title"></h1>
        <div id="det-content"></div> <div class="action-btn" onclick="openSources()">Haberin Tamamını Oku</div>
    </div>
</div>

<div id="source-view" class="view-layer" style="z-index: 110;">
    <div class="layer-header">
        <div class="back-btn" onclick="closeLayer('source-view')"><i class="fas fa-chevron-left"></i></div>
        <span>Kaynaklar</span>
    </div>
    <div class="detail-body">
        <div id="source-links-list"></div>
    </div>
</div>

<script>
    const RSS_URL = "https://news.google.com/rss?hl=tr&gl=TR&ceid=TR:tr";
    const PROXY_URL = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(RSS_URL);
    let currentItem = null;

    async function loadNews() {
    try {
        const res = await fetch(PROXY_URL);
        const data = await res.json();
        if (data.status === 'ok') {
            // Haberleri önce al, sonra karıştır, sonra ilk 20 tanesini göster
            const shuffledItems = data.items.sort(() => Math.random() - 0.5);
            renderList(shuffledItems.slice(0, 20));
        }
    } catch (err) { console.error(err); }
}

    function renderList(items) {
        const list = document.getElementById('news-list');
        list.innerHTML = '';
        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openDetail(item);
            card.innerHTML = `
                <div class="card-title">${item.title.split(' - ')[0]}</div>
                <div class="source-pill">${item.author || item.title.split(' - ').pop()}</div>
            `;
            list.appendChild(card);
        });
    }

function shuffle(array) {
  return array.sort(() => Math.random() - 0.5);
}

    function openDetail(item) {
        currentItem = item;
        document.getElementById('det-title').innerText = item.title.split(' - ')[0];
        const contentDiv = document.getElementById('det-content');
        contentDiv.innerHTML = '';

        // Google News HTML'ini parçala
        let temp = document.createElement('div');
        temp.innerHTML = item.description;
        const links = temp.querySelectorAll('a');

        links.forEach((link, index) => {
            const text = link.innerText.trim();
            if (text.length < 5) return;

            // Görseldeki yapıyı kur
            const container = document.createElement('div');
            container.innerHTML = `
                <div class="news-item-container">
                    <div class="item-number">${index + 1}.</div>
                    <div class="quote-block block-${index % 5}">${text}</div>
                </div>
                <span class="source-name">${item.author || "Haber Kaynağı"}</span>
            `;
            contentDiv.appendChild(container);
        });

        document.getElementById('detail-view').classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function openSources() {
        const list = document.getElementById('source-links-list');
        list.innerHTML = '<p style="color:#aaa; margin-bottom:20px">Okumak istediğiniz kaynağa tıklayın:</p>';
        
        let temp = document.createElement('div');
        temp.innerHTML = currentItem.description;
        temp.querySelectorAll('a').forEach(link => {
            const a = document.createElement('a');
            a.className = 'source-link-item';
            a.href = link.href;
            a.target = '_blank';
            a.innerHTML = `<span>${link.innerText}</span> <i class="fas fa-external-link-alt"></i>`;
            list.appendChild(a);
        });

        document.getElementById('source-view').classList.add('open');
    }

    function closeLayer(id) {
        document.getElementById(id).classList.remove('open');
        if(id === 'detail-view') document.body.style.overflow = 'auto';
    }

    loadNews();
</script>

</body>
</html>
