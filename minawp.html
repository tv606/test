<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Music Player with Playlist</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@700&display=swap');

        body {
            background-color: #2c2c2c;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding-top: 0px; /* Sayfanın en üstünde durur */
            font-family: 'Courier Prime', monospace;
        }

        /* Ana Player Kasası */
        .minawp-container {
            width: 380px;
            background: #1c1c1f;
            border: 3px solid #3a3a3a;
            border-right-color: #111;
            border-bottom-color: #111;
            padding: 10px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.7);
            user-select: none;
        }

        /* Üst Başlık Barı */
        .minawp-titlebar {
            background: linear-gradient(90deg, #000080, #008080);
            color: #fff;
            font-size: 11px;
            padding: 3px 5px;
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: 1px;
            border: 1px solid #555;
        }

        /* Ekran Bölümü */
        .minawp-display {
            background-color: #000;
            border: 2px inset #555;
            padding: 8px;
            margin-bottom: 10px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 5px;
        }

        .track-info {
            color: #00ff00;
            font-size: 12px;
            text-shadow: 0 0 3px #00ff00;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .time-display {
            color: #00ff00;
            font-size: 18px;
            text-align: right;
            text-shadow: 0 0 5px #00ff00;
        }

        /* Kontroller */
        .controls-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            color: #888;
            font-size: 10px;
        }

        .slider-container span {
            width: 40px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: #222;
            height: 6px;
            border: 1px solid #444;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 12px;
            background: #555;
            border: 2px solid #888;
            border-bottom-color: #333;
            border-right-color: #333;
            cursor: pointer;
        }

        /* Butonlar */
        .minawp-buttons {
            display: flex;
            justify-content: space-between;
            background: #222;
            padding: 5px;
            border: 1px solid #444;
        }

        .minawp-btn {
            background: linear-gradient(#444, #222);
            border: 1px solid #666;
            border-right-color: #111;
            border-bottom-color: #111;
            color: #aaa;
            font-weight: bold;
            font-size: 10px;
            padding: 5px 10px;
            cursor: pointer;
            min-width: 45px;
            text-align: center;
        }

        .minawp-btn:active {
            border: 1px solid #111;
            border-right-color: #666;
            border-bottom-color: #666;
            background: linear-gradient(#222, #444);
            color: #fff;
        }

        /* Dosya Seçme Alanı */
        .file-input-label {
            display: block;
            text-align: center;
            background: #252528;
            color: #ff9900;
            font-size: 10px;
            padding: 5px;
            margin-top: 8px;
            cursor: pointer;
            border: 1px solid #444;
        }
        .file-input-label:hover {
            background: #333;
        }
        #file-upload {
            display: none;
        }

        /* --- Player PLAYLIST MODÜLÜ --- */
        .minawp-playlist {
            width: 380px;
            background: #1c1c1f;
            border: 3px solid #3a3a3a;
            border-right-color: #111;
            border-bottom-color: #111;
            padding: 10px;
            margin-top: 10px; /* Üst modüle yapışık dursun diye ufak bir boşluk */
            box-shadow: 5px 5px 15px rgba(0,0,0,0.7);
        }

        .playlist-title {
            background: #111;
            color: #00e1ff; /* Klasik minawp playlist turkuazı esintisi */
            font-size: 10px;
            padding: 3px 5px;
            border: 1px solid #333;
            margin-bottom: 5px;
            text-align: center;
        }

        .playlist-content {
            background: #000;
            border: 2px inset #555;
            height: 120px;
            overflow-y: auto;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        /* Özelleştirilmiş Scrollbar (Retro tarza uyması için) */
        .playlist-content::-webkit-scrollbar {
            width: 12px;
            background: #222;
        }
        .playlist-content::-webkit-scrollbar-thumb {
            background: #444;
            border: 1px solid #666;
        }

        .playlist-item {
            color: #00ff00;
            font-size: 11px;
            padding: 4px 8px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-bottom: 1px solid #111;
        }

        .playlist-item:hover {
            background: #222;
        }

        .playlist-item.active {
            background: #000080;
            color: #fff;
            text-shadow: none;
        }
    </style>
</head>
<body>

<div class="minawp-container">
    <div class="minawp-titlebar">MINAWP nEVERLAND</div>

    <div class="minawp-display">
        <div class="track-info" id="track-name">Şarkı listesi boş...</div>
        <div class="time-display" id="time-left">00:00</div>
    </div>

    <div class="controls-row">
        <div class="slider-container">
            <span>SEEK:</span>
            <input type="range" id="seek-slider" value="0" max="100">
        </div>
        <div class="slider-container">
            <span>VOL:</span>
            <input type="range" id="volume-slider" value="80" max="100">
        </div>
    </div>

    <div class="minawp-buttons">
        <button class="minawp-btn" id="btn-prev">|&lt;&lt;</button>
        <button class="minawp-btn" id="btn-play">PLAY</button>
        <button class="minawp-btn" id="btn-pause">PAUSE</button>
        <button class="minawp-btn" id="btn-stop">STOP</button>
        <button class="minawp-btn" id="btn-next">&gt;&gt;|</button>
    </div>

    <label for="file-upload" class="file-input-label">+ ADD FILES (ÇOKLU SEÇEBİLİRSİN)</label>
    <input type="file" id="file-upload" accept="audio/*" multiple>
</div>

<div class="minawp-playlist">
    <div class="playlist-title">minawp PLAYLIST MANGER</div>
    <ul class="playlist-content" id="playlist-ul">
        </ul>
</div>

<audio id="audio-player"></audio>

<script>
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('btn-play');
    const pauseBtn = document.getElementById('btn-pause');
    const stopBtn = document.getElementById('btn-stop');
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');
    const seekSlider = document.getElementById('seek-slider');
    const volumeSlider = document.getElementById('volume-slider');
    const trackName = document.getElementById('track-name');
    const timeLeft = document.getElementById('time-left');
    const fileUpload = document.getElementById('file-upload');
    const playlistUl = document.getElementById('playlist-ul');

    let playlist = [];
    let currentTrackIndex = 0;

    // Çoklu Dosya Seçimi ve Listeye Ekleme
    fileUpload.addEventListener('change', function(e) {
        const files = e.target.files;
        if (files.length > 0) {
            const oldLength = playlist.length;
            
            for (let i = 0; i < files.length; i++) {
                playlist.push({
                    name: files[i].name.replace(/\.[^/.]+$/, ""), // uzantıyı temizle
                    file: files[i],
                    url: URL.createObjectURL(files[i])
                });
            }
            
            renderPlaylist();

            // Eğer ilk defa şarkı yükleniyorsa hemen ilkini yükle/çal
            if (oldLength === 0) {
                loadTrack(0);
                audio.play();
            }
        }
    });

    // Playlist'i HTML'e Döken Fonksiyon
    function renderPlaylist() {
        playlistUl.innerHTML = '';
        playlist.forEach((track, index) => {
            const li = document.createElement('li');
            li.classList.add('playlist-item');
            if (index === currentTrackIndex && playlist.length > 0) {
                li.classList.add('active');
            }
            // minawp tarzı numaralandırma (01. Şarkı Adı)
            li.textContent = `${(index + 1).toString().padStart(2, '0')}. ${track.name}`;
            
            // Listeden şarkıya tıklayınca çalma
            li.addEventListener('click', () => {
                loadTrack(index);
                audio.play();
            });
            
            playlistUl.appendChild(li);
        });
    }

    // Şarkı Yükleme Fonksiyonu
    function loadTrack(index) {
        if (playlist.length === 0) return;
        
        // Sınır kontrolü
        if (index < 0) index = playlist.length - 1;
        if (index >= playlist.length) index = 0;

        currentTrackIndex = index;
        audio.src = playlist[index].url;
        trackName.textContent = playlist[index].name;
        
        // Aktif şarkıyı görsel olarak güncelle
        renderPlaylist();
    }

    // Buton Kontrolleri
    playBtn.addEventListener('click', () => { if(audio.src) audio.play(); });
    pauseBtn.addEventListener('click', () => audio.pause());
    stopBtn.addEventListener('click', () => {
        audio.pause();
        audio.currentTime = 0;
    });

    nextBtn.addEventListener('click', () => {
        if(playlist.length > 0) {
            loadTrack(currentTrackIndex + 1);
            audio.play();
        }
    });

    prevBtn.addEventListener('click', () => {
        if(playlist.length > 0) {
            loadTrack(currentTrackIndex - 1);
            audio.play();
        }
    });

    // Şarkı bitince otomatik sonrakine geçme
    audio.addEventListener('ended', () => {
        if(playlist.length > 0) {
            loadTrack(currentTrackIndex + 1);
            audio.play();
        }
    });

    // Zaman ve İlerleme Güncellemeleri
    audio.addEventListener('timeupdate', () => {
        if (!isNaN(audio.duration)) {
            const progress = (audio.currentTime / audio.duration) * 100;
            seekSlider.value = progress;

            const minutes = Math.floor(audio.currentTime / 60);
            const seconds = Math.floor(audio.currentTime % 60);
            timeLeft.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
    });

    seekSlider.addEventListener('input', () => {
        if (audio.duration) {
            audio.currentTime = audio.duration * (seekSlider.value / 100);
        }
    });

    volumeSlider.addEventListener('input', () => {
        audio.volume = volumeSlider.value / 100;
    });
</script>

</body>
</html>
