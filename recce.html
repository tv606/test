<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Recce Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #08080a; color: #f0f0f3; display: flex; justify-content: center; align-items: center; min-height: 100vh; height: 100vh; overflow: hidden; }
        
        .app-container { width: 100%; max-width: 375px; height: 100vh; max-height: 812px; background: #121215; border-radius: 0; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        @media (min-width: 380px) {
            .app-container { height: 740px; border-radius: 40px; border: 1px solid #2a2a32; box-shadow: 0 25px 60px rgba(0,0,0,0.8); }
        }

        .notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 120px; height: 22px; background: #000; border-bottom-left-radius: 14px; border-bottom-right-radius: 14px; z-index: 100; }

        .header { background: rgba(22, 22, 26, 0.8); backdrop-filter: blur(12px); padding: 26px 16px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 90; flex-shrink: 0; }
        .header-title { font-size: 10px; color: #ff9500; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; text-align: center; margin-bottom: 2px; }
        .location-edit { display: flex; align-items: center; justify-content: center; gap: 6px; }
        .location-input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #fff; font-size: 12px; font-weight: 500; text-align: center; width: 85%; padding: 4px 8px; outline: none; transition: all 0.2s; }
        .location-input:focus { border-color: #ff9500; background: rgba(255,149,0,0.05); }

        .camera-wrapper { width: 100%; background: #000; display: flex; justify-content: center; align-items: center; flex-shrink: 0; position: relative; }
        .camera-section { width: 100%; aspect-ratio: 16 / 9; position: relative; overflow: hidden; background: #050507; }
        #video-feed { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
        #analysis-canvas { display: none; }
        
        .ar-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .grid-guide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }
        .grid-cell { border: 0.5px solid rgba(255, 255, 255, 0.15); }
        .aspect-ratio-badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); color: #ff9500; padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; border: 1px solid rgba(255, 149, 0, 0.3); }
        .reticle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 32px; height: 32px; border: 1px solid rgba(255, 149, 0, 0.8); border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .reticle-cross { width: 50%; height: 1px; background: #ff9500; position: absolute; }
        .reticle-cross.vert { width: 1px; height: 50%; }

        .lens-bar { background: #16161a; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; }
        .lens-title { font-size: 10px; color: #6e6e73; font-weight: 600; text-transform: uppercase; }
        .lens-selector { display: flex; gap: 4px; background: #0c0c0e; padding: 3px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .lens-btn { background: transparent; border: none; color: #8e8e93; padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .lens-btn.active { background: #2c2c2e; color: #ff9500; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }

        .data-panel { background: #121215; padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; border-top: 1px solid rgba(255,255,255,0.05); overflow-y: auto; }
        .card { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .card-full { grid-column: span 2; }
        .card-title { font-size: 9px; font-weight: 700; text-transform: uppercase; color: #6e6e73; letter-spacing: 0.5px; margin-bottom: 4px; }
        .metric { font-size: 16px; font-weight: 700; color: #fff; display: flex; align-items: baseline; }
        .unit { font-size: 10px; color: #8e8e93; margin-left: 3px; font-weight: 400; }
        .metric-sub { font-size: 9.5px; color: #30d158; font-weight: 500; margin-top: 3px; }
        .metric-sub.warning { color: #ff453a; }
        .metric-sub.gold { color: #ffd60a; }

        .slider-container { margin-top: 2px; }
        .slider-label { font-size: 9.5px; color: #8e8e93; display: flex; justify-content: space-between; margin-bottom: 4px;}
        input[type=range] { width: 100%; height: 4px; -webkit-appearance: none; background: #2c2c2e; border-radius: 2px; outline: none; accent-color: #ff9500; }
        
        .controls { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; background: #16161a; border-top: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; }
        .btn { flex: 1; padding: 12px 6px; border: none; border-radius: 10px; font-size: 10.5px; font-weight: 700; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap; }
        .btn-camera { background: #2c2c2e; color: #fff; }
        .btn-camera:active { background: #3a3a3c; }
        
        .btn-audio-active { background: #ff9500; color: #000; }
        .btn-audio-active:active { background: #e68600; }
        .btn-audio-disabled { background: #2c2c2e !important; color: #6e6e73 !important; cursor: not-allowed !important; opacity: 0.6; }
        
        .btn-gallery { background: #ff6969bd; color: #000; }
        .btn-gallery:active { background: #28b84c; }
        .icon { font-size: 13px; }
    </style>
</head>
<body>

<div class="app-container">
   
    
    <div class="header">
        <div class="header-title">RECCE PRO ANALİZ</div>
        <div class="location-edit">
            <input type="text" id="location-name" class="location-input" value="" placeholder="Mekân adını giriniz...">
            <span style="font-size: 11px; color: #8e8e93;">✏️</span>
        </div>
    </div>

    <div class="camera-wrapper">
        <div class="camera-section" id="capture-area">
            <video id="video-feed" autoplay playsinline muted></video>
            <canvas id="analysis-canvas"></canvas>
            
            <div class="ar-overlay">
                <div class="aspect-ratio-badge" id="aspect-badge">16:9 | 24mm</div>
                <div class="grid-guide">
                    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                </div>
                <div class="reticle">
                    <div class="reticle-cross"></div>
                    <div class="reticle-cross vert"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="lens-bar">
        <span class="lens-title">Lens Simülasyonu</span>
        <div class="lens-selector">
            <button class="lens-btn active" onclick="setLens('24mm')">24mm</button>
            <button class="lens-btn" onclick="setLens('35mm')">35mm</button>
            <button class="lens-btn" onclick="setLens('50mm')">50mm</button>
            <button class="lens-btn" onclick="setLens('85mm')">85mm</button>
        </div>
    </div>

    <div class="data-panel">
        <div class="card">
            <div class="card-title">Işık Analizi</div>
            <div class="metric" id="light-val">-- <span class="unit">Lux</span></div>
            <div class="metric-sub" id="light-status">Bekleniyor...</div>
        </div>

        <div class="card">
            <div class="card-title">Güneş Konumu</div>
            <div class="metric" id="sun-angle">--° <span class="unit">/ --</span></div>
            <div class="metric-sub gold" id="sun-time-status">Aktif</div>
        </div>

        <div class="card card-full slider-container">
            <div class="slider-label">Zaman Simülasyonu <span id="time-val">14:00</span></div>
            <input type="range" id="time-slider" min="6" max="20" value="14" step="0.5">
        </div>

        <div class="card card-full">
            <div class="card-title">Akustik Yankı</div>
            <div class="metric" id="echo-val">-- <span class="unit">s (RT60)</span></div>
            <div class="metric-sub warning" id="echo-status">Test Gerekli</div>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-camera" id="btn-camera"><span class="icon"></span> Kamera</button>
        <button class="btn btn-audio-active" id="btn-audio"><span class="icon"></span> Ses Testi</button>
        <button class="btn btn-gallery" id="btn-screenshot"><span class="icon"></span> Raporla</button>
    </div>
</div>

<script>
    const video = document.getElementById('video-feed');
    const canvas = document.getElementById('analysis-canvas');
    const ctx = canvas.getContext('2d');
    const timeSlider = document.getElementById('time-slider');
    const btnAudio = document.getElementById('btn-audio');
    
    let isCameraActive = false;
    let audioContext;
    let analyser;
    let currentLens = "24mm";
    let currentLux = "--";
    let currentSun = "--";
    let currentEcho = "--";

    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, 
                audio: false 
            });
            video.srcObject = stream;
            isCameraActive = true;
            document.getElementById('btn-camera').innerText = "📷 Aktif";
            canvas.width = 64;
            canvas.height = 64;
            requestAnimationFrame(analyzeFrame);
        } catch (err) {
            console.error("Kamera hatası:", err);
            document.getElementById('light-status').innerText = "Kamera İzni Yok";
            document.getElementById('light-status').className = "metric-sub warning";
        }
    }

    function setLens(lens) {
        currentLens = lens;
        document.querySelectorAll('.lens-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText === lens);
        });
        document.getElementById('aspect-badge').innerText = `16:9 | ${lens}`;
        
        if(lens === '24mm') video.style.transform = "scale(1)";
        if(lens === '35mm') video.style.transform = "scale(1.25)";
        if(lens === '50mm') video.style.transform = "scale(1.5)";
        if(lens === '85mm') video.style.transform = "scale(2)";
    }

    function analyzeFrame() {
        if (!isCameraActive) return;

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        
        let totalLuminance = 0;

        for(let i = 0, len = data.length; i < len; i += 4) {
            // Algısal Parlaklık (ITU-R BT.709 Standardı)
            let r = data[i] / 255;
            let g = data[i+1] / 255;
            let b = data[i+2] / 255;
            
            // Gama Düzeltmesi (Linearization)
            r = r > 0.04045 ? Math.pow((r + 0.055) / 1.055, 2.4) : r / 12.92;
            g = g > 0.04045 ? Math.pow((g + 0.055) / 1.055, 2.4) : g / 12.92;
            b = b > 0.04045 ? Math.pow((b + 0.055) / 1.055, 2.4) : b / 12.92;

            let lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
            totalLuminance += lum;
        }

        const avgLuminance = totalLuminance / (canvas.width * canvas.height);
        
        // Logaritmik Lux Ölçekleme (Piksel parlaklığından gerçekçi Lux kestirimi)
        currentLux = Math.round(Math.pow(avgLuminance, 0.8) * 1200); 
        if (currentLux < 5) currentLux = 5;

        updateLightUI(currentLux);
        requestAnimationFrame(analyzeFrame);
    }

    function updateLightUI(lux) {
        const lightValEl = document.getElementById('light-val');
        const lightStatusEl = document.getElementById('light-status');
        lightValEl.innerHTML = `${lux} <span class="unit">Lux</span>`;

        if (lux < 100) {
            lightStatusEl.innerText = "Karanlık (Destek Işık Şart)";
            lightStatusEl.className = "metric-sub warning";
        } else if (lux < 400) {
            lightStatusEl.innerText = "Düşük (İç Mekân/Atmosfer)";
            lightStatusEl.className = "metric-sub warning";
        } else if (lux < 1000) {
            lightStatusEl.innerText = "İdeal (Doğal / Yeterli)";
            lightStatusEl.className = "metric-sub";
        } else {
            lightStatusEl.innerText = "Yüksek (Sert / Parıl)";
            lightStatusEl.className = "metric-sub gold";
        }
    }

    function updateSun(val) {
        const hours = Math.floor(val);
        const minutes = (val % 1) === 0.5 ? "30" : "00";
        const timeStr = `${hours}:${minutes}`;
        document.getElementById('time-val').innerText = timeStr;
        
        let angle = Math.round((val - 6) * 12.8);
        if(angle < 0) angle = 0; if(angle > 180) angle = 180;
        
        const direction = (val > 13) ? "KB" : "GD";
        currentSun = `${angle}° / ${direction} (${timeStr})`;
        document.getElementById('sun-angle').innerHTML = `${angle}° <span class="unit">/ ${direction}</span>`;
        
        const sunStatusEl = document.getElementById('sun-time-status');
        if((val >= 6 && val <= 7.5) || (val >= 18.5 && val <= 20)) {
            sunStatusEl.innerText = "Altın Saat";
            sunStatusEl.className = "metric-sub gold";
        } else if (val < 6.5 || val > 19.5) {
            sunStatusEl.innerText = "Gece";
            sunStatusEl.className = "metric-sub warning";
        } else {
            sunStatusEl.innerText = "Gündüz";
            sunStatusEl.className = "metric-sub";
        }
    }

    async function testAudio() {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
        }

        const audioStatusEl = document.getElementById('echo-status');
        audioStatusEl.innerText = "Dinleniyor...";
        audioStatusEl.className = "metric-sub";

        btnAudio.innerText = "🎤 Dinleniyor...";
        btnAudio.className = "btn btn-audio-disabled";
        btnAudio.disabled = true;

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            const source = audioContext.createMediaStreamSource(stream);
            source.connect(analyser);
            analyser.fftSize = 256;
            
            setTimeout(() => {
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                analyser.getByteFrequencyData(dataArray);
                
                let sum = 0;
                for(let i=0; i<bufferLength; i++) { sum += dataArray[i]; }
                const avgVolume = sum / bufferLength;

                currentEcho = (0.4 + (avgVolume / 255) * 2.2).toFixed(1);
                updateAudioUI(currentEcho);
                
                stream.getTracks().forEach(track => track.stop());

                btnAudio.innerText = "🎤 Ses Testi";
                btnAudio.className = "btn btn-audio-active";
                btnAudio.disabled = false;

            }, 2000);

        } catch (err) {
            console.error("Mikrofon hatası:", err);
            audioStatusEl.innerText = "Mikrofon İzni Yok";
            audioStatusEl.className = "metric-sub warning";

            btnAudio.innerText = "🎤 Ses Testi";
            btnAudio.className = "btn btn-audio-active";
            btnAudio.disabled = false;
        }
    }

    function updateAudioUI(echo) {
        const echoValEl = document.getElementById('echo-val');
        const echoStatusEl = document.getElementById('echo-status');
        echoValEl.innerHTML = `${echo} <span class="unit">s (RT60)</span>`;

        if(echo > 1.3) {
            echoStatusEl.innerText = "Yüksek Yankı";
            echoStatusEl.className = "metric-sub warning";
        } else if (echo > 0.8) {
            echoStatusEl.innerText = "Orta Yankı";
            echoStatusEl.className = "metric-sub warning";
        } else {
            echoStatusEl.innerText = "İdeal Ses";
            echoStatusEl.className = "metric-sub";
        }
    }

async function takeReportScreenshot() {
    const reportCanvas = document.createElement('canvas');
    const reportCtx = reportCanvas.getContext('2d');
    
    reportCanvas.width = 1280;
    reportCanvas.height = 960;

    reportCtx.fillStyle = "#121215";
    reportCtx.fillRect(0, 0, reportCanvas.width, reportCanvas.height);

    const targetWidth = 1280;
    const targetHeight = 720;

    if (isCameraActive && video.videoWidth > 0) {
        // Lens simülasyonu zoom oranını al
        const scaleMatch = video.style.transform.match(/scale\(([^)]+)\)/);
        const lensScale = scaleMatch ? parseFloat(scaleMatch[1]) : 1;

        // Video ham boyutları
        const vWidth = video.videoWidth;
        const vHeight = video.videoHeight;

        // 16:9 alana sığdırmak için (cover mantığı) kırpma hesabı
        const videoAspect = vWidth / vHeight;
        const targetAspect = targetWidth / targetHeight;

        let drawWidth = vWidth;
        let drawHeight = vHeight;

        if (videoAspect > targetAspect) {
            drawWidth = vHeight * targetAspect;
        } else {
            drawHeight = vWidth / targetAspect;
        }

        // Zoom faktörünü kırpma alanına uygula
        drawWidth /= lensScale;
        drawHeight /= lensScale;

        // Kırpılacak kaynak alanı merkezle
        const sx = (vWidth - drawWidth) / 2;
        const sy = (vHeight - drawHeight) / 2;

        // Oranları bozmadan Canvas'a çiz
        reportCtx.drawImage(
            video, 
            sx, sy, drawWidth, drawHeight, // Kaynaktan kırpılan alan
            0, 0, targetWidth, targetHeight // Canvas üzerindeki hedef alan
        );
    } else {
        reportCtx.fillStyle = "#08080a";
        reportCtx.fillRect(0, 0, targetWidth, targetHeight);
        reportCtx.fillStyle = "#444";
        reportCtx.font = "bold 30px sans-serif";
        reportCtx.fillText("KAMERA GÖRÜNTÜSÜ YOK", 460, 360);
    }

    // Kılavuz Çizgiler
    reportCtx.strokeStyle = "rgba(255, 149, 0, 0.3)";
    reportCtx.lineWidth = 2;
    reportCtx.beginPath(); reportCtx.moveTo(426, 0); reportCtx.lineTo(426, 720); reportCtx.stroke();
    reportCtx.beginPath(); reportCtx.moveTo(853, 0); reportCtx.lineTo(853, 720); reportCtx.stroke();
    reportCtx.beginPath(); reportCtx.moveTo(0, 240); reportCtx.lineTo(1280, 240); reportCtx.stroke();
    reportCtx.beginPath(); reportCtx.moveTo(0, 480); reportCtx.lineTo(1280, 480); reportCtx.stroke();

    // Alt Bilgi Kartı
    reportCtx.fillStyle = "#16161a";
    reportCtx.fillRect(0, 720, 1280, 240);

    const locationText = document.getElementById('location-name').value || "Bilinmeyen Mekân";
    
    reportCtx.fillStyle = "#ff9500";
    reportCtx.font = "bold 36px -apple-system, sans-serif";
    reportCtx.fillText(locationText.toUpperCase(), 50, 780);

    reportCtx.fillStyle = "#8e8e93";
    reportCtx.font = "500 24px -apple-system, sans-serif";
    reportCtx.fillText(`LENS: ${currentLens} (16:9)`, 50, 830);
    reportCtx.fillText(`IŞIK: ${currentLux} Lux`, 50, 875);

    reportCtx.fillText(`GÜNEŞ: ${currentSun}`, 650, 830);
    reportCtx.fillText(`AKUSTİK: ${currentEcho} s (RT60)`, 650, 875);

    reportCtx.fillStyle = "rgba(255, 149, 0, 0.6)";
    reportCtx.font = "600 16px -apple-system, sans-serif";
    reportCtx.fillText("RECCE PRO AUTOMATED REPORT", 50, 925);

    // Galeriye Doğrudan Kaydetme / Paylaşma (Web Share API Entegrasyonu)
    reportCanvas.toBlob(async (blob) => {
        const fileName = `RECCE_RAPOR_${locationText.replace(/\s+/g, '_')}.png`;
        const file = new File([blob], fileName, { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
                await navigator.share({
                    files: [file],
                    title: 'Recce Analiz Raporu',
                    text: `${locationText} mekân analiz raporu.`
                });
            } catch (err) {
                console.log('Paylaşım iptal edildi veya desteklenmiyor:', err);
            }
        } else {
            // Fallback: Doğrudan İndir
            const link = document.createElement('a');
            link.download = fileName;
            link.href = URL.createObjectURL(blob);
            link.click();
            URL.revokeObjectURL(link.href);
        }
    }, 'image/png');
}

    document.getElementById('btn-camera').addEventListener('click', startCamera);
    btnAudio.addEventListener('click', testAudio);
    document.getElementById('btn-screenshot').addEventListener('click', takeReportScreenshot);
    timeSlider.addEventListener('input', (e) => updateSun(parseFloat(e.target.value)));

    updateSun(14);
</script>

</body>
</html>
