<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalori Takip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #020617;
        }
        .scroll-area {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: none;
            padding-bottom: 30px;
        }
        .scroll-area::-webkit-scrollbar { display: none; }
        .food-btn { transition: transform 0.1s; border: 1px solid #1e293b; font-size: 11px; text-align: left; }
        .food-btn:active { transform: scale(0.96); background-color: #1e293b; }
        .category-title { 
            color: #475569; 
            font-size: 0.6rem; 
            font-weight: 800; 
            text-transform: uppercase; 
            margin: 16px 0 8px 4px; 
            letter-spacing: 0.05em; 
            border-left: 2px solid #3b82f6;
            padding-left: 6px;
        }
    </style>
</head>
<body class="text-white p-3">

    <div class="bg-slate-900 p-4 rounded-3xl border border-slate-800 shadow-2xl mb-3 shrink-0">
        <div class="flex justify-between items-center">
            <div onclick="updateWeight()" class="cursor-pointer">
                <span class="text-[9px] text-gray-500 block font-bold uppercase"></span>
                <span id="weight-val" class="text-xl font-bold text-blue-400"></span>
            </div>
            <div class="text-center">
                <span class="text-[9px] text-gray-500 block font-bold uppercase tracking-widest">Kalan</span>
                <span id="remaining" class="text-5xl font-black text-green-400 leading-none">1350</span>
            </div>
            <div class="text-right opacity-40">
                <span class="text-[9px] text-gray-500 block font-bold uppercase"></span>
                <span class="text-xs font-bold text-orange-400 italic"></span>
            </div>
        </div>
    </div>

    <div class="scroll-area space-y-1">
        
        <div class="category-title">Protein & Ana Yemek</div>
        <div class="grid grid-cols-2 gap-2">
            <button onclick="add(250, '150g Tavuk')" class="food-btn bg-slate-900 p-3 rounded-2xl">🍗 150g Tavuk (250)</button>
            <button onclick="add(375, '150g Kırmızı Et')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥩 150g Kr. Et (375)</button>
            <button onclick="add(155, 'Haşl. Yumurta')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥚 Haşl. Yumurta (155)</button>
            <button onclick="add(190, 'Ton Balığı')" class="food-btn bg-slate-900 p-3 rounded-2xl">🐟 Ton Balığı (190)</button>
            <button onclick="add(90, 'Mercimek Çorba')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥣 Mercimek Çorba (90)</button>
            <button onclick="add(320, 'Hot Dog')" class="food-btn bg-slate-900 p-3 rounded-2xl">🌭 Hot Dog (320)</button>
            <button onclick="add(130, 'Yoğurt (1 Kase)')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥛 Tam yağlı Yoğurt (130)</button>
            <button onclick="add(240, 'Süzme Yoğurt (Kase)')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥛 Süzme Yoğurt (240)</button>
        </div>

        <div class="category-title">Karbonhidrat</div>
        <div class="grid grid-cols-2 gap-2">
            <button onclick="add(350, 'Bulgur Pilavı')" class="food-btn bg-slate-900 p-3 rounded-2xl">🌾 Bulgur Pilavı (350)</button>
            <button onclick="add(330, 'Makarna')" class="food-btn bg-slate-900 p-3 rounded-2xl">🍝 Makarna (330)</button>
            <button onclick="add(360, 'Pirinç Pilavı')" class="food-btn bg-slate-900 p-3 rounded-2xl">🍚 Pirinç Pilavı (360)</button>
            <button onclick="add(350, 'Yulaf (Sütlü)')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥣 Yulaf Ezmesi (350)</button>
            <button onclick="add(150, 'Fırın Patates')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥔 Fırın Patates (150)</button>
            <button onclick="add(85, 'Alman Çavdarı')" class="food-btn bg-slate-900 p-3 rounded-2xl">🍞 1 Dilim Çavdar Ekmek (85)</button>
        </div>

        <div class="category-title">Sebze & Meyve & Atıştırmalık</div>
        <div class="grid grid-cols-2 gap-2">
            <button onclick="add(52, 'Yeşil Elma')" class="food-btn bg-slate-900 p-3 rounded-2xl">🍏 Yeşil Elma (52)</button>
            <button onclick="add(45, 'Mandalina')" class="food-btn bg-slate-900 p-3 rounded-2xl">🍊 Mandalina (45)</button>
            <button onclick="add(22, 'Domates')" class="food-btn bg-slate-900 p-3 rounded-2xl">🍅 Domates (22)</button>
            <button onclick="add(15, 'Salatalık')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥒 Salatalık (15)</button>
            <button onclick="add(40, 'Mevsim Salata')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥗 Mevsim Salata (40)</button>
            <button onclick="add(30, 'Havuç')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥕 Havuç (30)</button>
            <button onclick="add(30, 'Soğan')" class="food-btn bg-slate-900 p-3 rounded-2xl">🧅 Soğan (30)</button>
            <button onclick="add(5, 'Marul Yaprağı')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥬 Marul (5)</button>
            <button onclick="add(7, 'Siyah Zeytin')" class="food-btn bg-slate-900 p-3 rounded-2xl">🫒 Siyah Zeytin (7)</button>
            <button onclick="add(70, 'Beyaz Peynir')" class="food-btn bg-slate-900 p-3 rounded-2xl">🧀 Beyaz Peynir (70)</button>
            <button onclick="add(70, 'İnce Dilim Kaşar')" class="food-btn bg-slate-900 p-3 rounded-2xl">🧀 İnce Dilim Kaşar (70)</button>
        </div>

        <div class="category-title">İçecek & Tatlı</div>
        <div class="grid grid-cols-2 gap-2">
            <button onclick="add(215, '50cc Bira')" class="food-btn bg-slate-900 p-3 rounded-2xl">🍺 50cc Bira (215)</button>
            <button onclick="add(142, '33cc Bira')" class="food-btn bg-slate-900 p-3 rounded-2xl">🍺 33cc Bira (142)</button>
            <button onclick="add(90, 'Laktozsuz Süt')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥛 Laktozsuz Süt (90)</button>
            <button onclick="add(120, 'Flat White')" class="food-btn bg-slate-900 p-3 rounded-2xl">☕ Flat White (120)</button>
            <button onclick="add(2, 'Şekersiz Çay/K')" class="food-btn bg-slate-900 p-3 rounded-2xl">☕ Şekersiz Çay/K (2)</button>
            <button onclick="add(0, 'Maden Suyu')" class="food-btn bg-slate-900 p-3 rounded-2xl">💧 Maden Suyu (0)</button>
            <button onclick="add(430, 'Profiterol')" class="food-btn bg-slate-900 p-3 rounded-2xl col-span-2">🍩 Profiterol (430)</button>
            <button onclick="add(300, 'Kruvasan (Sade)')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥐 Kruvasan (300)</button>
        </div>
    </div>

    <div class="pt-3 border-t border-slate-800 bg-slate-950 shrink-0">
        <div class="flex gap-2 mb-3">
            <input id="m-val" type="number" placeholder="Kcal gir..." class="bg-slate-900 border border-slate-800 rounded-2xl p-3 flex-1 outline-none text-sm focus:border-blue-500">
            <button onclick="addManual()" class="bg-blue-600 px-6 rounded-2xl font-black text-[10px] uppercase">Ekle</button>
        </div>

        <div class="bg-slate-900 rounded-2xl p-3 max-h-32 overflow-y-auto border border-slate-800 shadow-inner">
            <div class="flex justify-between items-center mb-2">
                <span class="text-[9px] text-gray-500 font-bold uppercase">Bugün Tüketilenler</span>
                <button onclick="resetDay()" class="text-[9px] text-red-500 font-bold uppercase underline">Tümünü Sil</button>
            </div>
            <ul id="log" class="space-y-2"></ul>
        </div>
    </div>

    <script>
        const GOAL = 1350;
        
        // Verileri localStorage'dan al veya varsayılan değerleri kullan
        let consumed = parseInt(localStorage.getItem('cal_consumed')) || 0;
        let weight = parseFloat(localStorage.getItem('cal_weight')) || 78.0;
        let logData = JSON.parse(localStorage.getItem('cal_logData')) || [];
        
        // Otomatik Gün Sıfırlama Kontrolü
        let lastDate = localStorage.getItem('cal_lastDate');
        let today = new Date().toDateString();
        
        if (lastDate !== today) {
            consumed = 0;
            logData = [];
            localStorage.setItem('cal_lastDate', today);
            saveData();
        }

        // Sayfa yüklendiğinde arayüzü çiz
        window.onload = () => {
            document.getElementById('weight-val').innerText = weight.toFixed(1);
            updateUI();
            renderLog();
        };

        function saveData() {
            localStorage.setItem('cal_consumed', consumed);
            localStorage.setItem('cal_weight', weight);
            localStorage.setItem('cal_logData', JSON.stringify(logData));
        }

        function updateUI() {
            let res = GOAL - consumed;
            const el = document.getElementById('remaining');
            el.innerText = res;
            el.className = res < 0 ? "text-5xl font-black text-red-500 leading-none" : "text-5xl font-black text-green-400 leading-none";
        }

        function renderLog() {
            const logEl = document.getElementById('log');
            logEl.innerHTML = '';
            logData.forEach(item => {
                const li = document.createElement('li');
                li.className = "flex justify-between items-center text-[10px] bg-slate-950 p-2 rounded-xl border border-slate-800";
                li.innerHTML = `<span>${item.name} <span class="text-red-400 ml-1">-${item.kcal}</span></span> 
                                <button onclick="del(${item.id}, ${item.kcal})" class="text-red-500 font-bold px-2 text-xl leading-none">×</button>`;
                logEl.appendChild(li);
            });
        }

        function add(kcal, name) {
            consumed += kcal;
            const id = Date.now();
            logData.unshift({ id, kcal, name }); // Listeye en üstten ekle
            saveData();
            updateUI();
            renderLog();
        }

        function del(id, kcal) {
            consumed -= kcal;
            logData = logData.filter(item => item.id !== id);
            saveData();
            updateUI();
            renderLog();
        }

        function addManual() {
            const v = document.getElementById('m-val').value;
            if(v && v > 0) { 
                add(parseInt(v), 'Özel Giriş'); 
                document.getElementById('m-val').value = ''; 
            }
        }

        function updateWeight() {
            const w = prompt("Yeni tartı sonucun:", weight);
            if(w && !isNaN(w)) { 
                weight = parseFloat(w); 
                document.getElementById('weight-val').innerText = weight.toFixed(1);
                saveData();
            }
        }

        function resetDay() {
            if(confirm('Tüm veriler temizlensin mi?')) { 
                consumed = 0; 
                logData = [];
                saveData();
                updateUI(); 
                renderLog();
            }
        }
    </script>
</body>
</html>
