<head>

    <title>Kalori Takip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #020617;
        }
        .scroll-area {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: none;
            padding-bottom: 30px;
        }
        .scroll-area::-webkit-scrollbar { display: none; }
        .food-btn { transition: transform 0.1s; border: 1px solid #1e293b; font-size: 11px; text-align: left; }
        .food-btn:active { transform: scale(0.96); background-color: #1e293b; }
        .category-title { 
            color: #475569; 
            font-size: 0.6rem; 
            font-weight: 800; 
            text-transform: uppercase; 
            margin: 16px 0 8px 4px; 
            letter-spacing: 0.05em; 
            border-left: 2px solid #3b82f6;
            padding-left: 6px;
        }
    </style>
</head>
<body class="text-white p-3">

        <div class="flex justify-between items-center">
            <div onclick="updateWeight()" class="cursor-pointer">
                <span class="text-[9px] text-gray-500 block font-bold uppercase"></span>
                <span id="weight-val" class="text-xl font-bold text-blue-400"></span>
            </div>
            <div class="text-center">
                <span class="text-[9px] text-gray-500 block font-bold uppercase tracking-widest">Kalan</span>

                <span class="text-[9px] text-gray-500 block font-bold uppercase"></span>
                <span class="text-xs font-bold text-orange-400 italic"></span>
            </div>
        </div>
    </div>

            <button onclick="add(90, '1 Kase Mercimek Çorbası')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥣 1 Kase Mercimek Çorbası (90)</button>
            <button onclick="add(320, '1 Adet  Hot Dog')" class="food-btn bg-slate-900 p-3 rounded-2xl">🌭 1 Adet  Hot Dog (320)</button>
            <button onclick="add(130, '1 Kase Tam yağlı Yoğurt')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥛 1 Kase Tam yağlı Yoğurt (130)</button>
            <button onclick="add(240, '1 Kase Süzme Yoğurt ')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥛 1 Kase Süzme Yoğurt (240)</button>

        <div class="category-title">Karbonhidrat</div>
        <div class="grid grid-cols-2 gap-2">
            <button onclick="add(350, '1 Tabak Bulgur Pilavı')" class="food-btn bg-slate-900 p-3 rounded-2xl">🌾 1 Tabak Bulgur Pilavı (350)</button>
            <button onclick="add(100, '1 Avuç Pilavlık Bulgur')" class="food-btn bg-slate-900 p-3 rounded-2xl">🌾 1 Avuç Pilavlık Bulgur (100)</button>
            <button onclick="add(330, '1 Tabak Makarna')" class="food-btn bg-slate-900 p-3 rounded-2xl">🍝 1 Tabak Makarna (330)</button>
            <button onclick="add(360, '1 TabakPirinç Pilavı')" class="food-btn bg-slate-900 p-3 rounded-2xl">🍚 1 TabakPirinç Pilavı (360)</button>
            <button onclick="add(350, '1 Kase Yulaf Ezmesi (Sütlü)')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥣 1 Kase Yulaf Ezmesi (Sütlü) (350)</button>
            <button onclick="add(150, '1 Adet Fırın Patates ')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥔 1 Adet Fırın Patates (150)</button>
            <button onclick="add(85, '1 Dilim Çavdar Ekmeği')" class="food-btn bg-slate-900 p-3 rounded-2xl">🍞 1 Dilim Çavdar Ekmeği (85)</button>
        </div>

        <div class="grid grid-cols-2 gap-2">
            <button onclick="add(52, '1 Adet Yeşil Elma')" class="food-btn bg-slate-900 p-3 rounded-2xl">🍏 1 Adet Yeşil Elma (52)</button>
            <button onclick="add(45, '1 Adet Mandalina')" class="food-btn bg-slate-900 p-3 rounded-2xl">🍊 1 Adet Mandalina (45)</button>
            <button onclick="add(22, '1 Adet Domates')" class="food-btn bg-slate-900 p-3 rounded-2xl">🍅 1 Adet Domates (22)</button>
            <button onclick="add(15, '1 Adet Salatalık')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥒  1 Adet Salatalık (15)</button>
            <button onclick="add(40, 'Mevsim Salatası')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥗 Mevsim Salatası (40)</button>
            <button onclick="add(30, '1 Adet Havuç')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥕  1 Adet Havuç (30)</button>
            <button onclick="add(5, '1 Diş Sarımsak')" class="food-btn bg-slate-900 p-3 rounded-2xl">🧄 1 Diş Sarımsak (5)</button>
            <button onclick="add(30, '1 Adet Soğan')" class="food-btn bg-slate-900 p-3 rounded-2xl">🧅 1 Adet Soğan (30)</button>
            <button onclick="add(7, '1 Adet Arpacık Soğanı')" class="food-btn bg-slate-900 p-3 rounded-2xl">🧅 1 Adet Arpacık Soğanı (7)</button>
            <button onclick="add(5, '1 Adet Yeşil Soğan')" class="food-btn bg-slate-900 p-3 rounded-2xl">🌱 1 Adet Yeşil Soğan (5)</button>
            <button onclick="add(5, '1 Adet Marul Yaprağı')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥬 1 Adet Marul Yaprağı (5)</button>
            <button onclick="add(7, ' 1 Adet Siyah Zeytin')" class="food-btn bg-slate-900 p-3 rounded-2xl">🫒 1 Adet Siyah Zeytin (7)</button>
            <button onclick="add(6, ' 1 Adet Yeşil Zeytin (1 Adet)')" class="food-btn bg-slate-900 p-3 rounded-2xl">🫒 1 Adet Yeşil Zeytin (6)</button>
            <button onclick="add(70, ' 1 Adet Dilim Beyaz Peynir')" class="food-btn bg-slate-900 p-3 rounded-2xl">🧀 1 Dilim Beyaz Peynir (70)</button>
            <button onclick="add(70, ' 1 Adet İnce Dilim Kaşar')" class="food-btn bg-slate-900 p-3 rounded-2xl">🧀  1 Adet İnce Dilim Kaşar (70)</button>
            <button onclick="add(70, '10 Adet Badem')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥜 10 Adet Badem (70)</button>
            <button onclick="add(65, '10 Adet Fındık')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥜 10 Adet Fındık (65)</button>
            <button onclick="add(60, '10 Adet Fındık')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥜 10 Adet Yer Fıstığı (60)</button>
            <button onclick="add(60, '10 Adet Fındık')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥜 10 Adet Antep Fıstığı (60)</button>
            <button onclick="add(20, '10 Adet Leblebi')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥜 10 Adet Leblebi (20)</button>
            <button onclick="add(35, '1 Adet Ceviz')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥜 1 Adet Ceviz (35)</button>
            
        </div>

        <div class="category-title">İçecek & Tatlı</div>
        <div class="grid grid-cols-2 gap-2">
            <button onclick="add(300, 'Tahin-Pekmezli Ekmek)" class="food-btn bg-slate-900 p-3 rounded-2xl">🥐 1 Dilim Tahin-Pekmezli Ekmek (300)</button>
            <button onclick="add(35, '1 Yemek Kaşığı Tatlı Ekşi Sos')" class="food-btn bg-slate-900 p-3 rounded-2xl">🍯 1 Yemek Kaşığı Tatlı Ekşi Sos (35)</button>
            <button onclick="add(35, '1 Yemek Kaşığı BBQ Sosu')" class="food-btn bg-slate-900 p-3 rounded-2xl">🔥 1 Yemek Kaşığı BBQ Sosu (35)</button>
            <button onclick="add(215, '1 Adet 50cc Bira')" class="food-btn bg-slate-900 p-3 rounded-2xl">🍺  1 Adet 50cc Bira (215)</button>
            <button onclick="add(142, '1 Adet 33cc Bira')" class="food-btn bg-slate-900 p-3 rounded-2xl">🍺  1 Adet 33cc Bira (142)</button>
            <button onclick="add(90, '1 Bardak Laktozsuz Süt')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥛 1 Bardak Laktozsuz Süt (90)</button>
            <button onclick="add(120, '1 Adet Flat White')" class="food-btn bg-slate-900 p-3 rounded-2xl">☕ 1 Adet Flat White (120)</button>
            <button onclick="add(7, '1 Adet Vitamin Tablet')" class="food-btn bg-slate-900 p-3 rounded-2xl">💊 1 Adet Vitamin Tablet (7)</button>
            <button onclick="add(2, '1 Bardak Şekersiz Çay')" class="food-btn bg-slate-900 p-3 rounded-2xl">☕ 1 Bardak Şekersiz Çay (2)</button>
            <button onclick="add(2, '1 Bardak Filtre kahve')" class="food-btn bg-slate-900 p-3 rounded-2xl">☕ 1 Bardak Filtre Kahve (2)</button>
            <button onclick="add(430, '1 Adet Profiterol')" class="food-btn bg-slate-900 p-3 rounded-2xl col-span-2">🍩 1 Adet Profiterol (430)</button>
            <button onclick="add(300, '1 Adet Kruvasan (Sade)')" class="food-btn bg-slate-900 p-3 rounded-2xl">🥐 1 Adet Kruvasan (300)</button>
            <button onclick="add(55, '1 Dilim Bitter Çikolata')" class="food-btn bg-slate-900 p-3 rounded-2xl">🍫 1 Dilim Bitter Çikolata (55)</button>
        </div>
    </div>

    <div class="pt-3 border-t border-slate-800 bg-slate-950 shrink-0">
        <div class="flex gap-2 mb-3">
            <input id="m-val" type="number" placeholder="Kcal gir..." class="bg-slate-900 border border-slate-800 rounded-2xl p-3 flex-1 outline-none text-sm focus:border-blue-500">
            <button onclick="addManual()" class="bg-blue-600 px-6 rounded-2xl font-black text-[10px] uppercase">Ekle</button>
        </div>

        <div class="bg-slate-900 rounded-2xl p-3 max-h-32 overflow-y-auto border border-slate-800 shadow-inner">
            <div class="flex justify-between items-center mb-2">
                <span class="text-[9px] text-gray-500 font-bold uppercase">Bugün Tüketilenler</span>
                <button onclick="resetDay()" class="text-[9px] text-red-500 font-bold uppercase underline">Tümünü Sil</button>
            </div>
            <ul id="log" class="space-y-2"></ul>
        </div>
    </div>

    <script>
        const GOAL = 1350;
        
        // Verileri localStorage'dan al veya varsayılan değerleri kullan
        let consumed = parseInt(localStorage.getItem('cal_consumed')) || 0;
        let weight = parseFloat(localStorage.getItem('cal_weight')) || 78.0;
        let logData = JSON.parse(localStorage.getItem('cal_logData')) || [];
        
        // Otomatik Gün Sıfırlama Kontrolü
        let lastDate = localStorage.getItem('cal_lastDate');
        let today = new Date().toDateString();
        
        if (lastDate !== today) {
            consumed = 0;
            logData = [];
            localStorage.setItem('cal_lastDate', today);
            saveData();
        }

        // Sayfa yüklendiğinde arayüzü çiz
        window.onload = () => {
            document.getElementById('weight-val').innerText = weight.toFixed(1);
            updateUI();
            renderLog();
        };

        function saveData() {
            localStorage.setItem('cal_consumed', consumed);
            localStorage.setItem('cal_weight', weight);
            localStorage.setItem('cal_logData', JSON.stringify(logData));
        }

        function updateUI() {
            let res = GOAL - consumed;
            const el = document.getElementById('remaining');
            el.innerText = res;
            el.className = res < 0 ? "text-5xl font-black text-red-500 leading-none" : "text-5xl font-black text-green-400 leading-none";
        }

        function renderLog() {
            const logEl = document.getElementById('log');
            logEl.innerHTML = '';
            logData.forEach(item => {
                const li = document.createElement('li');
                li.className = "flex justify-between items-center text-[10px] bg-slate-950 p-2 rounded-xl border border-slate-800";
                li.innerHTML = `<span>${item.name} <span class="text-red-400 ml-1">-${item.kcal}</span></span> 
                                <button onclick="del(${item.id}, ${item.kcal})" class="text-red-500 font-bold px-2 text-xl leading-none">×</button>`;
                logEl.appendChild(li);
            });
        }

        function add(kcal, name) {
            consumed += kcal;
            const id = Date.now();
            logData.unshift({ id, kcal, name }); // Listeye en üstten ekle
            saveData();
            updateUI();
            renderLog();
        }

        function del(id, kcal) {
            consumed -= kcal;
            logData = logData.filter(item => item.id !== id);
            saveData();
            updateUI();
            renderLog();
        }

        function addManual() {
            const v = document.getElementById('m-val').value;
            if(v && v > 0) { 
                add(parseInt(v), 'Özel Giriş'); 
                document.getElementById('m-val').value = ''; 
            }
        }

        function updateWeight() {
            const w = prompt("Yeni tartı sonucun:", weight);
            if(w && !isNaN(w)) { 
                weight = parseFloat(w); 
                document.getElementById('weight-val').innerText = weight.toFixed(1);
                saveData();
            }
        }

        function resetDay() {
            if(confirm('Tüm veriler temizlensin mi?')) { 
                consumed = 0; 
                logData = [];
                saveData();
                updateUI(); 
                renderLog();
            }
        }
    </script>
</body>
</html>
