<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="apple-touch-icon" sizes="180x180" href="IMG_1030.jpeg">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='25' width='80' height='60' rx='10' fill='%23333'/><rect x='18' y='33' width='64' height='44' rx='4' fill='%2300d2ff'/><polyline points='35,10 50,25 65,10' stroke='%23333' stroke-width='6' stroke-linecap='round' fill='none'/></svg>">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="WEB TV">
    <title>WEB TV</title>
    
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        background-color: #000000;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
        padding-top: max(15px, env(safe-area-inset-top));
    }

    html {
        scrollbar-color: #0a0a0a #0a0a0a;
        background-color: #000000;
    }

    .player-section {
        width: 100%;
        background-color: #000000;
        position: relative;
        z-index: 10;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
        display: flex;
        flex-direction: column-reverse;
    }

    .player-wrapper {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000000;
        position: relative;
        overflow: hidden;
    }

    .iframe-crop-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        overflow: hidden;
        display: none;
    }

    .iframe-crop-container iframe {
        width: 100%;
        height: 350%;
        position: absolute;
        top: 0;
        left: 0;
        border: none;
    }

    .video-js {
        width: 100% !important;
        height: 100% !important;
    }

    /* Eğik Üst Bar Stili */
    .info-bar {
        background: #000000;
        padding: 0 24px 0 0;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        overflow: hidden;
        position: relative;
        border-bottom: none;
    }

    .info-bar h1 {
        font-size: 1rem;
        font-weight: 900;
        letter-spacing: 1px;
        color: #8d8d8d;
        text-transform: uppercase;
        background: #111111;
        height: 100%;
        display: flex;
        align-items: center;
        padding: 0 35px 0 20px;
        clip-path: polygon(0 0, 100% 0, 80% 100%, 0 100%);
    }

    .current-badge {
        font-size: 0.95rem;
        color: #8d8d8d;
        background-color: transparent;
        padding: 0;
        border-radius: 0;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.8px;
    }

    /* Kanal Listesi Alanı */
    .content-section {
        flex: 1;
        overflow-y: auto;
        padding: 20px 16px;
        background: #0a0a0a;
        -webkit-overflow-scrolling: touch;
    }

    .section-title {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #666666;
        margin-bottom: 16px;
        padding-left: 8px;
        font-weight: 800;
    }

    .channel-grid {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-bottom: 40px;
    }

    /* Kanal Kartları (Eğik Kesim Uygulandı) */
    .channel-card {
        display: flex;
        align-items: center;
        padding: 14px 22px;
        background: #141414;
        border: none !important;
        cursor: pointer;
        outline: none;
        transition: all 0.2s ease;
        clip-path: polygon(0 0, 100% 0, 95% 100%, 0 100%);
    }

    .channel-card:hover,
    .channel-card:focus {
        background: #1f1f1f;
        transform: translateX(4px);
    }

    /* Seçili Kanal Kartı */
    .channel-card.active {
        background: #292929 !important;
        clip-path: polygon(0 0, 100% 0, 95% 100%, 0 100%);
    }

    .logo-container {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #444444;
        margin-right: 16px;
        flex-shrink: 0;
        padding: 0;
        border: none;
        transition: all 0.2s ease;
    }

    .channel-logo {
        display: none;
    }

    .channel-card:hover .logo-container,
    .channel-card:focus .logo-container {
        background: #000000;
    }

    .channel-card.active .logo-container {
        background: #000000 !important;
        transform: scale(1.2);
    }

    .channel-details {
        display: flex;
        flex-direction: column;
    }

    .channel-name {
        font-size: 0.95rem;
        font-weight: 700;
        color: #8d8d8d;
        letter-spacing: 0.5px;
    }

    .channel-type {
        font-size: 0.7rem;
        color: #666666;
        margin-top: 3px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .channel-card.active .channel-name {
        color: #8d8d8d !important;
    }

    .channel-card.active .channel-type {
        color: #9b9b9b  !important;
    }

    @media (min-width: 992px) {
        body { 
            flex-direction: row-reverse;
        }

        .player-section { 
            flex: 1; 
            height: 100vh; 
            padding: 0; 
            background: #000000;
            box-shadow: none;
            flex-direction: column-reverse;
        }



        .player-wrapper { 
            flex: 1;
            height: calc(100vh - 50px);
            aspect-ratio: auto;
        }

        .info-bar { 
            height: 50px;
        }

        .content-section { 
            width: 340px; 
            max-width: 340px; 
            height: 100vh;
            background: #0a0a0a; 
            border-right: 1px solid #1a1a1a; 
            border-left: none;
        }
    }
</style>
</head>
<body>

    <div class="player-section">
        <div class="player-wrapper">
            <video id="main-tv-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" playsinline></video>
            <div class="iframe-crop-container" id="iframeCropContainer">
                <iframe id="tvIframe" scrolling="no"></iframe>
            </div>
        </div>
        <div class="info-bar">
            <h1>WEB TV</h1>
            <div class="current-badge" id="currentTrack">Yükleniyor...</div>
        </div>
    </div>

    <div class="content-section">
        <div class="section-title">Kanallar</div>
        <div class="channel-grid" id="channelGrid"></div>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/videojs-youtube/3.0.1/videojs-youtube.min.js"></script>

    <script>
        const channels = [
          { name: "WELCOME", logo: "IMG_1030.jpeg", url: "https://lotus.stingray.com/manifest/ose-122ads-montreal/samsungtvplus/master.m3u8", type: "hls" },
          { name: "TLC TR", logo: "IMG_1030.jpeg", url: "https://www.tlctv.com.tr/canli-izle", type: "iframe", cropTop: "-230px" },  
          { name: "D-MAX TR", logo: "IMG_1030.jpeg", url: "https://www.dmax.com.tr/canli-izle", type: "iframe", cropTop: "-230px" }, 
            
          { name: "FX TR", logo: "IMG_1030.jpeg", url: "https://saran-live.ercdn.net/fx/index.m3u8", type: "hls" },
          { name: "CNBC-E", logo: "IMG_1030.jpeg", url: "https://hnpsechtsc.turknet.ercdn.net/xpnvudnlsv/cnbc-e/cnbc-e_720p.m3u8", type: "hls" },
          { name: "TRT1", logo: "IMG_1030.jpeg", url: "https://tv-trt1.medya.trt.com.tr/master_1080.m3u8", type: "hls" },
          { name: "TRT2", logo: "IMG_1030.jpeg", url: "https://tv-trt2.medya.trt.com.tr/master_1080.m3u8", type: "hls" },
          { name: "TRT BELGESEL", logo: "IMG_1030.jpeg", url: "https://tv-trtbelgesel.medya.trt.com.tr/master.m3u8", type: "hls" },
          { name: "GZT", logo: "IMG_1030.jpeg", url: "https://gzttv-live.lg.mncdn.com/gzttv-live/gzttv/720p.m3u8", type: "hls" },
          { name: "TRT SPOR", logo: "IMG_1030.jpeg", url: "https://tv-trtspor1.medya.trt.com.tr/master.m3u8", type: "hls" },
          { name: "HALK TV", logo: "IMG_1030.jpeg", url: "https://halktv-live.daioncdn.net/halktv/halktv_720p.m3u8", type: "hls" },
          { name: "KABEL EINS", logo: "IMG_1030.jpeg", url: "https://dash4.antik.sk/live/test_kabel_eins_tizen/playlist.m3u8", type: "hls" },
          { name: "BRITBOX M", logo: "IMG_1030.jpeg", url: "https://aegis-cloudfront-1.tubi.video/c95700f8-e51c-4a36-ad46-56f70fc9f1d9/playlist_1920x1080.m3u8", type: "hls" },
          { name: "GETFA UK", logo: "IMG_1030.jpeg", url: "https://d1nhni5l2n8hjt.cloudfront.net/gf_720.m3u8", type: "hls" },
          { name: "ARTE HD", logo: "IMG_1030.jpeg", url: "https://dash4.antik.sk/live/test_arte_avc_25p/playlist.m3u8", type: "hls" },
          { name: "PRO 7", logo: "IMG_1030.jpeg", url: "https://dash4.antik.sk/live/test_pro_sieben_tizen/playlist.m3u8", type: "hls" },
          { name: "SAT 1 GOLD", logo: "IMG_1030.jpeg", url: "https://dash4.antik.sk/live/test_sat_eins_gold_tizen/playlist.m3u8", type: "hls" },
          { name: "INTO CRIME", logo: "IMG_1030.jpeg", url: "https://amg00711-zylo-amg00711c10-rakuten-fr-6731.playouts.now.amagi.tv/playlist1080p.m3u8", type: "hls" },
          { name: "INWILD", logo: "IMG_1030.jpeg", url: "https://amg00861-amg00861c7-stirr-us-8227.playouts.now.amagi.tv/1080p-en/index.m3u8", type: "hls" },
          { name: "ATLAS", logo: "IMG_1030.jpeg", url: "https://cdn.whiplash.cc/whiplash-atlas/tracks-v1a1/mono.m3u8", type: "hls" },
          { name: "THE NEST", logo: "IMG_1030.jpeg", url: "https://fast-channels.sinclairstoryline.com/THENEST/index_1.m3u8", type: "hls" },
          { name: "FRANCE 24", logo: "IMG_1030.jpeg", url: "https://live.france24.com/hls/live/2037218-b/F24_EN_HI_HLS/master_5000.m3u8", type: "hls" },
          { name: "BBC NEWS", logo: "IMG_1030.jpeg", url: "https://vs-hls-push-ww-live.akamaized.net/x=4/i=urn:bbc:pips:service:bbc_news_channel_hd/t=3840/v=pv14/b=5070016/main.m3u8", type: "hls" },
        
          { name: "CBS NEWS", logo: "IMG_1030.jpeg", url: "https://cbsn-us.cbsnstream.cbsnews.com/out/v1/55a8648e8f134e82a470f83d562deeca/master_24.m3u8", type: "hls" },
          { name: "DW ENG", logo: "IMG_1030.jpeg", url: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/stream05/streamPlaylist.m3u8", type: "hls" },
          { name: "LOVE NATURE", logo: "IMG_1030.jpeg", url: "https://aegis-cloudfront-1.tubi.video/6d6d0f24-8445-4b4c-bdf6-44f9e38beaa4/1080p-cc/index.m3u8", type: "hls" },
          { name: "NATURESCAPE", logo: "IMG_1030.jpeg", url: "https://lotus.stingray.com/manifest/naturescape-a003-montreal/samsungtvplus/f7ed86a4-b8ac-38e0-a745-710077a95be6/3291200/manifest.m3u8", type: "hls" },
          { name: "EARTH", logo: "IMG_1030.jpeg", url: "https://autentic-adventure-earth-1-gb.lg.wurl.tv/playlist.m3u8", type: "hls" },
          { name: "NATURE TIME", logo: "IMG_1030.jpeg", url: "https://amg01515-amg01515c13-xiaomi-international-4618.playouts.now.amagi.tv/playlist.m3u8", type: "hls" },
          { name: "FASHION TV", logo: "IMG_1030.jpeg", url: "https://cdn-ue1-prod.tsv2.amagi.tv/linear/amg01546-ftv-fashiontv-xiaomi/playlist.m3u8", type: "hls" },
          { name: "SPACE LIVE", logo: "IMG_1030.jpeg", url: "https://d111bsx9oooqoh.cloudfront.net/playlist_1920x1080.m3u8", type: "hls" },

        ];

        let activeFocusIndex = 0;
        let player = null;

        const gridContainer = document.getElementById('channelGrid');
        const currentTrackBadge = document.getElementById('currentTrack');
        const iframeContainer = document.getElementById('iframeCropContainer');
        const iframeEl = document.getElementById('tvIframe');

        function initApp() {
            player = videojs('main-tv-player', {
                fluid: false, 
                fill: true,   
                techOrder: ["html5", "youtube"],
                youtube: { "iv_load_policy": 3, "modestbranding": 1 }
            });

            channels.forEach((channel, idx) => {
                const card = document.createElement('div');
                card.className = `channel-card ${idx === 0 ? 'active' : ''}`;
                card.setAttribute('tabindex', '0'); 
                card.setAttribute('data-index', idx);

                card.innerHTML = `
                    <div class="logo-container">
                        <img src="${channel.logo}" class="channel-logo" alt="${channel.name}" onerror="this.onerror=null;this.src='https://via.placeholder.com/50?text=TV'">
                    </div>
                    <div class="channel-details">
                        <div class="channel-name">${channel.name}</div>
                        <div class="channel-type">${channel.type === 'youtube' ? 'YouTube' : channel.type === 'iframe' ? 'Web Site' : 'Live Stream'}</div>
                    </div>
                `;

                card.addEventListener('click', () => { selectChannel(idx); });
                card.addEventListener('focus', () => { activeFocusIndex = idx; });
                gridContainer.appendChild(card);
            });

            if (channels.length > 0) playStream(channels[0], false);
            
            setTimeout(() => {
                const initialFocus = document.querySelector('.channel-card');
                if (initialFocus) initialFocus.focus();
            }, 500);
        }

        function selectChannel(idx) {
            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
            const cards = document.querySelectorAll('.channel-card');
            if (cards[idx]) {
                cards[idx].classList.add('active');
                playStream(channels[idx], true);
            }
        }

        function playStream(channel, shouldPlay = true) {
            currentTrackBadge.innerText = channel.name;

            const playerEl = document.getElementById('main-tv-player');

            if (channel.type === "iframe") {
                player.pause();
                if (playerEl) playerEl.style.display = 'none';
                
                iframeEl.src = channel.url;
                iframeEl.style.top = channel.cropTop || "0px";
                iframeContainer.style.display = 'block';
                return;
            }

            iframeContainer.style.display = 'none';
            iframeEl.src = 'about:blank';

            if (playerEl) playerEl.style.display = 'block';

            if (channel.type === "youtube") {
                player.src({ src: channel.url, type: "video/youtube" });
            } else {
                player.src({ src: channel.url, type: "application/x-mpegURL" });
            }

            if (shouldPlay) {
                player.ready(() => {
                    player.play().catch(() => console.log("Oynatma başlatılamadı"));
                });
            }
        }

        document.addEventListener('keydown', function(e) {
            const cards = document.querySelectorAll('.channel-card');
            switch(e.key) {
                case 'ArrowDown':
                    e.preventDefault();
                    if (activeFocusIndex < cards.length - 1) {
                        activeFocusIndex++;
                        cards[activeFocusIndex].focus();
                        cards[activeFocusIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    if (activeFocusIndex > 0) {
                        activeFocusIndex--;
                        cards[activeFocusIndex].focus();
                        cards[activeFocusIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                    break;
                case 'Enter':
                    e.preventDefault();
                    selectChannel(activeFocusIndex);
                    break;
            }
        });

        document.addEventListener('DOMContentLoaded', initApp);
    </script>

</body>
</html>
