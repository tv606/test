<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Video Kurgucu Mini Hızlı</title>
    <script src="https://unpkg.com/coi-serviceworker/coi-serviceworker.min.js"></script>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --sub: #94a3b8;
            --accent: #10b981;
            --border: #334155;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
        }

        .wrapper {
            display: table;
            width: 100%;
            height: 100%;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .row-header {
            display: table-row;
            height: 40px;
        }

        .row-main {
            display: table-row;
            height: auto;
        }

        .row-footer {
            display: table-row;
            height: 50px;
        }

        .cell {
            display: table-cell;
            vertical-align: middle;
            padding: 0 10px;
        }

        .header-cell {
            text-align: center;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            font-weight: bold;
        }

        .main-cell {
            vertical-align: top;
            padding-top: 8px;
        }

        .drop-box {
            display: block;
            height: 50px;
            border: 2px dashed var(--border);
            border-radius: 8px;
            text-align: center;
            background: #1a2436;
            margin-bottom: 6px;
            cursor: pointer;
            line-height: 46px;
            font-size: 0.8rem;
            color: var(--text);
            font-weight: 600;
        }

        .file-box {
            display: block;
            height: 50px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--card);
            overflow-y: auto;
            margin-bottom: 6px;
        }

        .file-item {
            padding: 4px 6px;
            border-bottom: 1px solid var(--border);
            font-size: 0.7rem;
            clear: both;
        }

        .file-name {
            float: left;
            width: 85%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--sub);
            pointer-events: none;
        }

        .file-remove {
            float: right;
            color: var(--danger);
            font-weight: bold;
            pointer-events: auto;
        }

        .controls-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px;
            margin-bottom: 6px;
        }

        .input-table {
            display: table;
            width: 100%;
            margin-bottom: 4px;
        }

        .input-cell {
            display: table-cell;
            width: 50%;
            padding: 0 2px;
        }

        .input-cell label {
            display: block;
            font-size: 0.65rem;
            color: var(--sub);
        }

        .input-cell input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 4px;
            padding: 3px;
            font-size: 0.75rem;
            text-align: center;
            outline: none;
        }

        .checkbox-row {
            font-size: 0.68rem;
            color: var(--sub);
        }

        .status-box {
            height: 16px;
            font-size: 0.65rem;
            text-align: center;
            color: var(--accent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .video-preview {
            display: none;
            width: 100%;
            height: 80px;
            border-radius: 6px;
            background: #000;
            margin-top: 2px;
        }

        .btn-submit {
            display: block;
            width: 100%;
            height: 40px;
            line-height: 40px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
        }

        .btn-submit:disabled {
            background: var(--border);
            color: var(--sub);
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="row-header">
        <div class="cell header-cell">Video Kurgucu Mini</div>
    </div>

    <div class="row-main">
        <div class="cell main-cell">
            <label class="drop-box" for="fileInput">
                + Videoları Seç / Ekle
                <input type="file" id="fileInput" multiple accept="video/*" style="display:none;">
            </label>

            <div class="file-box">
                <div id="fileList"></div>
            </div>

            <div class="controls-box">
                <div class="input-table">
                    <div class="input-cell">
                        <label for="minSure">Min (sn):</label>
                        <input type="number" id="minSure" value="0.8" step="0.1" min="0.1">
                    </div>
                    <div class="input-cell">
                        <label for="maxSure">Max (sn):</label>
                        <input type="number" id="maxSure" value="1.4" step="0.1" min="0.2">
                    </div>
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="ardisikEngelle" checked>
                    <label for="ardisikEngelle">Aynı video peş peşe gelmesin</label>
                </div>
            </div>

            <div class="status-box" id="statusLabel"></div>
            <video id="outputVideo" class="video-preview" controls playsinline></video>
        </div>
    </div>

    <div class="row-footer">
        <div class="cell">
            <button class="btn-submit" id="startBtn" onclick="videolariIsle()">VİDEOLARI OLUŞTUR</button>
        </div>
    </div>
</div>

<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({
        log: true,
        corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
    });

    let filesArray = [];

    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const statusLabel = document.getElementById('statusLabel');
    const startBtn = document.getElementById('startBtn');
    const outputVideo = document.getElementById('outputVideo');

    fileInput.addEventListener('change', (e) => {
        for (let file of e.target.files) {
            if (file.type.startsWith('video/')) {
                filesArray.push(file);
            }
        }
        renderFileList();
    });

    function renderFileList() {
        fileList.innerHTML = '';
        filesArray.forEach((file, index) => {
            const item = document.createElement('div');
            item.className = 'file-item';
            item.innerHTML = `
                <div class="file-name">${file.name}</div>
                <div class="file-remove" onclick="removeFile(${index})">&times;</div>
                <div style="clear:both;"></div>
            `;
            fileList.appendChild(item);
        });
    }

    function removeFile(index) {
        filesArray.splice(index, 1);
        renderFileList();
    }

    function ardisikEngelliKaristir(dilimler) {
        let gruplar = {};
        dilimler.forEach(item => {
            if (!gruplar[item.fileIndex]) gruplar[item.fileIndex] = [];
            gruplar[item.fileIndex].push(item);
        });

        Object.keys(gruplar).forEach(k => {
            gruplar[k].sort(() => Math.random() - 0.5);
        });

        let sonuc = [];
        let sonIndex = null;

        while (Object.keys(gruplar).length > 0) {
            let siraliKeys = Object.keys(gruplar).sort((a, b) => gruplar[b].length - gruplar[a].length);
            let secilenKey = siraliKeys.find(k => k !== sonIndex);
            if (!secilenKey) secilenKey = siraliKeys[0];

            let parca = gruplar[secilenKey].shift();
            sonuc.push(parca);
            sonIndex = secilenKey;

            if (gruplar[secilenKey].length === 0) {
                delete gruplar[secilenKey];
            }
        }
        return sonuc;
    }

    async function getVideoDuration(file) {
        return new Promise((resolve) => {
            const video = document.createElement('video');
            video.preload = 'metadata';
            video.src = URL.createObjectURL(file);
            video.onloadedmetadata = () => {
                URL.revokeObjectURL(video.src);
                resolve(video.duration);
            };
        });
    }

    async function videolariIsle() {
        if (filesArray.length === 0) {
            alert("En az 1 video ekleyin!");
            return;
        }

        const minSure = parseFloat(document.getElementById('minSure').value);
        const maxSure = parseFloat(document.getElementById('maxSure').value);
        const ardisikEngelle = document.getElementById('ardisikEngelle').checked;

        if (minSure >= maxSure || minSure <= 0) {
            alert("Geçersiz süre!");
            return;
        }

        startBtn.disabled = true;
        statusLabel.innerText = "FFmpeg yükleniyor...";

        if (!ffmpeg.isLoaded()) {
            await ffmpeg.load();
        }

        statusLabel.innerText = "Videolar aktarılıyor...";

        let tumDilimler = [];

        for (let i = 0; i < filesArray.length; i++) {
            const file = filesArray[i];
            const duration = await getVideoDuration(file);
            let currentTime = 0;

            while (currentTime < duration) {
                let sure = Math.random() * (maxSure - minSure) + minSure;
                if (currentTime + sure > duration) {
                    sure = duration - currentTime;
                }
                tumDilimler.push({ fileIndex: i, start: currentTime, duration: sure });
                currentTime += sure;
            }

            ffmpeg.FS('writeFile', `input_${i}.mp4`, await fetchFile(file));
        }

        if (ardisikEngelle) {
            tumDilimler = ardisikEngelliKaristir(tumDilimler);
        } else {
            tumDilimler.sort(() => Math.random() - 0.5);
        }

        statusLabel.innerText = "Kurgulanıyor (Ultra Hızlı)...";

        try {
            for (let i = 0; i < tumDilimler.length; i++) {
                const item = tumDilimler[i];
                await ffmpeg.run(
                    '-ss', item.start.toFixed(2),
                    '-t', item.duration.toFixed(2),
                    '-i', `input_${item.fileIndex}.mp4`,
                    '-c', 'copy',
                    `part_${i}.ts`
                );
            }

            let concatList = tumDilimler.map((_, i) => `file 'part_${i}.ts'`).join('\n');
            ffmpeg.FS('writeFile', 'concat_list.txt', concatList);

            await ffmpeg.run(
                '-f', 'concat',
                '-safe', '0',
                '-i', 'concat_list.txt',
                '-c', 'copy',
                'output.mp4'
            );

            const data = ffmpeg.FS('readFile', 'output.mp4');
            const videoUrl = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
            
            outputVideo.src = videoUrl;
            outputVideo.style.display = 'block';
            statusLabel.innerText = "Hazır!";
        } catch (error) {
            console.error(error);
            statusLabel.innerText = "Hata! Yeniden kodlamaya geçiliyor...";
            
            let filterConcat = "";
            for (let i = 0; i < tumDilimler.length; i++) filterConcat += `[${i}:v][${i}:a]`;
            filterConcat += `concat=n=${tumDilimler.length}:v=1:a=1[outv][outa]`;

            let fallbackCmd = [];
            for (let i = 0; i < tumDilimler.length; i++) {
                const item = tumDilimler[i];
                fallbackCmd.push('-ss', item.start.toFixed(2), '-t', item.duration.toFixed(2), '-i', `input_${item.fileIndex}.mp4`);
            }
            fallbackCmd.push('-filter_complex', filterConcat, '-map', '[outv]', '-map', '[outa]', '-preset', 'ultrafast', 'output.mp4');

            await ffmpeg.run(...fallbackCmd);
            const data = ffmpeg.FS('readFile', 'output.mp4');
            const videoUrl = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
            
            outputVideo.src = videoUrl;
            outputVideo.style.display = 'block';
            statusLabel.innerText = "Hazır!";
        } finally {
            startBtn.disabled = false;
        }
    }
</script>

</body>
</html>
