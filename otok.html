<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Video Kurgucu Mini</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #10b981;
            --accent-hover: #059669;
            --border-color: #334155;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        body {
            display: table;
            table-layout: fixed;
            width: 100%;
            height: 100vh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .app-layout {
            display: table-row-group;
            height: 100%;
        }

        .header-row {
            display: table-row;
            height: 48px;
        }

        .header-cell {
            display: table-cell;
            vertical-align: middle;
            text-align: center;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .header-cell h1 {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .main-row {
            display: table-row;
            height: calc(100% - 108px);
        }

        .main-cell {
            display: table-cell;
            vertical-align: top;
            padding: 10px;
        }

        .drop-box {
            display: block;
            width: 100%;
            height: 75px;
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            text-align: center;
            background-color: #1a2436;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .drop-box-content {
            display: block;
            padding-top: 18px;
        }

        .drop-box p {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .drop-box span {
            font-size: 0.7rem;
            color: var(--text-sub);
        }

        .file-box {
            display: block;
            width: 100%;
            height: 70px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--card-bg);
            overflow-y: auto;
            margin-bottom: 8px;
        }

        .file-list {
            list-style: none;
            display: block;
        }

        .file-item {
            display: block;
            padding: 5px 8px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.75rem;
            clear: both;
        }

        .file-name {
            float: left;
            width: 85%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-sub);
        }

        .file-remove {
            float: right;
            color: var(--danger);
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .controls-card {
            display: block;
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 8px;
        }

        .input-table {
            display: table;
            width: 100%;
            margin-bottom: 6px;
        }

        .input-cell {
            display: table-cell;
            width: 50%;
            padding: 0 4px;
        }

        .input-cell label {
            display: block;
            font-size: 0.68rem;
            color: var(--text-sub);
            margin-bottom: 2px;
        }

        .input-cell input {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            padding: 5px;
            font-size: 0.8rem;
            text-align: center;
            outline: none;
        }

        .checkbox-row {
            display: block;
            padding: 2px 4px;
            font-size: 0.72rem;
        }

        .checkbox-row input {
            vertical-align: middle;
            margin-right: 4px;
        }

        .checkbox-row label {
            vertical-align: middle;
            color: var(--text-sub);
        }

        .status-box {
            display: block;
            width: 100%;
            height: 18px;
            font-size: 0.7rem;
            text-align: center;
            color: var(--accent-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .video-preview {
            display: none;
            width: 100%;
            height: 110px;
            border-radius: 6px;
            background-color: #000;
            margin-top: 4px;
        }

        .footer-row {
            display: table-row;
            height: 60px;
        }

        .footer-cell {
            display: table-cell;
            vertical-align: middle;
            padding: 0 10px 10px 10px;
        }

        .btn-submit {
            display: block;
            width: 100%;
            height: 44px;
            line-height: 44px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
        }

        .btn-submit:active {
            background-color: var(--accent-hover);
        }

        .btn-submit:disabled {
            background-color: var(--border-color);
            color: var(--text-sub);
        }
    </style>
</head>
<body>

<div class="app-layout">
    <div class="header-row">
        <div class="header-cell">
            <h1>Video Kurgucu Mini</h1>
        </div>
    </div>

    <div class="main-row">
        <div class="main-cell">
            <div class="drop-box" onclick="document.getElementById('fileInput').click()">
                <div class="drop-box-content">
                    <p>Videoları Ekle</p>
                    <span>Dokun ve video seç</span>
                </div>
                <input type="file" id="fileInput" multiple accept="video/*" style="display:none;">
            </div>

            <div class="file-box">
                <div class="file-list" id="fileList"></div>
            </div>

            <div class="controls-card">
                <div class="input-table">
                    <div class="input-cell">
                        <label for="minSure">Min (sn):</label>
                        <input type="number" id="minSure" value="0.8" step="0.1" min="0.1">
                    </div>
                    <div class="input-cell">
                        <label for="maxSure">Max (sn):</label>
                        <input type="number" id="maxSure" value="1.4" step="0.1" min="0.2">
                    </div>
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="ardisikEngelle" checked>
                    <label for="ardisikEngelle">Aynı video üste gelmesin</label>
                </div>
            </div>

            <div class="status-box" id="statusLabel"></div>
            <video id="outputVideo" class="video-preview" controls playsinline></video>
        </div>
    </div>

    <div class="footer-row">
        <div class="footer-cell">
            <button class="btn-submit" id="startBtn" onclick="videolariIsle()">VİDEOLARI OLUŞTUR</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({ log: false });

    let filesArray = [];

    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const statusLabel = document.getElementById('statusLabel');
    const startBtn = document.getElementById('startBtn');
    const outputVideo = document.getElementById('outputVideo');

    fileInput.addEventListener('change', (e) => {
        for (let file of e.target.files) {
            if (file.type.startsWith('video/')) {
                filesArray.push(file);
            }
        }
        renderFileList();
    });

    function renderFileList() {
        fileList.innerHTML = '';
        filesArray.forEach((file, index) => {
            const item = document.createElement('div');
            item.className = 'file-item';
            item.innerHTML = `
                <div class="file-name">${file.name}</div>
                <div class="file-remove" onclick="removeFile(${index})">&times;</div>
                <div style="clear:both;"></div>
            `;
            fileList.appendChild(item);
        });
    }

    function removeFile(index) {
        filesArray.splice(index, 1);
        renderFileList();
    }

    function ardisikEngelliKaristir(dilimler) {
        let gruplar = {};
        dilimler.forEach(item => {
            if (!gruplar[item.fileIndex]) gruplar[item.fileIndex] = [];
            gruplar[item.fileIndex].push(item);
        });

        Object.keys(gruplar).forEach(k => {
            gruplar[k].sort(() => Math.random() - 0.5);
        });

        let sonuc = [];
        let sonIndex = null;

        while (Object.keys(gruplar).length > 0) {
            let siraliKeys = Object.keys(gruplar).sort((a, b) => gruplar[b].length - gruplar[a].length);
            let secilenKey = siraliKeys.find(k => k !== sonIndex);
            if (!secilenKey) secilenKey = siraliKeys[0];

            let parca = gruplar[secilenKey].shift();
            sonuc.push(parca);
            sonIndex = secilenKey;

            if (gruplar[secilenKey].length === 0) {
                delete gruplar[secilenKey];
            }
        }
        return sonuc;
    }

    async function getVideoDuration(file) {
        return new Promise((resolve) => {
            const video = document.createElement('video');
            video.preload = 'metadata';
            video.src = URL.createObjectURL(file);
            video.onloadedmetadata = () => {
                URL.revokeObjectURL(video.src);
                resolve(video.duration);
            };
        });
    }

    async function videolariIsle() {
        if (filesArray.length === 0) {
            alert("En az 1 video ekleyin!");
            return;
        }

        const minSure = parseFloat(document.getElementById('minSure').value);
        const maxSure = parseFloat(document.getElementById('maxSure').value);
        const ardisikEngelle = document.getElementById('ardisikEngelle').checked;

        if (minSure >= maxSure || minSure <= 0) {
            alert("Geçersiz süre!");
            return;
        }

        startBtn.disabled = true;
        statusLabel.innerText = "Yükleniyor...";

        if (!ffmpeg.isLoaded()) {
            await ffmpeg.load();
        }

        statusLabel.innerText = "Parçalanıyor...";

        let tumDilimler = [];

        for (let i = 0; i < filesArray.length; i++) {
            const file = filesArray[i];
            const duration = await getVideoDuration(file);
            let currentTime = 0;

            while (currentTime < duration) {
                let sure = Math.random() * (maxSure - minSure) + minSure;
                if (currentTime + sure > duration) {
                    sure = duration - currentTime;
                }
                tumDilimler.push({ fileIndex: i, start: currentTime, duration: sure });
                currentTime += sure;
            }

            ffmpeg.FS('writeFile', `input_${i}.mp4`, await fetchFile(file));
        }

        if (ardisikEngelle) {
            tumDilimler = ardisikEngelliKaristir(tumDilimler);
        } else {
            tumDilimler.sort(() => Math.random() - 0.5);
        }

        statusLabel.innerText = "Birleştiriliyor...";

        let filterConcat = "";
        for (let i = 0; i < tumDilimler.length; i++) {
            filterConcat += `[${i}:v][${i}:a]`;
        }
        filterConcat += `concat=n=${tumDilimler.length}:v=1:a=1[outv][outa]`;

        let command = [];
        for (let i = 0; i < tumDilimler.length; i++) {
            const item = tumDilimler[i];
            command.push('-ss', item.start.toString(), '-t', item.duration.toString(), '-i', `input_${item.fileIndex}.mp4`);
        }

        command.push('-filter_complex', filterConcat, '-map', '[outv]', '-map', '[outa]', 'output.mp4');

        try {
            await ffmpeg.run(...command);
            const data = ffmpeg.FS('readFile', 'output.mp4');
            const videoUrl = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
            
            outputVideo.src = videoUrl;
            outputVideo.style.display = 'block';
            statusLabel.innerText = "Hazır!";
        } catch (error) {
            console.error(error);
            statusLabel.innerText = "Hata oluştu!";
        } finally {
            startBtn.disabled = false;
        }
    }
</script>

</body>
</html>
