<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sesli Notlar</title>
<style>
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    background: #000; 
    color: #fff; 
    max-width: 420px; 
    margin: 0 auto; 
    padding: 20px; 
  }
  h3 { text-align: center; font-size: 22px; margin-bottom: 20px; }
  .controls { display: flex; gap: 10px; margin-bottom: 25px; }
  button { 
    flex: 1; padding: 14px; border-radius: 12px; border: none; 
    font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; 
  }
  #recordBtn { background: #ff3b30; color: #fff; }
  #recordBtn.recording { background: #ff9500; }
  #playAllBtn { background: #34c759; color: #fff; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { 
    background: #1c1c1e; padding: 14px; border-radius: 12px; 
    margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; 
  }
  .record-info { display: flex; flex-direction: column; gap: 4px; }
  .record-title { font-weight: 600; font-size: 15px; }
  .record-time { font-size: 12px; color: #8e8e93; }
  .action-btn { background: #2c2c2e; color: #0a84ff; padding: 8px 14px; border-radius: 8px; font-size: 14px; }
  audio { display: none; }
</style>
</head>
<body>

<h3>Sesli Notlar</h3>
<div class="controls">
  <button id="recordBtn">Kayıt Başlat</button>
  <button id="playAllBtn">Tümünü Çal</button>
</div>
<ul id="playlist"></ul>
<audio id="globalPlayer"></audio>

<script>
let mediaRecorder;
let audioChunks = [];
let audioList = [];
let currentIndex = 0;

const recordBtn = document.getElementById('recordBtn');
const playAllBtn = document.getElementById('playAllBtn');
const playlist = document.getElementById('playlist');
const globalPlayer = document.getElementById('globalPlayer');

recordBtn.onclick = async () => {
  if (!mediaRecorder || mediaRecorder.state === "inactive") {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/m4a' });
        const audioUrl = URL.createObjectURL(audioBlob);
        const recordName = `Ses_Kaydi_${Date.now()}.m4a`;

        audioList.push({ url: audioUrl, name: recordName });
        renderPlaylist();

        const downloadAnchor = document.createElement('a');
        downloadAnchor.href = audioUrl;
        downloadAnchor.download = recordName;
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        document.body.removeChild(downloadAnchor);
      };

      mediaRecorder.start();
      recordBtn.textContent = "Kaydı Bitir ve İndir";
      recordBtn.classList.add('recording');
    } catch (err) {
      alert("Mikrofon erişimi engellendi veya desteklenmiyor.");
    }
  } else {
    mediaRecorder.stop();
    recordBtn.textContent = "Kayıt Başlat";
    recordBtn.classList.remove('recording');
  }
};

function renderPlaylist() {
  playlist.innerHTML = "";
  audioList.forEach((item, index) => {
    const li = document.createElement('li');
    li.innerHTML = `
      <div class="record-info">
        <span class="record-title">Ses Kaydı ${index + 1}</span>
        <span class="record-time">${item.name}</span>
      </div>
      <button class="action-btn" onclick="playSingle(${index})">▶ Çal</button>
    `;
    playlist.appendChild(li);
  });
}

function playSingle(index) {
  globalPlayer.src = audioList[index].url;
  globalPlayer.play();
}

playAllBtn.onclick = () => {
  if (audioList.length === 0) return;
  currentIndex = 0;
  playNext();
};

function playNext() {
  if (currentIndex < audioList.length) {
    globalPlayer.src = audioList[currentIndex].url;
    globalPlayer.play();
    currentIndex++;
  }
}

globalPlayer.onended = () => {
  playNext();
};
</script>

</body>
</html>
