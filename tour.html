<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CP - Tour</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #0d0d0d;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            color: #ff0055;
            text-shadow: 3px 3px #ffff00;
            margin-bottom: 5px;
            letter-spacing: -1px;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 30px;
            text-transform: uppercase;
            border-bottom: 2px dashed #333;
            padding-bottom: 10px;
        }

        .link-card {
            display: block;
            background: #1a1a1a;
            border: 2px solid #fff;
            color: #fff;
            text-decoration: none;
            padding: 15px;
            margin-bottom: 15px;
            font-weight: bold;
            box-shadow: 4px 4px 0px #ff0055;
            transition: all 0.1s ease;
        }

        .link-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #ffff00;
            background: #252525;
            color: #ff0055;
        }

        .venue {
            font-size: 1.1rem;
            display: block;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .date {
            font-size: 0.85rem;
            color: #ffff00;
            display: block;
        }

        .tba {
            color: #666;
        }

        .disabled {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: 4px 4px 0px #333;
            border-color: #444;
        }

        .disabled:hover {
            transform: none;
            box-shadow: 4px 4px 0px #333;
            background: #1a1a1a;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1></h1>
        <p class="subtitle">TOUR 26/27</p>

        <a href="#" class="link-card">
            <span class="venue">Babylon İstanbul V1</span>
            <span class="date">21 Kasım Cumartesi</span>
        </a>

        <a href="#" class="link-card">
            <span class="venue">6:45 Ankara V1</span>
            <span class="date">29 Kasım Pazar</span>
        </a>

        <a href="#" class="link-card">
            <span class="venue">6:45 İzmir</span>
            <span class="date">13 Aralık Pazar</span>
        </a>

        <div class="link-card disabled">
            <span class="venue">Babylon İstanbul V2</span>
            <span class="date tba">Tarih Yakında</span>
        </div>

        <div class="link-card disabled">
            <span class="venue">6:45 Ankara V2</span>
            <span class="date tba">Tarih Yakında</span>
        </div>

        <div class="link-card disabled">
            <span class="venue">İKSV İstanbul Mat-Suare</span>
            <span class="date tba">Tarih Yakında</span>
        </div>
    </div>

</body>
</html>
