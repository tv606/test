<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Twin Peaks Cam</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
  
  /* iPhone 13 Mini Ekran Oranı (19.5:9) */
  #camera-container { position: relative; width: 100vw; height: calc(100vw * 19.5 / 9); max-height: 80vh; margin: 0 auto; overflow: hidden; background: #111; }
  video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  
  /* Grain efekti kaplaması */
  .grain-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.25; mix-blend-mode: overlay; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }

  /* Controls */
  .controls { height: 20vh; display: flex; align-items: center; justify-content: space-evenly; background: #000; padding-bottom: env(safe-area-inset-bottom); }
  .shutter-btn { width: 72px; height: 72px; border-radius: 50%; border: 4px solid #fff; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .shutter-btn-inner { width: 58px; height: 58px; border-radius: 50%; background: #e74c3c; transition: transform 0.1s; }
  .shutter-btn:active .shutter-btn-inner { transform: scale(0.85); }
  
  /* Flash Efekti */
  .flash { position: absolute; top:0; left:0; width:100%; height:100%; background:#fff; opacity:0; pointer-events:none; transition: opacity 0.1s ease-out; }
</style>
</head>
<body>

<div id="camera-container">
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="viewfinder"></canvas>
  <div class="grain-overlay"></div>
  <div id="flash" class="flash"></div>
</div>

<div class="controls">
  <div class="shutter-btn" id="capture-btn">
    <div class="shutter-btn-inner"></div>
  </div>
</div>

<script>
const video = document.getElementById('webcam');
const canvas = document.getElementById('viewfinder');
const ctx = canvas.getContext('2d');
const captureBtn = document.getElementById('capture-btn');
const flash = document.getElementById('flash');

// Kamera Başlatma
async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    video.srcObject = stream;
    video.play();
    requestAnimationFrame(render);
  } catch (err) {
    alert("Kamera erişimi reddedildi.");
  }
}

// Twin Peaks Filtre Uygulaması (Canlı Canvas Rendering)
function render() {
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    
    // Video Çerçevesini Çiz
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    // Twin Peaks Renk Paleti (Sıcak Kırmızılar, Derin Yeşiller, Yüksek Kontrast)
    ctx.globalCompositeOperation = 'color-burn';
    ctx.fillStyle = 'rgba(110, 38, 14, 0.3)'; // Sıcak Ahşap/Kırmızı tonu
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.globalCompositeOperation = 'soft-light';
    ctx.fillStyle = 'rgba(20, 80, 45, 0.3)'; // Douglas Çamı Yeşili
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Filtre İnce Ayarları
    ctx.globalCompositeOperation = 'source-over';
    ctx.filter = 'contrast(125%) saturate(140%) brightness(95%)';
    ctx.drawImage(canvas, 0, 0);
    ctx.filter = 'none'; // Sıfırla
  }
  requestAnimationFrame(render);
}

// Fotoğraf Çekme
captureBtn.addEventListener('click', () => {
  // Flash Efekti
  flash.style.opacity = '1';
  setTimeout(() => flash.style.opacity = '0', 100);

  // Canvas Görselini İndirme
  const image = canvas.toDataURL('image/jpeg', 0.95);
  const link = document.createElement('a');
  link.href = image;
  link.download = `twin-peaks-${Date.now()}.jpg`;
  link.click();
});

initCamera();
</script>
</body>
</html>
