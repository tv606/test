<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Black Lodge Vibrant FX</title>
<style>
  :root {
    --bg: #000;
    --red: #a00000;
    --gold: #d4af37;
    --panel: #111;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; margin: 0; padding: 0; }

  body {
    background-color: var(--bg);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  header {
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid #222;
    background: #080808;
  }

  h1 {
    font-size: 0.9rem;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--gold);
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    background: radial-gradient(circle, #1a0000 0%, #000 100%);
  }

  .canvas-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    display: block;
    border-radius: 4px;
    box-shadow: 0 0 30px rgba(160, 0, 0, 0.3);
  }

  #placeholder {
    position: absolute;
    color: #444;
    font-size: 0.8rem;
    letter-spacing: 2px;
  }

  controls {
    height: 110px;
    background: var(--panel);
    border-top: 1px solid #222;
    display: flex;
    flex-direction: column;
    padding: 15px;
    gap: 10px;
  }

  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
  }

  .btn-main { background: var(--red); color: #fff; }
  .btn-save { background: #222; color: var(--gold); border: 1px solid #333; }
  .row { display: flex; gap: 10px; }

  #file-input { display: none; }
</style>
</head>
<body>

<header>
  <h1>BLACK LODGE FX</h1>
</header>

<main>
  <div class="canvas-wrapper">
    <div id="placeholder">FOTOĞRAF YÜKLE</div>
    <canvas id="canvas"></canvas>
  </div>
</main>

<controls>
  <button class="btn btn-main" onclick="fileInput.click()">GÖRSEL SEÇ</button>
  <div class="row">
    <button class="btn btn-save" onclick="downloadImage()">KAYDET</button>
  </div>
  <input type="file" id="file-input" accept="image/*">
</controls>

<script>
const fileInput = document.getElementById('file-input');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const placeholder = document.getElementById('placeholder');
let originalImageData = null;

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => {
      const maxW = window.innerWidth * 2;
      const maxH = window.innerHeight * 0.65 * 2;
      
      let finalW = img.width;
      let finalH = img.height;
      const ratio = img.width / img.height;
      
      if (finalW > maxW) { finalW = maxW; finalH = finalW / ratio; }
      if (finalH > maxH) { finalH = maxH; finalW = finalH * ratio; }

      canvas.width = finalW;
      canvas.height = finalH;
      
      ctx.drawImage(img, 0, 0, finalW, finalH);
      originalImageData = ctx.getImageData(0, 0, finalW, finalH);
      
      placeholder.style.display = 'none';
      applyBlackLodgeVibrant();
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
});

function applyBlackLodgeVibrant() {
  if (!originalImageData) return;
  
  const workingData = new ImageData(
    new Uint8ClampedArray(originalImageData.data),
    originalImageData.width,
    originalImageData.height
  );
  const data = workingData.data;

  // Yoğun Grain Tablosu (Black Lodge Temeli)
  const grainAmount = 0.14;
  const grainSize = 10000;
  const grainTable = new Float32Array(grainSize);
  for(let i = 0; i < grainSize; i++) {
    grainTable[i] = (Math.random() - 0.5) * grainAmount;
  }

  for (let i = 0; i < data.length; i += 4) {
    let r = data[i] / 255;
    let g = data[i+1] / 255;
    let b = data[i+2] / 255;

    // 1. Exposure & Sert Kontrast (Black Lodge tabanı)
    const lum = r * 0.299 + g * 0.587 + b * 0.114;
    let expLum = (lum - 0.5) * 1.6 + 0.5; // Sert pozlama eğrisi
    
    // Gölge Ezme (Deep blacks)
    if (expLum < 0.12) expLum = expLum * 0.3;

    // 2. Vibrant Renk Basma (Log doyması)
    // Renk doygunluğunu kilitli tutarak parlaklık farkına göre renklendirme
    r = r + (r - lum) * 1.8;
    g = g + (g - lum) * 1.8;
    b = b + (b - lum) * 1.8;

    // Pozlama tonunu renklere yedir
    const factor = expLum / (lum || 0.001);
    r *= factor;
    g *= factor;
    b *= factor;

    // Kırmızı/Sıcak ton basması (Twin Peaks imzası)
    r = Math.pow(r, 0.82) + 0.03;
    g = Math.pow(g, 0.95);
    b = Math.pow(b, 1.1) - 0.02;

    // 3. Gren Ekleme (Gölgelere duyarlı)
    const noise = grainTable[i % grainSize];
    const grainFactor = (1.0 - expLum * 0.4);
    const finalNoise = noise * grainFactor;

    r += finalNoise;
    g += finalNoise;
    b += finalNoise;

    // Sınırla
    data[i]   = Math.min(255, Math.max(0, r * 255));
    data[i+1] = Math.min(255, Math.max(0, g * 255));
    data[i+2] = Math.min(255, Math.max(0, b * 255));
  }

  ctx.putImageData(workingData, 0, 0);
}

function downloadImage() {
  if (!originalImageData) return;
  const link = document.createElement('a');
  link.download = 'black-lodge-vibrant.jpg';
  link.href = canvas.toDataURL('image/jpeg', 0.92);
  link.click();
}
</script>

</body>
</html>
