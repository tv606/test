<style>
  :root {
    --bg: #05070a;
    --surface: #101218;
    --accent: #ff3e3e;
    --text: #ffffff;
    --nav-height: 80px; /* Alt menü yüksekliği */
    --header-height: 50px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden; /* Tüm sayfanın kaymasını engelle */
    position: fixed; /* iOS kaydırma zıplamalarını önle */
    width: 100%;
  }

  /* Sabit Header */
  .app-header {
    height: var(--header-height);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    position: absolute;
    top: 0; width: 100%; z-index: 100;
  }
  .app-logo { font-weight: 800; font-size: 0.9rem; color: var(--accent); text-transform: uppercase; }

  /* Sabit Player Alanı */
  .player-section {
    position: absolute;
    top: var(--header-height);
    width: 100%;
    z-index: 90;
    background: #000;
  }
  .video-box { width: 100%; aspect-ratio: 16 / 9; position: relative; background: #000; }
  video { width: 100%; height: 100%; }

  .vid-btn {
    position: absolute; background: rgba(0,0,0,0.5); color: white; border: none;
    padding: 8px; border-radius: 8px; backdrop-filter: blur(4px); z-index: 100;
  }
  .fs-btn { bottom: 8px; right: 8px; }
  .ss-btn { bottom: 8px; left: 8px; }

  /* KAYDIRILABİLİR LİSTE ALANI (DİNAMİK HESAPLAMA) */
  .channel-grid {
    position: absolute;
    /* Player'ın altından başla (Header + Player Yüksekliği) */
    top: calc(var(--header-height) + (100vw * 9 / 16)); 
    bottom: var(--nav-height); /* Alt menüye kadar uzan */
    width: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch; /* iPhone akıcı scroll */
    padding: 20px 15px;
    background: var(--bg);
  }

  .mobile-ch-card {
    display: flex; align-items: center; padding: 14px;
    background: var(--surface); border-radius: 12px; margin-bottom: 8px;
    border: 1px solid transparent;
  }
  .mobile-ch-card.active { border-color: var(--accent); background: rgba(255,62,62,0.1); }

  /* Sabit Alt Menü */
  .bottom-nav {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: var(--nav-height);
    background: rgba(16, 18, 24, 0.98);
    display: flex; justify-content: space-around; align-items: center;
    border-top: 1px solid rgba(255,255,255,0.1);
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom); /* iPhone Mini Çentiği */
  }

  .nav-item { color: #94a3b8; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .nav-item.active { color: var(--accent); }
  .nav-icon { width: 22px; height: 22px; }

  /* Modal */
  #addModal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal-content { background: var(--surface); padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; }
  input { width: 100%; background: #000; border: 1px solid #333; padding: 12px; border-radius: 10px; color: white; margin-bottom: 15px; font-size: 16px; }
</style>

let hls = null;
let currentIndex = -1;
let isRecording = false;

function renderChannels() {
  const container = document.getElementById('channelList');
  container.innerHTML = '';
  channels.forEach((ch, i) => {
    const card = document.createElement('div');
    card.className = `mobile-ch-card ${i === currentIndex ? 'active' : ''}`;
    card.innerHTML = `<div style="margin-right:15px; opacity:0.5">☰</div><h4>${ch.name}</h4>`;
    card.onclick = () => playStream(i);
    container.appendChild(card);
  });
}

function playStream(i) {
  currentIndex = i;
  const video = document.getElementById('videoPlayer');
  const ch = channels[i];
  document.getElementById('headerTitle').textContent = ch.name;
  renderChannels();
  if (hls) hls.destroy();
  if (Hls.isSupported()) {
    hls = new Hls(); hls.loadSource(ch.url); hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) { video.src = ch.url; }
}

// Swipe (Kanal Geçişi)
let startX = 0;
document.getElementById('videoBox').addEventListener('touchstart', e => startX = e.touches[0].clientX);
document.getElementById('videoBox').addEventListener('touchend', e => {
  let diff = e.changedTouches[0].clientX - startX;
  if (Math.abs(diff) > 70) changeChannel(diff > 0 ? -1 : 1);
});

function changeChannel(dir) {
  let n = (currentIndex + dir + channels.length) % channels.length;
  playStream(n);
}

function toggleModal(s) { document.getElementById('addModal').style.display = s ? 'flex' : 'none'; }
function addNewChannel() {
  const n = document.getElementById('customName').value || "Yeni Kanal";
  const u = document.getElementById('customUrl').value;
  if(u) { channels.unshift({name:n, url:u}); renderChannels(); toggleModal(false); playStream(0); }
}

function toggleFullScreen() {
  const v = document.getElementById('videoPlayer');
  if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
}

function takeScreenshot() {
  const v = document.getElementById('videoPlayer');
  const c = document.getElementById('ssCanvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  try {
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    const link = document.createElement('a');
    link.download = `SS_${Date.now()}.png`; link.href = c.toDataURL(); link.click();
  } catch(e) { alert("CORS Engeli."); }
}
