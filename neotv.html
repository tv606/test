<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TELEMISSION Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070a;
    --surface: #101218;
    --accent: #ff3e3e;
    --text: #ffffff;
    --nav-height: 85px;
    --header-height: 50px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    position: fixed;
    width: 100%;
  }

  /* Header */
  .app-header {
    height: var(--header-height);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    position: absolute;
    top: 0; width: 100%; z-index: 1000;
  }
  .app-logo { font-weight: 800; font-size: 0.9rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px; }

  /* Player Area */
  .player-section {
    position: absolute;
    top: var(--header-height);
    width: 100%;
    z-index: 900;
    background: #000;
  }
  .video-box { width: 100%; aspect-ratio: 16 / 9; position: relative; background: #000; }
  video { width: 100%; height: 100%; background: #000; }

  .vid-btn {
    position: absolute; background: rgba(0,0,0,0.6); color: white; border: none;
    padding: 10px; border-radius: 10px; backdrop-filter: blur(5px); z-index: 1001;
  }
  .fs-btn { bottom: 10px; right: 10px; }
  .ss-btn { bottom: 10px; left: 10px; }

  /* Scrollable Channel List */
  .channel-grid {
    position: absolute;
    top: calc(var(--header-height) + (100vw * 9 / 16)); 
    bottom: var(--nav-height);
    width: 100%;
    overflow-y: scroll;
    -webkit-overflow-scrolling: touch;
    padding: 15px;
    background: var(--bg);
    z-index: 800;
  }

  .mobile-ch-card {
    display: flex; align-items: center; padding: 15px;
    background: var(--surface); border-radius: 14px; margin-bottom: 10px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .mobile-ch-card.active { border-color: var(--accent); background: rgba(255,62,62,0.1); }
  .mobile-ch-card h4 { font-size: 0.9rem; font-weight: 600; color: #e2e8f0; }

  /* Fixed Bottom Navigation */
  .bottom-nav {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: var(--nav-height);
    background: #0f1116;
    display: flex; justify-content: space-around; align-items: center;
    border-top: 1px solid rgba(255,255,255,0.1);
    z-index: 1000;
    padding-bottom: env(safe-area-inset-bottom);
  }

  .nav-item { color: #64748b; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; height: 100%; justify-content: center; }
  .nav-item.active { color: var(--accent); }
  .nav-icon { width: 22px; height: 22px; }

  /* Modal (Add Channel) */
  #addModal { 
    position: fixed; inset: 0; 
    background: rgba(0,0,0,0.85); 
    backdrop-filter: blur(10px);
    z-index: 9999; /* En üstte olduğundan emin olalım */
    display: none; align-items: center; justify-content: center; padding: 20px; 
  }
  .modal-content { background: var(--surface); padding: 25px; border-radius: 24px; width: 100%; max-width: 350px; border: 1px solid rgba(255,255,255,0.1); }
  .modal-content h3 { margin-bottom: 20px; text-align: center; font-size: 1.2rem; }
  input { 
    width: 100%; background: #000; border: 1px solid #334155; padding: 14px; 
    border-radius: 12px; color: white; margin-bottom: 15px; font-size: 16px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  
  .modal-btns { display: flex; gap: 10px; }
  .btn-action { flex: 1; padding: 14px; border-radius: 12px; font-weight: 700; border: none; cursor: pointer; }

  .is-recording { color: var(--accent) !important; animation: blink 1s infinite; }
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
</style>
</head>

    </div>
  </div>
</div>

<nav class="bottom-nav">
  <div class="nav-item active">
    <div class="nav-icon"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M2 8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8zM7 21h10M12 18v3"/></svg></div>
    <span>CHANNELS</span>

  <div class="nav-item" onclick="toggleModal(true)">
    <div class="nav-icon"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg></div>
    <span>ADD</span>
  </div>
  <div class="nav-item" id="recToggle" onclick="toggleRecording()">

    <span id="recStatus">RECORD</span>
  </div>
</nav>

let hls = null;
let currentIndex = -1;
let isRecording = false;
let mediaRecorder;
let recordedChunks = [];

function renderChannels() {
  const container = document.getElementById('channelList');
  container.innerHTML = '';
  channels.forEach((ch, i) => {
    const card = document.createElement('div');
    card.className = `mobile-ch-card ${i === currentIndex ? 'active' : ''}`;
    card.innerHTML = `<div style="margin-right:15px; opacity:0.2">☰</div><h4>${ch.name}</h4>`;
    card.onclick = () => playStream(i);
    container.appendChild(card);
  });
}

function playStream(i) {
  currentIndex = i;
  const video = document.getElementById('videoPlayer');
  const ch = channels[i];
  renderChannels();

  if (hls) hls.destroy();

  if (Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(ch.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.muted = true;
      video.play().catch(e => console.log("Play failed"));
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = ch.url;
    video.muted = true;
    video.play().catch(e => console.log("Play failed"));
  }
}

function toggleModal(show) {
  document.getElementById('addModal').style.display = show ? 'flex' : 'none';
}

function addNewChannel() {
  const nameInput = document.getElementById('customName');
  const urlInput = document.getElementById('customUrl');
  
  if (urlInput.value.trim() !== "") {
    const newCh = {
      name: nameInput.value || "Channel " + (channels.length + 1),
      url: urlInput.value
    };
    channels.unshift(newCh);
    renderChannels();
    toggleModal(false);
    playStream(0);
    
    nameInput.value = "";
    urlInput.value = "";
  }
}

function toggleFullScreen() {
  const v = document.getElementById('videoPlayer');
  if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
  else if (v.requestFullscreen) v.requestFullscreen();
}

function takeScreenshot() {
  const v = document.getElementById('videoPlayer');
  const c = document.getElementById('ssCanvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  try {
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    const link = document.createElement('a');
    link.download = `Shot_${Date.now()}.png`; link.href = c.toDataURL(); link.click();
  } catch(e) { alert("Security: Cannot capture stream."); }
}

function toggleRecording() {
  const v = document.getElementById('videoPlayer');
  const btn = document.getElementById('recToggle');
  if (!isRecording) {
    try {
      recordedChunks = [];
      const stream = v.captureStream ? v.captureStream() : v.mozCaptureStream();
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, {type: 'video/webm'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download=`Record_${Date.now()}.webm`; a.click();
      };
      mediaRecorder.start(); 
      isRecording = true;
      btn.classList.add('is-recording');
      document.getElementById('recStatus').textContent = "STOP";
    } catch(e) { alert("Not supported."); }
  } else {
    mediaRecorder.stop(); 
    isRecording = false;
    btn.classList.remove('is-recording');
    document.getElementById('recStatus').textContent = "RECORD";
  }
}

renderChannels();
