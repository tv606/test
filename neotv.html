<style>
  :root {
    --bg: #05070a;
    --surface: #101218;
    --surface-light: #1c1f26;
    --accent: #ff3e3e;
    --text: #ffffff;
    --text-muted: #94a3b8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* HEADER */
  .app-header {
    height: 60px;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    z-index: 100;
  }
  .app-logo { font-weight: 800; font-size: 1.1rem; color: var(--accent); text-transform: uppercase; text-align: center; }

  /* PLAYER */
  .video-box {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    position: relative;
    overflow: hidden;
  }
  video { width: 100%; height: 100%; object-fit: contain; }

  .vid-btn {
    position: absolute;
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    padding: 10px;
    border-radius: 10px;
    backdrop-filter: blur(4px);
    z-index: 20;
    display: flex;
    cursor: pointer;
  }
  .fs-btn { bottom: 10px; right: 10px; }
  .ss-btn { bottom: 10px; left: 10px; }

  /* CONTENT AREA */
  .content-area {
    flex: 1;
    background: var(--bg);
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
    margin-top: -20px;
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
  }
  .sheet-handle { width: 40px; height: 4px; background: var(--surface-light); border-radius: 2px; margin: 12px auto; }
  .channel-grid { flex: 1; overflow-y: auto; padding: 0 15px 100px; }

  /* CHANNEL CARD */
  .mobile-ch-card {
    display: flex;
    align-items: center;
    padding: 12px;
    background: var(--surface);
    border-radius: 16px;
    margin-bottom: 10px;
    border: 1px solid transparent;
    transition: transform 0.2s;
  }
  .mobile-ch-card.active { border-color: var(--accent); background: rgba(255, 62, 62, 0.05); }
  .mobile-ch-card.dragging { opacity: 0.5; border: 1px dashed var(--accent); }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; height: 75px;
    background: rgba(16, 18, 24, 0.95); backdrop-filter: blur(20px);
    display: flex; justify-content: space-around; align-items: center;
    border-top: 1px solid rgba(255,255,255,0.05); z-index: 1000;
  }
  .nav-item { color: var(--text-muted); font-size: 10px; display: flex; flex-direction: column; align-items: center; text-decoration: none; font-weight: 600; gap: 5px; }
  .nav-item.active { color: var(--accent); }
  .nav-icon { width: 22px; height: 22px; display: flex; }

  /* RECORDING BLINK */
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
  .is-recording { color: #ff3e3e !important; animation: blink 1s infinite; }

  /* MODAL */
  #addModal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-content { background: var(--surface); padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; }
  .modal-content input { width: 100%; background: var(--bg); border: 1px solid var(--surface-light); padding: 12px; border-radius: 10px; color: white; margin-bottom: 15px; outline: none; }
</style>
</head>

let hls = null;
let currentIndex = -1;
let mediaRecorder;
let recordedChunks = [];
let isRecording = false;

// --- SÜRÜKLE BIRAK ---
const container = document.getElementById('channelList');
let dragItem = null;

function initSortable() {
  document.querySelectorAll('.mobile-ch-card').forEach(card => {
    card.addEventListener('dragstart', () => { dragItem = card; setTimeout(() => card.classList.add('dragging'), 0); });
    card.addEventListener('dragend', () => { card.classList.remove('dragging'); saveNewOrder(); });
    card.addEventListener('dragover', e => {
      e.preventDefault();
      const afterElement = getDragAfterElement(container, e.clientY);
      if (afterElement == null) container.appendChild(dragItem); else container.insertBefore(dragItem, afterElement);
    });
  });
}

function getDragAfterElement(container, y) {
  const elements = [...container.querySelectorAll('.mobile-ch-card:not(.dragging)')];
  return elements.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closest.offset) return { offset: offset, element: child }; else return closest;
  }, { offset: Number.NEGATIVE_INFINITY }).element;
}

function saveNewOrder() {
  const newOrder = [];
  document.querySelectorAll('.mobile-ch-card').forEach(card => {
    const name = card.querySelector('h4').textContent;
    const ch = channels.find(c => c.name === name);
    if (ch) newOrder.push(ch);
  });
  channels = newOrder;
  const active = document.querySelector('.mobile-ch-card.active');
  if(active) currentIndex = channels.findIndex(c => c.name === active.querySelector('h4').textContent);
}

// --- KAYIT SİSTEMİ ---
function toggleRecording() {
  const video = document.getElementById('videoPlayer');
  const btn = document.getElementById('recToggle');
  const statusTxt = document.getElementById('recStatus');

  if (!isRecording) {
    recordedChunks = [];
    let stream;
    try {
      stream = video.captureStream ? video.captureStream() : video.mozCaptureStream();
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `NEO_Record_${Date.now()}.webm`; a.click();
      };
      mediaRecorder.start();
      isRecording = true;
      btn.classList.add('is-recording');
      statusTxt.textContent = "DURDUR";
    } catch (e) { alert("Bu kanal kayıt korumalı (CORS)."); }
  } else {
    mediaRecorder.stop();
    isRecording = false;
    btn.classList.remove('is-recording');
    statusTxt.textContent = "KAYDET";
  }
}

// --- ANA FONKSİYONLAR ---
function renderChannels() {
  container.innerHTML = '';
  channels.forEach((ch, i) => {
    const card = document.createElement('div');
    card.className = `mobile-ch-card ${i === currentIndex ? 'active' : ''}`;
    card.draggable = true;
    card.innerHTML = `
      <div style="width:20px; height:20px; margin-right:15px; color:var(--text-muted); cursor:move">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </div>
      <div class="ch-details"><h4>${ch.name}</h4></div>
    `;
    card.onclick = () => { if (!card.classList.contains('dragging')) playStream(i); };
    container.appendChild(card);
  });
  initSortable();
}

function playStream(index) {
  currentIndex = index;
  const video = document.getElementById('videoPlayer');
  const ch = channels[index];
  document.getElementById('headerTitle').textContent = ch.name;
  renderChannels();
  if (hls) hls.destroy();
  if (Hls.isSupported()) {
    hls = new Hls(); hls.loadSource(ch.url); hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) { video.src = ch.url; video.play(); }
}

// Swipe & UI
let touchStartX = 0;
document.getElementById('videoBox').addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
document.getElementById('videoBox').addEventListener('touchend', e => {
  let endX = e.changedTouches[0].screenX;
  if (endX < touchStartX - 60) changeChannel(1);
  if (endX > touchStartX + 60) changeChannel(-1);
});
function changeChannel(dir) {
  let next = currentIndex + dir;
  if (next >= channels.length) next = 0; if (next < 0) next = channels.length - 1;
  playStream(next);
}
function toggleModal(s) { document.getElementById('addModal').style.display = s ? 'flex' : 'none'; }
function addNewChannel() {
  const n = document.getElementById('customName').value || "Yeni Kanal";
  const u = document.getElementById('customUrl').value;
  if(u) { channels.unshift({name:n, url:u}); renderChannels(); toggleModal(false); playStream(0); }
}
function takeScreenshot() {
  const v = document.getElementById('videoPlayer');
  const c = document.getElementById('ssCanvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  try { c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); const l = document.createElement('a'); l.download=`SS_${Date.now()}.png`; l.href=c.toDataURL(); l.click(); } catch(e) { alert("CORS Engeli."); }
}
function toggleFullScreen() {
  const v = document.getElementById('videoPlayer');
  if (v.requestFullscreen) v.requestFullscreen(); else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
}
renderChannels();
